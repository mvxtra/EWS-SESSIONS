<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0"
>

<title>EWS SESSIONS</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>

<script src="/socket.io/socket.io.js"></script>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    position: relative;
}

#canvas3d {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    background: #000;
}

/* =================================
   LOGIN
================================= */

#login-screen {
    position: fixed;
    inset: 0;
    z-index: 1000;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            circle at center,
            #181818 0%,
            #080808 45%,
            #000 100%
        );
}

.login-box {
    width: min(380px, 90vw);

    padding: 35px;

    border: 1px solid rgba(255,255,255,.25);

    background:
        rgba(0,0,0,.82);

    box-shadow:
        0 0 60px rgba(255,255,255,.08);

    text-align: center;
}

.login-logo {
    font-size: 42px;
    font-weight: 900;
    letter-spacing: 8px;
    margin-bottom: 5px;
}

.login-sub {
    color: #aaa;
    font-size: 11px;
    letter-spacing: 4px;
    margin-bottom: 30px;
}

.login-box input {
    width: 100%;
    height: 44px;

    margin-bottom: 12px;

    padding: 0 14px;

    border: 1px solid #444;

    background: #080808;

    color: white;

    outline: none;
}

.login-box input:focus {
    border-color: white;
}

.login-buttons {
    display: flex;
    gap: 10px;
}

.login-buttons button {
    flex: 1;

    height: 44px;

    border: 1px solid white;

    background: white;

    color: black;

    font-weight: bold;

    cursor: pointer;
}

.login-buttons button:last-child {
    background: transparent;
    color: white;
}

#login-status {
    min-height: 20px;
    margin-top: 15px;
    font-size: 12px;
    color: #aaa;
}

/* =================================
   HUD
================================= */

#hud {
    position: fixed;
    inset: 0;

    z-index: 50;

    pointer-events: none;
}

#top-logo {
    position: absolute;

    left: 25px;
    top: 20px;

    font-size: 20px;
    font-weight: 900;

    letter-spacing: 5px;

    text-shadow:
        0 0 10px rgba(255,255,255,.5);
}

#stream-indicator {
    position: absolute;

    left: 25px;
    top: 52px;

    font-size: 10px;

    letter-spacing: 3px;

    color: #999;
}

#audio-control {
    position: absolute;

    left: 25px;
    bottom: 25px;

    padding: 10px 16px;

    border: 1px solid rgba(255,255,255,.5);

    background: rgba(0,0,0,.65);

    color: white;

    cursor: pointer;

    pointer-events: auto;

    font-size: 11px;

    letter-spacing: 2px;
}

#lang {
    position: absolute;

    right: 25px;
    top: 20px;

    padding: 7px 10px;

    background: rgba(0,0,0,.7);

    color: white;

    border: 1px solid #444;

    pointer-events: auto;
}

/* =================================
   ONLINE
================================= */

#online-box {
    position: absolute;

    right: 25px;
    top: 65px;

    width: 190px;

    padding: 14px;

    background:
        rgba(0,0,0,.65);

    border:
        1px solid rgba(255,255,255,.15);
}

.online-title {
    font-size: 10px;
    letter-spacing: 3px;
    color: #888;
    margin-bottom: 8px;
}

#online-list {
    margin: 0;
    padding: 0;
    list-style: none;

    max-height: 180px;

    overflow: auto;
}

#online-list li {
    font-size: 12px;
    padding: 4px 0;
}

.online-dot {
    display: inline-block;

    width: 6px;
    height: 6px;

    margin-right: 7px;

    border-radius: 50%;

    background: #fff;

    box-shadow:
        0 0 8px #fff;
}

/* =================================
   CHAT
================================= */

#chat {
    position: absolute;

    left: 25px;
    bottom: 75px;

    width: 330px;

    pointer-events: auto;
}

#chat-messages {
    height: 180px;

    overflow-y: auto;

    padding: 10px;

    background:
        rgba(0,0,0,.55);

    border:
        1px solid rgba(255,255,255,.12);

    margin-bottom: 7px;
}

.chat-line {
    font-size: 12px;

    margin-bottom: 7px;

    line-height: 1.4;
}

.chat-user {
    font-weight: bold;
}

.chat-system {
    color: #777;
    font-style: italic;
}

#chat-form {
    display: flex;
    gap: 5px;
}

#chat-input {
    flex: 1;

    height: 38px;

    padding: 0 10px;

    background: rgba(0,0,0,.8);

    border: 1px solid #333;

    color: white;

    outline: none;
}

#chat-send {
    width: 65px;

    border: 1px solid white;

    background: white;

    color: black;

    cursor: pointer;

    font-weight: bold;
}

/* =================================
   ZONE
================================= */

#zone-label {
    position: absolute;

    left: 50%;

    bottom: 25px;

    transform: translateX(-50%);

    font-size: 10px;

    letter-spacing: 5px;

    color: #777;
}

#hint {
    position: absolute;

    left: 50%;

    bottom: 8px;

    transform: translateX(-50%);

    font-size: 9px;

    letter-spacing: 2px;

    color: #555;
}

/* =================================
   CROSSHAIR
================================= */

#crosshair {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 14px;
    height: 14px;

    transform: translate(-50%,-50%);

    opacity: .55;
}

#crosshair::before,
#crosshair::after {
    content: "";

    position: absolute;

    background: white;
}

#crosshair::before {
    left: 6px;
    top: 0;

    width: 1px;
    height: 14px;
}

#crosshair::after {
    left: 0;
    top: 6px;

    width: 14px;
    height: 1px;
}

/* =================================
   MOBILE
================================= */

@media(max-width:700px) {

    #top-logo {
        font-size: 15px;
    }

    #online-box {
        right: 10px;
        top: 50px;
        width: 150px;
    }

    #chat {
        left: 10px;
        bottom: 70px;
        width: calc(100vw - 20px);
    }

    #audio-control {
        left: 10px;
        bottom: 15px;
    }

    #zone-label,
    #hint {
        display: none;
    }
}

</style>

</head>

<body>

<canvas id="canvas3d"></canvas>

<!-- =================================
     LOGIN
================================= -->

<div id="login-screen">

    <div class="login-box">

        <div class="login-logo">
            EWS
        </div>

        <div class="login-sub">
            SESSIONS / UNDERGROUND CLUB
        </div>

        <input
            id="username"
            type="text"
            placeholder="USERNAME"
            maxlength="24"
            autocomplete="username"
        >

        <input
            id="password"
            type="password"
            placeholder="PASSWORD"
            maxlength="60"
            autocomplete="current-password"
        >

        <div class="login-buttons">

            <button
                id="login-btn"
                type="button"
            >
                ENTER
            </button>

            <button
                id="register-btn"
                type="button"
            >
                REGISTER
            </button>

        </div>

        <div id="login-status"></div>

    </div>

</div>

<!-- =================================
     HUD
================================= -->

<div id="hud">

    <div id="top-logo">
        EWS SESSIONS
    </div>

    <div id="stream-indicator">
        AUDIO: READY
    </div>

    <button
        id="audio-control"
        type="button"
    >
        ▶ AUDIO: START
    </button>

    <select id="lang">

        <option value="en">
            EN
        </option>

        <option value="ru">
            RU
        </option>

        <option value="nl">
            NL
        </option>

        <option value="de">
            DE
        </option>

        <option value="fr">
            FR
        </option>

    </select>

    <div id="online-box">

        <div class="online-title">
            ONLINE
        </div>

        <ul id="online-list"></ul>

    </div>

    <div id="chat">

        <div id="chat-messages"></div>

        <form id="chat-form">

            <input
                id="chat-input"
                type="text"
                maxlength="500"
                autocomplete="off"
                placeholder="type message..."
            >

            <button
                id="chat-send"
                type="submit"
            >
                SEND
            </button>

        </form>

    </div>

    <div id="crosshair"></div>

    <div id="zone-label">
        MAIN FLOOR
    </div>

    <div id="hint">
        WASD MOVE · SPACE JUMP · V CAMERA · C CHAT
    </div>

</div>

<audio
    id="ews-audio"
    crossorigin="anonymous"
    playsinline
    preload="none"
></audio>

<script>

'use strict';

/* =========================================
   GLOBALS
========================================= */

let socket = null;

let currentUser = null;

let scene = null;
let camera = null;
let renderer = null;

let clock = new THREE.Clock();

let player = null;

let remotePlayers = new Map();

let keys = {};

let yaw = 0;
let pitch = 0;

let pointerLocked = false;

let thirdPerson = true;

let chatMode = false;

let velocityY = 0;

let grounded = true;

let lastNetworkUpdate = 0;

let audio = null;
let hls = null;
let audioStarted = false;

/* =========================================
   DOM
========================================= */

const canvas =
    document.getElementById('canvas3d');

const loginScreen =
    document.getElementById('login-screen');

const loginStatus =
    document.getElementById('login-status');

const usernameInput =
    document.getElementById('username');

const passwordInput =
    document.getElementById('password');

const onlineList =
    document.getElementById('online-list');

const chatMessages =
    document.getElementById('chat-messages');

const chatForm =
    document.getElementById('chat-form');

const chatInput =
    document.getElementById('chat-input');

const audioControl =
    document.getElementById('audio-control');

const streamIndicator =
    document.getElementById('stream-indicator');

/* =========================================
   AUTH
========================================= */

document
    .getElementById('login-btn')
    .addEventListener(
        'click',
        () => auth(false)
    );

document
    .getElementById('register-btn')
    .addEventListener(
        'click',
        () => auth(true)
    );

passwordInput.addEventListener(
    'keydown',
    event => {

        if (event.key === 'Enter') {
            auth(false);
        }

    }
);

async function auth(register) {

    const username =
        usernameInput.value.trim();

    const password =
        passwordInput.value;

    if (!username || !password) {

        loginStatus.textContent =
            'ENTER USERNAME AND PASSWORD';

        return;
    }

    loginStatus.textContent =
        'CONNECTING...';

    try {

        const response =
            await fetch(
                register
                    ? '/api/register'
                    : '/api/login',
                {
                    method: 'POST',

                    headers: {
                        'Content-Type':
                            'application/json'
                    },

                    body: JSON.stringify({
                        username,
                        password
                    })
                }
            );

        const data =
            await response.json();

        if (!data.ok) {

            loginStatus.textContent =
                data.message ||
                'ERROR';

            return;
        }

        currentUser =
            data.username;

        loginScreen.style.display =
            'none';

        startClub();

    } catch (error) {

        console.error(error);

        loginStatus.textContent =
            'SERVER CONNECTION ERROR';
    }
}

/* =========================================
   START
========================================= */

function startClub() {

    init3D();

    connectSocket();

    setupChat();

    setupLanguage();

    setupAudioButton();

    window.focus();

    addSystemMessage(
        `Welcome ${currentUser}`
    );
}

/* =========================================
   SOCKET
========================================= */

function connectSocket() {

    socket = io({
        transports: [
            'websocket',
            'polling'
        ],
        reconnection: true,
        reconnectionAttempts: Infinity,
        reconnectionDelay: 1000
    });

    socket.on(
        'connect',
        () => {

            console.log(
                '[SOCKET CONNECTED]',
                socket.id
            );

            socket.emit(
                'join',
                {
                    username:
                        currentUser,

                    language:
                        document.getElementById(
                            'lang'
                        ).value
                }
            );

            socket.emit(
                'request-online'
            );
        }
    );

    socket.on(
        'disconnect',
        () => {

            console.log(
                '[SOCKET DISCONNECTED]'
            );
        }
    );

    socket.on(
        'online-users',
        users => {

            renderOnline(
                Array.isArray(users)
                    ? users
                    : []
            );
        }
    );

    socket.on(
        'players-state',
        players => {

            if (!Array.isArray(players)) {
                return;
            }

            players.forEach(
                data => {

                    if (
                        !data ||
                        data.id === socket.id
                    ) {
                        return;
                    }

                    createOrUpdateRemote(
                        data
                    );
                }
            );
        }
    );

    socket.on(
        'player-joined',
        data => {

            if (
                data &&
                data.id !== socket.id
            ) {

                createRemote(
                    data.id,
                    data.username
                );
            }
        }
    );

    socket.on(
        'player-move',
        data => {

            if (
                data &&
                data.id !== socket.id
            ) {

                createOrUpdateRemote(
                    data
                );
            }
        }
    );

    socket.on(
        'player-left',
        data => {

            if (data?.id) {
                removeRemote(
                    data.id
                );
            }
        }
    );

    socket.on(
        'system-message',
        data => {

            if (data?.text) {
                addSystemMessage(
                    data.text
                );
            }
        }
    );

    socket.on(
        'chat-message',
        data => {

            if (!data) return;

            addChatMessage(
                data.username ||
                data.user ||
                'Guest',

                data.text || ''
            );
        }
    );
}

/* =========================================
   ONLINE
========================================= */

function renderOnline(users) {

    onlineList.innerHTML = '';

    users.forEach(user => {

        const li =
            document.createElement('li');

        li.innerHTML =
            `<span class="online-dot"></span>` +
            escapeHTML(
                user.username ||
                'Guest'
            );

        onlineList.appendChild(
            li
        );
    });
}

/* =========================================
   CHAT
========================================= */

function setupChat() {

    chatForm.addEventListener(
        'submit',
        event => {

            event.preventDefault();

            if (!socket) return;

            const text =
                chatInput.value.trim();

            if (!text) return;

            socket.emit(
                'chat-message',
                {
                    text
                }
            );

            chatInput.value = '';
        }
    );

    chatInput.addEventListener(
        'focus',
        () => {

            chatMode = true;

            document.exitPointerLock?.();
        }
    );

    chatInput.addEventListener(
        'blur',
        () => {

            chatMode = false;
        }
    );
}

function addChatMessage(
    username,
    text
) {

    const div =
        document.createElement('div');

    div.className =
        'chat-line';

    div.innerHTML =
        `<span class="chat-user">` +
        `${escapeHTML(username)}:` +
        `</span> ` +
        `${escapeHTML(text)}`;

    chatMessages.appendChild(
        div
    );

    while (
        chatMessages.children.length >
        100
    ) {
        chatMessages.removeChild(
            chatMessages.firstChild
        );
    }

    chatMessages.scrollTop =
        chatMessages.scrollHeight;
}

function addSystemMessage(text) {

    const div =
        document.createElement('div');

    div.className =
        'chat-line chat-system';

    div.textContent =
        text;

    chatMessages.appendChild(
        div
    );

    chatMessages.scrollTop =
        chatMessages.scrollHeight;
}

/* =========================================
   LANGUAGE
========================================= */

function setupLanguage() {

    document
        .getElementById('lang')
        .addEventListener(
            'change',
            event => {

                if (socket) {

                    socket.emit(
                        'language-change',
                        event.target.value
                    );
                }
            }
        );
}

/* =========================================
   3D
========================================= */

function init3D() {

    scene =
        new THREE.Scene();

    scene.background =
        new THREE.Color(0x020202);

    scene.fog =
        new THREE.Fog(
            0x020202,
            10,
            65
        );

    camera =
        new THREE.PerspectiveCamera(
            70,
            window.innerWidth /
                window.innerHeight,
            0.1,
            100
        );

    camera.position.set(
        0,
        2.2,
        8
    );

    renderer =
        new THREE.WebGLRenderer({
            canvas,
            antialias: true,
            powerPreference: 'high-performance'
        });

    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            2
        )
    );

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.shadowMap.enabled = true;

    renderer.shadowMap.type =
        THREE.PCFSoftShadowMap;

    createLights();

    createFloor();

    createWalls();

    createCeiling();

    createDanceFloor();

    createStage();

    createScreen();

    createBar();

    createLounge();

    createColumns();

    createSpeakers();

    createNeon();

    createParticles();

    createPlayer();

    setupControls();

    window.addEventListener(
        'resize',
        onResize
    );

    animate();
}

/* =========================================
   LIGHTS
========================================= */

function createLights() {

    const ambient =
        new THREE.AmbientLight(
            0xffffff,
            0.12
        );

    scene.add(
        ambient
    );

    const main =
        new THREE.PointLight(
            0xffffff,
            2.5,
            35
        );

    main.position.set(
        0,
        5,
        -5
    );

    main.castShadow = true;

    scene.add(
        main
    );

    const left =
        new THREE.PointLight(
            0x8844ff,
            2,
            25
        );

    left.position.set(
        -12,
        4,
        -4
    );

    scene.add(
        left
    );

    const right =
        new THREE.PointLight(
            0x4488ff,
            2,
            25
        );

    right.position.set(
        12,
        4,
        -4
    );

    scene.add(
        right
    );
}

/* =========================================
   FLOOR
========================================= */

function createFloor() {

    const geometry =
        new THREE.BoxGeometry(
            36,
            .3,
            42
        );

    const material =
        new THREE.MeshStandardMaterial({
            color: 0x080808,
            roughness: .85,
            metalness: .25
        });

    const floor =
        new THREE.Mesh(
            geometry,
            material
        );

    floor.position.y =
        -.15;

    floor.receiveShadow = true;

    scene.add(
        floor
    );
}

/* =========================================
   WALLS
========================================= */

function createWalls() {

    const material =
        new THREE.MeshStandardMaterial({
            color: 0x101010,
            roughness: .9
        });

    const back =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                36,
                6,
                .4
            ),
            material
        );

    back.position.set(
        0,
        3,
        -18
    );

    scene.add(back);

    const left =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .4,
                6,
                36
            ),
            material
        );

    left.position.set(
        -18,
        3,
        0
    );

    scene.add(left);

    const right =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .4,
                6,
                36
            ),
            material
        );

    right.position.set(
        18,
        3,
        0
    );

    scene.add(right);

    const front =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                36,
                6,
                .4
            ),
            material
        );

    front.position.set(
        0,
        3,
        18
    );

    scene.add(front);
}

/* =========================================
   CEILING
========================================= */

function createCeiling() {

    const ceiling =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                36,
                .3,
                42
            ),
            new THREE.MeshStandardMaterial({
                color: 0x050505
            })
        );

    ceiling.position.y =
        6;

    scene.add(
        ceiling
    );
}

/* =========================================
   DANCE FLOOR
========================================= */

function createDanceFloor() {

    const group =
        new THREE.Group();

    for (
        let x = -7;
        x < 7;
        x++
    ) {

        for (
            let z = -8;
            z < 6;
            z++
        ) {

            const tile =
                new THREE.Mesh(
                    new THREE.BoxGeometry(
                        .96,
                        .08,
                        .96
                    ),
                    new THREE.MeshStandardMaterial({
                        color:
                            (
                                (x + z) % 2 === 0
                            )
                            ? 0x181818
                            : 0x080808,

                        emissive:
                            (
                                (x + z) % 2 === 0
                            )
                            ? 0x050505
                            : 0x000000
                    })
                );

            tile.position.set(
                x,
                .04,
                z
            );

            group.add(
                tile
            );
        }
    }

    group.position.z =
        1;

    scene.add(
        group
    );
}

/* =========================================
   STAGE
========================================= */

function createStage() {

    const stage =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                15,
                .7,
                4
            ),
            new THREE.MeshStandardMaterial({
                color: 0x111111,
                metalness: .5,
                roughness: .5
            })
        );

    stage.position.set(
        0,
        .35,
        -13
    );

    stage.castShadow = true;
    stage.receiveShadow = true;

    scene.add(
        stage
    );

    for (
        let x = -6;
        x <= 6;
        x += 3
    ) {

        const light =
            new THREE.PointLight(
                0xffffff,
                1.5,
                8
            );

        light.position.set(
            x,
            2,
            -11
        );

        scene.add(
            light
        );
    }
}

/* =========================================
   SCREEN
========================================= */

function createScreen() {

    const screen =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                12,
                5,
                .3
            ),
            new THREE.MeshStandardMaterial({
                color: 0x050505,
                emissive: 0x101010
            })
        );

    screen.position.set(
        0,
        3.5,
        -15.2

    for (
        let i = 0;
        i < count;
        i++
    ) {

        positions[i * 3] =
            (Math.random() - .5) * 34;

        positions[i * 3 + 1] =
            Math.random() * 5.5;

        positions[i * 3 + 2] =
            (Math.random() - .5) * 34;
    }

    geometry.setAttribute(
        'position',
        new THREE.BufferAttribute(
            positions,
            3
        )
    );

    const material =
        new THREE.PointsMaterial({
            color: 0xffffff,
            size: .025,
            transparent: true,
            opacity: .35

            material

/* =========================================
   REMOTE PLAYER
========================================= */

function createRemote(
    id,
    username
) {

    if (
        remotePlayers.has(id)
    ) {
        return remotePlayers.get(id);
    }

    const group =
        new THREE.Group();

    const body =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .65,
                1.15,
                .45
            ),
            new THREE.MeshStandardMaterial({
                color: 0x888888
            })
        );

    body.position.y =
        .9;

    group.add(
        body
    );

    const head =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .32,
                16,
                16
            ),
            new THREE.MeshStandardMaterial({
                color: 0xffffff
            })
        );

    head.position.y =
        1.65;

    group.add(
        head
    );

    const label =
        makeNameLabel(
            username || 'Guest'
        );

    label.position.y =
        2.35;

    group.add(
        label
    );

    group.position.set(
        0,
        0,
        8
    );

    scene.add(
        group
    );

    remotePlayers.set(
        id,
        group
    );

    return group;
}

function createOrUpdateRemote(
    data
) {

    if (
        !data ||
        !data.id ||
        data.id === socket?.id
    ) {
        return;
    }

    const remote =
        createRemote(
            data.id,
            data.username || 'Guest'
        );

    remote.position.set(
        Number(data.x) || 0,
        Number(data.y) || 0,
        Number(data.z) || 0
    );

    remote.rotation.y =
        Number(data.ry) || 0;
}

function removeRemote(id) {

    const remote =
        remotePlayers.get(id);

    if (!remote) return;

    scene.remove(
        remote
    );

    remote.traverse(
        object => {

            if (object.geometry) {
                object.geometry.dispose();
            }

            if (object.material) {

                if (
                    Array.isArray(
                        object.material
                    )
                ) {

                    object.material.forEach(
                        material =>
                            material.dispose()
                    );

                } else {
                    object.material.dispose();
                }
            }
        }
    );

    remotePlayers.delete(
        id
    );
}

/* =========================================
   NAME LABEL
========================================= */

function makeNameLabel(text) {

    const c =
        document.createElement(
            'canvas'
        );

    c.width = 512;
    c.height = 128;

    const ctx =
        c.getContext('2d');

    ctx.clearRect(
        0,
        0,
        c.width,
        c.height
    );

    ctx.fillStyle =
        'rgba(0,0,0,.65)';

    ctx.fillRect(
        0,
        20,
        c.width,
        88
    );

    ctx.fillStyle =
        '#ffffff';

    ctx.font =
        'bold 42px Arial';

    ctx.textAlign =
        'center';

    ctx.textBaseline =
        'middle';

    ctx.fillText(
        text,
        c.width / 2,
        c.height / 2
    );

    const texture =
        new THREE.CanvasTexture(c);

    texture.needsUpdate =
        true;

    const material =
        new THREE.SpriteMaterial({
            map: texture,
            transparent: true
        });

    const sprite =
        new THREE.Sprite(
            material
        );

    sprite.scale.set(
        3,
        .75,
        1
    );

    return sprite;
}

/* =========================================
   CONTROLS
========================================= */

function setupControls() {

    window.addEventListener(
        'keydown',
        event => {

            if (
                event.target.tagName ===
                'INPUT'
            ) {
                return;
            }

            if (
                event.key.toLowerCase() ===
                'c'
            ) {

                chatInput.focus();

                return;
            }

            if (
                event.key.toLowerCase() ===
                'v'
            ) {

                thirdPerson =
                    !thirdPerson;

                return;
            }

            keys[
                event.key.toLowerCase()
            ] = true;

            if (
                event.code ===
                'Space'
            ) {

                event.preventDefault();

                jump();
            }
        }
    );

    window.addEventListener(
        'keyup',
        event => {

            keys[
                event.key.toLowerCase()
            ] = false;
        }
    );

    canvas.addEventListener(
        'click',
        () => {

            if (chatMode) return;

            canvas.requestPointerLock();
        }
    );

    document.addEventListener(
        'pointerlockchange',
        () => {

            pointerLocked =
                document.pointerLockElement ===
                canvas;
        }
    );

    document.addEventListener(
        'mousemove',
        event => {

            if (
                !pointerLocked ||
                chatMode
            ) {
                return;
            }

            yaw -=
                event.movementX *
                0.0025;

            pitch -=
                event.movementY *
                0.0025;

            pitch =
                Math.max(
                    -1.1,
                    Math.min(
                        .9,
                        pitch
                    )
                );
        }
    );
}

/* =========================================
   JUMP
========================================= */

function jump() {

    if (!grounded) {
        return;
    }

    velocityY =
        7;

    grounded =
        false;
}

/* =========================================
   COLLISION
========================================= */

function blocked(
    x,
    z
) {

    const margin = .7;

    if (
        x < -17.1 ||
        x > 17.1 ||
        z < -17.1 ||
        z > 17.1
    ) {
        return true;
    }

    /* Stage */

    if (
        x > -8 &&
        x < 8 &&
        z > -15 &&
        z < -10.8
    ) {
        return true;
    }

    /* Bar */

    if (
        x > -16 &&
        x < -8.2 &&
        z > 7.5 &&
        z < 10.7
    ) {
        return true;
    }

    /* Lounge */

    if (
        x > 8 &&
        x < 15 &&
        z > 5.5 &&
        z < 16
    ) {
        return true;
    }

    /* Columns */

    const columns = [
        [-15,-7],
        [15,-7],
        [-15,2],
        [15,2],
        [-15,11],
        [15,11]
    ];

    for (
        const p of columns
    ) {

        const dx =
            x - p[0];

        const dz =
            z - p[1];

        if (
            Math.sqrt(
                dx * dx +
                dz * dz
            ) <
            1.15
        ) {
            return true;
        }
    }

    return false;
}

/* =========================================
   MOVEMENT
========================================= */

function updatePlayer(delta) {

    if (!player) {
        return;
    }

    let forward = 0;
    let side = 0;

    if (keys.w) {
        forward += 1;
    }

    if (keys.s) {
        forward -= 1;
    }

    if (keys.a) {
        side -= 1;
    }

    if (keys.d) {
        side += 1;
    }

    const length =
        Math.sqrt(
            forward * forward +
            side * side
        );

    if (length > 0) {

        forward /= length;
        side /= length;

        const speed =
            5.5;

        const dx =
            (
                Math.sin(yaw) *
                forward
            ) +
            (
                Math.cos(yaw) *
                side
            );

        const dz =
            (
                Math.cos(yaw) *
                forward
            ) -
            (
                Math.sin(yaw) *
                side
            );

        const nextX =
            player.position.x +
            dx * speed * delta;

        const nextZ =
            player.position.z +
            dz * speed * delta;

        if (
            !blocked(
                nextX,
                player.position.z
            )
        ) {

            player.position.x =
                nextX;
        }

        if (
            !blocked(
                player.position.x,
                nextZ
            )
        ) {

            player.position.z =
                nextZ;
        }
    }

    velocityY -=
        18 * delta;

    player.position.y +=
        velocityY * delta;

    if (
        player.position.y <= 0
    ) {

        player.position.y = 0;

        velocityY = 0;

        grounded = true;
    }

    player.rotation.y =
        yaw;

    updateCamera();

    sendPlayerPosition();
}

/* =========================================
   CAMERA
========================================= */

function updateCamera() {

    if (!player) return;

    if (thirdPerson) {

        const distance =
            5;

        const height =
            2.7;

        const camX =
            player.position.x -
            Math.sin(yaw) *
            distance;

        const camZ =
            player.position.z -
            Math.cos(yaw) *
            distance;

        const desired =
            new THREE.Vector3(
                camX,
                player.position.y +
                    height,
                camZ
            );

        camera.position.lerp(
            desired,
            .15
        );

        const target =
            new THREE.Vector3(
                player.position.x,
                player.position.y +
                    1.2 +
                    pitch,
                player.position.z
            );

        camera.lookAt(
            target
        );

    } else {

        camera.position.set(
            player.position.x,
            player.position.y +
                1.65,
            player.position.z
        );

        camera.rotation.order =
            'YXZ';

        camera.rotation.y =
            yaw;

        camera.rotation.x =
            pitch;
    }
}

/* =========================================
   NETWORK
========================================= */

function sendPlayerPosition() {

    if (!socket) return;

    const now =
        performance.now();

    if (
        now - lastNetworkUpdate <
        50
    ) {
        return;
    }

    lastNetworkUpdate =
        now;

    socket.emit(
        'player-move',
        {
            x:
                player.position.x,

            y:
                player.position.y,

            z:
                player.position.z,

            ry:
                player.rotation.y,

            jumping:
                !grounded
        }
    );
}

/* =========================================
   AUDIO
========================================= */

function setupAudioButton() {

    audio =
        document.getElementById(
            'ews-audio'
        );

    audioControl.addEventListener(
        'click',
        startAudio
    );
}

function startAudio() {

    if (!audio) return;

    if (audioStarted) {

        if (audio.paused) {

            audio.play()
                .catch(
                    console.error
                );

            audioControl.textContent =
                '❚❚ AUDIO: PAUSE';

        } else {

            audio.pause();

            audioControl.textContent =
                '▶ AUDIO: START';
        }

        return;
    }

    const streamURL =
        window.location.origin +
        '/hls/ews/index.m3u8';

    if (
        window.Hls &&
        Hls.isSupported()
    ) {

        hls =
            new Hls({
                enableWorker: true,
                lowLatencyMode: true,
                maxBufferLength: 10
            });

        hls.loadSource(
            streamURL
        );

        hls.attachMedia(
            audio
        );

        hls.on(
            Hls.Events.MANIFEST_PARSED,
            () => {

                audio.play()
                    .then(
                        () => {

                            audioStarted =
                                true;

                            streamIndicator.textContent =
                                'AUDIO: PLAYING';

                            audioControl.textContent =
                                '❚❚ AUDIO: PAUSE';
                        }
                    )
                    .catch(
                        error => {

                            console.log(
                                '[AUDIO]',
                                error
                            );

                            streamIndicator.textContent =
                                'AUDIO: CLICK START';
                        }
                    );
            }
        );

        hls.on(
            Hls.Events.ERROR,
            (
                event,
                data
            ) => {

                console.log(
                    '[HLS]',
                    data
                );

                streamIndicator.textContent =
                    'AUDIO: OFFLINE';
            }
        );

    } else if (
        audio.canPlayType(
            'application/vnd.apple.mpegurl'
        )
    ) {

        audio.src =
            streamURL;

        audio.addEventListener(
            'loadedmetadata',
            () => {

                audio.play()
                    .then(
                        () => {

                            audioStarted =
                                true;

                            streamIndicator.textContent =
                                'AUDIO: PLAYING';

                            audioControl.textContent =
                                '❚❚ AUDIO: PAUSE';
                        }
                    );
            }
        );

    } else {

        streamIndicator.textContent =
            'AUDIO: NOT SUPPORTED';
    }
}

/* =========================================
   RESIZE
========================================= */

function onResize() {

    if (!camera || !renderer) {
        return;
    }

    camera.aspect =
        window.innerWidth /
        window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );
}

/* =========================================
   ANIMATION
========================================= */

function animate() {

    requestAnimationFrame(
        animate
    );

    const delta =
        Math.min(
            clock.getDelta(),
            .05
        );

    updatePlayer(
        delta
    );

    renderer.render(
        scene,
        camera
    );
}

/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(value) {

    return String(value)
        .replace(
            /&/g,
            '&amp;'
        )
        .replace(
            /</g,
            '&lt;'
        )
        .replace(
            />/g,
            '&gt;'
        )
        .replace(
            /"/g,
            '&quot;'
        )
        .replace(
            /'/g,
            '&#039;'
        );
}
