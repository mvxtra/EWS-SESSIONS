<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0"

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050505;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

#app{
  position:relative;
  width:100vw;
  height:100vh;
}

#canvas3d{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}

/* 3D HTML layer — the club screen is physically anchored in Three.js */
#css3d-container{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  z-index:15;
  pointer-events:none;
  overflow:hidden;
}

#css3d-screen{
  width:1400px;
  height:600px;
  position:absolute;
  left:0;
  top:0;
  background:#000;
  border:1px solid #222;
  box-shadow:0 0 45px rgba(0,0,0,.9);
  pointer-events:auto;
  overflow:hidden;
  display:block;
  visibility:hidden;
  opacity:0;
  transform:translateZ(0);
  backface-visibility:hidden;
  will-change:transform,opacity;
}

#css3d-screen.active{
  visibility:visible;
  opacity:1;
}

#css3d-screen iframe{
  width:100%;
  height:100%;
  border:0;
  display:block;
  background:#000;
}


/* =========================================================
   LOGIN
========================================================= */

#login{

  inset:0;
  z-index:1000;
  display:flex;
  align-items:center;
  justify-content:center;

  background:

  letter-spacing:8px;

  margin-bottom:8px;
}

.login-box p{

  letter-spacing:5px;
  color:#777;
  margin-bottom:30px;
}

.tabs{
  display:flex;
  margin-bottom:20px;
  border:1px solid #333;
}

.tab{
  flex:1;
  padding:11px;

  background:#0c0c0c;

  letter-spacing:2px;
}

.tab.active{

}

input{

  margin-bottom:12px;
  padding:0 14px;

  border:1px solid #333;

  color:#fff;

}

.btn{

  height:45px;

  border:0;

  background:#fff;
  color:#000;

  font-weight:bold;
  letter-spacing:2px;

  cursor:pointer;
}

.btn:hover{

}

.error{
  min-height:20px;
  margin-top:12px;
  color:#ff5555;
  font-size:12px;
}

/* =========================================================
   HUD
========================================================= */

#hud{
  position:absolute;
  inset:0;
  z-index:20;

  display:none;

  pointer-events:none;
}

#top-logo{
  position:absolute;

  top:18px;
  left:20px;

  font-size:16px;
  font-weight:900;
  letter-spacing:5px;

  text-shadow:0 0 20px #fff;
}

#top-logo span{
  display:block;

  margin-top:4px;

  font-size:8px;
  letter-spacing:3px;
  color:#777;
}

#online-box{
  position:absolute;

  top:18px;
  right:18px;

  width:190px;

  padding:13px;

  background:rgba(0,0,0,.72);

  border:1px solid #333;

  pointer-events:auto;
}

#online-box h3{

  letter-spacing:3px;
  color:#aaa;
  margin-bottom:9px;
}

#online-list{
  list-style:none;

  max-height:180px;
  overflow:auto;

  color:#ddd;
  font-size:12px;
}

#online-list li{
  padding:4px 0;

  border-bottom:1px solid #161616;
}

#online-list li::before{
  content:"●";

  color:#fff;

  margin-right:7px;

  font-size:8px;
}

/* =========================================================
   CHAT
========================================================= */

#chat{
  position:absolute;

  left:18px;
  bottom:18px;

  width:390px;
  height:250px;

  padding:12px;

  display:flex;
  flex-direction:column;

  background:rgba(0,0,0,.75);

  border:1px solid #333;

  pointer-events:auto;
}

#chat-title{
  font-size:9px;
  letter-spacing:3px;
  color:#777;

  margin-bottom:8px;
}

#chat-messages{
  flex:1;

  overflow-y:auto;

  margin-bottom:8px;
}

.msg{
  margin-bottom:7px;

  font-size:12px;
  line-height:1.4;
}

.msg .u{
  color:#fff;
  font-weight:bold;
}

.msg .t{
  color:#aaa;
}

#chat-form{
  display:flex;
  gap:6px;
}

#chat-input{
  flex:1;
  height:35px;
  margin:0;
}

#chat-send{
  width:45px;

  border:0;

  background:#fff;
  color:#000;

  cursor:pointer;
}


/* =========================================================
   CLUB SCREEN / MEDIA
========================================================= */

#screen-control{
  position:fixed;
  top:108px;
  left:50%;
  transform:translateX(-50%);
  z-index:31;
  pointer-events:auto;

  padding:0 18px;

  font-weight:bold;
  letter-spacing:3px;

}

#screen-control:hover{
  background:#fff;
  color:#000;
}

#screen-menu{
  position:fixed;
  top:148px;
  left:50%;
  transform:translateX(-50%);
  z-index:40;
  width:min(560px,calc(100vw - 30px));
  padding:16px;
  background:rgba(4,4,4,.96);
  border:1px solid #444;
  box-shadow:0 20px 70px rgba(0,0,0,.7);
  display:none;
  pointer-events:auto;
}

#screen-menu.open{display:block;}

#screen-menu-title{
  font-size:10px;
  letter-spacing:3px;
  color:#fff;
  margin-bottom:10px;
}

#screen-menu-row{
  display:flex;
  gap:7px;
}

#screen-url{
  flex:1;
  margin:0;
  height:38px;
}

.screen-btn{
  height:38px;
  padding:0 13px;
  border:1px solid #444;
  background:#111;
  color:#fff;
  cursor:pointer;
  font-size:10px;
  letter-spacing:1px;
}

.screen-btn:hover{
  background:#fff;
  color:#000;
}

#screen-status{
  margin-top:9px;
  color:#777;
  font-size:10px;
  line-height:1.4;
}

#css3d-container{position:absolute;inset:0;width:100%;height:100%;z-index:15;pointer-events:none;overflow:hidden;}
#css3d-screen{width:1400px;height:600px;position:absolute;left:0;top:0;background:#000;border:1px solid #222;box-shadow:0 0 45px rgba(0,0,0,.9);pointer-events:auto;overflow:hidden;display:none;}
#css3d-screen.active{display:block;}
#css3d-screen iframe{width:100%;height:100%;border:0;display:block;background:#000;pointer-events:auto;}
#css3d-screen-close{position:absolute;top:7px;right:7px;z-index:2;width:28px;height:28px;border:1px solid #555;background:rgba(0,0,0,.85);color:#fff;cursor:pointer;font-size:14px;line-height:26px;}

@media(max-width:700px){
  #screen-menu-row{flex-wrap:wrap;}

}

/* =========================================================
   EMOTES / DANCES
========================================================= */
#emotes-control{position:fixed;left:50%;bottom:58px;transform:translateX(-50%);z-index:32;pointer-events:auto;height:34px;padding:0 18px;border:1px solid #444;background:rgba(0,0,0,.82);color:#fff;font-size:10px;font-weight:bold;letter-spacing:3px;cursor:pointer;}
#emotes-control:hover{background:#fff;color:#000;}
#emotes-menu{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);z-index:41;width:250px;padding:10px;background:rgba(4,4,4,.97);border:1px solid #444;box-shadow:0 20px 70px rgba(0,0,0,.7);display:none;pointer-events:auto;}
#emotes-menu.open{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.emote-btn{height:36px;border:1px solid #333;background:#111;color:#fff;cursor:pointer;font-size:10px;letter-spacing:1px;}

/* =========================================================

========================================================= */

#hint{

  padding:9px 12px;

  font-size:10px;

}

#stream-indicator,#audio-control{display:none !important;}

#lang-bar{

  right:220px;

}

#lang{
  background:#080808;

  border:1px solid #333;

  color:#aaa;

}



#audio-control{
  position:absolute;

  top:58px;
  left:50%;

  transform:translateX(-50%);

  z-index:100;

  pointer-events:auto;

  padding:9px 14px;

  border:1px solid #444;

  background:rgba(0,0,0,.78);

  color:#aaa;

  font-family:monospace;

  letter-spacing:2px;

#audio-control.live{

}

}

#ews-audio{
  position:absolute;

  height:1px;

/* =========================================================

========================================================= */

@media(max-width:700px){

  #top-logo{

  }

  #online-box{

  }

  }

    font-size:8px;

  }

  #chat-messages{

/* =========================================================
   MOBILE JOYSTICK + EMOJI
========================================================= */
#mobile-joystick{

}

}

</style>
</head>

<body>

<div id="app">

<canvas id="canvas3d"></canvas>

<div id="css3d-container">
  <div id="css3d-screen">
    <iframe id="media-screen-frame" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen></iframe>
  </div>
</div>

<audio
  id="ews-audio"
  crossorigin="anonymous"
  playsinline
  preload="auto"
  autoplay
  volume="1">
</audio>

<!-- =====================================================
     LOGIN
===================================================== -->

<div id="login">

  <div class="login-box">

    <h1>EWS</h1>

    <p>
      SESSIONS / UNDERGROUND CLUB
    </p>

    <div class="tabs">

      <button
        class="tab active"
        onclick="switchTab('login')">
        ВХОД
      </button>

      <button
        class="tab"
        onclick="switchTab('register')">
        РЕГИСТРАЦИЯ
      </button>

    </div>

    <input
      id="f-username"
      placeholder="USERNAME"
      autocomplete="username"
    >

    <input
      id="f-password"
      type="password"
      placeholder="PASSWORD"
      autocomplete="current-password"
    >

    <button
      class="btn"
      id="submitBtn"
      onclick="doLogin()">
      ВОЙТИ
    </button>

    <div
      id="error"
      class="error">
    </div>

  </div>

</div>

<!-- =====================================================
     HUD
===================================================== -->

<div id="hud">

  <div id="top-logo">
    EWS
    <span>SESSIONS</span>
  </div>

  <button
    id="screen-control"
    onclick="toggleScreenMenu()">
    SCREEN
  </button>

  <div id="screen-menu">
    <div id="screen-menu-title">EWS SESSIONS / CLUB SCREEN</div>
    <div id="screen-menu-row">
      <input
        id="screen-url"
        type="url"
        placeholder="YouTube / Twitch / website URL"
        autocomplete="off"

      <button class="screen-btn" onclick="loadClubScreen()">LOAD</button>
      <button class="screen-btn" onclick="clearClubScreen()">CLEAR</button>
    </div>
    <div id="screen-status">YouTube и Twitch открываются со звуком через официальный embed. Для звука браузер может потребовать первый клик.</div>
  </div>

  <button id="emotes-control" onclick="toggleEmotesMenu()">EMOTES</button>

  <div id="emotes-menu">
    <button class="emote-btn" onclick="playDance(1)">DANCE 01</button>
    <button class="emote-btn" onclick="playDance(2)">DANCE 02</button>
    <button class="emote-btn" onclick="playDance(3)">SHUFFLE</button>
    <button class="emote-btn" onclick="playDance(4)">ROBOT</button>
    <button class="emote-btn" onclick="playDance(5)">BOUNCE</button>
    <button class="emote-btn" onclick="playDance(6)">WAVE</button>
    <button id="emote-stop" class="emote-btn" onclick="stopDance()">STOP DANCE</button>
  </div>

  <div id="lang-bar">

    <select id="lang">

      <option value="ru">RU</option>
      <option value="en">EN</option>
      <option value="es">ES</option>
      <option value="de">DE</option>
      <option value="fr">FR</option>
      <option value="zh">中文</option>
      <option value="ja">日本語</option>
      <option value="ko">한국어</option>
      <option value="ar">AR</option>
      <option value="hi">HI</option>
      <option value="pt">PT</option>
      <option value="it">IT</option>
      <option value="tr">TR</option>
      <option value="uk">UA</option>

    </select>

  </div>

  <div id="online-box">

    <h3>
      ONLINE
    </h3>

    <ul id="online-list"></ul>

  </div>

  <div id="chat">

    <div id="chat-title">
      EWS SESSIONS / CHAT

        id="chat-input"
        autocomplete="off"
        placeholder="write something..."

        →
      </button>

    </form>

  </div>



  <div id="hint">
    WASD MOVE · MOUSE LOOK · ENTER CHAT
  </div>

</div>

</div>

<script>

let mode='login';

let socket=null;
let currentUser=null;

let scene;
let camera;
let renderer;
let cssScene;
let cssRenderer;
let cssScreenObject;

let keys={};

// JUMP / GRAVITY
let jumpVelocity=0;
let playerY=1.7;
const GROUND_Y=1.7;
const JUMP_FORCE=7.2;
const GRAVITY=18;
let isGrounded=true;

let yaw=0;
let pitch=0;

let pointerLocked=false;
let chatMode=false;

let clock=new THREE.Clock();

let neonObjects=[];
let lightObjects=[];

let particles;

let analyser=null;
let freqData=null;

let audioLevel=0;
let bassLevel=0;

let audioContext=null;
let audioSource=null;

let audioStarted=false;

let hls=null;

let screenTexture;
let screenCanvas;
let screenCtx;
let screenMesh;
let screenMediaActive=false;
let screenMediaUrl='';
let onlineUserList=[];
let remotePlayers=new Map();
let lastPlayerBroadcast=0;
let clubScreenHost=null;
let activeDance=0;
let danceStartedAt=0;

let playerBody;
let avatarLoader=null;
let avatarTemplates={male:null,female:null};
let avatarLoadStarted=false;
let collisionBoxes=[];
let seatPoints=[];
let sitting=false;
let currentSeatId=null;
let lastSitAttempt=0;
let logoSign=null;
let clubLasers=[];
let movingHeads=[];
let laserDevices=[];
let smokeCannons=[];
let smokeParticles=[];
let hazeGroup=null;

/* =========================================================
   EWS TEXTURES
   CC0 seamless textures from ShareTextures
========================================================= */

const EWS_TEXTURES = {
  concrete: 'https://images.sharetextures.com/u/concrete_black_mat-min.webp',
  floor: 'https://images.sharetextures.com/u/stone_floor_1-min.webp'
};

const ewsTextureLoader = new THREE.TextureLoader();

function loadEWSTexture(url, repeatX=4, repeatY=4){
  const texture = ewsTextureLoader.load(url);
  texture.wrapS = THREE.RepeatWrapping;
  texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(repeatX, repeatY);
  texture.anisotropy = Math.min(8, renderer ? renderer.capabilities.getMaxAnisotropy() : 8);
  texture.colorSpace = THREE.SRGBColorSpace;
  return texture;
}

/* =========================================================
   LOGIN
========================================================= */

function switchTab(type){

  mode=type;

  document
    .querySelectorAll('.tab')
    .forEach(
      t=>t.classList.remove('active')
    );

  if(type==='login'){

    document
      .querySelectorAll('.tab')[0]
      .classList.add('active');

    document.getElementById(
      'submitBtn'
    ).textContent='ВОЙТИ';

  }else{

    document
      .querySelectorAll('.tab')[1]
      .classList.add('active');

    document.getElementById(
      'submitBtn'
    ).textContent='СОЗДАТЬ АККАУНТ';

  }

  document.getElementById(
    'error'
  ).textContent='';

}

async function doLogin(){

  const username =
    document
      .getElementById('f-username')
      .value
      .trim();

  const password =
    document
      .getElementById('f-password')
      .value;

  const error =
    document.getElementById('error');

  error.textContent='';

  if(!username || !password){

    error.textContent=
      'Введите логин и пароль';

    return;
  }

  try{

    const res =
      await fetch(
        '/api/'+mode,
        {
          method:'POST',

          headers:{
            'Content-Type':
              'application/json'
          },

          body:JSON.stringify({
            username,
            password
          })
        }
      );

    const data =
      await res.json();

    if(data.error){

      error.textContent=
        data.error;

      return;
    }

    startSession(username);

  }catch(err){

    console.error(err);

    error.textContent=
      'Ошибка соединения';

  }

}

/* =========================================================
   SESSION
========================================================= */

function startSession(username){

  currentUser=username;

  const savedLanguage=localStorage.getItem('ews-language');
  const langSelect=document.getElementById('lang');
  if(langSelect && savedLanguage) langSelect.value=savedLanguage;

  document.getElementById(
    'login'
  ).style.display='none';

  document.getElementById(
    'hud'
  ).style.display='block';

  // SCREEN button is a HUD control and belongs only to mvxtra.
  clubScreenHost='mvxtra';
  const screenButton=document.getElementById('screen-control');
  if(screenButton){
    screenButton.style.display = String(currentUser).toLowerCase()==='mvxtra' ? 'block' : 'none';
  }

  init3D();

  // The saved language is restored before socket.io joins.

  socket=io();

  let savedPos = null;
  let reconnectAttempts = 0;

  socket.on('disconnect', function(){
    console.warn('[EWS] Socket disconnected, will auto-reconnect...');
    if(camera){
      savedPos = {x: camera.position.x, y: playerY, z: camera.position.z, yaw, pitch};
    }
  });

  socket.on('connect',function(){
    reconnectAttempts = 0;

    socket.emit(
      'join',
      {
        username: currentUser,
        language: (document.getElementById('lang')?.value || 'ru')
      }
    );

    socket.emit('language-change',document.getElementById('lang')?.value || 'ru');

    // Refresh the multiplayer snapshot after the server has registered this player.
    // This also fixes reconnects where the initial snapshot can arrive before the
    // browser has finished rebuilding the 3D scene.
    setTimeout(()=>{
      if(socket && socket.connected){
        socket.emit('request-players');
        socket.emit('request-club-screen');
        // Restore position after reconnect
        if(savedPos){
          camera.position.x = savedPos.x;
          playerY = savedPos.y;
          camera.position.z = savedPos.z;
          yaw = savedPos.yaw;
          pitch = savedPos.pitch;
          savedPos = null;
        }
      }
    },350);

  });

  socket.on('language-updated',data=>{
    if(data && data.language){
      const lang=document.getElementById('lang');
      if(lang) lang.value=data.language;
      localStorage.setItem('ews-language',data.language);
    }
  });

  socket.on(
    'online',
    list=>{

      onlineUserList=Array.isArray(list)?list:[];
      // Screen control belongs ONLY to mvxtra. Never use the first online user as host.
      clubScreenHost='mvxtra';

      const ul =
        document.getElementById('online-list');

      ul.innerHTML='';

      const screenButton=document.getElementById('screen-control');
      if(screenButton){ screenButton.style.display=isClubHost()?'block':'none'; }

      if(!Array.isArray(list)) return;

      list.forEach(user=>{

        const li =
          document.createElement('li');

        const name =
          typeof user === 'string'
            ? user
            : user.username;

        li.textContent =
          name === currentUser
            ? name + ' (YOU)'
            : name;

        ul.appendChild(li);

      });

    }
  );

  socket.on(
    'chat-message',
    async message=>{

      // The server normally sends a translation for each user's selected
      // language. If an external translation request failed upstream and
      // the translated text is still identical to the original, use the
      // public /api/translate endpoint as a client-side safety net.
      let displayText=String(message?.text||'');
      const selectedLanguage=document.getElementById('lang')?.value||'ru';
      const originalText=String(message?.original||'');
      if(message?.translated===true && message?.targetLanguage===selectedLanguage &&
         originalText && displayText===originalText && /[A-Za-zА-Яа-яЁё]/.test(originalText) &&
         !/^[\s\d\W_]+$/.test(originalText)){
        try{
          const response=await fetch('/api/translate',{
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({text:originalText,target:selectedLanguage})
          });
          const data=await response.json();
          if(data?.ok && typeof data.text==='string' && data.text.trim()) displayText=data.text;
        }catch(err){
          console.warn('[EWS TRANSLATOR FALLBACK]',err);
        }
      }

      const el =
        document.createElement(
          'div'
        );

      el.className='msg';

      const time =
        new Date(
          message.ts
        ).toLocaleTimeString();

      const user =
        document.createElement(
          'span'
        );

      user.className='u';

      user.textContent=
        message.user;

      const text =
        document.createElement(
          'span'
        );

      text.className='t';

      text.textContent=
        ' '+time+' '+displayText;

      el.appendChild(user);

      el.appendChild(
        document.createTextNode(' ')
      );

      el.appendChild(text);

      const box =
        document.getElementById(
          'chat-messages'
        );

      box.appendChild(el);

      box.scrollTop=
        box.scrollHeight;

    }
  );

  socket.on('club-screen-state', state=>{
    applyRemoteClubScreen(state);
  });

  // =====================================================
  // MULTIPLAYER — initial snapshot + live updates
  // =====================================================

  socket.on('players-state', list=>{
    if(!Array.isArray(list)) return;

    // Server sends everyone except the current socket.
    // Rebuild only the missing players so existing objects keep moving smoothly.
    const alive = new Set();

    list.forEach(data=>{
      if(!data || !data.id || data.id===socket.id) return;
      alive.add(data.id);
      updateRemotePlayer(data);
    });

    // Remove players that are no longer present in the server snapshot.
    Array.from(remotePlayers.keys()).forEach(id=>{
      if(!alive.has(id)) removeRemotePlayer(id);
    });
  });

  socket.on('player-joined', data=>{
    if(!data || !data.id || data.id===socket.id) return;
    updateRemotePlayer(data);
  });

  // The current server uses player-spawn for the joining player and some
  // server versions also use it for a fresh multiplayer snapshot.
  socket.on('player-spawn', data=>{
    if(!data || !data.id || data.id===socket.id) return;
    updateRemotePlayer(data);
  });

  // Compatibility with the older multiplayer event name.
  socket.on('player-move', data=>{
    if(!data || !data.id || data.id===socket.id) return;
    updateRemotePlayer(data);
  });

  socket.on('player-left', id=>{
    removeRemotePlayer(id);
  });

  socket.on('player-removed', id=>{
    removeRemotePlayer(id);
  });

  // Ask the server for a fresh snapshot after every connection.
  socket.on('joined', ()=>{
    socket.emit('request-players');
    socket.emit('request-club-screen');
  });

  socket.on('emoji-reaction', data=>{
    if(data && typeof data.emoji === 'number') spawnRemoteEmoji(data);
  });

  socket.on('vip-access', data=>{
    if(data && Array.isArray(data.users)){
      VIP_USERS.clear();
      data.users.forEach(u => VIP_USERS.add(String(u).toLowerCase()));
    }
  });

  socket.on('seat-occupied', data=>{
    if(data && data.seatId) console.log('Seat occupied:',data.seatId);
  });

  socket.on('player-state', data=>{
    if(data && data.id===socket.id){
      sitting=!!data.sitting;
      currentSeatId=data.seatId||null;
    }
    if(!data || !data.id || data.id===socket.id) return;
    updateRemotePlayer(data);
  });

}

function createBox(
  w,h,d,
  x,y,z,
  material,
  cast=true,
  receive=true
){

  const mesh =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        w,h,d
      ),
      material
    );

  mesh.position.set(
    x,y,z
  );

  mesh.castShadow=
    cast;

  mesh.receiveShadow=
    receive;

  scene.add(mesh);

  return mesh;

}

function createLight(
  x,y,z,
  color,
  intensity,
  distance
){

  const light =
    new THREE.PointLight(
      color,
      intensity,
      distance
    );

  light.position.set(
    x,y,z
  );

  light.castShadow=true;

  scene.add(light);

  lightObjects.push(
    light
  );

  return light;

}

/* =========================================================
   STROBE LIGHT
   Random intermittent flashes above the dancefloor.
========================================================= */
let strobeLight = null;
let strobeNextFlash = 0;
let strobeActiveUntil = 0;

function createStrobeLight(){
  strobeLight = new THREE.PointLight(0xffffff, 0, 25);
  strobeLight.position.set(0, 5.2, -1);
  scene.add(strobeLight);
  strobeNextFlash = performance.now() + 2000 + Math.random() * 3000;
}

function updateStrobe(now){
  if(!strobeLight) return;
  if(now < strobeNextFlash){
    // Check if currently in a flash
    if(now < strobeActiveUntil){
      strobeLight.intensity = 6 + Math.random() * 4;
    } else {
      strobeLight.intensity = 0;
    }
    return;
  }
  // Start a new flash burst
  const burstCount = 2 + Math.floor(Math.random() * 4); // 2-5 flashes
  const burstDuration = 0.08 + Math.random() * 0.06; // 0.08-0.14 sec per flash
  strobeActiveUntil = now + burstDuration * 1000;
  strobeNextFlash = now + (3000 + Math.random() * 8000); // 3-11 sec pause
  strobeLight.intensity = 8;
}

function updateClock(){
  if(!clockCtx || !clockTexture) return;
  // MSK = UTC+3
  const now = new Date();
  const utc = now.getTime() + now.getTimezoneOffset() * 60000;
  const msk = new Date(utc + 3 * 3600000);
  const hh = String(msk.getHours()).padStart(2, '0');
  const mm = String(msk.getMinutes()).padStart(2, '0');
  const ss = String(msk.getSeconds()).padStart(2, '0');

  clockCtx.fillStyle = 'rgba(0,0,0,.85)';
  clockCtx.fillRect(0, 0, 512, 160);

  clockCtx.fillStyle = '#6ea8ff';
  clockCtx.font = 'bold 60px "Courier New", monospace';
  clockCtx.textAlign = 'center';
  clockCtx.textBaseline = 'middle';
  clockCtx.shadowColor = '#6ea8ff';
  clockCtx.shadowBlur = 20;
  clockCtx.fillText(hh + ':' + mm + ':' + ss, 256, 60);
  clockCtx.shadowBlur = 0;

  clockCtx.fillStyle = '#5577aa';
  clockCtx.font = 'bold 22px Arial';
  clockCtx.fillText('MSK', 256, 125);

  clockTexture.needsUpdate = true;
}

function updateEmojis(now){
  emojiSprites = emojiSprites.filter(s => {
    const age = now - s.userData.born;
    if(age > s.userData.life){
      scene.remove(s);
      if(s.material.map) s.material.map.dispose();
      s.material.dispose();
      return false;
    }
    const t = age / s.userData.life;
    s.position.y += s.userData.vy;
    s.material.opacity = 1 - t;
    return true;
  });
}

/* =========================================================
   MOBILE CONTROLS — virtual joystick + touch look
========================================================= */
let isMobile = /Android|iPhone|iPad|iPod|Mobile|mobile|Touch/i.test(navigator.userAgent) || ('ontouchstart' in window && window.innerWidth < 900);
let joystickActive = false;
let joystickStart = {x: 0, y: 0};
let joystickVec = {x: 0, y: 0};
let touchLookActive = false;
let touchLookId = null;
let touchLookLast = {x: 0, y: 0};

function setupMobileControls(){
  if(!isMobile) return;

  // Create joystick element
  const js = document.createElement('div');
  js.id = 'mobile-joystick';
  js.style.cssText = 'position:fixed;bottom:100px;left:60px;width:120px;height:120px;border-radius:50%;border:2px solid rgba(110,168,255,.4);background:rgba(0,0,0,.3);z-index:300;touch-action:none;display:flex;align-items:center;justify-content:center;';
  const knob = document.createElement('div');
  knob.id = 'joystick-knob';
  knob.style.cssText = 'width:50px;height:50px;border-radius:50%;background:rgba(110,168,255,.5);border:1px solid rgba(110,168,255,.8);position:absolute;';
  js.appendChild(knob);
  document.body.appendChild(js);

  // Emoji buttons for mobile
  const eb = document.createElement('div');
  eb.id = 'mobile-emoji-bar';
  eb.style.cssText = 'position:fixed;bottom:100px;right:20px;display:flex;gap:8px;z-index:300;touch-action:none;';
  EMOJI_LIST.forEach((emoji, i) => {
    const btn = document.createElement('button');
    btn.textContent = emoji;
    btn.style.cssText = 'width:44px;height:44px;font-size:24px;border:1px solid #444;background:rgba(0,0,0,.7);border-radius:50%;cursor:pointer;';
    btn.addEventListener('touchstart', (e) => { e.preventDefault(); spawnEmoji(i); }, {passive: false});
    eb.appendChild(btn);
  });
  document.body.appendChild(eb);

  // Joystick touch events
  js.addEventListener('touchstart', (e) => {
    e.preventDefault();
    joystickActive = true;
    const t = e.touches[0];
    joystickStart = {x: t.clientX, y: t.clientY};
  }, {passive: false});

  js.addEventListener('touchmove', (e) => {
    e.preventDefault();
    if(!joystickActive) return;
    const t = e.touches[0];
    const dx = t.clientX - joystickStart.x;
    const dy = t.clientY - joystickStart.y;
    const maxR = 50;
    const dist = Math.hypot(dx, dy);
    const clampedDist = Math.min(dist, maxR);
    const angle = Math.atan2(dy, dx);
    const kx = Math.cos(angle) * clampedDist / maxR;
    const ky = Math.sin(angle) * clampedDist / maxR;
    joystickVec = {x: kx, y: ky};
    knob.style.transform = `translate(${kx * maxR}px, ${ky * maxR}px)`;
  }, {passive: false});

  js.addEventListener('touchend', (e) => {
    e.preventDefault();
    joystickActive = false;
    joystickVec = {x: 0, y: 0};
    knob.style.transform = 'translate(0, 0)';
  }, {passive: false});

  // Touch look — right half of screen
  document.addEventListener('touchstart', (e) => {
    for(const t of e.changedTouches){
      const target = t.target;
      if(target.id === 'mobile-joystick' || target.id === 'joystick-knob' || target.id === 'mobile-emoji-bar' || target.closest('#mobile-emoji-bar') || target.closest('#chat') || target.closest('#chat-input') || target.closest('#chat-send') || target.closest('#emotes-menu') || target.closest('#screen-menu') || target.closest('#screen-control') || target.closest('#emotes-control')){
        continue;
      }
      if(t.clientX > window.innerWidth / 2 && !touchLookActive){
        touchLookActive = true;
        touchLookId = t.identifier;
        touchLookLast = {x: t.clientX, y: t.clientY};
      }
    }
  }, {passive: false});

  document.addEventListener('touchmove', (e) => {
    if(!touchLookActive) return;
    for(const t of e.changedTouches){
      if(t.identifier === touchLookId){
        const dx = t.clientX - touchLookLast.x;
        const dy = t.clientY - touchLookLast.y;
        yaw -= dx * 0.004;
        pitch -= dy * 0.004;
        pitch = Math.max(-1.45, Math.min(1.45, pitch));
        touchLookLast = {x: t.clientX, y: t.clientY};
      }
    }
  }, {passive: false});

  document.addEventListener('touchend', (e) => {
    for(const t of e.changedTouches){
      if(t.identifier === touchLookId){
        touchLookActive = false;
        touchLookId = null;
      }
    }
  }, {passive: false});
}

function collides(x,z){
  const r=.38;
  if(collisionBoxes.some(b=>x> b.minX-r && x< b.maxX+r && z> b.minZ-r && z< b.maxZ+r)) return true;
  // VIP zone — blocks non-VIP users
  if(vipZoneBox && !isVIPUser()){
    if(x > vipZoneBox.minX - r && x < vipZoneBox.maxX + r && z > vipZoneBox.minZ - r && z < vipZoneBox.maxZ + r) return true;
  }
  return false;
}

function tryMove(dx,dz){
  const nx=THREE.MathUtils.clamp(camera.position.x+dx,-16.6,16.6);
  const nz=THREE.MathUtils.clamp(camera.position.z+dz,-15.6,15.6);
  if(!collides(nx,camera.position.z)) camera.position.x=nx;
  if(!collides(camera.position.x,nz)) camera.position.z=nz;
}

function nearestSeat(){
  let best=null,dist=Infinity;
  seatPoints.forEach(s=>{const d=Math.hypot(camera.position.x-s.x,camera.position.z-s.z); if(d<dist){dist=d;best=s;}});
  return dist<1.45?best:null;
}

function sitDown(){
  if(chatMode||!socket||sitting)return;
  const seat=nearestSeat();
  if(!seat || performance.now()-lastSitAttempt<500)return;
  lastSitAttempt=performance.now();
  socket.emit('sit',{seatId:seat.id});
}

function standUp(){
  if(!sitting)return;
  sitting=false; currentSeatId=null;
  socket && socket.emit('stand');
  camera.position.y=GROUND_Y;
}

function setupAudio(){
  const indicator=document.getElementById('stream-indicator');
  const button=document.getElementById('audio-control');
  if(indicator){ indicator.textContent='AUDIO: READY'; indicator.classList.remove('live','error'); }
  if(button){ button.textContent='▶ AUDIO: START'; button.classList.remove('live'); }
}

async function unlockEWSAudio(){

  const audio = document.getElementById('ews-audio');
  if(!audio) return false;
  audio.muted=false; audio.volume=1;

  try{
    if(audioContext && audioContext.state === 'suspended'){
      await audioContext.resume();
    }

    if(audioStarted && audio.paused){
      await audio.play();
      return true;
    }

    // If the stream was blocked by autoplay policy, retry the full
    // HLS startup from this real user interaction.
    if(!audioStarted){
      await startSSHAudio();
      return true;
    }
  }catch(err){
    console.warn('[EWS AUDIO UNLOCK]', err);
  }

  return false;
}

async function startSSHAudio(){

  const audio =
    document.getElementById(
      'ews-audio'
    );

  const indicator =
    document.getElementById('stream-indicator') ||
    {textContent:'',classList:{add(){},remove(){}}};

  const button =
    document.getElementById('audio-control') ||
    {textContent:'',disabled:false,classList:{add(){},remove(){}}};

  if(!audio)return;
  audio.muted=false; audio.volume=1; audio.autoplay=true;

  const hlsUrl =
    window.location.origin+
    '/hls/ews/index.m3u8';

  if(indicator) indicator.classList.remove('error');

  if(indicator) indicator.classList.add('live');

  if(indicator) indicator.textContent='AUDIO: CONNECTING...';

  if(button) button.disabled=true;

  if(button) button.textContent='● AUDIO: CONNECTING';

  try{

    if(!audioContext){

      audioContext =
        new(
          window.AudioContext ||
          window.webkitAudioContext
        )();

      audioSource =
        audioContext.createMediaElementSource(
          audio
        );

      analyser =
        audioContext.createAnalyser();

      analyser.fftSize=256;

      analyser.smoothingTimeConstant=.82;

      freqData =
        new Uint8Array(
          analyser.frequencyBinCount
        );

      audioSource.connect(
        analyser
      );

      analyser.connect(
        audioContext.destination
      );

    }

    if(
      audioContext.state===
      'suspended'
    ){

      await audioContext.resume();

    }

    if(hls){

      try{
        hls.destroy();
      }catch(e){}

      hls=null;

    }

    if(
      window.Hls &&
      Hls.isSupported()
    ){

      hls =
        new Hls({

          enableWorker:true,

          lowLatencyMode:true,

          backBufferLength:30,

          maxBufferLength:10,

          maxMaxBufferLength:20,

          liveSyncDurationCount:3,

          liveMaxLatencyDurationCount:6

        });

      hls.loadSource(
        hlsUrl
      );

      hls.attachMedia(
        audio
      );

      hls.on(
        Hls.Events.MANIFEST_PARSED,
        async function(){

          if(indicator) indicator.textContent='AUDIO: LIVE';

          if(button) button.textContent='● AUDIO: LIVE';

          if(button) button.classList.add('live');

          if(button) button.disabled=false;

          audioStarted=true;

          try{

            await audio.play();

          }catch(err){

            console.warn(
              'Audio play blocked:',
              err
            );

            indicator.textContent=
              'AUDIO: PRESS START';

            button.textContent=
              '▶ AUDIO: START';

            button.classList.remove(
              'live'
            );

          }

        }
      );

      hls.on(
        Hls.Events.ERROR,
        function(
          event,
          data
        ){

          console.error(
            '[HLS]',
            data
          );

          if(!data.fatal)return;

          if(
            data.type===
            Hls.ErrorTypes.NETWORK_ERROR
          ){

            indicator.textContent=
              'AUDIO: RECONNECTING...';

            button.textContent=
              '● AUDIO: RECONNECTING';

            setTimeout(
              function(){

                if(hls){

                  try{
                    hls.startLoad();
                  }catch(e){}

                }

              },
              1000
            );

          }

          else if(
            data.type===
            Hls.ErrorTypes.MEDIA_ERROR
          ){

            indicator.textContent=
              'AUDIO: RECOVERING...';

            try{

              hls.recoverMediaError();

            }catch(e){

              console.error(e);

            }

          }

          else{

            indicator.textContent=
              'AUDIO: NO STREAM';

            indicator.classList.remove(
              'live'
            );

            indicator.classList.add(
              'error'
            );

            button.textContent=
              '▶ AUDIO: RETRY';

            button.classList.remove(
              'live'
            );

            if(button) button.disabled=false;

          }

        }
      );

    }

    else if(
      audio.canPlayType(
        'application/vnd.apple.mpegurl'
      )
    ){

      audio.src=
        hlsUrl;

      audio.addEventListener(
        'loadedmetadata',
        async function(){

          try{

            await audio.play();

          }catch(err){

            console.error(err);

          }

        },
        {
          once:true
        }
      );

    }

    else{

      throw new Error(
        'HLS is not supported by this browser'
      );

    }

    audio.onplaying=function(){

      indicator.textContent=
        'AUDIO: LIVE';

      indicator.classList.add(
        'live'
      );

      indicator.classList.remove(
        'error'
      );

      button.textContent=
        '● AUDIO: LIVE';

      button.classList.add(
        'live'
      );

      if(button) button.disabled=false;

      audioStarted=true;

    };

    audio.onpause=function(){

      if(
        audioStarted &&
        !audio.ended
      ){

        indicator.textContent=
          'AUDIO: PAUSED';

        button.textContent=
          '▶ AUDIO: RESUME';

        button.classList.remove(
          'live'
        );

      }

    };

    audio.onerror=function(){

      console.error(
        '[AUDIO]',
        audio.error
      );

      indicator.textContent=
        'AUDIO: ERROR';

      indicator.classList.remove(
        'live'
      );

      indicator.classList.add(
        'error'
      );

      button.textContent=
        '▶ AUDIO: RETRY';

      button.classList.remove(
        'live'
      );

      if(button) button.disabled=false;

    };

  }catch(err){

    console.error(
      '[EWS AUDIO ERROR]',
      err
    );

    indicator.textContent=
      'AUDIO: NO STREAM';

    if(indicator) indicator.classList.remove('live');

    if(indicator) indicator.classList.add('error');

    if(button) button.textContent='▶ AUDIO: RETRY';

    if(button) button.classList.remove('live');

    if(button) button.disabled=false;

  }

}

function setupControls(){

  window.addEventListener(
    'resize',
    function(){

      if(
        !camera ||
        !renderer
      ){
        return;
      }

      camera.aspect=
        innerWidth/
        innerHeight;

      camera.updateProjectionMatrix();

      renderer.setSize(
        innerWidth,
        innerHeight
      );

      if(cssRenderer){
        cssRenderer.setSize(innerWidth,innerHeight);
      }

    }
  );

  window.addEventListener(
    'keydown',
    function(e){

      // While typing, movement keys must never get stuck in the 3D controller.
      const active=document.activeElement;
      const typing=active && (active.tagName==='INPUT' || active.tagName==='TEXTAREA');

      if(e.code==='Escape' && chatMode){
        e.preventDefault();
        chatMode=false;
        const input=document.getElementById('chat-input');
        if(input) input.blur();
        keys={};
        return;
      }

      if(typing && !chatMode){
        return;
      }

      if(chatMode && active && active.id==='chat-input'){
        if(e.code==='KeyW' || e.code==='KeyA' || e.code==='KeyS' || e.code==='KeyD' || e.code==='ArrowUp' || e.code==='ArrowDown' || e.code==='ArrowLeft' || e.code==='ArrowRight'){
          return;
        }
      }

      if(!chatMode){
        if(e.code==='KeyE'){
          if(sitting) standUp(); else sitDown();
          e.preventDefault();
          return;
        }
        if(e.code==='Space' && sitting){
          standUp();
          e.preventDefault();
          return;
        }
        if(e.code==='KeyB'){ toggleEmotesMenu(); e.preventDefault(); return; }
        if(e.code==='Digit1'){ playDance(1); e.preventDefault(); return; }
        if(e.code==='Digit2'){ playDance(2); e.preventDefault(); return; }
        if(e.code==='Digit3'){ playDance(3); e.preventDefault(); return; }
        if(e.code==='Digit4'){ playDance(4); e.preventDefault(); return; }
        if(e.code==='Digit5'){ playDance(5); e.preventDefault(); return; }
        if(e.code==='Digit6'){ playDance(6); e.preventDefault(); return; }
        if(['KeyW','KeyA','KeyS','KeyD','Space'].includes(e.code) && activeDance){ stopDance(); }
      }

      keys[e.code]=true;

      if(e.code==='Enter' && chatMode && active && active.id==='chat-input'){
        return; // the chat form handles Enter -> send
      }
      if(e.code==='Enter'){
        e.preventDefault();
        chatMode=true;
        toggleChat();
        const input=document.getElementById('chat-input');
        if(input){ input.focus(); }
        return;
      }

      // SPACE = JUMP
      // Пока открыт чат — пробел остаётся обычным пробелом.
      if(
        e.code==='Space' &&
        !chatMode &&
        pointerLocked &&
        isGrounded
      ){

        e.preventDefault();

        jumpVelocity=JUMP_FORCE;
        isGrounded=false;

      }

    }
  );

  window.addEventListener(
    'keyup',
    function(e){

      keys[e.code]=false;

    }
  );

  const canvas =
    document.getElementById(
      'canvas3d'
    );

  canvas.addEventListener(
    'click',
    function(){

      if(!chatMode){

        canvas.requestPointerLock();

      }

    }
  );

  document.addEventListener(
    'pointerlockchange',
    function(){

      pointerLocked=
        document.pointerLockElement===
        canvas;

    }
  );

  document.addEventListener(
    'mousemove',
    function(e){

      if(!pointerLocked)return;

      yaw-=
        e.movementX*.002;

      pitch-=
        e.movementY*.002;

      pitch=
        Math.max(
          -1.45,
          Math.min(
            1.45,
            pitch
          )
        );

    }
  );

}

/* =========================================================
   AUDIO AUTOPLAY UNLOCK
   Browsers may block live audio after a reconnect/re-entry.
   The first click/touch/key interaction gives the page a real
   user gesture, so we use it to resume the existing HLS audio.
========================================================= */
(function(){
  const unlock=async function(){
    const ok=await unlockEWSAudio();
    if(ok){
      document.removeEventListener('pointerdown',unlock);
      document.removeEventListener('touchstart',unlock);
      document.removeEventListener('keydown',unlock);
    }
  };

  document.addEventListener('pointerdown',unlock,{passive:true});
  document.addEventListener('touchstart',unlock,{passive:true});
  document.addEventListener('keydown',unlock,{passive:true});
  document.addEventListener('visibilitychange',()=>{
    if(!document.hidden && audioStarted){
      const a=document.getElementById('ews-audio');
      if(a && a.paused) a.play().catch(()=>{});
    }
  });
})();

function toggleChat(){

  const input =
    document.getElementById(
      'chat-input'
    );

  if(chatMode){

    if(document.pointerLockElement) document.exitPointerLock();

    input.focus();

  }else{

    input.blur();
    keys={};
    const canvas=document.getElementById('canvas3d');
    if(canvas && document.pointerLockElement!==canvas){
      try{ canvas.requestPointerLock(); }catch(err){}
    }

  }

}

function youtubeEmbed(url){
  try{
    const u=new URL(url);
    let id='';
    if(u.hostname.includes('youtu.be')){
      id=u.pathname.split('/').filter(Boolean)[0]||'';
    }else if(u.hostname.includes('youtube.com')){
      id=u.searchParams.get('v')||'';
      if(!id && u.pathname.startsWith('/shorts/')) id=u.pathname.split('/')[2]||'';
      if(!id && u.pathname.startsWith('/embed/')) id=u.pathname.split('/')[2]||'';
    }
    if(!id) return null;
    return 'https://www.youtube.com/embed/'+encodeURIComponent(id)+'?autoplay=1&rel=0&playsinline=1';
  }catch(e){ return null; }
}

function twitchEmbed(url){
  try{
    const u=new URL(url);
    if(!u.hostname.includes('twitch.tv')) return null;
    const parts=u.pathname.split('/').filter(Boolean);
    if(!parts.length) return null;
    const parent=location.hostname || 'ews-sessions.onrender.com';
    if(parts[0]==='videos' && parts[1]){
      return 'https://player.twitch.tv/?video='+encodeURIComponent(parts[1])+'&parent='+encodeURIComponent(parent)+'&autoplay=true';
    }
    return 'https://player.twitch.tv/?channel='+encodeURIComponent(parts[0])+'&parent='+encodeURIComponent(parent)+'&autoplay=true';
  }catch(e){ return null; }
}

function normalizeClubScreenUrl(raw){
  const value=String(raw||'').trim();
  if(!value) return null;

  const yt=youtubeEmbed(value);
  if(yt) return {src:yt,name:'YOUTUBE'};

  const tw=twitchEmbed(value);
  if(tw) return {src:tw,name:'TWITCH'};

  try{
    const u=new URL(value);
    if(u.protocol!=='http:' && u.protocol!=='https:') return null;
    return {src:u.href,name:'WEBSITE'};
  }catch(e){
    return null;
  }
}

// When the user wants to click the embedded player, release pointer lock first.
// The 3D screen remains physically fixed to the wall; only mouse control is released.
function enableScreenInteraction(){
  if(document.pointerLockElement){
    try{ document.exitPointerLock(); }catch(e){}
  }
  const panel=document.getElementById('css3d-screen');
  if(panel){ panel.style.pointerEvents='auto'; }
}

document.addEventListener('mousedown',function(e){

/* =========================================================
   REMOTE CLUB SCREEN
   The server sends one shared screen state to every guest.
   This function is intentionally separate from loadClubScreen()
   because friends must never need to be the host to display it.
========================================================= */
function applyRemoteClubScreen(state){
  const frame=document.getElementById('media-screen-frame');
  const panel=document.getElementById('css3d-screen');
  if(!frame || !panel) return;

  state=state || {};

  if(state.active !== true || (!state.src && !state.url)){
    if(!screenMediaActive){
      frame.src='about:blank';
      panel.classList.remove('active');
      screenMediaUrl='';
    }
    return;
  }

  // Prefer the original URL so every guest builds its own embed URL.
  // This is important for Twitch because the embed parent must match the
  // hostname used by the guest's browser, not the host's browser.
  let src='';
  const originalUrl=String(state.url||'').trim();
  if(originalUrl){
    const normalized=normalizeClubScreenUrl(originalUrl);
    src=normalized ? normalized.src : originalUrl;
  }else{
    src=String(state.src||'').trim();
  }
  if(!src) return;

  // Do not reload the iframe every time a duplicate Socket.IO event arrives.
  if(screenMediaUrl !== src){
    frame.src=src;
    screenMediaUrl=src;
  }

  screenMediaActive=true;
  panel.classList.add('active');

  // Make sure the iframe can play media on every guest browser.
  frame.setAttribute('allow','autoplay; fullscreen; encrypted-media; picture-in-picture');
  frame.setAttribute('allowfullscreen','');
}

/* =========================================================
   ANIMATION
========================================================= */

function animate(){

  requestAnimationFrame(
    animate
  );

  if(!scene)return;

  const dt =
    Math.min(
      clock.getDelta(),
      .05
    );

  const time =
    performance.now()/1000;

  let bass=.2;
  let level=.2;

  if(
    analyser &&
    freqData &&
    audioStarted
  ){

    analyser.getByteFrequencyData(
      freqData
    );

    let b=0;

    for(
      let i=0;
      i<10 &&
      i<freqData.length;
      i++
    ){

      b+=freqData[i];

    }

    bass=
      b/
      (
        Math.min(
          10,
          freqData.length
        )*255
      );

    let total=0;

    for(
      let i=0;
      i<freqData.length;
      i++
    ){

      total+=freqData[i];

    }

    level=
      total/
      (
        freqData.length*255
      );

  }

  else{

    bass=
      .25+
      Math.sin(time*3)*.12;

    level=
      .25+
      Math.sin(time*1.5)*.08;

  }

  bassLevel=
    bassLevel*.82+
    bass*.18;

  audioLevel=
    audioLevel*.88+
    level*.12;

  const speed=
    chatMode || activeDance || sitting
      ?0
      :5*dt;

  let forward=0;
  let side=0;

  if(
    keys['KeyW']
  ){
    forward+=1;
  }

  if(
    keys['KeyS']
  ){
    forward-=1;
  }

  if(
    keys['KeyA']
  ){
    side-=1;
  }

  if(
    keys['KeyD']
  ){
    side+=1;
  }

  // =========================
  // JUMP PHYSICS
  // =========================

  if(!chatMode){

    jumpVelocity-=
      GRAVITY*dt;

    playerY+=
      jumpVelocity*dt;

    if(playerY<=GROUND_Y){

      playerY=GROUND_Y;
      jumpVelocity=0;
      isGrounded=true;

    }

  }

  if(
    (pointerLocked || isMobile) &&
    !chatMode
  ){

    // Mobile joystick input
    if(isMobile && joystickActive){
      forward = -joystickVec.y;
      side = joystickVec.x;
    }

    const fx =
      -Math.sin(yaw);

    const fz=
      -Math.cos(yaw);

    const rx=
      Math.cos(yaw);

    const rz=
      -Math.sin(yaw);

    tryMove(
      (fx*forward+rx*side)*speed,
      (fz*forward+rz*side)*speed
    );

  }

  camera.position.x=
    THREE.MathUtils.clamp(
      camera.position.x,
      -16,
      16
    );

  camera.position.z=
    THREE.MathUtils.clamp(
      camera.position.z,
      -15.5,
      15.5
    );

  camera.position.y=playerY;

  camera.rotation.order=
    'YXZ';

  camera.rotation.y=
    yaw;

  camera.rotation.x=
    pitch;

  if(playerBody){

    playerBody.position.x=
      camera.position.x;

    playerBody.position.z=
      camera.position.z;

    playerBody.visible=false;

  }

  updateStrobe(performance.now());
  updateClock();
  updateEmojis(performance.now());
  broadcastPlayerState(performance.now());

  if(particles){

    particles.rotation.y+=
      .00015;

    particles.material.opacity=
      .22+
      audioLevel*.18;

  }

  remotePlayers.forEach(p=>{
    const t=performance.now()/1000;
    if(p.avatar && p.moving && !p.sitting){
      p.avatar.position.y=Math.abs(Math.sin(t*8))*.035;
      p.avatar.rotation.z=Math.sin(t*8)*.025;
    }else if(p.avatar){
      p.avatar.position.y=0; p.avatar.rotation.z=0;
    }
    if(p.parts && !p.avatar){
      const swing=p.moving?Math.sin(t*8)*.35:0;
      p.parts.leftArm.rotation.x=swing; p.parts.rightArm.rotation.x=-swing;
      p.parts.leftLeg.rotation.x=-swing; p.parts.rightLeg.rotation.x=swing;
    }
  });
  movingHeads.forEach((h,i)=>{
    h.spot.intensity=1.45+bassLevel*2.4;
    h.spot.target.position.x=Math.sin(time*.65+h.phase)*8;
    h.spot.target.position.y=.12+Math.sin(time*1.1+h.phase)*.22;
    h.spot.target.position.z=-2+Math.cos(time*.5+h.phase)*9;
    h.spot.target.updateMatrixWorld();
  });

  // Sweep lasers from the real fixtures mounted on the truss.
  clubLasers.forEach((b,i)=>{
    const fixture=laserDevices[i];
    if(!fixture) return;
    const source=new THREE.Vector3();
    fixture.device.getWorldPosition(source);
    source.z += .18;
    const target=new THREE.Vector3(
      Math.sin(time*(.55+(i%3)*.08)+fixture.phase)*7.2 + Math.cos(i)*2.0,
      .08,
      -1.0 + Math.cos(time*.48+fixture.phase)*7.0
    );
    const dir=new THREE.Vector3().subVectors(target,source);
    const length=dir.length();
    b.position.copy(source).add(target).multiplyScalar(.5);
    b.scale.set(1,Math.max(.1,length),1);
    b.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir.normalize());
    b.material.opacity=.24+bassLevel*.42+(.5+.5*Math.sin(time*7+i*1.7))*.14;
    b.material.needsUpdate=true;
    fixture.lens.material.opacity=.82+bassLevel*.18;
  });

  smokeParticles.forEach((sp,i)=>{
    const u=sp.userData;
    const t=(time*u.speed+u.phase)%6.5;
    sp.position.y=.95+t*.52;
    sp.position.x += Math.sin(time*.7+u.phase)*.004;
    sp.position.z += -.012;
    sp.material.opacity=Math.max(0,Math.min(.115,t<1.0?t*.11:(6.5-t)*.026));
    const pulse=1+t*.24+bassLevel*.12;
    sp.scale.set(pulse,pulse,1);
  });

  if(hazeGroup){
    hazeGroup.rotation.y+=.00009;
    hazeGroup.children.forEach((p)=>{
      p.position.y += Math.sin(time*p.userData.speed+p.userData.phase)*.0012;
      p.position.x += Math.sin(time*.055+p.userData.phase)*.0008;
      p.material.opacity=Math.min(.23,p.userData.baseOpacity + bassLevel*.075);
    });
  }

  neonObjects.forEach(
    (obj,index)=>{

      const pulse=
        .5+
        Math.sin(
          time*3+
          index*.4
        )*.25+
        bassLevel*.7;

      const value=
        Math.min(
          1,
          pulse
        );

      obj.material.color.setRGB(
        value,
        value,
        value
      );

    }
  );

  lightObjects.forEach(
    (light,index)=>{

      light.intensity=
        1+
        bassLevel*2+
        Math.sin(
          time*2+
          index
        )*.15;

    }
  );

  if(logoSign && logoSign.userData.glowLight){
    const lp=1.5+bassLevel*2.0+Math.sin(time*3.2)*.18;
    logoSign.userData.glowLight.intensity=lp;
    if(logoSign.userData.outer) logoSign.userData.outer.material.opacity=.72+bassLevel*.22;
    if(logoSign.userData.inner) logoSign.userData.inner.material.opacity=.55+bassLevel*.2;
  }

  if(screenCtx){

    screenCtx.fillStyle=
      '#050505';

    screenCtx.fillRect(
      0,
      0,
      1024,
      512
    );

    const grd =
      screenCtx.createLinearGradient(
        0,
        0,
        1024,
        0
      );

    const intensity=
      40+
      Math.floor(
        bassLevel*120
      );

    grd.addColorStop(
      0,
      `rgb(${intensity},${intensity},${intensity})`
    );

    grd.addColorStop(
      .5,
      '#050505'
    );

    grd.addColorStop(
      1,
      `rgb(${intensity},${intensity},${intensity})`
    );

    screenCtx.fillStyle=
      grd;

    screenCtx.fillRect(
      0,
      0,
      1024,
      512
    );

    screenCtx.fillStyle=
      '#fff';

    screenCtx.font=
      'bold 80px Arial';

    screenCtx.textAlign=
      'center';

    screenCtx.fillText(
      'EWS SESSIONS',
      512,
      200
    );

    screenCtx.font=
      '22px Arial';

    screenCtx.fillStyle=
      '#777';

    screenCtx.fillText(
      'UNDERGROUND CLUB',
      512,
      245
    );

    const bars=48;

    const bw=
      800/bars;

    for(
      let i=0;
      i<bars;
      i++
    ){

      let value;

      if(
        freqData &&
        audioStarted
      ){

        value=
          freqData[
            Math.floor(
              i*
              freqData.length/
              bars
            )
          ]/255;

      }else{

        value=
          .2+
          Math.sin(
            time*4+
            i*.5
          )*.15;

      }

      const h=
        value*180;

      screenCtx.fillStyle=
        '#fff';

      screenCtx.fillRect(
        112+i*bw,
        450-h,
        bw-3,
        h
      );

    }

    screenTexture.needsUpdate=true;

  }


  remotePlayers.forEach(p=>{
    if(p.dance) animateRemoteDance(p,time);
    else resetRemoteDancePose(p);
  });

  renderer.render(
    scene,
    camera
  );

  // Keep the HTML player exactly on the physical screen anchor.
  if(cssScreenObject && screenMesh){
    cssScreenObject.position.copy(screenMesh.position);
    cssScreenObject.rotation.copy(screenMesh.rotation);
    cssScreenObject.scale.set(0.01,0.01,0.01);
    cssScreenObject.position.z += 0.035;
  }

  if(cssRenderer && cssScene){
    cssRenderer.render(cssScene,camera);
  }

}

function loadAvatarModels(){
  if(avatarLoadStarted || !window.THREE || !THREE.GLTFLoader) return;

  avatarLoader=new THREE.GLTFLoader();
  const load=(key,file)=>new Promise(resolve=>{

  });

function makeNameLabel(username){
  const c=document.createElement('canvas'); c.width=256; c.height=64;
  const ctx=c.getContext('2d'); ctx.clearRect(0,0,256,64); ctx.font='bold 24px Arial'; ctx.textAlign='center'; ctx.fillStyle='#fff'; ctx.fillText(username,128,32);
  const tex=new THREE.CanvasTexture(c);
  const label=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false}));
  label.scale.set(1.7,.42,1); label.position.y=2.05; return label;
}

function applyAvatarToRemote(p){
  if(!p || !p.group) return;
  const key=(String(p.username||'').length%2===0)?'male':'female';
  const tpl=avatarTemplates[key]||avatarTemplates.male||avatarTemplates.female;
  if(!tpl) return;
  if(p.avatar){ p.group.remove(p.avatar); }
  const avatar=THREE.SkeletonUtils && THREE.SkeletonUtils.clone ? THREE.SkeletonUtils.clone(tpl.scene) : tpl.scene.clone(true);
  avatar.traverse(o=>{ if(o.isMesh){ o.castShadow=true; o.receiveShadow=true; }});
  const box=new THREE.Box3().setFromObject(avatar); const size=new THREE.Vector3(); box.getSize(size);
  const targetH=1.8; const scale=targetH/Math.max(.01,size.y); avatar.scale.setScalar(scale);
  const box2=new THREE.Box3().setFromObject(avatar); avatar.position.y=-box2.min.y;
  p.group.add(avatar); p.avatar=avatar;
  // Hide the old placeholder once the real Quaternius character is ready.
  if(p.placeholder) p.placeholder.visible=false;
  p.parts=null;
}

function createRemotePlayer(data){
  if(!scene || !data || !data.id || data.id===socket?.id) return;
  if(remotePlayers.has(data.id)) removeRemotePlayer(data.id);
  const g=new THREE.Group(); g.userData.username=data.username||'PLAYER';
  const placeholder=new THREE.Group();
  const mat=new THREE.MeshStandardMaterial({color:0x777777,roughness:1});
  const torso=new THREE.Mesh(new THREE.CylinderGeometry(.22,.30,.85,8),mat); torso.position.y=.78; placeholder.add(torso);
  const head=new THREE.Mesh(new THREE.SphereGeometry(.23,12,12),mat); head.position.y=1.42; placeholder.add(head);
  const armGeo=new THREE.CylinderGeometry(.075,.09,.72,6), legGeo=new THREE.CylinderGeometry(.09,.11,.82,6);
  const leftArm=new THREE.Mesh(armGeo,mat); leftArm.position.set(-.34,.80,0); leftArm.rotation.z=-.12; placeholder.add(leftArm);
  const rightArm=new THREE.Mesh(armGeo,mat); rightArm.position.set(.34,.80,0); rightArm.rotation.z=.12; placeholder.add(rightArm);
  const leftLeg=new THREE.Mesh(legGeo,mat); leftLeg.position.set(-.13,.30,0); placeholder.add(leftLeg);
  const rightLeg=new THREE.Mesh(legGeo,mat); rightLeg.position.set(.13,.30,0); placeholder.add(rightLeg);
  g.add(placeholder);
  const label=makeNameLabel(g.userData.username); g.add(label);
  const x=Number.isFinite(Number(data.x))?Number(data.x):0, z=Number.isFinite(Number(data.z))?Number(data.z):13, y=0;
  const ry=Number.isFinite(Number(data.yaw??data.ry))?Number(data.yaw??data.ry):0;
  g.position.set(x,y,z); g.rotation.y=ry; scene.add(g);
  const p={group:g,last:{x,z,yaw:ry},moving:!!data.moving,username:data.username||'PLAYER',dance:Number(data.dance)||0,danceStartedAt:Number(data.danceStartedAt)||0,parts:{torso,head,leftArm,rightArm,leftLeg,rightLeg},baseY:0,sitting:!!data.sitting,seatId:data.seatId||null,avatar:null,placeholder};
  placeholder.visible=true;
  remotePlayers.set(data.id,p);
  applyAvatarToRemote(p);
}

function updateRemotePlayer(data){
  if(!data.id || data.id===socket?.id) return;
  if(!remotePlayers.has(data.id)) createRemotePlayer(data);
  const p=remotePlayers.get(data.id);

  const rawX=Number(data.x);
  const rawZ=Number(data.z);
  const rawY=Number(data.y);
  const rawYaw=Number(data.yaw ?? data.ry);

  const nx=Number.isFinite(rawX) ? rawX : p.group.position.x;
  const nz=Number.isFinite(rawZ) ? rawZ : p.group.position.z;
  // server y is eye/camera height; avatar root stays on floor
  const ny=0;
  const nyaw=Number.isFinite(rawYaw) ? rawYaw : p.group.rotation.y;

  const dx=nx-p.group.position.x;
  const dz=nz-p.group.position.z;

  p.moving=Boolean(data.moving) || Math.hypot(dx,dz)>.002;
  if(data.dance!==undefined) p.dance=Number(data.dance)||0;
  if(data.danceStartedAt!==undefined) p.danceStartedAt=Number(data.danceStartedAt)||0;
  p.group.position.x=nx;
  p.group.position.y=ny;
  p.group.position.z=nz;
  p.group.rotation.y=nyaw;
  p.sitting=!!data.sitting; p.seatId=data.seatId||null;
  if(p.avatar) p.avatar.rotation.x=p.sitting ? -0.02 : 0;
  p.last={x:nx,z:nz,yaw:nyaw};
}

function removeRemotePlayer(id){
  const p=remotePlayers.get(id);
  if(!p) return;
  scene.remove(p.group);
  p.group.traverse(o=>{ if(o.geometry) o.geometry.dispose(); if(o.material){ if(o.material.map) o.material.map.dispose(); o.material.dispose(); }});
  remotePlayers.delete(id);
}

function broadcastPlayerState(now){
  if(!socket || !socket.connected || !camera) return;
  if(now-lastPlayerBroadcast<50) return;
  lastPlayerBroadcast=now;
  const moving = Math.abs(camera.position.x-(broadcastPlayerState.lastX ?? camera.position.x)) > 0.0005 ||
                 Math.abs(camera.position.z-(broadcastPlayerState.lastZ ?? camera.position.z)) > 0.0005;

  broadcastPlayerState.lastX=camera.position.x;
  broadcastPlayerState.lastZ=camera.position.z;

  socket.emit('player-state',{
    x:camera.position.x,
    y:Math.max(0, playerY-1.7),
    z:camera.position.z,
    yaw:yaw,
    pitch:pitch,
    username:currentUser,
    moving:moving,
    jumping:!isGrounded,
    dance:activeDance,
    danceStartedAt:danceStartedAt,
    sitting:sitting,
    seatId:currentSeatId
  });
}

function toggleEmotesMenu(){

function playDance(id){
  if(chatMode || !socket) return;
  activeDance=Math.max(1,Math.min(6,Number(id)||1));
  danceStartedAt=Date.now();
  keys={};
  try{ if(document.pointerLockElement) document.exitPointerLock(); }catch(e){}
  const menu=document.getElementById('emotes-menu');
  if(menu) menu.classList.remove('open');
  broadcastPlayerState(Date.now(),true);
}

function stopDance(){
  activeDance=0;
  danceStartedAt=0;
  const menu=document.getElementById('emotes-menu');
  if(menu) menu.classList.remove('open');
  broadcastPlayerState(Date.now(),true);
}

function animateRemoteDance(p,time){
  if(!p || !p.parts) return;
  const q=p.parts;
  const t=Math.max(0,(Date.now()-(p.danceStartedAt||Date.now()))/1000);
  const w=t*Math.PI*2;
  q.torso.rotation.set(0,0,0);
  q.head.rotation.set(0,0,0);
  q.leftArm.rotation.set(0,0,-.12); q.rightArm.rotation.set(0,0,.12);
  q.leftLeg.rotation.set(0,0,0); q.rightLeg.rotation.set(0,0,0);
  if(!p.dance) return;
  if(p.dance===1){
    q.leftArm.rotation.z=-1.1+Math.sin(w*2)*.35; q.rightArm.rotation.z=1.1-Math.sin(w*2)*.35;
    q.leftLeg.rotation.z=Math.sin(w)*.35; q.rightLeg.rotation.z=-Math.sin(w)*.35;
    q.torso.rotation.y=Math.sin(w)*.18;
  }else if(p.dance===2){
    q.leftArm.rotation.z=-.55+Math.sin(w*2)*.9; q.rightArm.rotation.z=.55-Math.sin(w*2)*.9;
    q.leftLeg.rotation.z=Math.sin(w*2)*.28; q.rightLeg.rotation.z=-Math.sin(w*2)*.28;
    q.torso.rotation.z=Math.sin(w)*.16;
  }else if(p.dance===3){
    q.leftArm.rotation.z=-1.25+Math.sin(w*2)*.25; q.rightArm.rotation.z=.25+Math.sin(w*2+.8)*.8;
    q.leftLeg.rotation.z=Math.sin(w*2)*.55; q.rightLeg.rotation.z=-Math.sin(w*2)*.55;
    q.torso.rotation.y=Math.sin(w)*.35;
  }else if(p.dance===4){
    const step=Math.sin(w*2)>0?1:-1;
    q.leftArm.rotation.z=-.85*step; q.rightArm.rotation.z=.85*step;
    q.leftLeg.rotation.z=.35*step; q.rightLeg.rotation.z=-.35*step;
    q.head.rotation.y=Math.sin(w*2)*.35;
  }else if(p.dance===5){
    const bounce=Math.abs(Math.sin(w*2))*0.22;
    p.group.position.y=(p.baseY||p.group.position.y)+bounce;
    q.leftArm.rotation.z=-.8-Math.sin(w*2)*.3; q.rightArm.rotation.z=.8+Math.sin(w*2)*.3;
  }else if(p.dance===6){
    q.leftArm.rotation.z=-1.35+Math.sin(w*3)*.5; q.rightArm.rotation.z=.15;
    q.rightArm.rotation.x=Math.sin(w*2)*.5; q.head.rotation.z=Math.sin(w*2)*.15;
  }
}

function resetRemoteDancePose(p){
  if(!p || !p.parts) return;
  p.group.position.y=p.baseY||0;
  const q=p.parts;
  q.torso.rotation.set(0,0,0); q.head.rotation.set(0,0,0);
  q.leftArm.rotation.set(0,0,-.12); q.rightArm.rotation.set(0,0,.12);
  q.leftLeg.rotation.set(0,0,0); q.rightLeg.rotation.set(0,0,0);
}

window.addEventListener(
  'beforeunload',
  function(){

    try{

      if(hls){
        hls.destroy();
      }

    }catch(e){}

    try{

      if(audioContext){
        audioContext.close();
      }

    }catch(e){}

  }
);
