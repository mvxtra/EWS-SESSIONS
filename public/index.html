<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0"
>

<title>EWS SESSIONS</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>

<script src="/socket.io/socket.io.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{

    width:100%;
    height:100%;

    overflow:hidden;

    background:#050505;

    color:#fff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

#app{

    position:relative;

    width:100vw;
    height:100vh;
}

#canvas3d{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    display:block;
}

/* =========================================================
   LOGIN
========================================================= */

#login{

    position:absolute;

    inset:0;

    z-index:1000;

    display:flex;

    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle at 50% 40%,
            rgba(255,255,255,.08),
            transparent 25%
        ),
        radial-gradient(
            circle at 50% 50%,
            #171717,
            #030303 70%
        );
}

.login-box{

    width:380px;

    padding:42px;

    background:
        rgba(5,5,5,.88);

    border:1px solid #444;

    box-shadow:
        0 0 80px rgba(255,255,255,.06),
        inset 0 0 40px rgba(255,255,255,.02);

    text-align:center;
}

.login-box h1{

    font-size:31px;

    letter-spacing:8px;

    font-weight:900;

    color:#fff;

    margin-bottom:8px;
}

.login-box p{

    font-size:10px;

    letter-spacing:5px;

    color:#777;

    margin-bottom:30px;
}

.tabs{

    display:flex;

    margin-bottom:20px;

    border:1px solid #333;
}

.tab{

    flex:1;

    padding:11px;

    border:0;

    background:#0c0c0c;

    color:#666;

    cursor:pointer;

    letter-spacing:2px;
}

.tab.active{

    background:#fff;

    color:#000;
}

input{

    width:100%;

    height:45px;

    margin-bottom:12px;

    padding:0 14px;

    border:1px solid #333;

    background:#080808;

    color:#fff;

    outline:none;
}

input:focus{

    border-color:#aaa;
}

.btn{

    width:100%;

    height:45px;

    border:0;

    background:#fff;

    color:#000;

    font-weight:bold;

    letter-spacing:2px;

    cursor:pointer;
}

.btn:hover{

    background:#ddd;
}

.error{

    min-height:20px;

    margin-top:12px;

    color:#ff5555;

    font-size:12px;
}

/* =========================================================
   HUD
========================================================= */

#hud{

    position:absolute;

    inset:0;

    z-index:20;

    display:none;

    pointer-events:none;
}

#top-logo{

    position:absolute;

    top:18px;

    left:20px;

    font-size:16px;

    font-weight:900;

    letter-spacing:5px;

    text-shadow:0 0 20px #fff;
}

#top-logo span{

    display:block;

    margin-top:4px;

    font-size:8px;

    letter-spacing:3px;

    color:#777;
}

#online-box{

    position:absolute;

    top:18px;

    right:18px;

    width:190px;

    padding:13px;

    background:
        rgba(0,0,0,.72);

    border:1px solid #333;

    pointer-events:auto;
}

#online-box h3{

    font-size:10px;

    letter-spacing:3px;

    color:#aaa;

    margin-bottom:9px;
}

#online-list{

    list-style:none;

    max-height:180px;

    overflow:auto;

    color:#ddd;

    font-size:12px;
}

#online-list li{

    padding:4px 0;

    border-bottom:1px solid #161616;
}

#online-list li::before{

    content:"●";

    color:#fff;

    margin-right:7px;

    font-size:8px;
}

/* =========================================================
   CHAT
========================================================= */

#chat{

    position:absolute;

    left:18px;

    bottom:18px;

    width:390px;

    height:250px;

    padding:12px;

    display:flex;

    flex-direction:column;

    background:
        rgba(0,0,0,.75);

    border:1px solid #333;

    pointer-events:auto;
}

#chat-title{

    font-size:9px;

    letter-spacing:3px;

    color:#777;

    margin-bottom:8px;
}

#chat-messages{

    flex:1;

    overflow-y:auto;

    margin-bottom:8px;
}

.msg{

    margin-bottom:7px;

    font-size:12px;

    line-height:1.4;
}

.msg .u{

    color:#fff;

    font-weight:bold;
}

.msg .t{

    color:#aaa;
}

.translation-mark{

    color:#666;

    font-size:10px;

    margin-left:4px;
}

#chat-form{

    display:flex;

    gap:6px;
}

#chat-input{

    flex:1;

    height:35px;

    margin:0;
}

#chat-send{

    width:45px;

    border:0;

    background:#fff;

    color:#000;

    cursor:pointer;
}

/* =========================================================
   OTHER
========================================================= */

#hint{

    position:absolute;

    right:18px;

    bottom:18px;

    padding:9px 12px;

    background:
        rgba(0,0,0,.65);

    border:1px solid #292929;

    color:#777;

    font-size:10px;

    letter-spacing:1px;
}

#stream-indicator{

    position:absolute;

    top:18px;

    left:50%;

    transform:
        translateX(-50%);

    padding:6px 12px;

    background:
        rgba(0,0,0,.75);

    border:1px solid #333;

    color:#777;

    font-family:monospace;

    font-size:10px;

    letter-spacing:2px;
}

#stream-indicator.live{

    color:#fff;

    border-color:#aaa;
}

#lang-bar{

    position:absolute;

    right:220px;

    top:18px;

    pointer-events:auto;
}

#lang{

    background:#080808;

    border:1px solid #333;

    color:#aaa;

    padding:7px 10px;
}

#zone-label{

    position:absolute;

    left:50%;

    bottom:90px;

    transform:
        translateX(-50%);

    font-size:10px;

    letter-spacing:5px;

    color:
        rgba(255,255,255,.4);

    pointer-events:none;
}

/* =========================================================
   SCREEN HOST PANEL
========================================================= */

#screen-host-panel{

    position:absolute;

    left:50%;

    top:60px;

    transform:
        translateX(-50%);

    width:430px;

    padding:12px;

    background:
        rgba(0,0,0,.88);

    border:1px solid #444;

    z-index:100;

    display:none;

    pointer-events:auto;
}

#screen-host-panel.show{

    display:block;
}

#screen-host-title{

    font-size:10px;

    letter-spacing:3px;

    color:#aaa;

    margin-bottom:9px;
}

#screen-url{

    width:100%;

    height:36px;

    margin:0 0 7px 0;

    padding:0 10px;

    background:#080808;

    color:#fff;

    border:1px solid #333;

    outline:none;
}

.screen-row{

    display:flex;

    gap:6px;
}

.screen-btn{

    flex:1;

    height:34px;

    border:1px solid #333;

    background:#111;

    color:#aaa;

    cursor:pointer;

    font-size:10px;

    letter-spacing:1px;
}

.screen-btn:hover{

    background:#fff;

    color:#000;
}

#screen-host-status{

    margin-top:8px;

    color:#666;

    font-size:10px;
}

/* =========================================================
   SCREEN SOUND
========================================================= */

#screen-sound{

    position:absolute;

    left:50%;

    bottom:130px;

    transform:
        translateX(-50%);

    z-index:90;

    display:none;

    padding:10px 16px;

    background:
        rgba(0,0,0,.88);

    border:1px solid #555;

    color:#fff;

    cursor:pointer;

    pointer-events:auto;

    font-size:10px;

    letter-spacing:2px;
}

#screen-sound.show{

    display:block;
}

</style>

</head>

<body>

<div id="app">

<canvas id="canvas3d"></canvas>

<audio
    id="stream-audio"
    crossorigin="anonymous"
></audio>

<!-- =======================================================
     LOGIN
======================================================= -->

<div id="login">

    <div class="login-box">

        <h1>EWS</h1>

        <p>
            SESSIONS / UNDERGROUND CLUB
        </p>

        <div class="tabs">

            <button
                class="tab active"
                onclick="switchTab('login')"
            >
                ВХОД
            </button>

            <button
                class="tab"
                onclick="switchTab('register')"
            >
                РЕГИСТРАЦИЯ
            </button>

        </div>

        <input
            id="f-username"
            placeholder="USERNAME"
            autocomplete="username"
        >

        <input
            id="f-password"
            type="password"
            placeholder="PASSWORD"
            autocomplete="current-password"
        >

        <button
            class="btn"
            id="submitBtn"
            onclick="doLogin()"
        >
            ВОЙТИ
        </button>

        <div
            id="error"
            class="error"
        ></div>

    </div>

</div>

<!-- =======================================================
     HUD
======================================================= -->

<div id="hud">

    <div id="top-logo">

        EWS

        <span>
            SESSIONS
        </span>

    </div>

    <div id="stream-indicator">
        AUDIO: CONNECTING
    </div>

    <div id="lang-bar">

        <select id="lang">

            <option value="ru">RU</option>
            <option value="en">EN</option>
            <option value="es">ES</option>
            <option value="de">DE</option>
            <option value="fr">FR</option>
            <option value="zh">中文</option>
            <option value="ja">日本語</option>
            <option value="ko">한국어</option>
            <option value="ar">AR</option>
            <option value="hi">HI</option>
            <option value="pt">PT</option>
            <option value="it">IT</option>
            <option value="tr">TR</option>
            <option value="uk">UA</option>

        </select>

    </div>

    <div id="online-box">

        <h3>
            ONLINE
        </h3>

        <ul id="online-list"></ul>

    </div>

    <div id="chat">

        <div id="chat-title">
            EWS SESSIONS / CHAT
        </div>

        <div id="chat-messages"></div>

        <form id="chat-form">

            <input
                id="chat-input"
                autocomplete="off"
                placeholder="write something..."
            >

            <button id="chat-send">
                →
            </button>

        </form>

    </div>

    <!-- ===================================================
         SCREEN HOST
    =================================================== -->

    <div id="screen-host-panel">

        <div id="screen-host-title">
            EWS SCREEN / MVXTRA CONTROL
        </div>

        <input
            id="screen-url"
            placeholder="MP4 / WEBM / HLS / IMAGE URL"
        >

        <div class="screen-row">

            <button
                class="screen-btn"
                id="screen-show"
            >
                SHOW
            </button>

            <button
                class="screen-btn"
                id="screen-hide"
            >
                HIDE
            </button>

            <button
                class="screen-btn"
                id="screen-sound-host"
            >
                SOUND
            </button>

        </div>

        <div id="screen-host-status">
            SCREEN HOST
        </div>

    </div>

    <button
        id="screen-sound"
    >
        🔊 ENABLE SCREEN SOUND
    </button>

    <div id="zone-label">
        MAIN FLOOR
    </div>

    <div id="hint">
        WASD MOVE · MOUSE LOOK · C CHAT
    </div>

</div>

</div>

<script>

/* =========================================================
   BASIC STATE
========================================================= */

let mode = 'login';

let socket = null;

let currentUser = null;

let scene;
let camera;
let renderer;

let keys = {};

let yaw = 0;

let pitch = 0;

let pointerLocked = false;

let chatMode = false;

let clock =
    new THREE.Clock();

let neonObjects = [];

let lightObjects = [];

let particles;

let analyser = null;

let freqData = null;

let audioLevel = 0;

let bassLevel = 0;

let screenTexture;

let screenCanvas;

let screenCtx;

let playerBody;

/* =========================================================
   SHARED SCREEN STATE
========================================================= */

let clubScreenState = {

    active:false,

    src:'',

    name:'',

    type:'auto',

    owner:'mvxtra',

    updatedAt:0
};

let remoteScreenMedia = null;

let remoteScreenType = null;

let remoteScreenHls = null;

let remoteScreenFrame = null;

let screenMediaStartTime = 0;

/* =========================================================
   TRANSLATION CACHE
========================================================= */

const translationCache =
    new Map();

/* =========================================================
   LOGIN
========================================================= */

function switchTab(type){

    mode = type;

    document
        .querySelectorAll('.tab')
        .forEach(
            t =>
                t.classList.remove(
                    'active'
                )
        );

    if(
        type === 'login'
    ){

        document
            .querySelectorAll('.tab')[0]
            .classList.add(
                'active'
            );

        document
            .getElementById(
                'submitBtn'
            )
            .textContent =
                'ВОЙТИ';

    }else{

        document
            .querySelectorAll('.tab')[1]
            .classList.add(
                'active'
            );

        document
            .getElementById(
                'submitBtn'
            )
            .textContent =
                'СОЗДАТЬ АККАУНТ';
    }

    document
        .getElementById(
            'error'
        )
        .textContent = '';
}

async function doLogin(){

    const username =
        document
            .getElementById(
                'f-username'
            )
            .value
            .trim();

    const password =
        document
            .getElementById(
                'f-password'
            )
            .value;

    const error =
        document
            .getElementById(
                'error'
            );

    error.textContent = '';

    if(
        !username ||
        !password
    ){

        error.textContent =
            'Введите логин и пароль';

        return;
    }

    try{

        const res =
            await fetch(
                '/api/' + mode,
                {
                    method:'POST',

                    headers:{
                        'Content-Type':
                            'application/json'
                    },

                    body:
                        JSON.stringify({
                            username,
                            password
                        })
                }
            );

        const data =
            await res.json();

        if(data.error){

            error.textContent =
                data.error;

            return;
        }

        startSession(
            data.username ||
            username
        );

    }catch(err){

        console.error(
            err
        );

        error.textContent =
            'Ошибка соединения';
    }
}

/* =========================================================
   SESSION
========================================================= */

function startSession(username){

    currentUser =
        username;

    document
        .getElementById(
            'login'
        )
        .style.display =
            'none';

    document
        .getElementById(
            'hud'
        )
        .style.display =
            'block';

    init3D();

    socket =
        io();

    const selectedLang =
        document
            .getElementById(
                'lang'
            )
            .value ||
        'ru';

    socket.emit(
        'join',
        {
            username:
                currentUser,

            language:
                selectedLang,

            lang:
                selectedLang
        }
    );

    /* =====================================================
       SCREEN
    ===================================================== */

    socket.on(
        'club-screen-state',
        state => {

            console.log(
                '[SCREEN] STATE:',
                state
            );

            applyClubScreenState(
                state
            );
        }
    );

    socket.on(
        'screen-host-result',
        result => {

            const status =
                document
                    .getElementById(
                        'screen-host-status'
                    );

            if(!status) return;

            if(result.ok){

                status.textContent =
                    'SCREEN HOST: READY';

            }else{

                status.textContent =
                    result.error ||
                    'SCREEN ERROR';
            }
        }
    );

    socket.on(
        'screen-command',
        command => {

            applyScreenCommand(
                command
            );
        }
    );

    /* =====================================================
       ONLINE
    ===================================================== */

    socket.on(
        'online-users',
        list => {

            renderOnlineUsers(
                list
            );
        }
    );

    /* =====================================================
       PLAYERS
    ===================================================== */

    socket.on(
        'players-state',
        list => {

            console.log(
                '[PLAYERS]',
                list
            );

            /*
             * Здесь оставляется совместимость
             * с твоей текущей системой multiplayer.
             *
             * Если в твоём старом коде есть
             * обработка players-state,
             * она может быть добавлена сюда.
             */
        }
    );

    socket.on(
        'player-joined',
        player => {

            console.log(
                '[PLAYER JOINED]',
                player
            );
        }
    );

    socket.on(
        'player-left',
        id => {

            console.log(
                '[PLAYER LEFT]',
                id
            );
        }
    );

    socket.on(
        'player-removed',
        id => {

            console.log(
                '[PLAYER REMOVED]',
                id
            );
        }
    );

    /* =====================================================
       CHAT
    ===================================================== */

    socket.on(
        'chat-message',
        async message => {

            await renderChatMessage(
                message
            );
        }
    );

    /* =====================================================
       REQUEST CURRENT STATE
    ===================================================== */

    setTimeout(
        () => {

            if(
                socket &&
                socket.connected
            ){

                socket.emit(
                    'request-screen'
                );

                socket.emit(
                    'request-online'
                );

                socket.emit(
                    'request-players'
                );
            }

        },
        500
    );

    /* =====================================================
       HOST PANEL
    ===================================================== */

    if(
        isClubHost()
    ){

        const panel =
            document
                .getElementById(
                    'screen-host-panel'
                );

        panel.classList.add(
            'show'
        );

        socket.emit(
            'screen-host'
        );
    }
}

/* =========================================================
   ONLINE
========================================================= */

function renderOnlineUsers(list){

    const ul =
        document
            .getElementById(
                'online-list'
            );

    if(!ul) return;

    ul.innerHTML = '';

    list.forEach(
        item => {

            const li =
                document
                    .createElement(
                        'li'
                    );

            li.textContent =
                item.username ||
                item;

            ul.appendChild(
                li
            );
        }
    );
}

/* =========================================================
   CLUB HOST
========================================================= */

function isClubHost(){

    return String(
        currentUser || ''
    ).trim().toLowerCase() ===
        'mvxtra';
}

/* =========================================================
   SCREEN
========================================================= */

function clearRemoteScreen(){

    if(
        remoteScreenFrame
    ){

        cancelAnimationFrame(
            remoteScreenFrame
        );

        remoteScreenFrame =
            null;
    }

    if(
        remoteScreenHls
    ){

        try{

            remoteScreenHls.destroy();

        }catch(e){}

        remoteScreenHls =
            null;
    }

    if(
        remoteScreenMedia
    ){

        try{

            remoteScreenMedia.pause();

        }catch(e){}

        try{

            remoteScreenMedia.remove();

        }catch(e){}

        remoteScreenMedia =
            null;
    }

    remoteScreenType =
        null;

    document
        .getElementById(
            'screen-sound'
        )
        .classList.remove(
            'show'
        );
}

function drawDefaultScreen(){

    if(
        !screenCtx ||
        !screenTexture
    ){

        return;
    }

    screenCtx.fillStyle =
        '#050505';

    screenCtx.fillRect(
        0,
        0,
        1024,
        512
    );

    screenCtx.fillStyle =
        '#fff';

    screenCtx.textAlign =
        'center';

    screenCtx.font =
        'bold 80px Arial';

    screenCtx.fillText(
        'EWS SESSIONS',
        512,
        220
    );

    screenCtx.font =
        '22px Arial';

    screenCtx.fillStyle =
        '#777';

    screenCtx.fillText(
        'UNDERGROUND CLUB',
        512,
        260
    );

    screenTexture.needsUpdate =
        true;
}

function drawRemoteScreen(){

    if(
        !screenCtx ||
        !screenTexture ||
        !remoteScreenMedia
    ){

        return;
    }

    const media =
        remoteScreenMedia;

    if(
        remoteScreenType ===
        'video'
    ){

        if(
            media.readyState < 2
        ){

            remoteScreenFrame =
                requestAnimationFrame(
                    drawRemoteScreen
                );

            return;
        }

        const mw =
            media.videoWidth ||
            16;

        const mh =
            media.videoHeight ||
            9;

        const scale =
            Math.min(
                1024 / mw,
                512 / mh
            );

        const w =
            mw * scale;

        const h =
            mh * scale;

        screenCtx.fillStyle =
            '#000';

        screenCtx.fillRect(
            0,
            0,
            1024,
            512
        );

        screenCtx.drawImage(
            media,
            (1024-w)/2,
            (512-h)/2,
            w,
            h
        );

        screenTexture.needsUpdate =
            true;
    }

    if(
        remoteScreenType ===
        'image'
    ){

        if(
            !media.complete
        ){

            remoteScreenFrame =
                requestAnimationFrame(
                    drawRemoteScreen
                );

            return;
        }

        const mw =
            media.naturalWidth ||
            16;

        const mh =
            media.naturalHeight ||
            9;

        const scale =
            Math.min(
                1024 / mw,
                512 / mh
            );

        const w =
            mw * scale;

        const h =
            mh * scale;

        screenCtx.fillStyle =
            '#000';

        screenCtx.fillRect(
            0,
            0,
            1024,
            512
        );

        screenCtx.drawImage(
            media,
            (1024-w)/2,
            (512-h)/2,
            w,
            h
        );

        screenTexture.needsUpdate =
            true;
    }

    remoteScreenFrame =
        requestAnimationFrame(
            drawRemoteScreen
        );
}

function detectScreenType(
    src
){

    if(
        /\.(jpg|jpeg|png|gif|webp|avif)(\?.*)?$/i
            .test(src)
    ){

        return 'image';
    }

    if(
        /\.(m3u8)(\?.*)?$/i
            .test(src)
    ){

        return 'hls';
    }

    return 'video';
}

function applyClubScreenState(
    state
){

    if(!state){

        clubScreenState = {
            active:false,
            src:'',
            name:'',
            type:'auto',
            owner:'mvxtra',
            updatedAt:0
        };

        clearRemoteScreen();

        drawDefaultScreen();

        return;
    }

    clubScreenState = {

        active:
            !!state.active,

        src:
            String(
                state.src || ''
            ),

        name:
            String(
                state.name || ''
            ),

        type:
            String(
                state.type || 'auto'
            ),

        owner:
            String(
                state.owner ||
                'mvxtra'
            ),

        updatedAt:
            Number(
                state.updatedAt ||
                Date.now()
            )
    };

    clearRemoteScreen();

    if(
        !clubScreenState.active ||
        !clubScreenState.src
    ){

        drawDefaultScreen();

        return;
    }

    const src =
        clubScreenState.src;

    let type =
        clubScreenState.type;

    if(
        type === 'auto'
    ){

        type =
            detectScreenType(
                src
            );
    }

    console.log(
        '[SCREEN] Loading:',
        type,
        src
    );

    /* =====================================================
       IMAGE
    ===================================================== */

    if(
        type === 'image'
    ){

        const img =
            document
                .createElement(
                    'img'
                );

        img.crossOrigin =
            'anonymous';

        img.onload =
            function(){

                remoteScreenMedia =
                    img;

                remoteScreenType =
                    'image';

                drawRemoteScreen();
            };

        img.onerror =
            function(){

                console.error(
                    '[SCREEN] Image failed:',
                    src
                );

                drawDefaultScreen();
            };

        img.src =
            src;

        return;
    }

    /* =====================================================
       VIDEO / HLS
    ===================================================== */

    const video =
        document
            .createElement(
                'video'
            );

    video.crossOrigin =
        'anonymous';

    video.autoplay =
        true;

    video.playsInline =
        true;

    video.controls =
        false;

    /*
     * Сначала muted=true,
     * чтобы браузер разрешил autoplay.
     * Пользователь может включить звук
     * отдельной кнопкой.
     */

    video.muted =
        true;

    video.volume =
        1;

    video.style.display =
        'none';

    document.body.appendChild(
        video
    );

    remoteScreenMedia =
        video;

    remoteScreenType =
        'video';

    video.addEventListener(
        'loadeddata',
        function(){

            video.play()
                .then(
                    () => {

                        document
                            .getElementById(
                                'screen-sound'
                            )
                            .classList.add(
                                'show'
                            );

                        drawRemoteScreen();
                    }
                )
                .catch(
                    () => {

                        document
                            .getElementById(
                                'screen-sound'
                            )
                            .classList.add(
                                'show'
                            );

                        drawRemoteScreen();
                    }
                );
        }
    );

    video.addEventListener(
        'error',
        function(){

            console.error(
                '[SCREEN] Video error:',
                src
            );
        }
    );

    /*
     * Прямой HLS
     */

    if(
        type === 'hls' &&
        window.Hls &&
        Hls.isSupported()
    ){

        remoteScreenHls =
            new Hls({
                enableWorker:true,

                liveDurationInfinity:true
            });

        remoteScreenHls.loadSource(
            src
        );

        remoteScreenHls.attachMedia(
            video
        );

        return;
    }

    /*
     * Native HLS
     */

    if(
        type === 'hls' &&
        video.canPlayType(
            'application/vnd.apple.mpegurl'
        )
    ){

        video.src =
            src;

        video.load();

        return;
    }

    /*
     * MP4 / WEBM
     */

    video.src =
        src;

    video.load();
}

/* =========================================================
   SCREEN COMMAND
========================================================= */

function applyScreenCommand(
    command
){

    if(
        !remoteScreenMedia ||
        !command
    ){

        return;
    }

    const media =
        remoteScreenMedia;

    const name =
        command.command;

    if(
        name === 'play'
    ){

        media.play()
            .catch(
                () => {}
            );
    }

    if(
        name === 'pause'
    ){

        media.pause();
    }

    if(
        name === 'mute'
    ){

        media.muted =
            true;
    }

    if(
        name === 'unmute'
    ){

        media.muted =
            false;
    }

    if(
        name === 'seek'
    ){

        if(
            Number.isFinite(
                Number(
                    command.value
                )
            )
        ){

            media.currentTime =
                Number(
                    command.value
                );
        }
    }
}

/* =========================================================
   CHAT TRANSLATION
========================================================= */

async function translateMessage(
    text,
    source,
    target
){

    if(!text) return text;

    if(
        !target ||
        target === source
    ){

        return text;
    }

    const key =
        source +
        '|' +
        target +
        '|' +
        text;

    if(
        translationCache.has(
            key
        )
    ){

        return translationCache.get(
            key
        );
    }

    try{

        const url =
            'https://translate.googleapis.com/translate_a/single' +
            '?client=gtx' +
            '&sl=' +
            encodeURIComponent(
                source || 'auto'
            ) +
            '&tl=' +
            encodeURIComponent(
                target
            ) +
            '&dt=t' +
            '&q=' +
            encodeURIComponent(
                text
            );

        const response =
            await fetch(
                url
            );

        if(
            !response.ok
        ){

            throw new Error(
                'HTTP ' +
                response.status
            );
        }

        const data =
            await response.json();

        let result = '';

        if(
            Array.isArray(data) &&
            Array.isArray(data[0])
        ){

            data[0].forEach(
                part => {

                    if(
                        Array.isArray(part) &&
                        part[0]
                    ){

                        result +=
                            part[0];
                    }
                }
            );
        }

        if(!result){

            return text;
        }

        translationCache.set(
            key,
            result
        );

        return result;

    }catch(err){

        console.warn(
            '[TRANSLATION FAILED]',
            err
        );

        return text;
    }
}

async function renderChatMessage(
    message
){

    const box =
        document
            .getElementById(
                'chat-messages'
            );

    if(!box) return;

    const el =
        document
            .createElement(
                'div'
            );

    el.className =
        'msg';

    const user =
        document
            .createElement(
                'span'
            );

    user.className =
        'u';

    user.textContent =
        message.user ||
        'PLAYER';

    const text =
        document
            .createElement(
                'span'
            );

    text.className =
        't';

    const timestamp =
        Number(
            message.timestamp
        );

    const safeTimestamp =
        Number.isFinite(
            timestamp
        )
            ? timestamp
            : Date.now();

    const time =
        new Date(
            safeTimestamp
        )
        .toLocaleTimeString(
            [],
            {
                hour:'2-digit',
                minute:'2-digit'
            }
        );

    text.textContent =
        ' ' +
        time +
        ' ' +
        (
            message.text ||
            ''
        );

    el.appendChild(
        user
    );

    el.appendChild(
        document.createTextNode(
            ' '
        )
    );

    el.appendChild(
        text
    );

    box.appendChild(
        el
    );

    box.scrollTop =
        box.scrollHeight;

    const myLang =
        document
            .getElementById(
                'lang'
            )
            .value ||
        'ru';

    const sourceLang =
        message.lang ||
        'auto';

    /*
     * Если язык сообщения и язык
     * пользователя одинаковые —
     * ничего не переводим.
     */

    if(
        sourceLang ===
        myLang
    ){

        return;
    }

    /*
     * Индивидуальный перевод.
     * Этот запрос выполняется только
     * в браузере конкретного пользователя.
     */

    const translated =
        await translateMessage(
            message.text,
            sourceLang,
            myLang
        );

    if(
        translated &&
        translated !==
            message.text
    ){

        text.textContent =
            ' ' +
            time +
            ' ' +
            translated;

        const mark =
            document
                .createElement(
                    'span'
                );

        mark.className =
            'translation-mark';

        mark.textContent =
            ' 🌐';

        mark.title =
            sourceLang +
            ' → ' +
            myLang;

        el.appendChild(
            mark
        );

        box.scrollTop =
            box.scrollHeight;
    }
}

function createBox(
    w,
    h,
    d,
    x,
    y,
    z,
    material,
    cast=true,
    receive=true
){

    const mesh =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                w,
                h,
                d
            ),
            material
        );

    mesh.position.set(
        x,
        y,
        z
    );

    mesh.castShadow =
        cast;

    mesh.receiveShadow =
        receive;

    scene.add(
        mesh
    );

    return mesh;
}

function createLight(
    x,
    y,
    z,
    color,
    intensity,
    distance
){

    const light =
        new THREE.PointLight(
            color,
            intensity,
            distance
        );

    light.position.set(
        x,
        y,
        z
    );

    light.castShadow =
        true;

    scene.add(
        light
    );

    lightObjects.push(
        light
    );

    return light;
}

/* =========================================================

function createParticles(){

    const count =
        900;

    const geo =
        new THREE.BufferGeometry();

    const pos =
        new Float32Array(
            count * 3
        );

    for(
        let i=0;
        i<count;
        i++
    ){

        pos[i*3] =
            (Math.random()-.5)*34;

        pos[i*3+1] =
            Math.random()*5.8;

        pos[i*3+2] =
            (Math.random()-.5)*34;
    }

    geo.setAttribute(
        'position',
        new THREE.BufferAttribute(
            pos,
            3
        )
    );

    particles =
        new THREE.Points(
            geo,
            new THREE.PointsMaterial({
                color:0xffffff,
                size:.025,
                transparent:true,
                opacity:.18
            })
        );

    scene.add(
        particles
    );
}

/* =========================================================
   AUDIO / DJ STREAM
========================================================= */

function setupAudio(){

    const audio =
        document
            .getElementById(
                'stream-audio'
            );

    const indicator =
        document
            .getElementById(
                'stream-indicator'
            );

    const url =
        window.location.origin +
        '/hls/ews/index.m3u8';

    if(
        window.Hls &&
        Hls.isSupported()
    ){

        const hls =
            new Hls({
                enableWorker:true,
                liveDurationInfinity:true
            });

        hls.loadSource(
            url
        );

        hls.attachMedia(
            audio
        );

        hls.on(
            Hls.Events.MANIFEST_PARSED,
            function(){

                audio.play()
                    .then(
                        () => {

                            indicator.textContent =
                                'AUDIO: LIVE';

                            indicator.classList.add(
                                'live'
                            );

                            setupAnalyser(
                                audio
                            );
                        }
                    )
                    .catch(
                        () => {

                            indicator.textContent =
                                'AUDIO: CLICK TO START';
                        }
                    );
            }
        );

        hls.on(
            Hls.Events.ERROR,
            function(
                event,
                data
            ){

                if(
                    data.fatal
                ){

                    indicator.textContent =
                        'AUDIO: OFFLINE';
                }
            }
        );

    }else{

        audio.src =
            url;

        audio.play()
            .then(
                () => {

                    indicator.textContent =
                        'AUDIO: LIVE';

                    indicator.classList.add(
                        'live'
                    );

                    setupAnalyser(
                        audio
                    );
                }
            )
            .catch(
                () => {

                    indicator.textContent =
                        'AUDIO: CLICK TO START';
                }
            );
    }

    indicator.addEventListener(
        'click',
        function(){

            audio.play()
                .then(
                    () => {

                        indicator.textContent =
                            'AUDIO: LIVE';

                        indicator.classList.add(
                            'live'
                        );

                        setupAnalyser(
                            audio
                        );
                    }
                )
                .catch(
                    () => {}
                );
        }
    );
}

function setupAnalyser(
    audio
){

    if(analyser) return;

    try{

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        const ctx =
            new AudioContext();

        const source =
            ctx.createMediaElementSource(
                audio
            );

        analyser =
            ctx.createAnalyser();

        analyser.fftSize =
            512;

        analyser.smoothingTimeConstant =
            .8;

        source.connect(
            analyser
        );

        analyser.connect(
            ctx.destination
        );

        freqData =
            new Uint8Array(
                analyser.frequencyBinCount
            );

    }catch(e){

        console.log(
            'Audio analyser:',
            e
        );
    }
}

/* =========================================================
   CONTROLS
========================================================= */

function setupControls(){

    window.addEventListener(
        'resize',
        function(){

            if(!camera) return;

            camera.aspect =
                innerWidth /
                innerHeight;

            camera.updateProjectionMatrix();

            renderer.setSize(
                innerWidth,
                innerHeight
            );
        }
    );

    window.addEventListener(
        'keydown',
        function(e){

            if(
                e.target &&
                (
                    e.target.tagName ===
                        'INPUT' ||
                    e.target.tagName ===
                        'SELECT'
                )
            ){

                return;
            }

            keys[e.code] =
                true;

            if(
                e.code ===
                'KeyC'
            ){

                chatMode =
                    !chatMode;

                toggleChat();
            }
        }
    );

    window.addEventListener(
        'keyup',
        function(e){

            keys[e.code] =
                false;
        }
    );

    const canvas =
        document
            .getElementById(
                'canvas3d'
            );

    canvas.addEventListener(
        'click',
        function(){

            if(
                !chatMode
            ){

                try{

                    canvas.requestPointerLock();

                }catch(err){}
            }
        }
    );

    document.addEventListener(
        'pointerlockchange',
        function(){

            pointerLocked =
                document.pointerLockElement ===
                canvas;
        }
    );

    document.addEventListener(
        'mousemove',
        function(e){

            if(!pointerLocked)
                return;

            yaw -=
                e.movementX *
                .002;

            pitch -=
                e.movementY *
                .002;

            pitch =
                Math.max(
                    -1.45,
                    Math.min(
                        1.45,
                        pitch
                    )
                );
        }
    );
}

function toggleChat(){

    const input =
        document
            .getElementById(
                'chat-input'
            );

    if(
        chatMode
    ){

        if(
            document.pointerLockElement
        ){

            document.exitPointerLock();
        }

        input.focus();

    }else{

        input.blur();
    }
}

/* =========================================================
   ANIMATION
========================================================= */

function animate(){

    requestAnimationFrame(
        animate
    );

    if(!scene)
        return;

    const dt =
        Math.min(
            clock.getDelta(),
            .05
        );

    const time =
        performance.now() /
        1000;

    /* =====================================================
       AUDIO
    ===================================================== */

    let bass =
        .2;

    let level =
        .2;

    if(
        analyser &&
        freqData
    ){

        analyser.getByteFrequencyData(
            freqData
        );

        let b = 0;

        for(
            let i=0;
            i<10;
            i++
        ){

            b +=
                freqData[i];
        }

        bass =
            b /
            (10 * 255);

        let total =
            0;

        for(
            let i=0;
            i<freqData.length;
            i++
        ){

            total +=
                freqData[i];
        }

        level =
            total /
            (
                freqData.length *
                255
            );

    }else{

        bass =
            .25 +
            Math.sin(
                time * 3
            ) * .12;

        level =
            .25 +
            Math.sin(
                time * 1.5
            ) * .08;
    }

    bassLevel =
        bassLevel*.82 +
        bass*.18;

    audioLevel =
        audioLevel*.88 +
        level*.12;

    /* =====================================================
       MOVEMENT
    ===================================================== */

    const speed =
        chatMode
            ? 0
            : 5 * dt;

    let forward =
        0;

    let side =
        0;

    if(
        keys['KeyW']
    )
        forward += 1;

    if(
        keys['KeyS']
    )
        forward -= 1;

    if(
        keys['KeyA']
    )
        side -= 1;

    if(
        keys['KeyD']
    )
        side += 1;

    if(
        pointerLocked &&
        !chatMode
    ){

        const fx =
            -Math.sin(
                yaw
            );

        const fz =
            -Math.cos(
                yaw
            );

        const rx =
            Math.cos(
                yaw
            );

        const rz =
            -Math.sin(
                yaw
            );

        camera.position.x +=
            (
                fx * forward +
                rx * side
            ) *
            speed;

        camera.position.z +=
            (
                fz * forward +
                rz * side
            ) *
            speed;
    }

    camera.position.x =
        THREE.MathUtils.clamp(
            camera.position.x,
            -16,
            16
        );

    camera.position.z =
        THREE.MathUtils.clamp(
            camera.position.z,
            -15.5,
            15.5
        );

    camera.position.y =
        1.7;

    camera.rotation.order =
        'YXZ';

    camera.rotation.y =
        yaw;

    camera.rotation.x =
        pitch;

    /* =====================================================
       PLAYER BODY
    ===================================================== */

    if(playerBody){

        playerBody.position.x =
            camera.position.x;

        playerBody.position.z =
            camera.position.z;

        playerBody.visible =
            false;
    }

    /* =====================================================
       PARTICLES
    ===================================================== */

    if(particles){

        particles.rotation.y +=
            .00015;

        particles.material.opacity =
            .12 +
            audioLevel*.2;
    }

    /* =====================================================
       NEON
    ===================================================== */

    neonObjects.forEach(
        (
            obj,
            index
        ) => {

            const pulse =
                .5 +
                Math.sin(
                    time*3 +
                    index*.4
                )*.25 +
                bassLevel*.7;

            const value =
                Math.min(
                    1,
                    pulse
                );

            obj.material.color.setRGB(
                value,
                value,
                value
            );
        }
    );

    /* =====================================================
       LIGHTS
    ===================================================== */

    lightObjects.forEach(
        (
            light,
            index
        ) => {

            light.intensity =
                1 +
                bassLevel*2 +
                Math.sin(
                    time*2 +
                    index
                )*.15;
        }
    );

    /*
     * ВАЖНО:
     * Здесь больше НЕТ старого блока,
     * который каждый кадр затирал
     * общий экран надписью EWS SESSIONS.
     */

    if(
        !clubScreenState.active &&
        screenCtx
    ){

        drawDefaultScreen();
    }

    renderer.render(
        scene,
        camera
    );
}
