<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EWS SESSIONS</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS3DRenderer.js"></script>
<script src="/socket.io/socket.io.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;color:#fff;font-family:Arial,Helvetica,sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
#app{position:relative;width:100vw;height:100vh}
#canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#css3d{position:absolute;inset:0;z-index:20;pointer-events:none}
#screen3d{width:1400px;height:600px;background:#000;border:6px solid #111;box-shadow:0 0 50px #000;overflow:hidden;opacity:0;visibility:hidden;pointer-events:auto;transition:opacity .15s}
#screen3d.active{opacity:1;visibility:visible}
#screen3d iframe{display:block;width:100%;height:100%;border:0;background:#000}
#screenHint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);padding:8px 12px;border:1px solid rgba(255,255,255,.4);background:rgba(0,0,0,.8);font-size:12px;letter-spacing:1px;pointer-events:none}
#screenHint.hide{display:none}
#logo{position:absolute;left:22px;top:18px;z-index:40;font-weight:900;font-size:28px;letter-spacing:8px;text-shadow:0 0 18px rgba(255,255,255,.18)}
#status{position:absolute;left:24px;top:58px;z-index:40;font-size:11px;letter-spacing:1.6px;opacity:.72}
#onlineBox,#chatBox,#screenBox{position:absolute;z-index:40;background:rgba(0,0,0,.76);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(8px)}
#onlineBox{right:18px;top:18px;width:190px;padding:12px}
#onlineTitle{font-size:10px;letter-spacing:2px;opacity:.65;margin-bottom:8px}
#onlineList{margin:0;padding:0;list-style:none;max-height:180px;overflow:auto;font-size:13px}
#onlineList li{padding:4px 0;border-bottom:1px solid rgba(255,255,255,.08)}
#chatBox{left:18px;bottom:18px;width:340px;padding:10px}
#chatLog{height:150px;overflow:auto;font-size:12px;line-height:1.4}
.chatLine{margin:0 0 5px}
.chatUser{font-weight:800;margin-right:5px}
#chatForm{display:flex;gap:6px;margin-top:8px}
#chatInput{flex:1;min-width:0;background:#050505;color:#fff;border:1px solid #444;padding:8px}
#chatSend{width:64px;background:#fff;color:#000;border:0}
#screenBox{left:18px;top:18px;width:330px;padding:12px;display:none}
#screenBox.open{display:block}
#screenTitle{font-size:10px;letter-spacing:2px;opacity:.65;margin-bottom:8px}
#screenUrl{width:100%;padding:8px;background:#050505;color:#fff;border:1px solid #444}
.screenRow{display:flex;gap:6px;margin-top:7px}
.screenRow button{flex:1;padding:7px;border:0}
#screenLoad{background:#fff;color:#000}
#screenClear{background:#222;color:#fff;border:1px solid #555!important}
#auth{position:absolute;inset:0;z-index:100;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#171717 0,#070707 42%,#000 100%)}
#auth.hidden{display:none}
.authCard{width:min(390px,calc(100vw - 36px));padding:30px;border:1px solid rgba(255,255,255,.22);background:rgba(0,0,0,.75);box-shadow:0 0 60px rgba(255,255,255,.05)}
.authLogo{text-align:center;font-size:34px;font-weight:900;letter-spacing:9px;margin-bottom:4px}
.authSub{text-align:center;font-size:10px;letter-spacing:3px;opacity:.55;margin-bottom:24px}
.authCard input{width:100%;margin-bottom:9px;padding:11px;background:#080808;color:#fff;border:1px solid #444}
.authBtns{display:flex;gap:8px}
.authBtns button{flex:1;padding:10px;border:0}
#loginBtn{background:#fff;color:#000}
#registerBtn{background:#222;color:#fff;border:1px solid #555!important}
#authMsg{min-height:18px;margin-top:10px;font-size:12px;text-align:center;opacity:.75}
#lang{width:100%;padding:8px;background:#080808;color:#fff;border:1px solid #444;margin-bottom:9px}
#hint{position:absolute;z-index:35;left:50%;bottom:18px;transform:translateX(-50%);font-size:11px;letter-spacing:1.3px;opacity:.45;pointer-events:none}
@media(max-width:700px){
  #onlineBox{width:150px}
  #chatBox{width:calc(100vw - 36px)}
  #screen3d{width:1000px;height:430px}
}
</style>
</head>
<body>
<div id="app">
<canvas id="canvas"></canvas>
<div id="css3d"><div id="screen3d"><iframe id="screenFrame" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen></iframe><div id="screenHint">CLICK SCREEN FOR SOUND</div></div></div>
<div id="logo">EWS</div>
<div id="status">SESSIONS / OFFLINE</div>
<div id="onlineBox"><div id="onlineTitle">ONLINE</div><ul id="onlineList"></ul></div>

<div id="screenBox">
  <div id="screenTitle">CLUB SCREEN / MVXTRA ONLY</div>
  <input id="screenUrl" placeholder="YouTube / Twitch / https://">
  <div class="screenRow">
    <button id="screenLoad">LOAD</button>
    <button id="screenClear">CLEAR</button>
  </div>
</div>

<div id="chatBox">
  <div id="chatLog"></div>
  <form id="chatForm"><input id="chatInput" autocomplete="off" maxlength="240" placeholder="say something..."><button id="chatSend" type="submit">SEND</button></form>
</div>

<div id="hint">CLICK TO ENTER · WASD MOVE · SPACE JUMP · ESC RELEASE MOUSE</div>

<div id="auth">
  <div class="authCard">
    <div class="authLogo">EWS</div>
    <div class="authSub">SESSIONS / UNDERGROUND CLUB</div>
    <input id="authUser" autocomplete="username" maxlength="24" placeholder="username">
    <input id="authPass" type="password" autocomplete="current-password" maxlength="128" placeholder="password">
    <select id="lang">
      <option value="en">ENGLISH</option>
      <option value="ru">РУССКИЙ</option>
      <option value="nl">NEDERLANDS</option>
      <option value="de">DEUTSCH</option>
      <option value="es">ESPAÑOL</option>
      <option value="fr">FRANÇAIS</option>
    </select>
    <div class="authBtns">
      <button id="loginBtn" type="button">ENTER</button>
      <button id="registerBtn" type="button">REGISTER</button>
    </div>
    <div id="authMsg"></div>
  </div>
</div>
</div>

<script>
'use strict';

const $ = id => document.getElementById(id);

let currentUser = '';
let socket = null;
let scene = null;
let camera = null;
let renderer = null;
let cssScene = null;
let cssRenderer = null;
let cssObject = null;
let screenAnchor = null;
let clock = new THREE.Clock();
let remotePlayers = new Map();

let yaw = 0;
let pitch = 0;
let playerX = 0;
let playerZ = 10;
let grounded = true;
let jumpVelocity = 0;

const keys = Object.create(null);
const GROUND_Y = 0;
const GRAVITY = 18;
const JUMP = 7;
const MOVE_SPEED = 4.7;

let lastSent = 0;
let lastScreenVersion = 0;
let screenUrlLoaded = '';
let screenRequestTimer = null;
let dustField = null;
let hazeField = null;
let mistField = null;

function msg(text) {
  $('authMsg').textContent = text || '';
}

async function auth(path) {
  const username = $('authUser').value.trim();
  const password = $('authPass').value;

  if (!username || !password) {
    msg('ENTER USERNAME AND PASSWORD');
    return;
  }

  try {
    const response = await fetch(path,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({username,password})
    });

    const data = await response.json();

    if (!response.ok || !data.ok) {
      msg(data.error || 'LOGIN ERROR');
      return;
    }

    currentUser = data.username;
    localStorage.setItem('ews-username', currentUser);
    enterClub();
  } catch {
    msg('SERVER CONNECTION ERROR');
  }
}

$('loginBtn').onclick = () => auth('/api/login');
$('registerBtn').onclick = () => auth('/api/register');

$('authPass').addEventListener('keydown',e=>{
  if(e.key==='Enter') auth('/api/login');
});

function isHost() {
  return currentUser.toLowerCase() === 'mvxtra';
}

function setStatus(text) {
  $('status').textContent = 'SESSIONS / ' + text;
}

function enterClub() {
  $('auth').classList.add('hidden');
  $('hint').style.display = 'block';
  $('screenBox').classList.toggle('open',isHost());
  init3D();
  connectSocket();
}

function connectSocket() {
  if (socket) {
    try { socket.disconnect(); } catch {}
  }

  socket = io({
    transports:['websocket','polling'],
    reconnection:true,
    reconnectionAttempts:Infinity,
    reconnectionDelay:500,
    reconnectionDelayMax:3000
  });

  socket.on('connect',()=>{
    setStatus('ONLINE');
    socket.emit('join',{
      username:currentUser,
      language:$('lang').value
    });

    setTimeout(requestWorldAndScreen,250);
    setTimeout(requestWorldAndScreen,1200);

    if(screenRequestTimer) clearInterval(screenRequestTimer);
    screenRequestTimer = setInterval(requestWorldAndScreen,2500);
  });

  socket.on('disconnect',()=>{
    setStatus('RECONNECTING');
    $('onlineList').innerHTML = '';
    remotePlayers.forEach(removeRemotePlayer);
    remotePlayers.clear();
  });

  socket.on('world:state',world=>{
    if(!world) return;

    const alive = new Set();

    if(Array.isArray(world.players)){
      world.players.forEach(data=>{
        if(!data || data.id === socket.id) return;
        alive.add(data.id);
        updateRemotePlayer(data);
      });
    }

    [...remotePlayers.keys()].forEach(id=>{
      if(!alive.has(id)) removeRemotePlayer(id);
    });

    if(world.screen) applyScreen(world.screen);
  });

  socket.on('online:state',list=>{
    const users = Array.isArray(list) ? list : [];
    $('onlineList').innerHTML='';

    users.forEach(item=>{
      const name = String(item && item.username || '');
      if(!name) return;
      const li = document.createElement('li');
      li.textContent = name + (name.toLowerCase()===currentUser.toLowerCase() ? ' (YOU)' : '');
      $('onlineList').appendChild(li);
    });
  });

  socket.on('player:joined',data=>{
    if(data && data.id && data.id !== socket.id) updateRemotePlayer(data);
  });

  socket.on('player:state',data=>{
    if(data && data.id && data.id !== socket.id) updateRemotePlayer(data);
  });

  socket.on('player:left',id=>removeRemotePlayer(id));

  socket.on('screen:state',state=>applyScreen(state));

  socket.on('chat:message',message=>{
    addChat(message.user,message.text);
  });

  socket.on('club:ready',info=>{
    if(info && info.screen) applyScreen(info.screen);
  });
}

function requestWorldAndScreen() {
  if(!socket || !socket.connected) return;
  socket.emit('world:request');
  socket.emit('screen:request');
}

function addChat(user,text) {
  const line = document.createElement('div');
  line.className='chatLine';

  const who = document.createElement('span');
  who.className='chatUser';
  who.textContent=String(user||'');
  
  const body = document.createElement('span');
  body.textContent=String(text||'');

  line.append(who,body);
  $('chatLog').appendChild(line);
  $('chatLog').scrollTop=$('chatLog').scrollHeight;
}

$('chatForm').addEventListener('submit',e=>{
  e.preventDefault();
  const value=$('chatInput').value.trim();
  if(!value || !socket || !socket.connected) return;
  socket.emit('chat:message',value);
  $('chatInput').value='';
});

document.addEventListener('keydown',e=>{
  if(e.target && /input|select|textarea/i.test(e.target.tagName)) return;
  keys[e.code]=true;

  if(e.code==='Space' && grounded && !document.pointerLockElement) {
    return;
  }

  if(e.code==='Space' && grounded) {
    jumpVelocity=JUMP;
    grounded=false;
    e.preventDefault();
  }
});

document.addEventListener('keyup',e=>{
  keys[e.code]=false;
});

function init3D() {
  if(renderer) return;

  const canvas=$('canvas');

  renderer=new THREE.WebGLRenderer({
    canvas,
    antialias:true,
    powerPreference:'high-performance'
  });

  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
  renderer.shadowMap.enabled=true;

  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x040404);
  scene.fog=new THREE.Fog(0x040404,18,48);

  camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.05,120);
  camera.position.set(playerX,2.05,playerZ);
  camera.rotation.order='YXZ';

  const ambient=new THREE.AmbientLight(0xffffff,.16);
  scene.add(ambient);

  const key=new THREE.PointLight(0xffffff,2.2,35);
  key.position.set(0,8,1);
  key.castShadow=true;
  scene.add(key);

  const floor=new THREE.Mesh(
    new THREE.PlaneGeometry(40,36),
    new THREE.MeshStandardMaterial({color:0x111111,roughness:.8,metalness:.15})
  );
  floor.rotation.x=-Math.PI/2;
  floor.receiveShadow=true;
  scene.add(floor);

  const wallMaterial=new THREE.MeshStandardMaterial({color:0x080808,roughness:.9});
  const backWall=new THREE.Mesh(new THREE.BoxGeometry(40,12,.5),wallMaterial);
  backWall.position.set(0,6,-15.7);
  scene.add(backWall);

  const side1=new THREE.Mesh(new THREE.BoxGeometry(.5,12,32),wallMaterial);
  side1.position.set(-20,6,0);
  scene.add(side1);

  const side2=side1.clone();
  side2.position.x=20;
  scene.add(side2);

  buildClubDetails();
  buildAtmosphere();

  cssRenderer=new THREE.CSS3DRenderer();
  cssRenderer.setSize(innerWidth,innerHeight);
  cssRenderer.domElement.style.position='absolute';
  cssRenderer.domElement.style.left='0';
  cssRenderer.domElement.style.top='0';
  cssRenderer.domElement.style.width='100%';
  cssRenderer.domElement.style.height='100%';
  cssRenderer.domElement.style.pointerEvents='none';
  $('css3d').appendChild(cssRenderer.domElement);

  cssScene=new THREE.Scene();

  screenAnchor=new THREE.Object3D();
  screenAnchor.position.set(0,5.4,-15.35);
  scene.add(screenAnchor);

  cssObject=new THREE.CSS3DObject($('screen3d'));
  cssObject.position.set(0,0,0);
  cssObject.scale.set(.01,.01,.01);
  cssScene.add(cssObject);

  renderer.domElement.addEventListener('click',()=>{
    if($('screen3d').classList.contains('active')) {
      $('screenHint').classList.add('hide');
      try { document.exitPointerLock(); } catch {}
    } else {
      renderer.domElement.requestPointerLock();
    }
  });

  window.addEventListener('resize',resize);
  animate();
}

function buildClubDetails() {
  const mats=[
    new THREE.MeshStandardMaterial({color:0x181818,roughness:.6,metalness:.35}),
    new THREE.MeshStandardMaterial({color:0x303030,roughness:.45,metalness:.45})
  ];

  const screenFrame=new THREE.Mesh(
    new THREE.BoxGeometry(14.6,6.6,.35),
    new THREE.MeshStandardMaterial({color:0x020202,roughness:.4,metalness:.7})
  );
  screenFrame.position.set(0,5.35,-15.1);
  scene.add(screenFrame);

  // Symmetric speaker stacks beside the screen.
  const speakerMaterial=new THREE.MeshStandardMaterial({
    color:0x101010,
    roughness:.52,
    metalness:.25
  });

  const grilleMaterial=new THREE.MeshStandardMaterial({
    color:0x252525,
    roughness:.72,
    metalness:.1
  });

  function addSpeakerStack(x){
    const stack=new THREE.Group();

    const cabinet=new THREE.Mesh(
      new THREE.BoxGeometry(1.25,3.9,.75),
      speakerMaterial
    );
    cabinet.position.y=3.0;
    cabinet.castShadow=true;
    cabinet.receiveShadow=true;
    stack.add(cabinet);

    for(let i=0;i<3;i++){
      const cone=new THREE.Mesh(
        new THREE.CylinderGeometry(.26,.26,.10,24),
        grilleMaterial
      );
      cone.rotation.x=Math.PI/2;
      cone.position.set(0,1.85+i*.95,.39);
      stack.add(cone);
    }

    const sub=new THREE.Mesh(
      new THREE.BoxGeometry(1.65,1.55,1.0),
      speakerMaterial
    );
    sub.position.set(0,.78,.02);
    sub.castShadow=true;
    sub.receiveShadow=true;
    stack.add(sub);

    const subGrille=new THREE.Mesh(
      new THREE.CircleGeometry(.46,32),
      grilleMaterial
    );
    subGrille.rotation.y=Math.PI;
    subGrille.position.set(0,.78,.52);
    stack.add(subGrille);

    stack.position.set(x,0,-14.45);
    scene.add(stack);
  }

  addSpeakerStack(-8.55);
  addSpeakerStack(8.55);

}

function buildAtmosphere() {
  // Fine airborne dust: tiny, slow particles spread through the room.
  const dustCount = 900;
  const dustPositions = new Float32Array(dustCount * 3);

  for(let i=0;i<dustCount;i++){
    const i3=i*3;
    dustPositions[i3] = (Math.random()-.5) * 34;
    dustPositions[i3+1] = .35 + Math.random() * 7.5;
    dustPositions[i3+2] = -14 + Math.random() * 28;
  }

  const dustGeometry = new THREE.BufferGeometry();
  dustGeometry.setAttribute(
    'position',
    new THREE.BufferAttribute(dustPositions,3)
  );

  dustField = new THREE.Points(
    dustGeometry,
    new THREE.PointsMaterial({
      color:0xb8b8b8,
      size:.035,
      transparent:true,
      opacity:.38,
      depthWrite:false,
      sizeAttenuation:true
    })
  );

  scene.add(dustField);

  // Soft haze: larger, translucent particles mainly around the outer room.
  const hazeCount = 120;
  const hazePositions = new Float32Array(hazeCount * 3);

  for(let i=0;i<hazeCount;i++){
    const i3=i*3;
    const edge = Math.random() < .65 ? 1 : 0;
    const x=edge
      ? (Math.random()<.5 ? -1 : 1) * (7 + Math.random()*9)
      : (Math.random()-.5)*12;

    hazePositions[i3] = x;
    hazePositions[i3+1] = .45 + Math.random() * 3.8;
    hazePositions[i3+2] = -12 + Math.random() * 23;
  }

  const hazeGeometry = new THREE.BufferGeometry();
  hazeGeometry.setAttribute(
    'position',
    new THREE.BufferAttribute(hazePositions,3)
  );

  hazeField = new THREE.Points(
    hazeGeometry,
    new THREE.PointsMaterial({
      color:0xaaaaaa,
      size:1.7,
      transparent:true,
      opacity:.055,
      depthWrite:false,
      sizeAttenuation:true
    })
  );

  scene.add(hazeField);

  // Denser low mist gives the floor a soft atmospheric layer.
  const mistCount = 150;
  const mistPositions = new Float32Array(mistCount * 3);

  for(let i=0;i<mistCount;i++){
    const i3=i*3;
    mistPositions[i3] = (Math.random()-.5) * 32;
    mistPositions[i3+1] = .12 + Math.random() * 1.25;
    mistPositions[i3+2] = -13 + Math.random() * 25;
  }

  const mistGeometry = new THREE.BufferGeometry();
  mistGeometry.setAttribute(
    'position',
    new THREE.BufferAttribute(mistPositions,3)
  );

  mistField = new THREE.Points(
    mistGeometry,
    new THREE.PointsMaterial({
      color:0xc0c0c0,
      size:2.35,
      transparent:true,
      opacity:.035,
      depthWrite:false,
      sizeAttenuation:true
    })
  );

  scene.add(mistField);
}

function resize() {
  if(!renderer || !camera) return;

  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();

  renderer.setSize(innerWidth,innerHeight);
  if(cssRenderer) cssRenderer.setSize(innerWidth,innerHeight);
}

function normalizeScreenUrl(value) {
  let raw=String(value||'').trim();
  if(!raw) return null;

  try {
    const u=new URL(raw);

    if(u.hostname==='youtu.be') {
      const id=u.pathname.split('/').filter(Boolean)[0];
      if(!id) return null;
      return {
        src:'https://www.youtube.com/embed/'+encodeURIComponent(id)+'?autoplay=1&rel=0&playsinline=1',
        name:'YOUTUBE'
      };
    }

    if(u.hostname.endsWith('youtube.com')) {
      let id=u.searchParams.get('v');

      if(!id && u.pathname.startsWith('/shorts/')) {
        id=u.pathname.split('/')[2];
      }

      if(!id && u.pathname.startsWith('/embed/')) {
        id=u.pathname.split('/')[2];
      }

      if(!id && u.pathname.startsWith('/live/')) {
        id=u.pathname.split('/')[2];
      }

      if(!id) return null;

      return {
        src:'https://www.youtube.com/embed/'+encodeURIComponent(id)+'?autoplay=1&rel=0&playsinline=1',
        name:'YOUTUBE'
      };
    }

    if(u.hostname==='twitch.tv' || u.hostname==='www.twitch.tv' || u.hostname.endsWith('.twitch.tv')) {
      const bits=u.pathname.split('/').filter(Boolean);
      if(!bits.length) return null;

      const host=location.hostname;
      const parent=encodeURIComponent(host);

      if(bits[0]==='videos' && bits[1]) {
        return {
          src:'https://player.twitch.tv/?video='+encodeURIComponent(bits[1])+'&parent='+parent+'&autoplay=true',
          name:'TWITCH'
        };
      }

      return {
        src:'https://player.twitch.tv/?channel='+encodeURIComponent(bits[0])+'&parent='+parent+'&autoplay=true',
        name:'TWITCH'
      };
    }

    if(u.protocol!=='https:') return null;

    return {
      src:u.href,
      name:'HTTPS'
    };
  } catch {
    return null;
  }
}

function applyScreen(state) {
  state=state||{};

  const version=Number(state.version)||0;
  if(version && version<lastScreenVersion) return;

  if(version) lastScreenVersion=version;

  const box=$('screen3d');
  const frame=$('screenFrame');

  if(state.active!==true || !state.src) {
    box.classList.remove('active');
    $('screenHint').classList.add('hide');
    frame.src='about:blank';
    screenUrlLoaded='';
    return;
  }

  const original=String(state.url||'').trim();
  const normalized=original ? normalizeScreenUrl(original) : null;
  const src=normalized ? normalized.src : String(state.src).trim();

  if(!src) return;

  if(src!==screenUrlLoaded) {
    frame.src=src;
    screenUrlLoaded=src;
  }

  box.classList.add('active');
  $('screenHint').classList.toggle('hide',isHost());

  // CSS3DObject keeps the DOM screen in the actual 3D room.
  cssObject.element.style.display='block';
}

$('screenLoad').onclick=()=>{
  if(!isHost() || !socket || !socket.connected) return;

  const normalized=normalizeScreenUrl($('screenUrl').value);

  if(!normalized) {
    addChat('SYSTEM','Use a YouTube, Twitch or HTTPS link.');
    return;
  }

  socket.emit('screen:set',{
    active:true,
    src:normalized.src,
    url:$('screenUrl').value.trim(),
    name:normalized.name
  });
};

$('screenClear').onclick=()=>{
  if(!isHost() || !socket || !socket.connected) return;
  socket.emit('screen:set',{active:false});
};

function createLabel(name) {
  const canvas=document.createElement('canvas');
  canvas.width=512;
  canvas.height=96;
  const ctx=canvas.getContext('2d');
  ctx.clearRect(0,0,512,96);
  ctx.fillStyle='#ffffff';
  ctx.font='700 34px Arial';
  ctx.textAlign='center';
  ctx.fillText(String(name||'PLAYER'),256,58);

  const tex=new THREE.CanvasTexture(canvas);
  const sprite=new THREE.Sprite(
    new THREE.SpriteMaterial({
      map:tex,
      transparent:true,
      depthTest:false
    })
  );

  sprite.scale.set(2.3,.43,1);
  sprite.position.y=2.9;
  return sprite;
}

function avatarSeed(id) {
  let n=0;
  for(let i=0;i<String(id).length;i++) n=(n*31+String(id).charCodeAt(i))>>>0;
  return n;
}

function createRemotePlayer(data) {
  const g=new THREE.Group();
  g.userData.id=data.id;

  const seed=avatarSeed(data.id);
  const bodyColor=0x777777 + (seed % 4)*0x080808;
  const accent=seed%2 ? 0xdddddd : 0xaaaaaa;

  const body=new THREE.Mesh(
    new THREE.BoxGeometry(.8,1.25,.45),
    new THREE.MeshStandardMaterial({color:bodyColor,roughness:.65})
  );
  body.position.y=1.35;
  body.castShadow=true;
  g.add(body);

  const head=new THREE.Mesh(
    new THREE.SphereGeometry(.38,12,12),
    new THREE.MeshStandardMaterial({color:accent,roughness:.6})
  );
  head.position.y=2.3;
  head.castShadow=true;
  g.add(head);

  const legL=new THREE.Mesh(
    new THREE.BoxGeometry(.22,.95,.24),
    new THREE.MeshStandardMaterial({color:0x292929})
  );
  legL.position.set(-.2,.48,0);
  legL.castShadow=true;
  g.add(legL);

  const legR=legL.clone();
  legR.position.x=.2;
  g.add(legR);

  const armL=new THREE.Mesh(
    new THREE.BoxGeometry(.2,1.02,.22),
    new THREE.MeshStandardMaterial({color:0x444444})
  );
  armL.position.set(-.56,1.38,0);
  armL.rotation.z=.05;
  armL.castShadow=true;
  g.add(armL);

  const armR=armL.clone();
  armR.position.x=.56;
  armR.rotation.z=-.05;
  g.add(armR);

  g.add(createLabel(data.username));

  g.position.set(Number(data.x)||0,GROUND_Y,Number(data.z)||0);
  g.rotation.y=Number(data.yaw)||0;

  scene.add(g);
  remotePlayers.set(data.id,{
    group:g,
    data,
    targetX:g.position.x,
    targetZ:g.position.z,
    targetYaw:g.rotation.y
  });
}

function updateRemotePlayer(data) {
  let p=remotePlayers.get(data.id);

  if(!p) {
    createRemotePlayer(data);
    p=remotePlayers.get(data.id);
  }

  if(!p) return;

  p.data=data;
  p.targetX=Number(data.x)||0;
  p.targetZ=Number(data.z)||0;
  p.targetYaw=Number(data.yaw)||0;
}

function removeRemotePlayer(id) {
  const p=remotePlayers.get(id);
  if(!p) return;

  scene.remove(p.group);
  remotePlayers.delete(id);
}

function updateRemoteAvatars(time) {
  remotePlayers.forEach(p=>{
    p.group.position.x += (p.targetX-p.group.position.x)*.22;
    p.group.position.z += (p.targetZ-p.group.position.z)*.22;
    p.group.rotation.y += THREE.MathUtils.clamp(
      p.targetYaw-p.group.rotation.y,
      -.12,.12
    );

    const swing=p.data.moving ? Math.sin(time*9)*.35 : 0;
    if(p.group.children[2]) p.group.children[2].rotation.x=swing;
    if(p.group.children[3]) p.group.children[3].rotation.x=-swing;
    if(p.group.children[4]) p.group.children[4].rotation.x=-swing;
    if(p.group.children[5]) p.group.children[5].rotation.x=swing;
  });
}

function sendPlayerState(now) {
  if(!socket || !socket.connected) return;
  if(now-lastSent<60) return;

  lastSent=now;

  socket.emit('player:state',{
    x:playerX,
    z:playerZ,
    yaw
  });
}

function movePlayer(dt) {
  if(!document.pointerLockElement) return;

  const forward=(keys.KeyW?1:0)-(keys.KeyS?1:0);
  const side=(keys.KeyD?1:0)-(keys.KeyA?1:0);

  if(!forward && !side) return;

  const length=Math.hypot(forward,side)||1;
  const f=forward/length;
  const s=side/length;

  const fx=-Math.sin(yaw);
  const fz=-Math.cos(yaw);
  const rx=Math.cos(yaw);
  const rz=-Math.sin(yaw);

  playerX += (fx*f+rx*s)*MOVE_SPEED*dt;
  playerZ += (fz*f+rz*s)*MOVE_SPEED*dt;

  playerX=THREE.MathUtils.clamp(playerX,-16,16);
  playerZ=THREE.MathUtils.clamp(playerZ,-14,14);
}

function animate() {
  requestAnimationFrame(animate);

  const dt=Math.min(clock.getDelta(),.05);
  const time=performance.now()/1000;

  if(!scene) return;

  if(document.pointerLockElement) movePlayer(dt);

  if(document.pointerLockElement) {
    jumpVelocity -= GRAVITY*dt;
    camera.position.y += jumpVelocity*dt;

    if(camera.position.y<=2.05) {
      camera.position.y=2.05;
      jumpVelocity=0;
      grounded=true;
    }
  }

  camera.position.x=playerX;
  camera.position.z=playerZ;
  camera.rotation.y=yaw;
  camera.rotation.x=pitch;

  sendPlayerState(performance.now());
  updateRemoteAvatars(time);

  if(dustField){
    dustField.rotation.y += dt*.006;
    dustField.position.y = Math.sin(time*.18)*.03;
  }

  if(hazeField){
    hazeField.rotation.y -= dt*.002;
    hazeField.position.x = Math.sin(time*.11)*.45;
  }

  if(mistField){
    mistField.rotation.y += dt*.004;
    mistField.position.x = Math.cos(time*.09)*.35;
  }

  if(screenAnchor && cssObject) {
    cssObject.position.copy(screenAnchor.position);
    cssObject.rotation.copy(screenAnchor.rotation);
    cssObject.scale.set(.01,.01,.01);
  }

  renderer.render(scene,camera);
  cssRenderer.render(cssScene,camera);
}

document.addEventListener('click',e=>{
  if(e.target.closest && (
    e.target.closest('#auth') ||
    e.target.closest('#chatBox') ||
    e.target.closest('#onlineBox') ||
    e.target.closest('#screenBox') ||
    e.target.closest('#screen3d')
  )) return;

  if(renderer && renderer.domElement && !document.pointerLockElement) {
    try { renderer.domElement.requestPointerLock(); } catch {}
  }
});

document.addEventListener('mousemove',e=>{
  if(!document.pointerLockElement) return;
  yaw -= e.movementX*.0022;
  pitch -= e.movementY*.0022;
  pitch=THREE.MathUtils.clamp(pitch,-1.35,1.35);
});

document.addEventListener('pointerlockchange',()=>{
  $('hint').style.opacity=document.pointerLockElement ? '.15' : '.55';
});

const remembered=localStorage.getItem('ews-username');
if(remembered) $('authUser').value=remembered;
</script>
</body>
