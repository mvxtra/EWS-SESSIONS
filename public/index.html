<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0"
>

<title>EWS SESSIONS</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>

<script src="/socket.io/socket.io.js"></script>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #000;

    color: #fff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

#canvas3d {

    position: fixed;

    inset: 0;

    width: 100vw;
    height: 100vh;

    display: block;

    background: #000;

    z-index: 1;
}

#loginScreen {

    position: fixed;

    inset: 0;

    z-index: 100;

    display: flex;

    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            circle at center,
            #222 0%,
            #050505 45%,
            #000 100%
        );
}

.loginBox {

    width: 360px;

    max-width: calc(100vw - 40px);

    padding: 32px;

    border: 1px solid #444;

    background: rgba(0,0,0,.92);

    box-shadow:
        0 0 40px rgba(255,255,255,.08);

    text-align: center;
}

.logo {

    font-size: 32px;

    font-weight: 900;

    letter-spacing: 8px;

    margin-bottom: 8px;
}

.sub {

    font-size: 11px;

    letter-spacing: 4px;

    color: #777;

    margin-bottom: 28px;
}

.loginBox input {

    width: 100%;

    padding: 13px;

    margin-bottom: 10px;

    border: 1px solid #333;

    background: #111;

    color: #fff;

    outline: none;
}

.loginBox button {

    width: 100%;

    padding: 13px;

    margin-top: 6px;

    border: 0;

    background: #fff;

    color: #000;

    font-weight: 900;

    cursor: pointer;
}

.loginBox button:hover {

    background: #ddd;
}

#registerBtn {

    background: #222;

    color: #fff;
}

#error {

    min-height: 20px;

    margin-top: 12px;

    color: #ff5555;

    font-size: 12px;
}

#club {

    position: fixed;

    inset: 0;

    z-index: 5;

    display: none;
}

#hud {

    position: fixed;

    top: 18px;

    left: 18px;

    z-index: 20;

    pointer-events: none;
}

.brand {

    font-size: 20px;

    font-weight: 900;

    letter-spacing: 5px;
}

.status {

    margin-top: 5px;

    font-size: 10px;

    letter-spacing: 2px;

    color: #aaa;
}

#onlineBox {

    position: fixed;

    top: 18px;

    right: 18px;

    z-index: 20;

    width: 190px;

    max-height: 240px;

    overflow: auto;

    padding: 12px;

    background: rgba(0,0,0,.65);

    border: 1px solid #333;
}

.onlineTitle {

    font-size: 10px;

    letter-spacing: 3px;

    color: #888;

    margin-bottom: 8px;
}

.onlineUser {

    padding: 4px 0;

    font-size: 12px;
}

.onlineDot {

    display: inline-block;

    width: 7px;
    height: 7px;

    margin-right: 7px;

    border-radius: 50%;

    background: #fff;
}

#chat {

    position: fixed;

    left: 18px;

    bottom: 18px;

    z-index: 20;

    width: 340px;

    max-width: calc(100vw - 36px);
}

#messages {

    height: 170px;

    overflow-y: auto;

    padding: 10px;

    background: rgba(0,0,0,.55);

    border: 1px solid #333;

    margin-bottom: 6px;
}

.msg {

    font-size: 12px;

    margin-bottom: 6px;

    line-height: 1.35;
}

.msgUser {

    font-weight: 900;
}

.system {

    color: #777;
}

#chatForm {

    display: flex;

    gap: 5px;
}

#chatInput {

    flex: 1;

    padding: 10px;

    border: 1px solid #333;

    background: rgba(0,0,0,.8);

    color: #fff;

    outline: none;
}

#chatForm button {

    width: 60px;

    border: 0;

    background: #fff;

    color: #000;

    font-weight: 900;
}

#audioBtn {

    position: fixed;

    right: 18px;

    bottom: 18px;

    z-index: 30;

    padding: 12px 18px;

    border: 1px solid #555;

    background: #000;

    color: #fff;

    cursor: pointer;

    font-weight: 900;
}

#hint {

    position: fixed;

    left: 50%;

    bottom: 20px;

    transform: translateX(-50%);

    z-index: 20;

    padding: 8px 14px;

    background: rgba(0,0,0,.55);

    border: 1px solid #333;

    font-size: 11px;

    color: #aaa;
}

#crosshair {

    position: fixed;

    left: 50%;

    top: 50%;

    width: 8px;

    height: 8px;

    transform: translate(-50%,-50%);

    z-index: 15;

    pointer-events: none;
}

#crosshair::before,
#crosshair::after {

    content: "";

    position: absolute;

    background: rgba(255,255,255,.8);
}

#crosshair::before {

    width: 14px;
    height: 1px;

    left: -3px;
    top: 4px;
}

#crosshair::after {

    width: 1px;
    height: 14px;

    left: 4px;
    top: -3px;
}

#zone {

    position: fixed;

    left: 50%;

    top: 20px;

    transform: translateX(-50%);

    z-index: 20;

    font-size: 10px;

    letter-spacing: 4px;

    color: #aaa;
}

.hidden {

    display: none !important;
}

</style>

</head>

<body>

<canvas id="canvas3d"></canvas>

<div id="loginScreen">

    <div class="loginBox">

        <div class="logo">
            EWS
        </div>

        <div class="sub">
            SESSIONS
        </div>

        <input
            id="username"
            type="text"
            placeholder="USERNAME"
            autocomplete="username"
        >

        <input
            id="password"
            type="password"
            placeholder="PASSWORD"
            autocomplete="current-password"
        >

        <button id="loginBtn">
            ENTER CLUB
        </button>

        <button id="registerBtn">
            REGISTER
        </button>

        <div id="error"></div>

    </div>

</div>

<div id="club">

    <div id="hud">

        <div class="brand">
            EWS SESSIONS
        </div>

        <div class="status">
            <span id="streamStatus">
                STREAM OFFLINE
            </span>
        </div>

    </div>

    <div id="zone">
        MAIN FLOOR
    </div>

    <div id="onlineBox">

        <div class="onlineTitle">
            ONLINE
        </div>

        <div id="onlineList">
            nobody
        </div>

    </div>

    <div id="chat">

        <div id="messages"></div>

        <form id="chatForm">

            <input
                id="chatInput"
                autocomplete="off"
                placeholder="chat..."
            >

            <button>
                SEND
            </button>

        </form>

    </div>

    <button id="audioBtn">
        🔊 START AUDIO
    </button>

    <div id="hint">
        WASD MOVE · SPACE JUMP · V VIEW · CLICK MOUSE
    </div>

    <div id="crosshair"></div>

</div>

<audio
    id="ewsAudio"
    crossorigin="anonymous"
    playsinline
></audio>

<script>

'use strict';

/* =========================
   GLOBALS
========================= */

let scene;
let camera;
let renderer;
let clock;

let socket = null;

let currentUser = null;

let keys = {};

let yaw = 0;
let pitch = 0;

let pointerLocked = false;

let thirdPerson = true;

let velocityY = 0;

let onGround = true;

let localPlayer = null;

const remotePlayers = new Map();

let hls = null;

let audioStarted = false;

const canvas =
    document.getElementById('canvas3d');

const loginScreen =
    document.getElementById('loginScreen');

const club =
    document.getElementById('club');

const errorBox =
    document.getElementById('error');

const audio =
    document.getElementById('ewsAudio');

/* =========================
   HELPERS
========================= */

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
}

function showError(text) {

    errorBox.textContent = text || '';

}

/* =========================
   LOGIN
========================= */

document
    .getElementById('loginBtn')
    .onclick = login;

document
    .getElementById('registerBtn')
    .onclick = register;

async function login() {

    showError('');

    const username =
        document
            .getElementById('username')
            .value
            .trim();

    const password =
        document
            .getElementById('password')
            .value;

    if (!username || !password) {

        showError(
            'Введите username и password'
        );

        return;
    }

    try {

        const response =
            await fetch('/api/login', {

                method: 'POST',

                headers: {
                    'Content-Type':
                        'application/json'
                },

                body: JSON.stringify({
                    username,
                    password
                })
            });

        const data =
            await response.json();

        if (!data.ok) {

            showError(
                data.message ||
                'Login failed'
            );

            return;
        }

        currentUser =
            data.username;

        enterClub();

    } catch (error) {

        console.error(error);

        showError(
            'SERVER CONNECTION ERROR'
        );
    }
}

async function register() {

    showError('');

    const username =
        document
            .getElementById('username')
            .value
            .trim();

    const password =
        document
            .getElementById('password')
            .value;

    if (!username || !password) {

        showError(
            'Введите username и password'
        );

        return;
    }

    try {

        const response =
            await fetch('/api/register', {

                method: 'POST',

                headers: {
                    'Content-Type':
                        'application/json'
                },

                body: JSON.stringify({
                    username,
                    password
                })
            });

        const data =
            await response.json();

        if (!data.ok) {

            showError(
                data.message ||
                'Registration failed'
            );

            return;
        }

        currentUser =
            data.username;

        enterClub();

    } catch (error) {

        console.error(error);

        showError(
            'SERVER CONNECTION ERROR'
        );
    }
}

/* =========================
   ENTER
========================= */

function enterClub() {

    loginScreen.style.display =
        'none';

    club.style.display =
        'block';

    init3D();

    connectSocket();

    setupAudio();

}

/* =========================
   THREE
========================= */

function init3D() {

    if (scene) return;

    if (
        typeof THREE === 'undefined'
    ) {

        showFatal(
            'THREE.JS НЕ ЗАГРУЗИЛСЯ'
        );

        return;
    }

    clock =
        new THREE.Clock();

    scene =
        new THREE.Scene();

    scene.background =
        new THREE.Color(0x030303);

    scene.fog =
        new THREE.Fog(
            0x030303,
            20,
            65
        );

    camera =
        new THREE.PerspectiveCamera(
            70,
            window.innerWidth /
            window.innerHeight,
            0.1,
            200
        );

    camera.position.set(
        0,
        2.2,
        8
    );

    renderer =
        new THREE.WebGLRenderer({

            canvas,

            antialias: true,

            powerPreference:
                'high-performance'
        });

    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio || 1,
            2
        )
    );

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.outputEncoding =
        THREE.sRGBEncoding;

    /* LIGHT */

    const ambient =
        new THREE.AmbientLight(
            0xffffff,
            0.45
        );

    scene.add(ambient);

    const light =
        new THREE.PointLight(
            0xffffff,
            2,
            35
        );

    light.position.set(
        0,
        5,
        0
    );

    scene.add(light);

    /* ROOM */

    createRoom();

    /* PLAYER */

    localPlayer =
        createPlayer(
            0xffffff
        );

    localPlayer.position.set(
        0,
        1,
        7
    );

    scene.add(
        localPlayer
    );

    window.addEventListener(
        'resize',
        resize
    );

    document.addEventListener(
        'keydown',
        e => {

            keys[e.code] = true;

            if (
                e.code === 'Space' &&
                onGround
            ) {

                velocityY = 7;

                onGround = false;
            }

            if (
                e.code === 'KeyV'
            ) {

                thirdPerson =
                    !thirdPerson;
            }
        }
    );

    document.addEventListener(
        'keyup',
        e => {

            keys[e.code] = false;
        }
    );

    canvas.addEventListener(
        'click',
        () => {

            canvas.requestPointerLock();
        }
    );

    document.addEventListener(
        'pointerlockchange',
        () => {

            pointerLocked =
                document.pointerLockElement ===
                canvas;
        }
    );

    document.addEventListener(
        'mousemove',
        e => {

            if (!pointerLocked)
                return;

            yaw -=
                e.movementX *
                0.002;

            pitch -=
                e.movementY *
                0.002;

            pitch =
                Math.max(
                    -1.2,
                    Math.min(
                        1.2,
                        pitch
                    )
                );
        }
    );

    animate();
}

/* =========================
   ROOM
========================= */

function createRoom() {

    const floorMat =
        new THREE.MeshStandardMaterial({
            color: 0x111111,
            roughness: .7,
            metalness: .2
        });

    const floor =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                36,
                .4,
                36
            ),
            floorMat
        );

    floor.position.y =
        -0.2;

    scene.add(floor);

    const wallMat =
        new THREE.MeshStandardMaterial({
            color: 0x080808
        });

    createBox(
        36,
        6,
        .5,
        0,
        3,
        -18,
        wallMat
    );

    createBox(
        36,
        6,
        .5,
        0,
        3,
        18,
        wallMat
    );

    createBox(
        .5,
        6,
        36,
        -18,
        3,
        0,
        wallMat
    );

    createBox(
        .5,
        6,
        36,
        18,
        3,
        0,
        wallMat
    );

    /* DANCE FLOOR */

    const dance =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                16,
                .15,
                12
            ),
            new THREE.MeshStandardMaterial({
                color: 0x202020,
                emissive: 0x101010
            })
        );

    dance.position.set(
        0,
        .08,
        -1
    );

    scene.add(dance);

    /* STAGE */

    createBox(
        14,
        1,
        4,
        0,
        .5,
        -13,
        new THREE.MeshStandardMaterial({
            color: 0x151515
        })
    );

    /* SCREEN */

    createBox(
        10,
        4,
        .3,
        0,
        3,
        -15,
        new THREE.MeshStandardMaterial({
            color: 0x050505,
            emissive: 0x101010
        })
    );

    /* BAR */

    createBox(
        7,
        1.2,
        2,
        -11,
        .6,
        9,
        new THREE.MeshStandardMaterial({
            color: 0x151515
        })
    );

    /* LOUNGE */

    createBox(
        5,
        1,
        3,
        11,
        .5,
        8,
        new THREE.MeshStandardMaterial({
            color: 0x111111
        })
    );

    /* COLUMNS */

    const positions = [
        [-14, 3, -8],
        [14, 3, -8],
        [-14, 3, 5],
        [14, 3, 5]
    ];

    for (
        const p of positions
    ) {

        const column =
            new THREE.Mesh(
                new THREE.CylinderGeometry(
                    .5,
                    .5,
                    6,
                    16
                ),
                new THREE.MeshStandardMaterial({
                    color: 0x181818
                })
            );

        column.position.set(
            p[0],
            p[1],
            p[2]
        );

        scene.add(column);
    }

    /* SPEAKERS */

    for (
        let x = -5;
        x <= 5;
        x += 10
    ) {

        createBox(
            2,
            3,
            1,
            x,
            1.5,
            -10,
            new THREE.MeshStandardMaterial({
                color: 0x050505
            })
        );
    }
}

function createBox(
    sx,
    sy,
    sz,
    x,
    y,
    z,
    material
) {

    const mesh =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                sx,
                sy,
                sz
            ),
            material
        );

    mesh.position.set(
        x,
        y,
        z
    );

    scene.add(mesh);

    return mesh;
}

/* =========================
   PLAYER
========================= */

function createPlayer(
    color
) {

    const group =
        new THREE.Group();

    const material =
        new THREE.MeshStandardMaterial({
            color
        });

    const body =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .8,
                1.4,
                .5
            ),
            material
        );

    body.position.y =
        .9;

    group.add(body);

    const head =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .32,
                16,
                16
            ),
            material
        );

    head.position.y =
        1.85;

    group.add(head);

    const leg1 =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .25,
                .8,
                .3
            ),
            material
        );

    leg1.position.set(
        -.2,
        .1,
        0
    );

    group.add(leg1);

    const leg2 =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .25,
                .8,
                .3
            ),
            material
        );

    leg2.position.set(
        .2,
        .1,
        0
    );

    group.add(leg2);

    return group;
}

/* =========================
   SOCKET
========================= */

function connectSocket() {

    if (
        typeof io !== 'function'
    ) {

        console.error(
            'Socket.IO client missing'
        );

        return;
    }

    socket =
        io({
            transports: [
                'websocket',
                'polling'
            ]
        });

    socket.on(
        'connect',
        () => {

            console.log(
                '[SOCKET] connected',
                socket.id
            );

            socket.emit(
                'join',
                {
                    username:
                        currentUser,

                    language:
                        'en'
                }
            );

            socket.emit(
                'request-online'
            );

            socket.emit(
                'request-players'
            );
        }
    );

    socket.on(
        'disconnect',
        reason => {

            console.log(
                '[SOCKET] disconnected',
                reason
            );
        }
    );

    socket.on(
        'online-users',
        users => {

            renderOnline(
                users
            );
        }
    );

    socket.on(
        'players-state',
        players => {

            if (!Array.isArray(players))
                return;

            players.forEach(
                createRemotePlayer
            );
        }
    );

    socket.on(
        'player-joined',
        player => {

            createRemotePlayer(
                player
            );
        }
    );

    socket.on(
        'player-move',
        player => {

            updateRemotePlayer(
                player
            );
        }
    );

    socket.on(
        'player-left',
        id => {

            removeRemotePlayer(
                id
            );
        }
    );

    socket.on(
        'chat-message',
        message => {

            addChatMessage(
                message
            );
        }
    );

    socket.on(
        'system-message',
        message => {

            addSystemMessage(
                message.text
            );
        }
    );
}

/* =========================
   ONLINE
========================= */

function renderOnline(
    users
) {

    const list =
        document.getElementById(
            'onlineList'
        );

    if (
        !Array.isArray(users) ||
        users.length === 0
    ) {

        list.innerHTML =
            '<div style="color:#666">nobody</div>';

        return;
    }

    list.innerHTML =
        users.map(
            user => `
                <div class="onlineUser">
                    <span class="onlineDot"></span>
                    ${escapeHTML(
                        user.username
                    )}
                </div>
            `
        ).join('');
}

/* =========================
   REMOTE PLAYERS
========================= */

function createRemotePlayer(
    data
) {

    if (!data?.id)
        return;

    if (
        data.id === socket?.id
    )
        return;

    if (
        remotePlayers.has(
            data.id
        )
    )
        return;

    const group =
        createPlayer(
            0xffffff
        );

    group.position.set(
        Number(data.x) || 0,
        Number(data.y) || 1,
        Number(data.z) || 0
    );

    group.rotation.y =
        Number(data.ry) || 0;

    scene.add(group);

    remotePlayers.set(
        data.id,
        {
            object: group,
            username:
                data.username ||
                'Guest'
        }
    );
}

function updateRemotePlayer(
    data
) {

    const item =
        remotePlayers.get(
            data.id
        );

    if (!item) {

        createRemotePlayer(
            data
        );

        return;
    }

    item.object.position.set(
        Number(data.x) || 0,
        Number(data.y) || 1,
        Number(data.z) || 0
    );

    item.object.rotation.y =
        Number(data.ry) || 0;
}

function removeRemotePlayer(
    id
) {

    const item =
        remotePlayers.get(id);

    if (!item)
        return;

    scene.remove(
        item.object
    );

    remotePlayers.delete(id);
}

/* =========================
   CHAT
========================= */

document
    .getElementById('chatForm')
    .addEventListener(
        'submit',
        e => {

            e.preventDefault();

            const input =
                document.getElementById(
                    'chatInput'
                );

            const text =
                input.value.trim();

            if (
                !text ||
                !socket ||
                !socket.connected
            )
                return;

            socket.emit(
                'chat-message',
                {
                    text
                }
            );

            input.value = '';
        }
    );

function addChatMessage(
    message
) {

    const box =
        document.getElementById(
            'messages'
        );

    const div =
        document.createElement(
            'div'
        );

    div.className =
        'msg';

    div.innerHTML =
        `<span class="msgUser">
            ${escapeHTML(
                message.user ||
                message.username ||
                'Guest'
            )}
        </span>: 
        ${escapeHTML(
            message.text || ''
        )}`;

    box.appendChild(div);

    box.scrollTop =
        box.scrollHeight;
}

function addSystemMessage(
    text
) {

    const box =
        document.getElementById(
            'messages'
        );

    const div =
        document.createElement(
            'div'
        );

    div.className =
        'msg system';

    div.textContent =
        text;

    box.appendChild(div);

    box.scrollTop =
        box.scrollHeight;
}

/* =========================
   MOVEMENT
========================= */

function updatePlayer(
    delta
) {

    if (!localPlayer)
        return;

    const speed =
        5 * delta;

    let forward = 0;
    let side = 0;

    if (
        keys['KeyW'] ||
        keys['ArrowUp']
    )
        forward += 1;

    if (
        keys['KeyS'] ||
        keys['ArrowDown']
    )
        forward -= 1;

    if (
        keys['KeyA'] ||
        keys['ArrowLeft']
    )
        side -= 1;

    if (
        keys['KeyD'] ||
        keys['ArrowRight']
    )
        side += 1;

    if (
        forward ||
        side
    ) {

        const len =
            Math.hypot(
                forward,
                side
            );

        forward /= len;
        side /= len;

        const dx =
            (
                Math.sin(yaw) *
                forward +
                Math.cos(yaw) *
                side
            ) * speed;

        const dz =
            (
                Math.cos(yaw) *
                forward -
                Math.sin(yaw) *
                side
            ) * speed;

        const nx =
            localPlayer.position.x +
            dx;

        const nz =
            localPlayer.position.z +
            dz;

        if (
            !blocked(
                nx,
                nz
            )
        ) {

            localPlayer.position.x =
                nx;

            localPlayer.position.z =
                nz;
        }
    }

    velocityY -=
        18 * delta;

    localPlayer.position.y +=
        velocityY * delta;

    if (
        localPlayer.position.y <= 1
    ) {

        localPlayer.position.y =
            1;

        velocityY = 0;

        onGround = true;
    }

    camera.rotation.order =
        'YXZ';

    camera.rotation.y =
        yaw;

    camera.rotation.x =
        pitch;

    if (thirdPerson) {

        const distance = 5;

        const target =
            new THREE.Vector3(
                localPlayer.position.x,
                localPlayer.position.y +
                    1.3,
                localPlayer.position.z
            );

        const offset =
            new THREE.Vector3(
                Math.sin(yaw) *
                    distance,
                2.4,
                Math.cos(yaw) *
                    distance
            );

        camera.position.copy(
            target.clone().add(offset)
        );

        camera.lookAt(
            target
        );

    } else {

        camera.position.set(
            localPlayer.position.x,
            localPlayer.position.y +
                1.5,
            localPlayer.position.z
        );
    }

    if (
        socket &&
        socket.connected
    ) {

        socket.emit(
            'player-move',
            {
                x:
                    localPlayer.position.x,

                y:
                    localPlayer.position.y,

                z:
                    localPlayer.position.z,

                ry:
                    yaw,

                jumping:
                    !onGround
            }
        );
    }
}

/* =========================
   COLLISION
========================= */

function blocked(
    x,
    z
) {

    const limit = 17;

    if (
        x < -limit ||
        x > limit ||
        z < -limit ||
        z > limit
    )
        return true;

    if (
        x > -7 &&
        x < 7 &&
        z < -10 &&
        z > -15
    )
        return true;

    if (
        x > -15 &&
        x < -7 &&
        z > 7 &&
        z < 11
    )
        return true;

    if (
        x > 8 &&
        x < 14 &&
        z > 6 &&
        z < 10
    )
        return true;

    return false;
}

/* =========================
   AUDIO / HLS
========================= */

function setupAudio() {

    const url =
        `${window.location.origin}/hls/live/ews/index.m3u8`;

    if (
        window.Hls &&
        Hls.isSupported()
    ) {

        hls =
            new Hls({
                enableWorker: true
            });

        hls.loadSource(url);

        hls.attachMedia(audio);

        hls.on(
            Hls.Events.MANIFEST_PARSED,
            () => {

                document
                    .getElementById(
                        'streamStatus'
                    )
                    .textContent =
                    'STREAM READY';
            }
        );

        hls.on(
            Hls.Events.ERROR,
            (event, data) => {

                console.log(
                    '[HLS]',
                    data
                );
            }
        );

    } else if (
        audio.canPlayType(
            'application/vnd.apple.mpegurl'
        )
    ) {

        audio.src = url;
    }
}

document
    .getElementById('audioBtn')
    .onclick = async () => {

        try {

            await audio.play();

            audioStarted = true;

            document
                .getElementById(
                    'audioBtn'
                )
                .textContent =
                '🔊 AUDIO ON';

            document
                .getElementById(
                    'streamStatus'
                )
                .textContent =
                'STREAM ONLINE';

        } catch (error) {

            console.error(
                '[AUDIO]',
                error
            );
        }
    };

/* =========================
   RENDER
========================= */

function animate() {

    requestAnimationFrame(
        animate
    );

    if (!renderer || !scene)
        return;

    const delta =
        Math.min(
            clock.getDelta(),
            .05
        );

    updatePlayer(
        delta
    );

    renderer.render(
        scene,
        camera
    );
}

/* =========================
   RESIZE
========================= */

function resize() {

    if (
        !camera ||
        !renderer
    )
        return;

    camera.aspect =
        window.innerWidth /
        window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );
}

/* =========================
   FATAL ERROR
========================= */

function showFatal(
    text
) {

    loginScreen.style.display =
        'flex';

    errorBox.textContent =
        text;

    console.error(
        text
    );
}

========================= */

);
