<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Club PS2 Style</title>
  <style>
    body { margin: 0; overflow: hidden; background: #050505; font-family: sans-serif; }
    #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    .hud-text { position: absolute; color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.8); font-weight: bold; }
    #fps { top: 10px; left: 10px; }
    #chat { bottom: 10px; left: 10px; max-width: 300px; }
    #emojis { bottom: 10px; right: 10px; display: flex; gap: 10px; }
    .emoji-btn {
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(255,255,255,0.4);
      color: #fff;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 18px;
      pointer-events: auto;
    }
    .emoji-btn:hover { background: rgba(255,255,255,0.4); }
    #mobile-controls {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 15px; pointer-events: auto;
    }
    .mobile-btn {
      width: 60px; height: 60px; border-radius: 50%;
      background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.4);
      color: #fff; font-size: 24px; display: flex; align-items: center; justify-content: center;
    }
    @media (min-width: 768px) {
      #mobile-controls { display: none; }
    }
    #players-online {
      position: absolute;
      top: 10px;
      right: 20px;
      width: 200px;
      max-height: 200px;
      overflow-y: auto;
      pointer-events: auto;
      color: #fff;
      font-size: 16px;
      text-align: right;
      border-left: 2px solid rgba(255,255,255,0.3);
      padding-left: 10px;
    }
    #players-online .player-item {
      margin-bottom: 6px;
      opacity: 0.9;
      animation: fadeIn 0.4s ease-out forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateX(10px); }
      to { opacity: 0.9; transform: translateX(0); }
    }
  </style>
</head>
<body>
  <div id="ui-layer">
    <div id="fps" class="hud-text">FPS: 0</div>
    <div id="chat" class="hud-text"></div>
    <div id="emojis">
      <button class="emoji-btn" onclick="sendEmoji('😀')">😀</button>
      <button class="emoji-btn" onclick="sendEmoji('😎')">😎</button>
      <button class="emoji-btn" onclick="sendEmoji('🔥')">🔥</button>
      <button class="emoji-btn" onclick="sendEmoji('🎉')">🎉</button>
    </div>
    <div id="players-online">
      <div style="font-size:14px; color:#aaa; margin-bottom:8px;">Кто в клубе:</div>
      <div id="players-list"></div>
    </div>
    <div id="mobile-controls">
      <button class="mobile-btn" onmousedown="setMoveDir(0,1)" onmouseup="setMoveDir(0,0)">↑</button>
      <button class="mobile-btn" onmousedown="setMoveDir(-1,0)" onmouseup="setMoveDir(0,0)">←</button>
      <button class="mobile-btn" onmousedown="setMoveDir(1,0)" onmouseup="setMoveDir(0,0)">→</button>
      <button class="mobile-btn" onmousedown="setMoveDir(0,-1)" onmouseup="setMoveDir(0,0)">↓</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  <script>
    const CONFIG = {
      avatar: {
        baseScale: 1.7,
        headSegments: 16,
        hairCubes: 4,
        colors: [
          { shirt: '#1a1a1a', pants: '#2b3e50', shoes: '#111111', hair: '#000000' },
          { shirt: '#2b2b2b', pants: '#334756', shoes: '#0f0f0f', hair: '#1a1a1a' },
          { shirt: '#333333', pants: '#48637f', shoes: '#151515', hair: '#222222' },
          { shirt: '#444444', pants: '#5a7594', shoes: '#1a1a1a', hair: '#333333' }
        ]
      },
      scene: {
        fogColor: 0x0a0a0a,
        fogNear: 10,
        fogFar: 60
      }
    };

    let scene, camera, renderer, clock;
    let player, playerMesh, playerNickname;
    let moveDir = new THREE.Vector2(0, 0);
    let lastTime = 0;
    let fpsCounter = 0;
    let fpsDisplay = document.getElementById('fps');
    let playersListEl = document.getElementById('players-list');
    let socket;
    let players = {};
    let emojis = [];
    let allPlayers = {};

    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x050505);
      scene.fog = new THREE.Fog(CONFIG.scene.fogColor, CONFIG.scene.fogNear, CONFIG.scene.fogFar);

      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
      camera.position.set(0, 4, 8);
      camera.lookAt(0, 2, 0);

      renderer = new THREE.WebGLRenderer({ antialias: false });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      document.body.appendChild(renderer.domElement);

      clock = new THREE.Clock();

      const ambientLight = new THREE.AmbientLight(0x404040, 0.4);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
      dirLight.position.set(5, 10, 5);
      dirLight.castShadow = true;
      scene.add(dirLight);

      // Пол
      const floorGeo = new THREE.PlaneGeometry(100, 100);
      const floorMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 });
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.rotation.x = -Math.PI / 2;
      floor.receiveShadow = true;
      scene.add(floor);

      // Стены
      const wallMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.9 });
      const wallPositions = [
        { geo: new THREE.BoxGeometry(0.2, 10, 40), pos: [-20, 5, 0] },
        { geo: new THREE.BoxGeometry(0.2, 10, 40), pos: [20, 5, 0] },
        { geo: new THREE.BoxGeometry(40, 10, 0.2), pos: [0, 5, -20] },
        { geo: new THREE.BoxGeometry(40, 10, 0.2), pos: [0, 5, 20] }
      ];
      wallPositions.forEach(w => {
        const wall = new THREE.Mesh(w.geo, wallMat);
        wall.position.set(...w.pos);
        wall.castShadow = true;
        wall.receiveShadow = true;
        scene.add(wall);
      });

      // Диваны по углам
      const sofaMat = new THREE.MeshStandardMaterial({ color: 0x8B4513, roughness: 0.7 });
      const sofaGeo = new THREE.BoxGeometry(6, 2, 4);
      const sofaPositions = [
        { x: -18, z: -18 },
        { x: 18, z: -18 },
        { x: -18, z: 18 },
        { x: 18, z: 18 }
      ];
      sofaPositions.forEach(pos => {
        const sofa = new THREE.Mesh(sofaGeo, sofaMat);
        sofa.position.set(pos.x, 1, pos.z);
        sofa.castShadow = true;
        sofa.receiveShadow = true;
        scene.add(sofa);
        const pl = new THREE.PointLight(0xffaa00, 0.8, 15);
        pl.position.set(pos.x, 3, pos.z);
        scene.add(pl);
      });

      // Часы MSK
      const clockGroup = new THREE.Group();
      clockGroup.position.set(0, 6, -19.8);
      scene.add(clockGroup);

      const clockBgGeo = new THREE.BoxGeometry(4, 2, 0.1);
      const clockBgMat = new THREE.MeshStandardMaterial({ color: 0x000000, emissive: 0xffffff, emissiveIntensity: 0.3 });
      const clockBg = new THREE.Mesh(clockBgGeo, clockBgMat);
      clockGroup.add(clockBg);

      const clockCanvas = document.createElement('canvas');
      clockCanvas.width = 512;
      clockCanvas.height = 256;
      const clockCtx = clockCanvas.getContext('2d');
      const clockTexture = new THREE.CanvasTexture(clockCanvas);
      const clockTextMat = new THREE.MeshBasicMaterial({ map: clockTexture, transparent: true });
      const clockTextGeo = new THREE.PlaneGeometry(3.6, 1.8);
      const clockTextMesh = new THREE.Mesh(clockTextGeo, clockTextMat);
      clockTextMesh.position.z = 0.06;
      clockTextMesh.name = 'clockText';
      clockGroup.add(clockTextMesh);

      const clockLight = new THREE.PointLight(0xffffff, 1.5, 10);
      clockLight.position.set(0, 2, 2);
      clockGroup.add(clockLight);

      // Стробоскоп
      const strobeLight = new THREE.PointLight(0xffffff, 2, 50);
      strobeLight.position.set(0, 10, 0);
      scene.add(strobeLight);
      let strobeOn = true;
      setInterval(() => {
        strobeOn = !strobeOn;
        strobeLight.intensity = strobeOn ? 2 : 0.1;
      }, 300);

      // Игрок
      playerNickname = 'Player_' + Math.floor(Math.random() * 1000);
      player = createAvatar({ style: Math.floor(Math.random() * CONFIG.avatar.colors.length) });
      player.position.set(0, 0, 0);
      scene.add(player);
      playerMesh = player;

      // Сокет
      socket = io();

      socket.on('connect', () => {
        socket.emit('join', { nickname: playerNickname });
      });

      socket.on('players-list', (list) => {
        allPlayers = {};
        list.forEach(p => {
          allPlayers[p.socketId] = p.nickname;
        });
        updatePlayersListUI();
      });

      socket.on('player-join', (data) => {
        if (data.nickname !== playerNickname) {
          allPlayers[data.socketId] = data.nickname;
          updatePlayersListUI();
          const avatar = createAvatar(data.avatarData || { style: 0 });
          avatar.position.set(data.position.x, data.position.y, data.position.z);
          scene.add(avatar);
          players[data.socketId] = { mesh: avatar, lastMoveTime: 0 };
        }
      });

      socket.on('player-leave', (socketId) => {
        if (players[socketId]) {
          scene.remove(players[socketId].mesh);
          delete players[socketId];
        }
        if (allPlayers[socketId]) {
          delete allPlayers[socketId];
          updatePlayersListUI();
        }
      });

      socket.on('player-move', (data) => {
        if (players[data.socketId]) {
          const p = players[data.socketId];
          p.mesh.position.set(data.position.x, data.position.y, data.position.z);
          p.mesh.rotation.y = data.rotation;
          p.lastMoveTime = Date.now();
        }
      });

      socket.on('emoji', (data) => {
        spawnEmoji(data.position, data.emoji);
      });

      // Управление
      window.addEventListener('keydown', (e) => {
        if (e.code === 'KeyW') moveDir.y = 1;
        if (e.code === 'KeyS') moveDir.y = -1;
        if (e.code === 'KeyA') moveDir.x = -1;
        if (e.code === 'KeyD') moveDir.x = 1;
      });
      window.addEventListener('keyup', (e) => {
        if (e.code === 'KeyW' || e.code === 'KeyS') moveDir.y = 0;
        if (e.code === 'KeyA' || e.code === 'KeyD') moveDir.x = 0;
      });

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      animate();
    }

    function updatePlayersListUI() {
      playersListEl.innerHTML = '';
      const nicknames = Object.values(allPlayers);
      if (nicknames.length === 0) {
        playersListEl.innerHTML = '<div style="color:#666; font-size:13px;">В клубе пока тихо…</div>';
      } else {
        nicknames.forEach(n => {
          const div = document.createElement('div');
          div.className = 'player-item';
          div.textContent = n;
          playersListEl.appendChild(div);
        });
      }
    }

    function createAvatar(data) {
      const group = new THREE.Group();
      const style = (data && data.style) || 0;
      const colors = CONFIG.avatar.colors[style % CONFIG.avatar.colors.length];

      // Голова
      const headGeo = new THREE.SphereGeometry(0.4, 16, 16);
      const headMat = new THREE.MeshStandardMaterial({ color: 0xf0e6dd, flatShading: true });
      const head = new THREE.Mesh(headGeo, headMat);
      head.position.y = 1.6;
      group.add(head);

      // Глаза
      const eyeGeo = new THREE.BoxGeometry(0.15, 0.06, 0.02);
      const eyeMat = new THREE.MeshStandardMaterial({ color: 0x000000, flatShading: true });
      const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
      leftEye.position.set(-0.12, 1.7, 0.38);
      const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
      rightEye.position.set(0.12, 1.7, 0.38);
      group.add(leftEye, rightEye);

      // Нос
      const noseGeo = new THREE.BoxGeometry(0.04, 0.06, 0.04);
      const noseMat = new THREE.MeshStandardMaterial({ color: 0xd0c0b0, flatShading: true });
      const nose = new THREE.Mesh(noseGeo, noseMat);
      nose.position.set(0, 1.65, 0.38);
      group.add(nose);

      // Рот
      const mouthGeo = new THREE.BoxGeometry(0.14, 0.04, 0.02);
      const mouthMat = new THREE.MeshStandardMaterial({ color: 0x000000, flatShading: true });
      const mouth = new THREE.Mesh(mouthGeo, mouthMat);
      mouth.position.set(0, 1.52, 0.38);
      group.add(mouth);

      // Причёска
      for (let i = 0; i < CONFIG.avatar.hairCubes; i++) {
        const hGeo = new THREE.BoxGeometry(0.3, 0.2, 0.2);
        const hMat = new THREE.MeshStandardMaterial({ color: colors.hair, flatShading: true });
        const hair = new THREE.Mesh(hGeo, hMat);
        hair.position.y = 1.8 + (Math.random() - 0.5) * 0.2;
        hair.position.x = (Math.random() - 0.5) * 0.4;
        hair.position.z = (Math.random() - 0.5) * 0.4;
        group.add(hair);
      }

      // Тело
      const bodyGeo = new THREE.BoxGeometry(0.6, 0.8, 0.3);
      const bodyMat = new THREE.MeshStandardMaterial({ color: colors.shirt, flatShading: true });
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.position.y = 1.05;
      group.add(body);

      // Воротник
      const collarGeo = new THREE.BoxGeometry(0.6, 0.04, 0.32);
      const collarMat = new THREE.MeshStandardMaterial({ color: 0xffffff, flatShading: true });
      const collar = new THREE.Mesh(collarGeo, collarMat);
      collar.position.y = 1.45;
      group.add(collar);

      // Руки
      const armGeo = new THREE.CylinderGeometry(0.1, 0.1, 0.6, 8);
      const armMat = new THREE.MeshStandardMaterial({ color: 0xf0e6dd, flatShading: true });
      const leftArm = new THREE.Mesh(armGeo, armMat);
      leftArm.position.set(-0.35, 0.9, 0);
      leftArm.rotation.z = Math.PI / 4;
      leftArm.name = 'leftArm';
      const rightArm = new THREE.Mesh(armGeo, armMat);
      rightArm.position.set(0.35, 0.9, 0);
      rightArm.rotation.z = -Math.PI / 4;
      rightArm.name = 'rightArm';
      group.add(leftArm, rightArm);

      // Ноги
      const legGeo = new THREE.CylinderGeometry(0.12, 0.12, 0.7, 8);
      const legMat = new THREE.MeshStandardMaterial({ color: colors.pants, flatShading: true });
      const leftLeg = new THREE.Mesh(legGeo, legMat);
      leftLeg.position.set(-0.15, 0.3, 0);
      leftLeg.name = 'leftLeg';
      const rightLeg = new THREE.Mesh(legGeo, legMat);
      rightLeg.position.set(0.15, 0.3, 0);
      rightLeg.name = 'rightLeg';
      group.add(leftLeg, rightLeg);

      // Обувь
      const shoeGeo = new THREE.BoxGeometry(0.25, 0.1, 0.25);
      const shoeMat = new THREE.MeshStandardMaterial({ color: colors.shoes, flatShading: true });
      const leftShoe = new THREE.Mesh(shoeGeo, shoeMat);
      leftShoe.position.set(-0.15, -0.05, 0);
      const rightShoe = new THREE.Mesh(shoeGeo, shoeMat);
      rightShoe.position.set(0.15, -0.05, 0);
      group.add(leftShoe, rightShoe);

      // Ремень
      const beltGeo = new THREE.BoxGeometry(0.6, 0.03, 0.32);
      const beltMat = new THREE.MeshStandardMaterial({ color: 0x333333, flatShading: true });
      const belt = new THREE.Mesh(beltGeo, beltMat);
      belt.position.y = 0.65;
      group.add(belt);

      // Никнейм над головой
      const nickCanvas = document.createElement('canvas');
      nickCanvas.width = 256;
      nickCanvas.height = 64;
      const nickCtx = nickCanvas.getContext('2d');
      nickCtx.fillStyle = 'rgba(255,255,255,0.9)';
      nickCtx.font = 'bold 28px sans-serif';
      nickCtx.textAlign = 'center';
      nickCtx.fillText(data && data.nickname ? data.nickname : '', 128, 40);
      const nickTex = new THREE.CanvasTexture(nickCanvas);
      const nickMat = new THREE.SpriteMaterial({ map: nickTex, transparent: true });
      const nickSprite = new THREE.Sprite(nickMat);
      nickSprite.position.y = 2.3;
      nickSprite.scale.set(2, 0.5, 1);
      group.add(nickSprite);

      group.scale.set(CONFIG.avatar.baseScale / 1.7, CONFIG.avatar.baseScale / 1.7, CONFIG.avatar.baseScale / 1.7);
      return group;
    }

    function sendEmoji(emoji) {
      const pos = playerMesh.position.clone();
      pos.y += 2;
      socket.emit('emoji', { position: { x: pos.x, y: pos.y, z: pos.z }, emoji: emoji });
      spawnEmoji(pos, emoji);
    }

    function spawnEmoji(pos, emoji) {
      const canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');
      ctx.font = '80px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(emoji, 64, 90);
      const tex = new THREE.CanvasTexture(canvas);
      const mat = new THREE.SpriteMaterial({ map: tex, transparent: true });
      const sprite = new THREE.Sprite(mat);
      sprite.position.copy(pos);
      sprite.scale.set(1, 1, 1);
      scene.add(sprite);
      emojis.push({ mesh: sprite, lifeTime: Date.now() + 3000, startY: pos.y });
    }

    function setMoveDir(x, y) {
      moveDir.set(x, y);
    }

    function updateClock() {
      const now = new Date();
      const utc = now.getTime() + now.getTimezoneOffset() * 60000;
      const msk = new Date(utc + 3 * 3600000);
      const hours = msk.getHours().toString().padStart(2, '0');
      const minutes = msk.getMinutes().toString().padStart(2, '0');
      const seconds = msk.getSeconds().toString().padStart(2, '0');
      const text = 'MSK ' + hours + ':' + minutes + ':' + seconds;

      const clockTextMesh = scene.getObjectByName('clockText');
      if (clockTextMesh && clockTextMesh.material && clockTextMesh.material.map) {
        const ctx = clockTextMesh.material.map.image.getContext('2d');
        ctx.fillStyle = 'rgba(0,0,0,0)';
        ctx.fillRect(0, 0, 512, 256);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 80px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(text, 256, 160);
        clockTextMesh.material.map.needsUpdate = true;
      }
    }

    let walkPhase = 0;

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();

      fpsCounter++;
      if (Date.now() - lastTime >= 1000) {
        fpsDisplay.textContent = 'FPS: ' + fpsCounter;
        fpsCounter = 0;
        lastTime = Date.now();
      }

      // Движение
      const speed = 5;
      const moveVector = new THREE.Vector3(moveDir.x, 0, moveDir.y).normalize().multiplyScalar(speed * delta);
      playerMesh.position.add(moveVector);

      // Ограничение по стенам
      playerMesh.position.x = Math.max(-19, Math.min(19, playerMesh.position.x));
      playerMesh.position.z = Math.max(-19, Math.min(19, playerMesh.position.z));

      // Поворот по направлению движения
      if (moveDir.lengthSq() > 0.01) {
        playerMesh.rotation.y = Math.atan2(moveDir.x, moveDir.y);
        walkPhase += delta * 8;
        const swing = Math.sin(walkPhase) * 0.3;
        const leftArm = playerMesh.getObjectByName('leftArm');
        const rightArm = playerMesh.getObjectByName('rightArm');
        const leftLeg = playerMesh.getObjectByName('leftLeg');
        const rightLeg = playerMesh.getObjectByName('rightLeg');
        if (leftArm) leftArm.rotation.x = swing;
        if (rightArm) rightArm.rotation.x = -swing;
        if (leftLeg) leftLeg.rotation.x = -swing;
        if (rightLeg) rightLeg.rotation.x = swing;
      } else {
        walkPhase = 0;
        const leftArm = playerMesh.getObjectByName('leftArm');
        const rightArm = playerMesh.getObjectByName('rightArm');
        const leftLeg = playerMesh.getObjectByName('leftLeg');
        const rightLeg = playerMesh.getObjectByName('rightLeg');
        if (leftArm) leftArm.rotation.x = 0;
        if (rightArm) rightArm.rotation.x = 0;
        if (leftLeg) leftLeg.rotation.x = 0;
        if (rightLeg) rightLeg.rotation.x = 0;
      }

      // Отправка позиции на сервер (throttle)
      if (socket && socket.connected && moveDir.lengthSq() > 0.01) {
        socket.emit('player-move', {
          position: { x: playerMesh.position.x, y: playerMesh.position.y, z: playerMesh.position.z },
          rotation: playerMesh.rotation.y
        });
      }

      // Камера следует за игроком
      camera.position.x = playerMesh.position.x;
      camera.position.z = playerMesh.position.z + 8;
      camera.position.y = 4;
      camera.lookAt(playerMesh.position.x, 1, playerMesh.position.z);

      // Часы
      updateClock();

      // Эмодзи — всплывают и исчезают
      const nowTime = Date.now();
      for (let i = emojis.length - 1; i >= 0; i--) {
        const e = emojis[i];
        e.mesh.position.y += delta * 1.5;
        if (nowTime > e.lifeTime) {
          scene.remove(e.mesh);
          if (e.mesh.material) e.mesh.material.dispose();
          emojis.splice(i, 1);
        }
      }

      renderer.render(scene, camera);
    }

    init();
  </script>
</body>
</html>
