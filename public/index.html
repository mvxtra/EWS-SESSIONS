<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>EWS SESSIONS</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<script src="/socket.io/socket.io.js"></script>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050505;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

#app{
  position:relative;
  width:100vw;
  height:100vh;
}

#canvas3d{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}

/* ================= LOGIN ================= */

#login{
  position:absolute;
  inset:0;
  z-index:1000;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 50% 40%,rgba(255,255,255,.08),transparent 25%),
    radial-gradient(circle at 50% 50%,#171717,#030303 70%);
}

.login-box{
  width:380px;
  padding:42px;
  background:rgba(5,5,5,.88);
  border:1px solid #444;
  box-shadow:
    0 0 80px rgba(255,255,255,.06),
    inset 0 0 40px rgba(255,255,255,.02);
  text-align:center;
}

.login-box h1{
  font-size:31px;
  letter-spacing:8px;
  font-weight:900;
  color:#fff;
  margin-bottom:8px;
}

.login-box p{
  font-size:10px;
  letter-spacing:5px;
  color:#777;
  margin-bottom:30px;
}

.tabs{
  display:flex;
  margin-bottom:20px;
  border:1px solid #333;
}

.tab{
  flex:1;
  padding:11px;
  border:0;
  background:#0c0c0c;
  color:#666;
  cursor:pointer;
  letter-spacing:2px;
}

.tab.active{
  background:#fff;
  color:#000;
}

input{
  width:100%;
  height:45px;
  margin-bottom:12px;
  padding:0 14px;
  border:1px solid #333;
  background:#080808;
  color:#fff;
  outline:none;
}

input:focus{
  border-color:#aaa;
}

.btn{
  width:100%;
  height:45px;
  border:0;
  background:#fff;
  color:#000;
  font-weight:bold;
  letter-spacing:2px;
  cursor:pointer;
}

.btn:hover{
  background:#ddd;
}

.error{
  min-height:20px;
  margin-top:12px;
  color:#ff5555;
  font-size:12px;
}

/* ================= HUD ================= */

#hud{
  position:absolute;
  inset:0;
  z-index:20;
  display:none;
  pointer-events:none;
}

#top-logo{
  position:absolute;
  top:18px;
  left:20px;
  font-size:16px;
  font-weight:900;
  letter-spacing:5px;
  text-shadow:0 0 20px #fff;
}

#top-logo span{
  display:block;
  margin-top:4px;
  font-size:8px;
  letter-spacing:3px;
  color:#777;
}

#online-box{
  position:absolute;
  top:18px;
  right:18px;
  width:190px;
  padding:13px;
  background:rgba(0,0,0,.72);
  border:1px solid #333;
  pointer-events:auto;
}

#online-box h3{
  font-size:10px;
  letter-spacing:3px;
  color:#aaa;
  margin-bottom:9px;
}

#online-list{
  list-style:none;
  max-height:180px;
  overflow:auto;
  color:#ddd;
  font-size:12px;
}

#online-list li{
  padding:4px 0;
  border-bottom:1px solid #161616;
}

#online-list li::before{
  content:"●";
  color:#fff;
  margin-right:7px;
  font-size:8px;
}

/* ================= CHAT ================= */

#chat{
  position:absolute;
  left:18px;
  bottom:18px;
  width:390px;
  height:250px;
  padding:12px;
  display:flex;
  flex-direction:column;
  background:rgba(0,0,0,.75);
  border:1px solid #333;
  pointer-events:auto;
}

#chat-title{
  font-size:9px;
  letter-spacing:3px;
  color:#777;
  margin-bottom:8px;
}

#chat-messages{
  flex:1;
  overflow-y:auto;
  margin-bottom:8px;
}

.msg{
  margin-bottom:7px;
  font-size:12px;
  line-height:1.4;
}

.msg .u{
  color:#fff;
  font-weight:bold;
}

.msg .t{
  color:#aaa;
}

#chat-form{
  display:flex;
  gap:6px;
}

#chat-input{
  flex:1;
  height:35px;
  margin:0;
}

#chat-send{
  width:45px;
  border:0;
  background:#fff;
  color:#000;
  cursor:pointer;
}

/* ================= OTHER ================= */

#hint{
  position:absolute;
  right:18px;
  bottom:18px;
  padding:9px 12px;
  background:rgba(0,0,0,.65);
  border:1px solid #292929;
  color:#777;
  font-size:10px;
  letter-spacing:1px;
}

#stream-indicator{
  position:absolute;
  top:18px;
  left:50%;
  transform:translateX(-50%);
  padding:6px 12px;
  background:rgba(0,0,0,.75);
  border:1px solid #333;
  color:#777;
  font-family:monospace;
  font-size:10px;
  letter-spacing:2px;
}

#stream-indicator.live{
  color:#fff;
  border-color:#aaa;
}

#lang-bar{
  position:absolute;
  right:220px;
  top:18px;
  pointer-events:auto;
}

#lang{
  background:#080808;
  border:1px solid #333;
  color:#aaa;
  padding:7px 10px;
}

#zone-label{
  position:absolute;
  left:50%;
  bottom:90px;
  transform:translateX(-50%);
  font-size:10px;
  letter-spacing:5px;
  color:rgba(255,255,255,.4);
  pointer-events:none;
}

#ssh101-audio-panel{
  position:fixed;
  right:20px;
  bottom:20px;
  width:360px;
  height:235px;
  z-index:50;
  background:#050505;
  border:1px solid rgba(255,255,255,.22);
  box-shadow:0 0 30px rgba(0,0,0,.6);
  font-family:monospace;
}

#ssh101-title{
  height:32px;
  display:flex;
  align-items:center;
  padding:0 10px;
  box-sizing:border-box;
  color:#fff;
  background:#090909;
  border-bottom:1px solid #222;
  font-size:9px;
  letter-spacing:2px;
}

#ssh101-player{
  display:block;
  width:360px;
  height:203px;
  border:0;
  background:#000;
}

#ssh101-help{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:0;
  overflow:hidden;
  pointer-events:none;
}

@media(max-width:600px){
  #ssh101-audio-panel{
    right:10px;
    bottom:10px;
    width:300px;
    height:200px;
  }
  #ssh101-player{
    width:300px;
    height:168px;
  }
}
</style>
</head>

<body>

<div id="app">

<canvas id="canvas3d"></canvas>

<div id="ssh101-audio-panel">
  <div id="ssh101-title">EWS SESSIONS / LIVE AUDIO</div>
  <iframe
    id="ssh101-player"
    src="https://ssh101.com/securelive/index.php?id=ewsessions"
    allow="autoplay; fullscreen; encrypted-media"
    frameborder="0"
    scrolling="no"
    allowfullscreen>
  </iframe>
  <div id="ssh101-help">PRESS PLAY TO START AUDIO</div>
</div>

<!-- LOGIN -->

<div id="login">

  <div class="login-box">

    <h1>EWS</h1>
    <p>SESSIONS / UNDERGROUND CLUB</p>

    <div class="tabs">
      <button class="tab active" onclick="switchTab('login')">
        ВХОД
      </button>

      <button class="tab" onclick="switchTab('register')">
        РЕГИСТРАЦИЯ
      </button>
    </div>

    <input
      id="f-username"
      placeholder="USERNAME"
      autocomplete="username"
    >

    <input
      id="f-password"
      type="password"
      placeholder="PASSWORD"
      autocomplete="current-password"
    >

    <button
      class="btn"
      id="submitBtn"
      onclick="doLogin()"
    >
      ВОЙТИ
    </button>

    <div id="error" class="error"></div>

  </div>

</div>

<!-- HUD -->

<div id="hud">

  <div id="top-logo">
    EWS
    <span>SESSIONS</span>
  </div>

  <div id="stream-indicator">
    AUDIO: CONNECTING
  </div>

  <div id="lang-bar">
    <select id="lang">
      <option value="ru">RU</option>
      <option value="en">EN</option>
      <option value="es">ES</option>
      <option value="de">DE</option>
      <option value="fr">FR</option>
      <option value="zh">中文</option>
      <option value="ja">日本語</option>
      <option value="ko">한국어</option>
      <option value="ar">AR</option>
      <option value="hi">HI</option>
      <option value="pt">PT</option>
      <option value="it">IT</option>
      <option value="tr">TR</option>
      <option value="uk">UA</option>
    </select>
  </div>

  <div id="online-box">
    <h3>ONLINE</h3>
    <ul id="online-list"></ul>
  </div>

  <div id="chat">

    <div id="chat-title">
      EWS SESSIONS / CHAT
    </div>

    <div id="chat-messages"></div>

    <form id="chat-form">

      <input
        id="chat-input"
        autocomplete="off"
        placeholder="write something..."
      >

      <button id="chat-send">
        →
      </button>

    </form>

  </div>

  <div id="zone-label">
    MAIN FLOOR
  </div>

  <div id="hint">
    WASD MOVE · MOUSE LOOK · C CHAT
  </div>

</div>

</div>

<script>

/* =========================================================
   BASIC STATE
========================================================= */

let mode = 'login';
let socket = null;
let currentUser = null;

let scene;
let camera;
let renderer;

let keys = {};

let yaw = 0;
let pitch = 0;
let pointerLocked = false;
let chatMode = false;

let clock = new THREE.Clock();

let neonObjects = [];
let lightObjects = [];
let particles;

let analyser = null;
let freqData = null;

let audioLevel = 0;
let bassLevel = 0;

let screenTexture;
let screenCanvas;
let screenCtx;

let playerBody;


/* =========================================================
   LOGIN
========================================================= */

function switchTab(type){

  mode = type;

  document
    .querySelectorAll('.tab')
    .forEach(t => t.classList.remove('active'));

  if(type === 'login'){

    document
      .querySelectorAll('.tab')[0]
      .classList.add('active');

    document.getElementById('submitBtn')
      .textContent = 'ВОЙТИ';

  }else{

    document
      .querySelectorAll('.tab')[1]
      .classList.add('active');

    document.getElementById('submitBtn')
      .textContent = 'СОЗДАТЬ АККАУНТ';

  }

  document.getElementById('error').textContent = '';
}


async function doLogin(){

  const username =
    document.getElementById('f-username').value.trim();

  const password =
    document.getElementById('f-password').value;

  const error =
    document.getElementById('error');

  error.textContent = '';

  if(!username || !password){

    error.textContent =
      'Введите логин и пароль';

    return;
  }

  try{

    const res = await fetch(
      '/api/' + mode,
      {
        method:'POST',
        headers:{
          'Content-Type':'application/json'
        },
        body:JSON.stringify({
          username,
          password
        })
      }
    );

    const data = await res.json();

    if(data.error){

      error.textContent = data.error;
      return;

    }

    startSession(username);

  }catch(err){

    error.textContent =
      'Ошибка соединения';

  }
}


/* =========================================================
   SESSION
========================================================= */

function startSession(username){

  currentUser = username;

  document.getElementById('login')
    .style.display = 'none';

  document.getElementById('hud')
    .style.display = 'block';

  init3D();

  socket = io();

  socket.emit('join',username);

  socket.on('online',list=>{

    const ul =
      document.getElementById('online-list');

    ul.innerHTML = '';

    list.forEach(name=>{

      const li =
        document.createElement('li');

      li.textContent = name;

      ul.appendChild(li);

    });

  });


  socket.on('msg',message=>{

    const el =
      document.createElement('div');

    el.className = 'msg';

    const time =
      new Date(message.ts)
        .toLocaleTimeString();

    const user =
      document.createElement('span');

    user.className = 'u';

    user.textContent = message.user;

    const text =
      document.createElement('span');

    text.className = 't';

    text.textContent =
      ' ' + message.text;

    el.appendChild(user);

    el.appendChild(
      document.createTextNode(
        ' ' + time + ' '
      )
    );

    el.appendChild(text);

    document
      .getElementById('chat-messages')
      .appendChild(el);

    const box =
      document.getElementById('chat-messages');

    box.scrollTop = box.scrollHeight;

  });

}


/* =========================================================
   CHAT
========================================================= */

document
  .getElementById('chat-form')
  .addEventListener('submit',function(e){

    e.preventDefault();

    if(!socket) return;

    const input =
      document.getElementById('chat-input');

    const text =
      input.value.trim();

    if(!text) return;

    socket.emit('msg',{
      user:currentUser,
      text:text,
      lang:
        document.getElementById('lang').value
    });

    input.value='';

  });


/* =========================================================
   THREE.JS
========================================================= */

function init3D(){

  scene =
    new THREE.Scene();

  scene.background =
    new THREE.Color(0x030303);

  scene.fog =
    new THREE.FogExp2(
      0x030303,
      0.035
    );


  camera =
    new THREE.PerspectiveCamera(
      72,
      innerWidth / innerHeight,
      0.1,
      150
    );

  camera.position.set(
    0,
    1.7,
    13
  );


  renderer =
    new THREE.WebGLRenderer({
      canvas:
        document.getElementById('canvas3d'),

      antialias:true
    });

  renderer.setSize(
    innerWidth,
    innerHeight
  );

  renderer.setPixelRatio(
    Math.min(devicePixelRatio,2)
  );

  renderer.shadowMap.enabled = true;

  renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;


/* =========================================================
   LIGHTING
========================================================= */

  const ambient =
    new THREE.AmbientLight(
      0xffffff,
      0.13
    );

  scene.add(ambient);


  const ceilingLight =
    new THREE.PointLight(
      0xffffff,
      1.4,
      40
    );

  ceilingLight.position.set(
    0,
    5.5,
    -5
  );

  scene.add(ceilingLight);

  lightObjects.push(
    ceilingLight
  );


  createLight(
    -7,
    3,
    -7,
    0xffffff,
    5,
    16
  );

  createLight(
    7,
    3,
    -7,
    0xffffff,
    5,
    16
  );

  createLight(
    -8,
    2,
    5,
    0x888888,
    2,
    14
  );

  createLight(
    8,
    2,
    5,
    0x888888,
    2,
    14
  );


/* =========================================================
   CLUB ARCHITECTURE
========================================================= */

  createFloor();

  createCeiling();

  createWalls();

  createDanceFloor();

  createMainScreen();

  createStage();

  createBar();

  createLounge();

  createColumns();

  createEntrance();

  createNeonArchitecture();

  createCeilingBeams();

  createSpeakers();

  createParticles();

  createPlayer();


/* =========================================================
   AUDIO
========================================================= */

  setupAudio();


/* =========================================================
   CONTROLS
========================================================= */

  setupControls();


/* =========================================================
   LOOP
========================================================= */

  animate();

}


/* =========================================================
   HELPERS
========================================================= */

function createBox(
  w,h,d,
  x,y,z,
  material,
  cast=true,
  receive=true
){

  const mesh =
    new THREE.Mesh(
      new THREE.BoxGeometry(w,h,d),
      material
    );

  mesh.position.set(x,y,z);

  mesh.castShadow = cast;
  mesh.receiveShadow = receive;

  scene.add(mesh);

  return mesh;

}


function createLight(
  x,y,z,
  color,
  intensity,
  distance
){

  const light =
    new THREE.PointLight(
      color,
      intensity,
      distance
    );

  light.position.set(x,y,z);

  light.castShadow = true;

  scene.add(light);

  lightObjects.push(light);

  return light;

}


/* =========================================================
   FLOOR
========================================================= */

function createFloor(){

  const mat =
    new THREE.MeshStandardMaterial({
      color:0x080808,
      metalness:.75,
      roughness:.28
    });

  const floor =
    new THREE.Mesh(
      new THREE.PlaneGeometry(
        36,
        42
      ),
      mat
    );

  floor.rotation.x =
    -Math.PI/2;

  floor.receiveShadow = true;

  scene.add(floor);


  const grid =
    new THREE.GridHelper(
      36,
      36,
      0x444444,
      0x111111
    );

  grid.position.y=.012;

  scene.add(grid);

}


/* =========================================================
   CEILING
========================================================= */

function createCeiling(){

  const ceiling =
    new THREE.Mesh(
      new THREE.PlaneGeometry(
        36,
        42
      ),
      new THREE.MeshStandardMaterial({
        color:0x050505,
        roughness:1
      })
    );

  ceiling.rotation.x =
    Math.PI/2;

  ceiling.position.y=6;

  scene.add(ceiling);

}


/* =========================================================
   WALLS
========================================================= */

function createWalls(){

  const mat =
    new THREE.MeshStandardMaterial({
      color:0x0b0b0b,
      roughness:.9
    });


  createBox(
    36,6,.5,
    0,3,-17,
    mat
  );

  createBox(
    36,6,.5,
    0,3,17,
    mat
  );

  createBox(
    .5,6,34,
    -18,3,0,
    mat
  );

  createBox(
    .5,6,34,
    18,3,0,
    mat
  );

}


/* =========================================================
   DANCE FLOOR
========================================================= */

function createDanceFloor(){

  const floor =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        14,
        .12,
        14
      ),
      new THREE.MeshStandardMaterial({
        color:0x111111,
        metalness:.9,
        roughness:.15
      })
    );

  floor.position.set(
    0,
    .08,
    -1
  );

  floor.receiveShadow=true;

  scene.add(floor);


  const frameMat =
    new THREE.MeshBasicMaterial({
      color:0xffffff
    });


  const lines=[
    [-7,.16,-1,14,.04,.04],
    [7,.16,-1,14,.04,.04],
    [0,.16,-8,.04,.04,14],
    [0,.16,6,.04,.04,14]
  ];


  lines.forEach(l=>{

    const mesh =
      createBox(
        l[3],
        l[4],
        l[5],
        l[0],
        l[1],
        l[2],
        frameMat,
        false,
        false
      );

    neonObjects.push(mesh);

  });

}


/* =========================================================
   MAIN SCREEN
========================================================= */

function createMainScreen(){

  screenCanvas =
    document.createElement('canvas');

  screenCanvas.width=1024;
  screenCanvas.height=512;

  screenCtx =
    screenCanvas.getContext('2d');

  screenTexture =
    new THREE.CanvasTexture(
      screenCanvas
    );


  const frame =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        16,
        7,
        .35
      ),
      new THREE.MeshStandardMaterial({
        color:0x151515,
        metalness:.7,
        roughness:.3
      })
    );

  frame.position.set(
    0,
    3.6,
    -16.5
  );

  scene.add(frame);


  const screen =
    new THREE.Mesh(
      new THREE.PlaneGeometry(
        15.5,
        6.5
      ),
      new THREE.MeshBasicMaterial({
        map:screenTexture
      })
    );

  screen.position.set(
    0,
    3.6,
    -16.28
  );

  scene.add(screen);

}


/* =========================================================
   STAGE
========================================================= */

function createStage(){

  const stageMat =
    new THREE.MeshStandardMaterial({
      color:0x111111,
      metalness:.6,
      roughness:.35
    });


  createBox(
    17,
    .45,
    3,
    0,
    .3,
    -12.5,
    stageMat
  );


  const stripMat =
    new THREE.MeshBasicMaterial({
      color:0xffffff
    });


  const strip =
    createBox(
      16,
      .04,
      .08,
      0,
      .54,
      -11,
      stripMat,
      false,
      false
    );

  neonObjects.push(strip);

}


/* =========================================================
   BAR
========================================================= */

function createBar(){

  const wood =
    new THREE.MeshStandardMaterial({
      color:0x141414,
      metalness:.3,
      roughness:.55
    });


  createBox(
    8,
    1.1,
    2,
    -12,
    .65,
    7,
    wood
  );


  createBox(
    8.5,
    .15,
    2.3,
    -12,
    1.25,
    7,
    new THREE.MeshStandardMaterial({
      color:0xdddddd,
      metalness:.7,
      roughness:.25
    })
  );


  for(let i=0;i<5;i++){

    const bottle =
      new THREE.Mesh(
        new THREE.CylinderGeometry(
          .07,
          .09,
          .65,
          12
        ),
        new THREE.MeshStandardMaterial({
          color:0x888888,
          metalness:.6,
          roughness:.25
        })
      );

    bottle.position.set(
      -15+i*.8,
      1.7,
      6.5
    );

    scene.add(bottle);

  }

}


/* =========================================================
   LOUNGE
========================================================= */

function createLounge(){

  const sofaMat =
    new THREE.MeshStandardMaterial({
      color:0x181818,
      roughness:.9
    });


  createBox(
    6,
    .8,
    1.6,
    11,
    .7,
    8,
    sofaMat
  );


  createBox(
    1.6,
    1.4,
    5.5,
    14,
    1.2,
    8,
    sofaMat
  );


  for(let i=0;i<3;i++){

    const table =
      new THREE.Mesh(
        new THREE.CylinderGeometry(
          .65,
          .65,
          .08,

}

/* =========================================================
   NEON ARCHITECTURE
========================================================= */

function createNeonArchitecture(){

  const mat =
    new THREE.MeshBasicMaterial({
      color:0xffffff
    });


  for(let z=-14;z<=14;z+=4){

    const left =
      createBox(
        .06,
        4,
        .06,
        -17.5,
        3,
        z,
        mat,
        false,
        false
      );

    const right =
      createBox(
        .06,
        4,
        .06,
        17.5,
        3,
        z,
        mat,
        false,
        false
      );

    neonObjects.push(
      left,
      right
    );

  }


  for(let z=-15;z<=15;z+=5){

    const beam =
      createBox(
        34,
        .05,
        .05,
        0,
        5.4,
        z,
        mat,
        false,
        false
      );

    neonObjects.push(beam);

  }

}

/* =========================================================
   PARTICLES / ATMOSPHERE
========================================================= */

function createParticles(){

  const count=900;

  const geo =
    new THREE.BufferGeometry();

  const pos =
    new Float32Array(
      count*3
    );


  for(let i=0;i<count;i++){

    pos[i*3] =
      (Math.random()-.5)*34;

    pos[i*3+1] =
      Math.random()*5.8;

    pos[i*3+2] =
      (Math.random()-.5)*34;

  }


  geo.setAttribute(
    'position',
    new THREE.BufferAttribute(
      pos,
      3
    )
  );


  particles =
    new THREE.Points(
      geo,
      new THREE.PointsMaterial({
        color:0xffffff,
        size:.025,
        transparent:true,
        opacity:.18
      })
    );


  scene.add(particles);

}

/* =========================================================
   AUDIO
========================================================= */

function setupAudio(){

  const indicator =
    document.getElementById(
      'stream-indicator'
    );

  const player =
    document.getElementById(
      'ssh101-player'
    );

  if(!player){
    indicator.textContent =
      'AUDIO: OFFLINE';
    return;
  }

  indicator.textContent =
    'AUDIO: CLICK PLAY';

  player.addEventListener('load',function(){
    indicator.textContent =
      'AUDIO: READY — PRESS PLAY';
  });

}



/* =========================================================
   CONTROLS
========================================================= */

function setupControls(){

  window.addEventListener(
    'resize',
    function(){

      camera.aspect =
        innerWidth/innerHeight;

      camera.updateProjectionMatrix();

      renderer.setSize(
        innerWidth,
        innerHeight
      );

    }
  );


  window.addEventListener(
    'keydown',
    function(e){

      keys[e.code]=true;


      if(e.code==='KeyC'){

        chatMode=!chatMode;

        toggleChat();

      }

    }
  );


  window.addEventListener(
    'keyup',
    function(e){

      keys[e.code]=false;

    }
  );


  const canvas =
    document.getElementById(
      'canvas3d'
    );


  canvas.addEventListener(
    'click',
    function(){

      if(!chatMode){

        canvas.requestPointerLock();

      }

    }
  );


  document.addEventListener(
    'pointerlockchange',
    function(){

      pointerLocked =
        document.pointerLockElement===canvas;

    }
  );


  document.addEventListener(
    'mousemove',
    function(e){

      if(!pointerLocked)return;

      yaw -=
        e.movementX*.002;

      pitch -=
        e.movementY*.002;


      pitch =
        Math.max(
          -1.45,
          Math.min(
            1.45,
            pitch
          )
        );

    }
  );

}


function toggleChat(){

  const input =
    document.getElementById(
      'chat-input'
    );


  if(chatMode){

    document.exitPointerLock();

    input.focus();

  }else{

    input.blur();

  }

}


/* =========================================================
   ANIMATION
========================================================= */

function animate(){

  requestAnimationFrame(
    animate
  );


  if(!scene)return;


  const dt =
    Math.min(
      clock.getDelta(),
      .05
    );


  const time =
    performance.now()/1000;


  /* AUDIO */

  let bass=.2;
  let level=.2;


  if(analyser && freqData){

    analyser.getByteFrequencyData(
      freqData
    );


    let b=0;

    for(let i=0;i<10;i++){

      b+=freqData[i];

    }

    bass =
      b/(10*255);


    let total=0;

    for(let i=0;i<freqData.length;i++){

      total+=freqData[i];

    }

    level =
      total/
      (freqData.length*255);

  }else{

    bass =
      .25+
      Math.sin(time*3)*.12;

    level =
      .25+
      Math.sin(time*1.5)*.08;

  }


  bassLevel =
    bassLevel*.82+
    bass*.18;

  audioLevel =
    audioLevel*.88+
    level*.12;


  /* MOVEMENT */

  const speed =
    chatMode ? 0 : 5*dt;


  let forward=0;
  let side=0;


  if(keys['KeyW']) forward+=1;
  if(keys['KeyS']) forward-=1;
  if(keys['KeyA']) side-=1;
  if(keys['KeyD']) side+=1;


  if(pointerLocked && !chatMode){

    const fx =
      -Math.sin(yaw);

    const fz =
      -Math.cos(yaw);

    const rx =
      Math.cos(yaw);

    const rz =
      -Math.sin(yaw);


    camera.position.x +=
      (fx*forward+
       rx*side)*speed;


    camera.position.z +=
      (fz*forward+
       rz*side)*speed;

  }


  camera.position.x =
    THREE.MathUtils.clamp(
      camera.position.x,
      -16,
      16
    );


  camera.position.z =
    THREE.MathUtils.clamp(
      camera.position.z,
      -15.5,
      15.5
    );


  camera.position.y=1.7;


  camera.rotation.order='YXZ';

  camera.rotation.y=yaw;

  camera.rotation.x=pitch;


  /* PLAYER BODY */

  if(playerBody){

    playerBody.position.x =
      camera.position.x;

    playerBody.position.z =
      camera.position.z;

    playerBody.visible=false;

  }


  /* PARTICLES */

  if(particles){

    particles.rotation.y +=
      .00015;


    particles.material.opacity =
      .12+
      audioLevel*.2;

  }


  /* NEON PULSE */

  neonObjects.forEach(
    (obj,index)=>{

      const pulse =
        .5+
        Math.sin(
          time*3+
          index*.4
        )*.25+
        bassLevel*.7;

      const value =
        Math.min(
          1,
          pulse
        );

      obj.material.color.setRGB(
        value,
        value,
        value
      );

    }
  );


  /* LIGHT PULSE */

  lightObjects.forEach(
    (light,index)=>{

      light.intensity =
        1+
        bassLevel*
        2+
        Math.sin(
          time*2+
          index
        )*.15;

    }
  );


  /* SCREEN */

  if(screenCtx){

    screenCtx.fillStyle='#050505';

    screenCtx.fillRect(
      0,
      0,
      1024,
      512
    );


    const grd =
      screenCtx.createLinearGradient(
        0,
        0,
        1024,
        0
      );

    const intensity =
      40+
      Math.floor(
        bassLevel*120
      );


    grd.addColorStop(
      0,
      `rgb(${intensity},${intensity},${intensity})`
    );

    grd.addColorStop(
      .5,
      '#050505'
    );

    grd.addColorStop(
      1,
      `rgb(${intensity},${intensity},${intensity})`
    );


    screenCtx.fillStyle=grd;

    screenCtx.fillRect(
      0,
      0,
      1024,
      512
    );


    screenCtx.fillStyle='#fff';

    screenCtx.font=
      'bold 80px Arial';

    screenCtx.textAlign='center';

    screenCtx.fillText(
      'EWS SESSIONS',
      512,
      200
    );


    screenCtx.font=
      '22px Arial';

    screenCtx.fillStyle='#777';

    screenCtx.fillText(
      'UNDERGROUND CLUB',
      512,
      245
    );


    const bars=48;

    const bw=
      800/bars;


    for(let i=0;i<bars;i++){

      let value;

      if(freqData){

        value =
          freqData[
            Math.floor(
              i*freqData.length/bars
            )
          ]/255;

      }else{

        value =
          .2+
          Math.sin(
            time*4+i*.5
          )*.15;

      }


      const h =
        value*180;


      screenCtx.fillStyle='#fff';

      screenCtx.fillRect(
        112+i*bw,
        450-h,
        bw-3,
        h
      );

    }


    screenTexture.needsUpdate=true;

  }


  renderer.render(
    scene,
    camera
  );

}

</script>
