<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EWS SESSIONS — Underground Club</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
:root{
  --ui-bg:rgba(5,5,6,.82);
  --ui-border:rgba(255,255,255,.14);
  --ui-text:#fff;
  --ui-muted:rgba(255,255,255,.55);
}

*{box-sizing:border-box}

html,body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  background:#050505;
  color:var(--ui-text);
  font-family:Arial,Helvetica,sans-serif;
}

button,input,select{font:inherit}

button{cursor:pointer}

#app{
  position:relative;
  width:100vw;
  height:100vh;
  background:#040404;
}

#canvas3d{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}

#css3d-layer{
  position:absolute;
  inset:0;
  z-index:30;
  pointer-events:none;
  overflow:hidden;
}

#club-screen{
  position:absolute;
  width:1400px;
  height:600px;
  left:0;
  top:0;
  display:block;
  visibility:hidden;
  opacity:0;
  overflow:hidden;
  background:#000;
  border:5px solid #111;
  box-shadow:0 0 55px rgba(0,0,0,.95);
  pointer-events:auto;
  transition:opacity .12s ease;
}

#club-screen.active{
  visibility:visible;
  opacity:1;
}

#club-screen iframe{
  width:100%;
  height:100%;
  border:0;
  display:block;
  background:#000;
}

#screen-sound-hint{
  position:absolute;
  left:50%;
  bottom:14px;
  transform:translateX(-50%);
  padding:8px 12px;
  color:#fff;
  background:rgba(0,0,0,.74);
  border:1px solid rgba(255,255,255,.34);
  font:10px/1 monospace;
  letter-spacing:2px;
  pointer-events:none;
  white-space:nowrap;
}

#screen-sound-hint.hidden{display:none}

#brand{
  position:absolute;
  left:24px;
  top:20px;
  z-index:60;
  font-weight:900;
  font-size:26px;
  letter-spacing:8px;
  text-shadow:0 0 18px rgba(255,255,255,.12);
  pointer-events:none;
}

#connection{
  position:absolute;
  left:26px;
  top:56px;
  z-index:60;
  font-size:10px;
  letter-spacing:2px;
  color:var(--ui-muted);
  pointer-events:none;
}

.ui-panel{
  position:absolute;
  z-index:70;
  background:var(--ui-bg);
  border:1px solid var(--ui-border);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  box-shadow:0 14px 40px rgba(0,0,0,.24);
}

#online-panel{
  top:20px;
  right:20px;
  width:205px;
  padding:12px;
}

.panel-kicker{
  margin-bottom:8px;
  font-size:9px;
  letter-spacing:2.4px;
  color:var(--ui-muted);
}

#online-list{
  margin:0;
  padding:0;
  list-style:none;
  max-height:190px;
  overflow:auto;
}

#online-list li{
  padding:5px 0;
  border-bottom:1px solid rgba(255,255,255,.07);
  font-size:12px;
}

#chat-panel{
  left:20px;
  bottom:20px;
  width:390px;
  padding:10px;
}

#chat-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-bottom:8px;
}

#chat-title{
  font-size:9px;
  letter-spacing:2.4px;
  color:var(--ui-muted);
}

#chat-language{
  width:128px;
  padding:5px 7px;
  color:#fff;
  background:#080808;
  border:1px solid #444;
  outline:none;
  font-size:10px;
}

#chat-log{
  height:160px;
  overflow:auto;
  padding-right:3px;
  scrollbar-width:thin;
}

.chat-line{
  margin:0 0 8px;
  font-size:12px;
  line-height:1.45;
}

.chat-user{
  margin-right:5px;
  font-weight:800;
}

.chat-body{opacity:.92}

.chat-compose{
  display:flex;
  gap:6px;
  margin-top:8px;
}

#chat-input{
  flex:1;
  min-width:0;
  padding:9px;
  color:#fff;
  background:#070707;
  border:1px solid #444;
  outline:none;
}

#chat-send{
  width:66px;
  border:0;
  background:#fff;
  color:#000;
  font-weight:700;
  font-size:11px;
}

#screen-panel{
  top:20px;
  left:50%;
  transform:translateX(-50%);
  width:370px;
  padding:12px;
  display:none;
}

#screen-panel.active{display:block}

#screen-url{
  width:100%;
  padding:9px;
  color:#fff;
  background:#070707;
  border:1px solid #444;
  outline:none;
}

.screen-actions{
  display:flex;
  gap:6px;
  margin-top:7px;
}

.screen-actions button{
  flex:1;
  padding:8px;
  border:0;
  font-size:10px;
  letter-spacing:1px;
}

#screen-load{
  color:#000;
  background:#fff;
}

#screen-clear{
  color:#fff;
  background:#222;
  border:1px solid #555!important;
}

#help{
  position:absolute;
  left:50%;
  bottom:20px;
  transform:translateX(-50%);
  z-index:55;
  color:rgba(255,255,255,.42);
  font:10px monospace;
  letter-spacing:1.6px;
  pointer-events:none;
}

#auth{
  position:absolute;
  inset:0;
  z-index:200;
  display:grid;
  place-items:center;
  background:
    radial-gradient(circle at 50% 38%,#1b1b1b 0,#090909 42%,#000 100%);
}

#auth.hidden{display:none}

.auth-card{
  width:min(410px,calc(100vw - 36px));
  padding:34px;
  background:rgba(0,0,0,.8);
  border:1px solid rgba(255,255,255,.2);
  box-shadow:0 28px 90px rgba(0,0,0,.6);
}

.auth-brand{
  text-align:center;
  font-size:36px;
  font-weight:900;
  letter-spacing:10px;
}

.auth-sub{
  margin-top:5px;
  margin-bottom:24px;
  text-align:center;
  font-size:9px;
  letter-spacing:3px;
  color:rgba(255,255,255,.46);
}

.auth-card input,
#auth-language{
  width:100%;
  margin-bottom:9px;
  padding:11px;
  color:#fff;
  background:#080808;
  border:1px solid #444;
  outline:none;
}

.auth-actions{
  display:flex;
  gap:8px;
}

.auth-actions button{
  flex:1;
  padding:10px;
  border:0;
}

#enter-button{
  background:#fff;
  color:#000;
}

#register-button{
  background:#242424;
  color:#fff;
  border:1px solid #555!important;
}

#auth-message{
  min-height:18px;
  margin-top:10px;
  text-align:center;
  font-size:11px;
  color:rgba(255,255,255,.65);
}

@media(max-width:700px){
  #brand{left:16px;top:14px}
  #connection{left:18px;top:49px}
  #online-panel{right:12px;top:12px;width:155px}
  #chat-panel{left:12px;bottom:12px;width:calc(100vw - 24px)}
  #screen-panel{top:12px;width:min(370px,calc(100vw - 24px))}
  #help{display:none}
  #club-screen{width:1000px;height:430px}
}

<body>
<div id="app">

<canvas id="canvas3d"></canvas>

<div id="css3d-layer">
  <div id="club-screen">
    <iframe
      id="screen-frame"
      allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
      allowfullscreen
    ></iframe>
    <div id="screen-sound-hint">CLICK SCREEN FOR SOUND</div>
  </div>
</div>

<div id="brand">EWS</div>
<div id="connection">SESSIONS / OFFLINE</div>

<section id="online-panel" class="ui-panel">
  <div class="panel-kicker">ONLINE</div>
  <ul id="online-list"></ul>
</section>

<section id="screen-panel" class="ui-panel">
  <div class="panel-kicker">CLUB SCREEN / MVXTRA ONLY</div>
  <input id="screen-url" placeholder="YouTube / Twitch / https://">
  <div class="screen-actions">
    <button id="screen-load" type="button">LOAD</button>
    <button id="screen-clear" type="button">CLEAR</button>
  </div>

<section id="chat-panel" class="ui-panel">
  <div id="chat-top">
    <div id="chat-title">CHAT</div>
    <select id="chat-language" aria-label="Chat language">
      <option value="en">EN</option>
      <option value="ru">RU</option>
      <option value="nl">NL</option>
      <option value="de">DE</option>
      <option value="es">ES</option>
      <option value="fr">FR</option>
      <option value="it">IT</option>
      <option value="pt">PT</option>
      <option value="pl">PL</option>
      <option value="uk">UK</option>
      <option value="tr">TR</option>
      <option value="zh">ZH</option>
      <option value="ja">JA</option>
      <option value="ko">KO</option>
      <option value="ar">AR</option>
      <option value="hi">HI</option>
    </select>
  </div>

  <div id="chat-log"></div>

  <form id="chat-form" class="chat-compose">
    <input id="chat-input" maxlength="240" autocomplete="off" placeholder="say something...">

    <div class="auth-brand">EWS</div>
    <div class="auth-sub">SESSIONS / UNDERGROUND CLUB</div>

    <input id="auth-password" type="password" autocomplete="current-password" maxlength="128" placeholder="password">

    <select id="auth-language">
      <option value="en">ENGLISH</option>
      <option value="ru">РУССКИЙ</option>
      <option value="nl">NEDERLANDS</option>
      <option value="de">DEUTSCH</option>
      <option value="es">ESPAÑOL</option>
      <option value="fr">FRANÇAIS</option>
    </select>

    <div class="auth-actions">
      <button id="enter-button" type="button">ENTER</button>
      <button id="register-button" type="button">REGISTER</button>
    </div>

    <div id="auth-message"></div>
  </div>
</div>

<script>
'use strict';

const $ = id => document.getElementById(id);

let currentUser = '';
let socket = null;

let scene = null;
let camera = null;
let renderer = null;

let cssScene = null;
let cssRenderer = null;
let cssScreenObject = null;

let screenAnchor = null;
let screenFrameMesh = null;

let clock = new THREE.Clock();
let remotePlayers = new Map();

let playerX = 0;
let playerY = 0;
let playerZ = 10;

let yaw = 0;
let pitch = 0;

let verticalVelocity = 0;
let grounded = true;

let lastStateSent = 0;
let lastScreenVersion = 0;
let lastScreenSrc = '';

let screenSyncTimer = null;

let chatLanguage = localStorage.getItem('ews-chat-language') || 'en';
let chatMessages = [];
let chatTranslationCache = new Map();
let chatRenderToken = 0;

let dustField = null;
let smokePuffs = [];
let floorMist = null;

let moverLights = [];
let moverBeams = [];
let floorLights = [];
let strobes = [];
let lasers = [];

const keys = Object.create(null);

const WORLD = {
  minX:-16,
  maxX:16,
  minZ:-14,
  maxZ:14,
  floorY:0,
  eyeY:2.05
};

const EMOTE_KEYS = {
  Digit1:1,
  Digit2:2,
  Digit3:3,
  Digit4:4,
  Digit5:5,
  Digit6:6
};

function isHost(){
  return currentUser.trim().toLowerCase() === 'mvxtra';
}

function setConnection(text){
  $('connection').textContent='SESSIONS / '+text;
}

function showAuthMessage(text){
  $('auth-message').textContent=String(text||'');
}

async function auth(path){
  const username=$('auth-username').value.trim();
  const password=$('auth-password').value;

  if(!username || !password){
    showAuthMessage('ENTER USERNAME AND PASSWORD');
    return;
  }

  try{
    const response=await fetch(path,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({username,password})
    });

    const data=await response.json();

    if(!response.ok || !data.ok){
      showAuthMessage(data.error||'AUTH ERROR');
      return;
    }

    currentUser=data.username;
    localStorage.setItem('ews-username',currentUser);

    $('auth').classList.add('hidden');

    chatLanguage=
      localStorage.getItem('ews-chat-language') ||
      $('auth-language').value ||
      'en';

    if(!Array.from($('chat-language').options).some(o=>o.value===chatLanguage)){
      chatLanguage='en';
    }

    $('chat-language').value=chatLanguage;
    $('screen-panel').classList.toggle('active',isHost());

    init3D();
    connectSocket();
  }catch(error){
    showAuthMessage('SERVER CONNECTION ERROR');
  }
}

$('enter-button').addEventListener('click',()=>auth('/api/login'));
$('register-button').addEventListener('click',()=>auth('/api/register'));

$('auth-password').addEventListener('keydown',event=>{
  if(event.key==='Enter'){
    auth('/api/login');
  }
});

function connectSocket(){
  if(socket){
    try{socket.disconnect();}catch(error){}
  }

  socket=io({
    transports:['websocket','polling'],
    reconnection:true,
    reconnectionAttempts:Infinity,
    reconnectionDelay:500,
    reconnectionDelayMax:3000
  });

  socket.on('connect',()=>{
    setConnection('ONLINE');

    socket.emit('join',{
      username:currentUser,
      language:$('auth-language').value
    });

    setTimeout(requestWorldAndScreen,250);
    setTimeout(requestWorldAndScreen,1200);

    if(screenSyncTimer){
      clearInterval(screenSyncTimer);
    }

    screenSyncTimer=setInterval(requestWorldAndScreen,3000);
  });

  socket.on('disconnect',()=>{
    setConnection('RECONNECTING');

    if(screenSyncTimer){
      clearInterval(screenSyncTimer);
      screenSyncTimer=null;
    }

    $('online-list').innerHTML='';

    remotePlayers.forEach(player=>{
      if(player.group) scene.remove(player.group);
    });

    remotePlayers.clear();
  });

  socket.on('club:ready',data=>{
    if(data && data.screen){
      applyScreen(data.screen);
    }
  });

  socket.on('world:state',world=>{
    if(!world) return;

    const alive=new Set();

    if(Array.isArray(world.players)){
      world.players.forEach(data=>{
        if(!data || data.id===socket.id) return;
        alive.add(data.id);
        updateRemotePlayer(data);
      });
    }

    remotePlayers.forEach((player,id)=>{
      if(!alive.has(id)){
        removeRemotePlayer(id);
      }
    });

    if(world.screen){
      applyScreen(world.screen);
    }
  });

  socket.on('online:state',list=>{
    const users=Array.isArray(list)?list:[];

    $('online-list').innerHTML='';

    users.forEach(item=>{
      const name=String(item && item.username || '');
      if(!name) return;

      const li=document.createElement('li');
      li.textContent=
        name+
        (name.toLowerCase()===currentUser.toLowerCase()?' (YOU)':'');

      $('online-list').appendChild(li);
    });
  });

  socket.on('player:joined',data=>{
    if(data && data.id && data.id!==socket.id){
      updateRemotePlayer(data);
    }
  });

  socket.on('player:state',data=>{
    if(data && data.id && data.id!==socket.id){
      updateRemotePlayer(data);
    }
  });

  socket.on('player:left',id=>{
    removeRemotePlayer(id);
  });

  socket.on('screen:state',state=>{
    applyScreen(state);
  });

  socket.on('chat:message',message=>{
    addChatMessage(
      message.user,
      message.text,
      Number(message.ts)||Date.now()
    );
  });
}

function requestWorldAndScreen(){
  if(!socket || !socket.connected) return;

  socket.emit('world:request');
  socket.emit('screen:request');
}

function normalizeScreenUrl(value){
  const raw=String(value||'').trim();
  if(!raw) return null;

  try{
    const url=new URL(raw);

    const host=url.hostname.toLowerCase();

    if(host==='youtu.be'){
      const id=url.pathname.split('/').filter(Boolean)[0];

      if(!id) return null;

      return {
        src:
          'https://www.youtube.com/embed/'+
          encodeURIComponent(id)+
          '?autoplay=1&rel=0&playsinline=1',
        name:'YOUTUBE'
      };
    }

    if(host==='youtube.com' || host==='www.youtube.com'){
      let id=url.searchParams.get('v');

      if(!id && url.pathname.startsWith('/shorts/')){
        id=url.pathname.split('/')[2];
      }

      if(!id && url.pathname.startsWith('/embed/')){
        id=url.pathname.split('/')[2];
      }

      if(!id && url.pathname.startsWith('/live/')){
        id=url.pathname.split('/')[2];
      }

      if(!id) return null;

      return {
        src:
          'https://www.youtube.com/embed/'+
          encodeURIComponent(id)+
          '?autoplay=1&rel=0&playsinline=1',
        name:'YOUTUBE'
      };
    }

    if(
      host==='twitch.tv' ||
      host==='www.twitch.tv' ||
      host.endsWith('.twitch.tv')
    ){
      const parts=url.pathname.split('/').filter(Boolean);

      if(!parts.length) return null;

      const parent=encodeURIComponent(location.hostname);

      if(parts[0]==='videos' && parts[1]){
        return {
          src:
            'https://player.twitch.tv/?video='+
            encodeURIComponent(parts[1])+
            '&parent='+parent+
            '&autoplay=true',
          name:'TWITCH'
        };
      }

      return {
        src:
          'https://player.twitch.tv/?channel='+
          encodeURIComponent(parts[0])+
          '&parent='+parent+
          '&autoplay=true',
        name:'TWITCH'
      };
    }

    if(url.protocol!=='https:') return null;

    return {
      src:url.href,
      name:'HTTPS'
    };
  }catch(error){
    return null;
  }
}

function applyScreen(state){
  state=state||{};

  const version=Number(state.version)||0;

  if(
    version &&
    version<lastScreenVersion
  ){
    return;
  }

  if(version){
    lastScreenVersion=version;
  }

  const panel=$('club-screen');
  const frame=$('screen-frame');
  const hint=$('screen-sound-hint');

  if(
    state.active!==true ||
    !state.src
  ){
    panel.classList.remove('active');
    hint.classList.add('hidden');

    frame.src='about:blank';
    lastScreenSrc='';
    return;
  }

  const original=String(state.url||'').trim();

  const normalized=
    original
      ? normalizeScreenUrl(original)
      : null;

  const src=
    normalized
      ? normalized.src
      : String(state.src||'').trim();

  if(!src) return;

  if(src!==lastScreenSrc){
    frame.src=src;
    lastScreenSrc=src;
  }

  panel.classList.add('active');
  hint.classList.toggle('hidden',isHost());

  if(cssScreenObject){
    cssScreenObject.element.style.display='block';
  }
}

$('screen-load').addEventListener('click',()=>{
  if(!isHost() || !socket || !socket.connected) return;

  const normalized=normalizeScreenUrl($('screen-url').value);

  if(!normalized) return;

  socket.emit('screen:set',{
    active:true,
    src:normalized.src,
    url:$('screen-url').value.trim(),
    name:normalized.name
  });
});

$('screen-clear').addEventListener('click',()=>{
  if(!isHost() || !socket || !socket.connected) return;

  socket.emit('screen:set',{
    active:false
  });
});

function createProceduralTexture(type){
  const canvas=document.createElement('canvas');
  canvas.width=512;
  canvas.height=512;

  const ctx=canvas.getContext('2d');

  ctx.fillStyle=
    type==='floor'
      ? '#0b0b0b'
      : '#151515';

  ctx.fillRect(0,0,512,512);

  for(let i=0;i<7000;i++){
    const v=Math.random()*255;
    const alpha=.015+Math.random()*.055;

    ctx.fillStyle=
      'rgba('+v+','+v+','+v+','+alpha+')';

    ctx.fillRect(
      Math.random()*512,
      Math.random()*512,
      type==='floor'?2+Math.random()*8:1+Math.random()*5,
      type==='floor'?2+Math.random()*8:1+Math.random()*4
    );
  }

  if(type==='wall'){
    for(let i=0;i<36;i++){
      const x=Math.random()*512;
      const y=Math.random()*512;
      const w=25+Math.random()*90;

      ctx.strokeStyle='rgba(0,0,0,.16)';
      ctx.lineWidth=3+Math.random()*9;

      ctx.beginPath();
      ctx.moveTo(x,y);
      ctx.lineTo(x+w,y+Math.random()*15-7);
      ctx.stroke();
    }
  }

  const texture=new THREE.CanvasTexture(canvas);
  texture.wrapS=THREE.RepeatWrapping;
  texture.wrapT=THREE.RepeatWrapping;

  return texture;
}

function box(w,h,d,x,y,z,material){
  const mesh=new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),
    material
  );

  mesh.position.set(x,y,z);
  mesh.castShadow=true;
  mesh.receiveShadow=true;

  scene.add(mesh);
  return mesh;
}

function buildArchitecture(){
  const wallTexture=createProceduralTexture('wall');
  wallTexture.repeat.set(3,2);

  const floorTexture=createProceduralTexture('floor');
  floorTexture.repeat.set(5,5);

  const wallMaterial=new THREE.MeshStandardMaterial({
    map:wallTexture,
    color:0x3a3a3a,
    roughness:.94,
    metalness:.05
  });

  const floorMaterial=new THREE.MeshStandardMaterial({
    map:floorTexture,
    color:0x161616,
    roughness:.72,
    metalness:.24
  });

  const floor=new THREE.Mesh(
    new THREE.PlaneGeometry(36,32),
    floorMaterial
  );

  floor.rotation.x=-Math.PI/2;
  floor.receiveShadow=true;
  scene.add(floor);

  const back=box(36,8,.5,0,4,-15.7,wallMaterial);
  const left=box(.5,8,32,-18,4,0,wallMaterial);
  const right=box(.5,8,32,18,4,0,wallMaterial);

function buildAtmosphere(){
  const dustCount=950;
  const positions=new Float32Array(dustCount*3);

  for(let i=0;i<dustCount;i++){
    const j=i*3;

    positions[j]=(Math.random()-.5)*34;
    positions[j+1]=.28+Math.random()*6.0;
    positions[j+2]=-14+Math.random()*28;
  }

  const geometry=new THREE.BufferGeometry();

  geometry.setAttribute(
    'position',
    new THREE.BufferAttribute(positions,3)
  );

  dustField=new THREE.Points(
    geometry,
    new THREE.PointsMaterial({
      color:0xbdbdbd,
      size:.028,
      transparent:true,
      opacity:.28,
      depthWrite:false,
      sizeAttenuation:true
    })
  );

  scene.add(dustField);

  const smokeTexture=createSmokeTexture();

  smokePuffs=[];

  for(let i=0;i<38;i++){
    const sprite=new THREE.Sprite(
      new THREE.SpriteMaterial({
        map:smokeTexture,
        color:0xc7c7c7,
        transparent:true,
        opacity:.024+Math.random()*.045,
        depthWrite:false,
        depthTest:true
      })
    );

    sprite.position.set(
      (Math.random()-.5)*29,
      .4+Math.random()*5.5,
      -13+Math.random()*25
    );

    sprite.scale.set(
      2.0+Math.random()*4.2,
      1.7+Math.random()*3.4,
      1
    );

    sprite.material.rotation=
      (Math.random()-.5)*.8;

    scene.add(sprite);

    smokePuffs.push({
      sprite,
      x:sprite.position.x,
      y:sprite.position.y,
      z:sprite.position.z,
      phase:Math.random()*Math.PI*2,
      rise:.018+Math.random()*.045,
      drift:.15+Math.random()*.38,
      pulse:.5+Math.random()*1.2
    });
  }

  const mistGeometry=new THREE.BufferGeometry();
  const mistPositions=new Float32Array(100*3);

  for(let i=0;i<100;i++){
    const j=i*3;

    mistPositions[j]=(Math.random()-.5)*32;
    mistPositions[j+1]=.10+Math.random()*.9;
    mistPositions[j+2]=-13+Math.random()*25;
  }

  mistGeometry.setAttribute(
    'position',
    new THREE.BufferAttribute(mistPositions,3)
  );

  floorMist=new THREE.Points(
    mistGeometry,
    new THREE.PointsMaterial({
      color:0xaaaaaa,
      size:2.3,
      transparent:true,
      opacity:.012,
      depthWrite:false,
      sizeAttenuation:true
    })
  );

  scene.add(floorMist);

  scene.fog=new THREE.FogExp2(0x040404,.017);
}

function createSmokeTexture(){
  const canvas=document.createElement('canvas');
  canvas.width=256;
  canvas.height=256;

  const ctx=canvas.getContext('2d');

  for(let i=0;i<18;i++){
    const x=35+Math.random()*185;
    const y=45+Math.random()*165;
    const r=20+Math.random()*55;

    const gradient=ctx.createRadialGradient(
      x,y,0,
      x,y,r
    );

    gradient.addColorStop(0,'rgba(235,235,235,.30)');
    gradient.addColorStop(.32,'rgba(205,205,205,.17)');
    gradient.addColorStop(.72,'rgba(165,165,165,.055)');
    gradient.addColorStop(1,'rgba(100,100,100,0)');

    ctx.fillStyle=gradient;
    ctx.beginPath();
    ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fill();
  }

  return new THREE.CanvasTexture(canvas);
}

  });

  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;

  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x040404);

  camera=new THREE.PerspectiveCamera(

  );

  );

  );

  bindPointerControls();

  window.addEventListener('resize',onResize);

  animate();

function bindPointerControls(){
  $('canvas3d').addEventListener('click',()=>{
    if(document.pointerLockElement) return;

    try{
      $('canvas3d').requestPointerLock();
    }catch(error){}
  });

  document.addEventListener('mousemove',event=>{
    if(!document.pointerLockElement) return;

    yaw-=event.movementX*.0022;
    pitch-=event.movementY*.0022;

    pitch=THREE.MathUtils.clamp(
      pitch,
      -1.30,
      1.30
    );
  });

  document.addEventListener('pointerlockchange',()=>{
    $('help').style.opacity=
      document.pointerLockElement ? '.13' : '.52';
  });
}

function onResize(){
  if(!renderer || !camera) return;

  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();

  renderer.setSize(innerWidth,innerHeight);

  if(cssRenderer){
    cssRenderer.setSize(
      innerWidth,
      innerHeight
    );
  }
}

function movePlayer(dt){
  if(!document.pointerLockElement) return;

  const forward=
    (keys.KeyW?1:0)-
    (keys.KeyS?1:0);

  const side=
    (keys.KeyD?1:0)-
    (keys.KeyA?1:0);

  if(!forward && !side) return;

  const len=Math.hypot(forward,side)||1;

  const f=forward/len;
  const s=side/len;

  const fx=-Math.sin(yaw);
  const fz=-Math.cos(yaw);

  const rx=Math.cos(yaw);
  const rz=-Math.sin(yaw);

  playerX+=
    (fx*f+rx*s)*
    4.6*
    dt;

  playerZ+=
    (fz*f+rz*s)*
    4.6*
    dt;

  playerX=THREE.MathUtils.clamp(
    playerX,
    WORLD.minX,
    WORLD.maxX
  );

  playerZ=THREE.MathUtils.clamp(
    playerZ,
    WORLD.minZ,
    WORLD.maxZ
  );
}

function handleJump(dt){
  if(!document.pointerLockElement) return;

  verticalVelocity-=18*dt;
  playerY+=verticalVelocity*dt;

  if(playerY<=0){
    playerY=0;
    verticalVelocity=0;
    grounded=true;
  }
}

document.addEventListener('keydown',event=>{
  if(
    event.target &&
    /input|select|textarea/i.test(event.target.tagName)
  ){
    return;
  }

  keys[event.code]=true;

  if(event.code==='Space' && grounded){
    verticalVelocity=7;
    grounded=false;
    event.preventDefault();
  }

  if(
    EMOTE_KEYS[event.code] &&
    socket &&
    socket.connected
  ){
    socket.emit(
      'player:emote',
      EMOTE_KEYS[event.code]
    );
  }
});

document.addEventListener('keyup',event=>{
  keys[event.code]=false;
});

function sendPlayerState(now){
  if(!socket || !socket.connected) return;

  if(now-lastStateSent<60) return;

  lastStateSent=now;

  const moving=
    Boolean(
      keys.KeyW||
      keys.KeyA||
      keys.KeyS||
      keys.KeyD
    );

  socket.emit('player:state',{
    x:playerX,
    y:0,
    z:playerZ,
    yaw:yaw,
    moving
  });
}

function createLabel(name){
  const canvas=document.createElement('canvas');
  canvas.width=512;
  canvas.height=96;

  const ctx=canvas.getContext('2d');

  ctx.clearRect(0,0,512,96);
  ctx.fillStyle='#fff';
  ctx.font='700 34px Arial';
  ctx.textAlign='center';
  ctx.fillText(
    String(name||'PLAYER'),
    256,
    58
  );

  const texture=new THREE.CanvasTexture(canvas);

  const sprite=new THREE.Sprite(
    new THREE.SpriteMaterial({
      map:texture,
      transparent:true,
      depthTest:false
    })
  );

  sprite.scale.set(2.3,.43,1);
  sprite.position.y=2.95;

  return sprite;
}

function hashId(id){
  let value=0;

  const s=String(id||'');

  for(let i=0;i<s.length;i++){
    value=
      (value*31+s.charCodeAt(i))>>>
      0;
  }

  return value;
}

function makeRemoteAvatar(data){
  const group=new THREE.Group();

  group.userData.id=data.id;

  const seed=hashId(data.id);

  const bodyTone=
    0x3a3a3a+
    (seed%4)*0x0b0b0b;

  const suitMaterial=new THREE.MeshStandardMaterial({
    color:bodyTone,
    roughness:.72,
    metalness:.18
  });

  const accentMaterial=new THREE.MeshStandardMaterial({
    color:seed%2?0xbdbdbd:0x8d8d8d,
    roughness:.55,
    metalness:.25
  });

  const darkMaterial=new THREE.MeshStandardMaterial({
    color:0x202020,
    roughness:.78,
    metalness:.1
  });

  const body=new THREE.Mesh(
    new THREE.BoxGeometry(.82,1.28,.46),
    suitMaterial
  );

  body.position.y=1.35;
  body.castShadow=true;
  group.add(body);

  const chest=new THREE.Mesh(
    new THREE.BoxGeometry(.54,.45,.06),
    accentMaterial
  );

  chest.position.set(0,1.55,.26);
  group.add(chest);

  const head=new THREE.Mesh(
    new THREE.SphereGeometry(.39,16,16),
    accentMaterial
  );

  head.position.y=2.28;
  head.castShadow=true;
  group.add(head);

  const eyeMaterial=new THREE.MeshBasicMaterial({
    color:0x101010
  });

  for(let side=-1;side<=1;side+=2){
    const eye=new THREE.Mesh(
      new THREE.BoxGeometry(.07,.07,.025),
      eyeMaterial
    );

    eye.position.set(
      side*.12,
      2.31,
      .36
    );

    group.add(eye);
  }

  const legL=new THREE.Mesh(
    new THREE.BoxGeometry(.22,.94,.24),
    darkMaterial
  );

  legL.position.set(-.2,.48,0);
  legL.castShadow=true;
  group.add(legL);

  const legR=legL.clone();
  legR.position.x=.2;
  group.add(legR);

  const armL=new THREE.Mesh(
    new THREE.BoxGeometry(.20,1.02,.23),
    suitMaterial
  );

  armL.position.set(-.57,1.37,0);
  armL.rotation.z=.05;
  group.add(armL);

  const armR=armL.clone();
  armR.position.x=.57;
  armR.rotation.z=-.05;
  group.add(armR);

  group.add(createLabel(data.username));

  group.position.set(
    Number(data.x)||0,
    WORLD.floorY,
    Number(data.z)||0
  );

  group.rotation.y=
    Number(data.yaw)||0;

  scene.add(group);

  return {
    group,
    data,
    targetX:group.position.x,
    targetZ:group.position.z,
    targetYaw:group.rotation.y
  };
}

function updateRemotePlayer(data){
  if(!data || !data.id) return;

  let remote=remotePlayers.get(data.id);

  if(!remote){
    remote=makeRemoteAvatar(data);
    remotePlayers.set(data.id,remote);
  }

  remote.data=data;
  remote.targetX=Number(data.x)||0;
  remote.targetZ=Number(data.z)||0;
  remote.targetYaw=Number(data.yaw)||0;
}

function removeRemotePlayer(id){
  const remote=remotePlayers.get(id);

  if(!remote) return;

  scene.remove(remote.group);
  remotePlayers.delete(id);
}

function animateRemotePlayers(time){
  remotePlayers.forEach(remote=>{
    const group=remote.group;

    group.position.x +=
      (remote.targetX-group.position.x)*.24;

    group.position.z +=
      (remote.targetZ-group.position.z)*.24;

    let deltaYaw=
      remote.targetYaw-group.rotation.y;

    while(deltaYaw>Math.PI) deltaYaw-=Math.PI*2;
    while(deltaYaw<-Math.PI) deltaYaw+=Math.PI*2;

    group.rotation.y += deltaYaw*.24;

    const moving=Boolean(remote.data && remote.data.moving);

    const dance=
      Number(remote.data && remote.data.dance)||0;

    const swing=
      moving
        ? Math.sin(time*9)*.35
        : 0;

    if(group.children[6]){
      group.children[6].rotation.x=swing;
    }

    if(group.children[7]){
      group.children[7].rotation.x=-swing;
    }

    if(dance){
      const pulse=Math.sin(
        time*7+
        Number(remote.data.danceStartedAt||0)*.001
      )*.24;

      group.rotation.z=pulse;
      group.position.y=
        WORLD.floorY+
        Math.abs(Math.sin(time*7))*(
          dance===1?0.04:.08
        );
    }else{
      group.rotation.z=0;
      group.position.y=WORLD.floorY;
    }
  });
}

function animateAtmosphere(time,dt){
  if(dustField){
    dustField.rotation.y+=dt*.006;
    dustField.position.x=
      Math.sin(time*.07)*.14;
    dustField.position.y=
      Math.sin(time*.17)*.025;
  }

  smokePuffs.forEach(puff=>{
    const wave=time*puff.drift+puff.phase;

    puff.sprite.position.x=
      puff.x+
      Math.sin(wave)*.34;

    puff.sprite.position.z=
      puff.z+
      Math.cos(wave*.63)*.20;

    puff.sprite.position.y=
      puff.y+
      ((time*puff.rise+puff.phase*.4)%1.7);

    puff.sprite.material.opacity=
      .022+
      .012*
      (0.5+0.5*Math.sin(
        time*puff.pulse+
        puff.phase
      ));
  });

  if(floorMist){
    floorMist.rotation.y-=dt*.002;
    floorMist.position.x=
      Math.cos(time*.08)*.2;
  }
}

function animateLighting(time){
  moverLights.forEach((item,index)=>{
    const x=
      Math.sin(time*(.30+index*.035)+item.phase)*
      (index<2?8.8:7.4);

    const z=
      -1+
      Math.cos(time*(.24+index*.025)+item.phase)*
      8.2;

    item.target.position.set(
      x,
      1.0+Math.sin(time*.55+item.phase)*1.25,
      z
    );

    item.light.intensity=
      1.0+
      .38*(.5+.5*Math.sin(time*1.5+item.phase));
  });

  const beat=
    Math.sin(time*5.4);

  const sharpBeat=
    Math.pow(Math.max(0,beat),28);

  strobes.forEach((item,index)=>{
    const flash=
      sharpBeat*(index%2?.78:1);

    item.light.intensity=flash*20;

    item.fixture.material.emissiveIntensity=
      .18+flash*10;
  });

  lasers.forEach((laser,index)=>{
    const target=new THREE.Vector3(
      Math.sin(time*(.48+index*.065)+laser.phase)*11.8,
      1.15+Math.sin(time*(.65+index*.06)+laser.phase*.7)*2.05,
      -1.7+Math.cos(time*(.38+index*.045)+laser.phase)*11.2
    );

    const direction=target.clone().normalize();
    const length=Math.max(4,target.length());
    const q=new THREE.Quaternion();

    q.setFromUnitVectors(
      new THREE.Vector3(0,1,0),
      direction
    );

    [laser.core,laser.beam,laser.halo].forEach(mesh=>{
      mesh.quaternion.copy(q);
      mesh.position.copy(direction).multiplyScalar(length*.5);
      mesh.scale.set(1,length,1);
    });

    laser.core.material.opacity=.72+sharpBeat*.22;
    laser.beam.material.opacity=.045+sharpBeat*.065;
    laser.halo.material.opacity=.012+sharpBeat*.022;
  });
}


function animate(){
  requestAnimationFrame(animate);

  const dt=Math.min(
    clock.getDelta(),
    .05
  );

  const time=performance.now()/1000;

  if(!scene) return;

  movePlayer(dt);
  handleJump(dt);

  camera.position.set(
    playerX,
    WORLD.eyeY+playerY,
    playerZ
  );

  camera.rotation.y=yaw;
  camera.rotation.x=pitch;

  sendPlayerState(performance.now());
  animateRemotePlayers(time);
  animateAtmosphere(time,dt);
  animateLighting(time);

  if(screenAnchor && cssScreenObject){
    cssScreenObject.position.copy(
      screenAnchor.position
    );

    cssScreenObject.rotation.copy(
      screenAnchor.rotation
    );

    cssScreenObject.scale.set(
      .01,.01,.01
    );
  }

  renderer.render(
    scene,
    camera
  );

  cssRenderer.render(
    cssScene,
    camera
  );
}

async function translateChatText(text,target){
  const source=String(text||'').trim();
  const lang=String(target||'en').toLowerCase();

  if(!source) return '';

  const key=
    lang+
    '\n'+
    source;

  if(chatTranslationCache.has(key)){
    return chatTranslationCache.get(key);
  }

  try{
    const response=await fetch(
      '/api/translate',
      {
        method:'POST',
        headers:{
          'Content-Type':'application/json'
        },
        body:JSON.stringify({
          text:source,
          target:lang
        })
      }
    );

    if(!response.ok){
      throw new Error(
        'translation http '+
        response.status
      );
    }

    const data=await response.json();

    const translated=
      String(data.text||source);

    chatTranslationCache.set(
      key,
      translated
    );

    return translated;
  }catch(error){
    return source;
  }
}

function addChatMessage(user,text,ts){
  chatMessages.push({
    user:String(user||''),
    text:String(text||''),
    ts:Number(ts)||Date.now()
  });

  if(chatMessages.length>80){
    chatMessages=
      chatMessages.slice(-80);
  }

  renderChat();
}

async function renderChat(){
  const token=++chatRenderToken;
  const log=$('chat-log');

  log.innerHTML='';

  const messages=
    chatMessages.slice(-80);

  for(const message of messages){
    const line=
      document.createElement('div');

    line.className='chat-line';

    const user=
      document.createElement('span');

    user.className='chat-user';
    user.textContent=message.user;

    const body=
      document.createElement('span');

    body.className='chat-body';
    body.textContent='…';

    line.append(
      user,
      body
    );

    log.appendChild(line);

    const translated=
      await translateChatText(
        message.text,
        chatLanguage
      );

    if(token!==chatRenderToken) return;

    body.textContent=translated;
    log.scrollTop=log.scrollHeight;
  }
}

$('chat-language').addEventListener('change',()=>{
  chatLanguage=
    $('chat-language').value||
    'en';

  localStorage.setItem(
    'ews-chat-language',
    chatLanguage
  );

  renderChat();
});

$('chat-form').addEventListener('submit',event=>{
  event.preventDefault();

  const value=
    $('chat-input').value.trim();

  if(
    !value||
    !socket||
    !socket.connected
  ){
    return;
  }

  socket.emit(
    'chat:message',
    value
  );

  $('chat-input').value='';
});

const remembered=
  localStorage.getItem(
    'ews-username'
  );

if(remembered){
  $('auth-username').value=remembered;
}

$('auth-language').value=
  localStorage.getItem(
    'ews-chat-language'
  )||
  'en';
