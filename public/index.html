<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0"
>

<title>EWS SESSIONS</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>

<script src="/socket.io/socket.io.js"></script>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:#fff;
    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

#game{
    position:fixed;
    inset:0;
}

canvas{
    display:block;
}

/* =========================
   LOGIN
========================= */

#login{
    position:fixed;
    inset:0;
    z-index:100;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#000;
}

.login-box{
    width:360px;
    max-width:90vw;

    padding:40px;

    border:1px solid #333;

    background:#050505;

    text-align:center;
}

.logo{
    font-size:32px;
    font-weight:900;
    letter-spacing:8px;
    margin-bottom:8px;
}

.subtitle{
    color:#666;
    font-size:11px;
    letter-spacing:4px;
    margin-bottom:30px;
}

input,
select,
button{
    width:100%;
    height:44px;

    margin-top:10px;

    border:1px solid #333;

    background:#080808;
    color:#fff;

    padding:0 12px;

    outline:none;
}

input:focus,
select:focus{
    border-color:#777;
}

button{
    cursor:pointer;
    font-weight:bold;
    letter-spacing:2px;
}

button:hover{
    background:#151515;
}

#login-message{
    min-height:20px;
    margin-top:15px;
    color:#aaa;
    font-size:12px;
}

/* =========================
   HUD
========================= */

#hud{
    display:none;

    position:fixed;
    inset:0;

    z-index:20;

    pointer-events:none;
}

#brand{
    position:absolute;
    top:22px;
    left:24px;

    font-weight:900;
    font-size:18px;
    letter-spacing:5px;
}

#status{
    position:absolute;
    top:25px;
    right:25px;

    font-size:11px;
    letter-spacing:2px;

    color:#aaa;
}

#controls{
    position:absolute;
    bottom:22px;
    left:24px;

    color:#777;

    font-size:10px;
    line-height:18px;

    letter-spacing:1px;
}

#crosshair{
    position:absolute;

    left:50%;
    top:50%;

    width:14px;
    height:14px;

    transform:
        translate(-50%,-50%);

    opacity:.65;
}

#crosshair:before,
#crosshair:after{
    content:"";

    position:absolute;

    background:#fff;
}

#crosshair:before{
    left:6px;
    top:0;

    width:1px;
    height:14px;
}

#crosshair:after{
    top:6px;
    left:0;

    width:14px;
    height:1px;
}

/* =========================
   ONLINE
========================= */

#online-panel{
    position:absolute;

    top:65px;
    right:25px;

    width:180px;

    border-left:1px solid #222;

    padding-left:12px;
}

.panel-title{
    font-size:9px;
    color:#555;
    letter-spacing:3px;
    margin-bottom:8px;
}

#online-list{
    font-size:11px;
    line-height:20px;
}

.online-user{
    color:#aaa;
}

.online-dot{
    display:inline-block;

    width:5px;
    height:5px;

    margin-right:7px;

    border-radius:50%;

    background:#fff;
}

/* =========================
   CHAT
========================= */

#chat{
    position:absolute;

    left:24px;
    bottom:85px;

    width:320px;
    max-width:calc(100vw - 48px);

    pointer-events:auto;
}

#messages{
    height:190px;

    overflow-y:auto;

    padding-right:8px;

    font-size:11px;

    text-shadow:
        0 1px 4px #000;
}

.message{
    margin-bottom:7px;
}

.message-user{
    color:#fff;
    font-weight:bold;
}

.message-text{
    color:#aaa;
}

#chat-form{
    display:flex;
    gap:6px;
}

#chat-input{
    flex:1;

    width:auto;
    height:34px;

}

    height:34px;

========================= */

#audio-button{

   HIDE
========================= */

.hidden{
    display:none !important;
}

</style>

</head>

<body>

<div id="game"></div>

<!-- LOGIN -->

<div id="login">

    <div class="login-box">

        <div class="logo">
            EWS

            </option>

<!-- HUD -->

<div id="hud">

    <div id="brand">
        EWS SESSIONS
    </div>

    <div id="status">

    </div>

    <div id="online-panel">

        <div class="panel-title">
            ONLINE
        </div>

        <div id="online-list"></div>

    </div>

    <div id="controls">

        WASD — MOVE<br>
        SPACE — JUMP<br>
        V — THIRD PERSON<br>
        CLICK — LOCK MOUSE

    </div>

    <div id="chat">

        <div id="messages"></div>

        <form id="chat-form">

            <input
                id="chat-input"
                maxlength="500"
                autocomplete="off"
                placeholder="message..."
            >

            <button id="chat-send">
                SEND
            </button>

        </form>

    </div>

    <button id="audio-button">
        AUDIO OFF
    </button>

</div>

<script>

/* =========================================================
   GLOBAL
========================================================= */

const socket = io();

let username = '';
let language = 'en';

let joined = false;

let scene;
let camera;
let renderer;

let clock;

let localPlayer;
let playerBody;

let remotePlayers = new Map();

let thirdPerson = false;

let pointerLocked = false;

const keys = {};

let velocityY = 0;

let canJump = true;

let cameraYaw = 0;

let cameraPitch = 0.25;

let audio;
let audioStarted = false;

/* =========================================================
   LOGIN
========================================================= */

const loginScreen =
    document.getElementById(
        'login'
    );

const hud =
    document.getElementById(
        'hud'
    );

const loginMessage =
    document.getElementById(
        'login-message'
    );

const usernameInput =
    document.getElementById(
        'username'
    );

const passwordInput =
    document.getElementById(
        'password'
    );

const languageSelect =
    document.getElementById(
        'language'
    );

document
    .getElementById(
        'login-button'
    )
    .onclick = login;

document
    .getElementById(
        'register-button'
    )
    .onclick = register;

async function login(){

    const user =
        usernameInput.value.trim();

    const pass =
        passwordInput.value;

    language =
        languageSelect.value;

    if(!user || !pass){

        loginMessage.textContent =
            'ENTER USERNAME AND PASSWORD';

        return;
    }

    try{

        const response =
            await fetch(
                '/api/login',
                {
                    method:'POST',

                    headers:{
                        'Content-Type':
                            'application/json'
                    },

                    body:JSON.stringify({
                        username:user,
                        password:pass
                    })
                }
            );

        const data =
            await response.json();

        if(!data.ok){

            loginMessage.textContent =
                data.message ||
                'LOGIN ERROR';

            return;
        }

        username =
            data.username;

        enterClub();

    }catch(error){

        loginMessage.textContent =
            'SERVER ERROR';

        console.error(error);
    }
}

async function register(){

    const user =
        usernameInput.value.trim();

    const pass =
        passwordInput.value;

    language =
        languageSelect.value;

    if(!user || !pass){

        loginMessage.textContent =
            'ENTER USERNAME AND PASSWORD';

        return;
    }

    try{

        const response =
            await fetch(
                '/api/register',
                {
                    method:'POST',

                    headers:{
                        'Content-Type':
                            'application/json'
                    },

                    body:JSON.stringify({
                        username:user,
                        password:pass
                    })
                }
            );

        const data =
            await response.json();

        if(!data.ok){

            loginMessage.textContent =
                data.message ||
                'REGISTER ERROR';

            return;
        }

        username =
            data.username;

        enterClub();

    }catch(error){

        loginMessage.textContent =
            'SERVER ERROR';

        console.error(error);
    }
}

/* =========================================================
   ENTER
========================================================= */

function enterClub(){

    loginScreen.classList.add(
        'hidden'
    );

    hud.style.display =
        'block';

    createClub();

    socket.emit(
        'join',
        {
            username,
            language
        }
    );

    socket.emit(
        'request-online'
    );

    socket.emit(
        'request-players'
    );
}

/* =========================================================
   THREE
========================================================= */

function createClub(){

    scene =
        new THREE.Scene();

    scene.background =
        new THREE.Color(
            0x000000
        );

    scene.fog =
        new THREE.Fog(
            0x000000,
            18,
            45
        );

    camera =
        new THREE.PerspectiveCamera(
            65,
            window.innerWidth /
            window.innerHeight,
            0.1,
            100
        );

    renderer =
        new THREE.WebGLRenderer({
            antialias:true
        });

    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            2
        )
    );

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.outputEncoding =
        THREE.sRGBEncoding;

    document
        .getElementById(
            'game'
        )
        .appendChild(
            renderer.domElement
        );

    clock =
        new THREE.Clock();

    /* LIGHT */

    const ambient =
        new THREE.AmbientLight(
            0xffffff,
            0.55
        );

    scene.add(
        ambient
    );

    const mainLight =
        new THREE.PointLight(
            0xffffff,
            1.5,
            35
        );

    mainLight.position.set(
        0,
        8,
        0
    );

    scene.add(
        mainLight
    );

    const sideLight =
        new THREE.PointLight(
            0x888888,
            0.8,
            25
        );

    sideLight.position.set(
        -10,
        5,
        -4
    );

    scene.add(
        sideLight
    );

    createClubEnvironment();

    createLocalPlayer();

    camera.position.set(
        0,
        4,
        8
    );

    window.addEventListener(
        'resize',
        onResize
    );

    renderer.domElement.addEventListener(
        'click',
        requestPointerLock
    );

    document.addEventListener(
        'pointerlockchange',
        pointerLockChange
    );

    document.addEventListener(
        'mousemove',
        mouseMove
    );

    document.addEventListener(
        'keydown',
        keyDown
    );

    document.addEventListener(
        'keyup',
        keyUp
    );

    animate();
}

/* =========================================================
   CLUB
========================================================= */

function createClubEnvironment(){

    /*
        ЧЁРНЫЙ МИНИМАЛИСТИЧНЫЙ КЛУБ.

        Никакой клетчатой текстуры.
        Никаких шахмат.
    */

    const floorMaterial =
        new THREE.MeshStandardMaterial({
            color:0x080808,
            roughness:0.85,
            metalness:0.1
        });

    const floor =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                36,
                0.25,
                36
            ),
            floorMaterial
        );

    floor.position.y =
        -0.15;

    scene.add(
        floor
    );

    /* WALLS */

    const wallMaterial =
        new THREE.MeshStandardMaterial({
            color:0x030303,
            roughness:0.95
        });

    const backWall =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                36,
                10,
                0.3
            ),
            wallMaterial
        );

    backWall.position.set(
        0,
        5,
        -18
    );

    scene.add(
        backWall
    );

    const leftWall =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                0.3,
                10,
                36
            ),
            wallMaterial
        );

    leftWall.position.set(
        -18,
        5,
        0
    );

    scene.add(
        leftWall
    );

    const rightWall =
        leftWall.clone();

    rightWall.position.x =
        18;

    scene.add(
        rightWall
    );

    /* CEILING */

    const ceiling =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                36,
                0.3,
                36
            ),
            new THREE.MeshStandardMaterial({
                color:0x010101
            })
        );

    ceiling.position.y =
        10;

    scene.add(
        ceiling
    );

    /* MINIMAL STAGE */

    const stage =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                12,
                0.6,
                5
            ),
            new THREE.MeshStandardMaterial({
                color:0x111111,
                roughness:0.7
            })
        );

    stage.position.set(
        0,
        0.3,
        -13
    );

    scene.add(
        stage
    );

    /* BACK PANEL */

    const panel =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                13,
                5,
                0.25
            ),
            new THREE.MeshStandardMaterial({
                color:0x090909
            })
        );

    panel.position.set(
        0,
        3,
        -15.5
    );

    scene.add(
        panel
    );

    /* SIMPLE EWS LETTERING */

    const ews =
        createTextSprite(
            'EWS'
        );

    ews.position.set(
        0,
        4.2,
        -15.25
    );

    ews.scale.set(
        4,
        2,
        1
    );

    scene.add(
        ews
    );

    /* COLUMNS */

    for(
        const x of [-14,14]
    ){

        const column =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    0.5,
                    8,
                    0.5
                ),
                new THREE.MeshStandardMaterial({
                    color:0x111111
                })
            );

        column.position.set(
            x,
            4,
            -10
        );

        scene.add(
            column
        );
    }

    /* MINIMAL WALL LIGHTS */

    for(
        const z of [-7,0,7]
    ){

        const light =
            new THREE.PointLight(
                0xffffff,
                0.22,
                10
            );

        light.position.set(
            -12,
            4,
            z
        );

        scene.add(
            light
        );

        const light2 =
            new THREE.PointLight(
                0xffffff,
                0.22,
                10
            );

        light2.position.set(
            12,
            4,
            z
        );

        scene.add(
            light2
        );
    }
}

/* =========================================================
   TEXT SPRITE
========================================================= */

function createTextSprite(text){

    const canvas =
        document.createElement(
            'canvas'
        );

    canvas.width =
        1024;

    canvas.height =
        256;

    const ctx =
        canvas.getContext(
            '2d'
        );

    ctx.fillStyle =
        '#ffffff';

    ctx.font =
        '900 180px Arial';

    ctx.textAlign =
        'center';

    ctx.textBaseline =
        'middle';

    ctx.fillText(
        text,
        512,
        128
    );

    const texture =
        new THREE.CanvasTexture(
            canvas
        );

    const material =
        new THREE.SpriteMaterial({
            map:texture,
            transparent:true
        });

    return new THREE.Sprite(
        material
    );
}

/* =========================================================
   PLAYER
========================================================= */

function createHuman(

){

    const group =
        new THREE.Group();

    const material =
        new THREE.MeshStandardMaterial({
            color,
            roughness:0.7,
            metalness:0
        });

    const darkMaterial =
        new THREE.MeshStandardMaterial({
            color:0x111111,
            roughness:0.8
        });

    /* LEGS */

    const leftLeg =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                0.28,
                1.05,
                0.32
            ),
            darkMaterial
        );

    leftLeg.position.set(
        -0.22,
        0.85,
        0
    );

    group.add(
        leftLeg
    );

    const rightLeg =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                0.28,
                1.05,
                0.32
            ),
            darkMaterial
        );

    rightLeg.position.set(
        0.22,
        0.85,
        0
    );

    group.add(
        rightLeg
    );

    /* BODY */

    const body =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                0.75,
                1.25,
                0.42
            ),
            material
        );

    body.position.y =
        1.85;

    group.add(

    );

    /* HEAD */

        );

    head.position.y =

    /* LEFT ARM */

                0.24
            ),
            material
        );

    leftArm.position.set(
        -0.58,
        1.88,
        0
    );

    leftArm.rotation.z =
        -0.08;

    group.add(
        leftArm
    );

    /* RIGHT ARM */

    const rightArm =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                0.24,
                1.05,
                0.24
            ),
            material
        );

    rightArm.position.set(
        0.58,
        1.88,
        0
    );

    rightArm.rotation.z =
        0.08;

    group.add(
        rightArm
    );

    /* HANDS */

    const leftHand =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                0.14,
                10,
                10
            ),
            material
        );

    leftHand.position.set(
        -0.59,
        1.35,
        0
    );

    group.add(
        leftHand
    );

    const rightHand =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                0.14,
                10,
                10
            ),
            material
        );

    rightHand.position.set(
        0.59,
        1.35,
        0
    );

    group.add(
        rightHand

    /* FEET */

    const leftFoot =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                0.34,
                0.18,
                0.5
            ),

        );

    leftFoot.position.set(
        -0.22,
        0.32,
        -0.06
    );

    group.add(
        leftFoot
    );

    const rightFoot =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                0.34,
                0.18,
                0.5

    rightFoot.position.set(

}

function createLocalPlayer(){

    playerBody =
        createHuman(
            0xffffff
        );

    playerBody.position.set(
        0,
        0,
        5
    );

    scene.add(
        playerBody
    );

    localPlayer =
        playerBody;
}

/* =========================================================
   REMOTE PLAYERS
========================================================= */

function addRemotePlayer(data){

    if(
        remotePlayers.has(
            data.id
        )
    ){
        return;
    }

    const player =
        createHuman(
            0xaaaaaa
        );

    player.position.set(
        data.x || 0,
        data.y || 0,
        data.z || 0
    );

    player.rotation.y =
        data.ry || 0;

    scene.add(
        player
    );

    remotePlayers.set(
        data.id,
        player
    );
}

function removeRemotePlayer(id){

    const player =
        remotePlayers.get(id);

    if(!player){
        return;
    }

    scene.remove(
        player
    );

    remotePlayers.delete(
        id
    );
}

/* =========================================================
   MOVEMENT
========================================================= */

function keyDown(event){

    keys[
        event.code
    ] = true;

    if(
        event.code === 'Space'
    ){

        event.preventDefault();

        if(canJump){

            velocityY =
                6.5;

            canJump =
                false;
        }
    }

    if(
        event.code === 'KeyV'
    ){

        thirdPerson =
            !thirdPerson;
    }
}

function keyUp(event){

    keys[
        event.code
    ] = false;
}

function updatePlayer(delta){

    if(!localPlayer){
        return;
    }

    const speed =
        5.5;

    let dx = 0;
    let dz = 0;

    if(
        keys['KeyW'] ||
        keys['ArrowUp']
    ){
        dz -= 1;
    }

    if(
        keys['KeyS'] ||
        keys['ArrowDown']
    ){
        dz += 1;
    }

    if(
        keys['KeyA'] ||
        keys['ArrowLeft']
    ){
        dx -= 1;
    }

    if(
        keys['KeyD'] ||
        keys['ArrowRight']
    ){
        dx += 1;
    }

    const length =
        Math.sqrt(
            dx * dx +
            dz * dz
        );

    if(length > 0){

        dx /= length;
        dz /= length;

        const angle =
            cameraYaw;

        const moveX =
            dx * Math.cos(angle) -
            dz * Math.sin(angle);

        const moveZ =
            dx * Math.sin(angle) +
            dz * Math.cos(angle);

        const nextX =
            localPlayer.position.x +
            moveX *
            speed *
            delta;

        const nextZ =
            localPlayer.position.z +
            moveZ *
            speed *
            delta;

        if(
            !isBlocked(
                nextX,
                localPlayer.position.z
            )
        ){

            localPlayer.position.x =
                nextX;
        }

        if(
            !isBlocked(
                localPlayer.position.x,
                nextZ
            )
        ){

            localPlayer.position.z =
                nextZ;
        }

        localPlayer.rotation.y =
            Math.atan2(
                moveX,
                moveZ
            );
    }

    /* GRAVITY */

    velocityY -=
        15 *
        delta;

    localPlayer.position.y +=
        velocityY *
        delta;

    if(
        localPlayer.position.y <= 0
    ){

        localPlayer.position.y =
            0;

        velocityY =
            0;

        canJump =
            true;
    }

    /* LIMIT */

    localPlayer.position.x =
        THREE.MathUtils.clamp(
            localPlayer.position.x,
            -16.5,
            16.5
        );

    localPlayer.position.z =
        THREE.MathUtils.clamp(
            localPlayer.position.z,
            -16.5,
            16.5
        );

    /* SYNC */

    if(joined){

        socket.emit(
            'player-move',
            {
                x:
                    localPlayer.position.x,

                y:
                    localPlayer.position.y,

                z:
                    localPlayer.position.z,

                ry:
                    localPlayer.rotation.y,

                jumping:
                    !canJump
            }
        );
    }
}

/* =========================================================
   COLLISION
========================================================= */

function isBlocked(
    x,
    z
){

    /*
        Стены
    */

    if(
        x < -16.5 ||
        x > 16.5 ||
        z < -16.5 ||
        z > 16.5
    ){
        return true;
    }

    /*
        Сцена / stage
    */

    if(
        z < -10.2 &&
        z > -15.8 &&
        Math.abs(x) < 6.5
    ){
        return true;
    }

    /*
        Центральные минимальные колонны
    */

    const columns = [
        [-14,-10],
        [14,-10]
    ];

    for(
        const [
            cx,
            cz
        ] of columns
    ){

        if(
            Math.abs(x-cx) < 0.7 &&
            Math.abs(z-cz) < 0.7
        ){
            return true;
        }
    }

    return false;
}

/* =========================================================
   CAMERA
========================================================= */

function updateCamera(){

    if(!localPlayer){
        return;
    }

    if(thirdPerson){

        const distance =
            6;

        const height =
            3.2;

        const target =
            new THREE.Vector3(
                localPlayer.position.x,
                localPlayer.position.y +
                    2,
                localPlayer.position.z
            );

        const offset =
            new THREE.Vector3(
                Math.sin(cameraYaw) *
                    distance,

                height,

                Math.cos(cameraYaw) *
                    distance
            );

        camera.position
            .copy(target)
            .add(offset);

        camera.lookAt(
            target
        );

    }else{

        const target =
            new THREE.Vector3(
                localPlayer.position.x,
                localPlayer.position.y +
                    2.1,
                localPlayer.position.z
            );

        camera.position.lerp(
            target,
            0.3
        );

        const direction =
            new THREE.Vector3(
                -Math.sin(cameraYaw),
                Math.sin(cameraPitch),
                -Math.cos(cameraYaw)
            );

        camera.lookAt(
            camera.position
                .clone()
                .add(direction)
        );
    }
}

/* =========================================================
   MOUSE
========================================================= */

function requestPointerLock(){

    if(
        renderer &&
        renderer.domElement
    ){

        renderer.domElement.requestPointerLock();
    }
}

function pointerLockChange(){

    pointerLocked =
        document.pointerLockElement ===
        renderer.domElement;
}

function mouseMove(event){

    if(!pointerLocked){
        return;
    }

    cameraYaw -=
        event.movementX *
        0.0025;

    cameraPitch -=
        event.movementY *
        0.0025;

    cameraPitch =
        THREE.MathUtils.clamp(
            cameraPitch,
            -0.7,
            0.9
        );
}

/* =========================================================
   SOCKET
========================================================= */

socket.on(
    'server-ready',
    () => {
        console.log(
            'SERVER READY'
        );
    }
);

socket.on(
    'joined',
    data => {

        joined =
            true;

        document.getElementById(
            'status'
        ).textContent =
            'ONLINE';

        console.log(
            'JOINED',
            data
        );
    }
);

socket.on(
    'online-users',
    users => {

        const list =
            document.getElementById(
                'online-list'
            );

        list.innerHTML = '';

        users.forEach(
            user => {

                const div =
                    document.createElement(
                        'div'
                    );

                div.className =
                    'online-user';

                div.innerHTML =
                    '<span class="online-dot"></span>' +
                    escapeHTML(
                        user.username
                    );

                list.appendChild(
                    div
                );
            }
        );

        document.getElementById(
            'status'
        ).textContent =
            `ONLINE ${users.length}`;
    }
);

socket.on(
    'players-state',
    players => {

        players.forEach(
            addRemotePlayer
        );
    }
);

socket.on(
    'player-joined',
    player => {

        addRemotePlayer(
            player
        );
    }
);

socket.on(
    'player-move',
    data => {

        const player =
            remotePlayers.get(
                data.id
            );

        if(!player){
            addRemotePlayer(
                data
            );
            return;
        }

        player.position.lerp(
            new THREE.Vector3(
                data.x,
                data.y,
                data.z
            ),
            0.35
        );

        player.rotation.y =
            data.ry || 0;
    }
);

socket.on(
    'player-left',
    id => {

        removeRemotePlayer(
            id
        );
    }
);

/* =========================================================
   CHAT
========================================================= */

socket.on(
    'chat-message',
    message => {

        addMessage(
            message.user ||
            message.username ||
            'USER',
            message.text
        );
    }
);

socket.on(
    'system-message',
    message => {

        addMessage(
            'SYSTEM',
            message.text
        );
    }
);

function addMessage(
    user,
    text
){

    const messages =
        document.getElementById(
            'messages'
        );

    const div =
        document.createElement(
            'div'
        );

    div.className =
        'message';

    div.innerHTML =
        '<span class="message-user">' +
        escapeHTML(user) +
        '</span> ' +
        '<span class="message-text">' +
        escapeHTML(text) +
        '</span>';

    messages.appendChild(
        div
    );

    while(
        messages.children.length >
        100
    ){

        messages.removeChild(
            messages.firstChild
        );
    }

    messages.scrollTop =
        messages.scrollHeight;
}

document
    .getElementById(
        'chat-form'
    )
    .addEventListener(
        'submit',
        event => {

            event.preventDefault();

            const input =
                document.getElementById(
                    'chat-input'
                );

            const text =
                input.value.trim();

            if(!text){
                return;
            }

            socket.emit(
                'chat-message',
                {
                    text
                }
            );

            input.value = '';
        }
    );

/* =========================================================
   AUDIO
========================================================= */

document
    .getElementById(
        'audio-button'
    )
    .onclick = startAudio;

function startAudio(){

    if(audioStarted){
        return;
    }

    audioStarted =
        true;

    audio =
        document.createElement(
            'audio'
        );

    audio.controls =
        false;

    audio.autoplay =
        true;

    audio.muted =
        false;

    audio.playsInline =
        true;

    audio.src =
        '/hls/ews/index.m3u8';

    document.body.appendChild(
        audio
    );

    if(
        window.Hls &&
        Hls.isSupported()
    ){

        const hls =
            new Hls({
                enableWorker:true,
                lowLatencyMode:true
            });

        hls.loadSource(
            '/hls/ews/index.m3u8'
        );

        hls.attachMedia(
            audio
        );

        hls.on(
            Hls.Events.MANIFEST_PARSED,
            () => {

                audio.play()
                    .catch(
                        console.error
                    );
            }
        );

    }else if(
        audio.canPlayType(
            'application/vnd.apple.mpegurl'
        )
    ){

        audio.play()
            .catch(
                console.error
            );
    }

    document.getElementById(
        'audio-button'
    ).textContent =
        'AUDIO ON';
}

/* =========================================================
   ESCAPE
========================================================= */

function escapeHTML(
    value
){

    return String(
        value
    )
    .replace(
        /&/g,
        '&amp;'
    )
    .replace(
        /</g,
        '&lt;'
    )
    .replace(
        />/g,
        '&gt;'
    )
    .replace(
        /"/g,
        '&quot;'
    )
    .replace(
        /'/g,
        '&#039;'
    );
}

/* =========================================================
   RESIZE
========================================================= */

function onResize(){

    if(!camera || !renderer){
        return;
    }

    camera.aspect =
        window.innerWidth /
        window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );
}

/* =========================================================
   ANIMATION
========================================================= */

function animate(){

    requestAnimationFrame(
        animate
    );

    const delta =
        Math.min(
            clock.getDelta(),
            0.05
        );

    updatePlayer(
        delta
    );

    updateCamera();

    renderer.render(
        scene,
        camera
    );
}

</script>
