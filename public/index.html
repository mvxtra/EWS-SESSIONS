<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0"
>

<title>EWS SESSIONS</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS3DRenderer.js"></script>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>

<script src="/socket.io/socket.io.js"></script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050505;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

#app{
  position:relative;
  width:100vw;
  height:100vh;
}

#canvas3d{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}

/* 3D HTML layer — the club screen is physically anchored in Three.js */
#css3d-container{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  z-index:15;
  pointer-events:none;
  overflow:hidden;
}

#css3d-screen{
  width:1400px;
  height:600px;
  position:absolute;
  left:0;
  top:0;
  background:#000;
  border:1px solid #222;
  box-shadow:0 0 45px rgba(0,0,0,.9);
  pointer-events:auto;
  overflow:hidden;
  display:none;
}

#css3d-screen.active{
  display:block;
}

#css3d-screen iframe{
  width:100%;
  height:100%;
  border:0;
  display:block;
  background:#000;
}


/* =========================================================
   LOGIN
========================================================= */

#login{
  position:absolute;
  inset:0;
  z-index:1000;
  display:flex;
  align-items:center;
  justify-content:center;

  background:
    radial-gradient(
      circle at 50% 40%,
      rgba(255,255,255,.08),
      transparent 25%
    ),
    radial-gradient(
      circle at 50% 50%,
      #171717,
      #030303 70%
    );
}

.login-box{
  width:380px;
  padding:42px;

  background:rgba(5,5,5,.88);

  border:1px solid #444;

  box-shadow:
    0 0 80px rgba(255,255,255,.06),
    inset 0 0 40px rgba(255,255,255,.02);

  text-align:center;
}

.login-box h1{
  font-size:31px;
  letter-spacing:8px;
  font-weight:900;
  color:#fff;
  margin-bottom:8px;
}

.login-box p{
  font-size:10px;
  letter-spacing:5px;
  color:#777;
  margin-bottom:30px;
}

.tabs{
  display:flex;
  margin-bottom:20px;
  border:1px solid #333;
}

.tab{
  flex:1;
  padding:11px;
  border:0;
  background:#0c0c0c;
  color:#666;
  cursor:pointer;
  letter-spacing:2px;
}

.tab.active{
  background:#fff;
  color:#000;
}

input{
  width:100%;
  height:45px;
  margin-bottom:12px;
  padding:0 14px;

  border:1px solid #333;
  background:#080808;
  color:#fff;

  outline:none;
}

input:focus{
  border-color:#aaa;
}

.btn{
  width:100%;
  height:45px;

  border:0;

  background:#fff;
  color:#000;

  font-weight:bold;
  letter-spacing:2px;

  cursor:pointer;
}

.btn:hover{
  background:#ddd;
}

.error{
  min-height:20px;
  margin-top:12px;
  color:#ff5555;
  font-size:12px;
}

/* =========================================================
   HUD
========================================================= */

#hud{
  position:absolute;
  inset:0;
  z-index:20;

  display:none;

  pointer-events:none;
}

#top-logo{
  position:absolute;

  top:18px;
  left:20px;

  font-size:16px;
  font-weight:900;
  letter-spacing:5px;

  text-shadow:0 0 20px #fff;
}

#top-logo span{
  display:block;

  margin-top:4px;

  font-size:8px;
  letter-spacing:3px;
  color:#777;
}

#online-box{
  position:absolute;

  top:18px;
  right:18px;

  width:190px;

  padding:13px;

  background:rgba(0,0,0,.72);

  border:1px solid #333;

  pointer-events:auto;
}

#online-box h3{
  font-size:10px;
  letter-spacing:3px;
  color:#aaa;
  margin-bottom:9px;
}

#online-list{
  list-style:none;

  max-height:180px;
  overflow:auto;

  color:#ddd;
  font-size:12px;
}

#online-list li{
  padding:4px 0;

  border-bottom:1px solid #161616;
}

#online-list li::before{
  content:"●";

  color:#fff;

  margin-right:7px;

  font-size:8px;
}

/* =========================================================
   CHAT
========================================================= */

#chat{
  position:absolute;

  left:18px;
  bottom:18px;

  width:390px;
  height:250px;

  padding:12px;

  display:flex;
  flex-direction:column;

  background:rgba(0,0,0,.75);

  border:1px solid #333;

  pointer-events:auto;
}

#chat-title{
  font-size:9px;
  letter-spacing:3px;
  color:#777;

  margin-bottom:8px;
}

#chat-messages{
  flex:1;

  overflow-y:auto;

  margin-bottom:8px;
}

.msg{
  margin-bottom:7px;

  font-size:12px;
  line-height:1.4;
}

.msg .u{
  color:#fff;
  font-weight:bold;
}

.msg .t{
  color:#aaa;
}

#chat-form{
  display:flex;
  gap:6px;
}

#chat-input{
  flex:1;
  height:35px;
  margin:0;
}

#chat-send{
  width:45px;

  border:0;

  background:#fff;
  color:#000;

  cursor:pointer;
}


/* =========================================================
   CLUB SCREEN / MEDIA
========================================================= */

#screen-control{
  position:fixed;
  top:108px;
  left:50%;
  transform:translateX(-50%);
  z-index:31;
  pointer-events:auto;
  height:34px;
  padding:0 18px;
  border:1px solid #444;
  background:rgba(0,0,0,.78);
  color:#fff;
  font-size:10px;
  font-weight:bold;
  letter-spacing:3px;
  cursor:pointer;
}

#screen-control:hover{
  background:#fff;
  color:#000;
}

#screen-menu{
  position:fixed;
  top:148px;
  left:50%;
  transform:translateX(-50%);
  z-index:40;
  width:min(560px,calc(100vw - 30px));
  padding:16px;
  background:rgba(4,4,4,.96);
  border:1px solid #444;
  box-shadow:0 20px 70px rgba(0,0,0,.7);
  display:none;
  pointer-events:auto;
}

#screen-menu.open{display:block;}

#screen-menu-title{
  font-size:10px;
  letter-spacing:3px;
  color:#fff;
  margin-bottom:10px;
}

#screen-menu-row{
  display:flex;
  gap:7px;
}

#screen-url{
  flex:1;
  margin:0;
  height:38px;
}

.screen-btn{
  height:38px;
  padding:0 13px;
  border:1px solid #444;
  background:#111;
  color:#fff;
  cursor:pointer;
  font-size:10px;
  letter-spacing:1px;
}

.screen-btn:hover{
  background:#fff;
  color:#000;
}

#screen-status{
  margin-top:9px;
  color:#777;
  font-size:10px;
  line-height:1.4;
}

#css3d-container{position:absolute;inset:0;width:100%;height:100%;z-index:15;pointer-events:none;overflow:hidden;}
#css3d-screen{width:1400px;height:600px;position:absolute;left:0;top:0;background:#000;border:1px solid #222;box-shadow:0 0 45px rgba(0,0,0,.9);pointer-events:auto;overflow:hidden;display:none;}
#css3d-screen.active{display:block;}
#css3d-screen iframe{width:100%;height:100%;border:0;display:block;background:#000;pointer-events:auto;}
#css3d-screen-close{position:absolute;top:7px;right:7px;z-index:2;width:28px;height:28px;border:1px solid #555;background:rgba(0,0,0,.85);color:#fff;cursor:pointer;font-size:14px;line-height:26px;}

@media(max-width:700px){
  #screen-menu-row{flex-wrap:wrap;}
  #screen-url{flex-basis:100%;}
}

/* =========================================================
   EMOTES / DANCES
========================================================= */
#emotes-control{position:fixed;left:50%;bottom:58px;transform:translateX(-50%);z-index:32;pointer-events:auto;height:34px;padding:0 18px;border:1px solid #444;background:rgba(0,0,0,.82);color:#fff;font-size:10px;font-weight:bold;letter-spacing:3px;cursor:pointer;}
#emotes-control:hover{background:#fff;color:#000;}
#emotes-menu{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);z-index:41;width:250px;padding:10px;background:rgba(4,4,4,.97);border:1px solid #444;box-shadow:0 20px 70px rgba(0,0,0,.7);display:none;pointer-events:auto;}
#emotes-menu.open{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.emote-btn{height:36px;border:1px solid #333;background:#111;color:#fff;cursor:pointer;font-size:10px;letter-spacing:1px;}
.emote-btn:hover{background:#fff;color:#000;}
#emote-stop{grid-column:1/-1;}
/* =========================================================
   OTHER HUD
========================================================= */

#hint{
  position:absolute;

  right:18px;
  bottom:18px;

  padding:9px 12px;

  background:rgba(0,0,0,.65);

  border:1px solid #292929;

  color:#777;

  font-size:10px;
  letter-spacing:1px;
}

#stream-indicator{
  display:none !important;
  position:absolute;

  top:18px;
  left:50%;

  transform:translateX(-50%);

  padding:6px 12px;

  background:rgba(0,0,0,.75);

  border:1px solid #333;

  color:#777;

  font-family:monospace;

  font-size:10px;
  letter-spacing:2px;
}

#stream-indicator.live{
  color:#fff;
  border-color:#aaa;
}

#stream-indicator.error{
  color:#ff5555;
  border-color:#ff5555;
}

#lang-bar{
  position:absolute;

  right:220px;
  top:18px;

  pointer-events:auto;
}

#lang{
  background:#080808;

  border:1px solid #333;

  color:#aaa;

  padding:7px 10px;
}

#zone-label{
  position:absolute;

  left:50%;
  bottom:90px;

  transform:translateX(-50%);

  font-size:10px;

  letter-spacing:5px;

  color:rgba(255,255,255,.4);

  pointer-events:none;
}

#audio-control{
  display:none !important;
  position:absolute;

  top:58px;
  left:50%;

  transform:translateX(-50%);

  z-index:100;

  pointer-events:auto;

  padding:9px 14px;

  border:1px solid #444;

  background:rgba(0,0,0,.78);

  color:#aaa;

  font-family:monospace;

  font-size:10px;

  letter-spacing:2px;

  cursor:pointer;
}

#audio-control.live{
  color:#fff;
  border-color:#aaa;
}

#audio-control:disabled{
  opacity:.7;
  cursor:wait;
}

#ews-audio{
  position:absolute;

  width:1px;
  height:1px;

  opacity:0;

  pointer-events:none;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

  #top-logo{
    top:12px;
    left:12px;
    font-size:22px;
  }

  #top-logo span{
    font-size:9px;
  }

  #lang-bar{
    right:12px;
    top:12px;
  }

  #lang{
    padding:6px 7px;
    font-size:11px;
  }

  #online-box{
    top:52px;
    right:12px;

    width:145px;

    padding:9px;

    max-height:105px;
  }

  #online-list{
    max-height:62px;
    font-size:10px;
  }

  #online-box h3{
    font-size:8px;
    margin-bottom:5px;
  }

  #online-list li{
    padding:2px 0;
  }

  #stream-indicator{
    top:52px;
    left:12px;

    transform:none;

    padding:5px 8px;

    font-size:8px;
  }

  #audio-control{
    top:84px;
    left:12px;

    transform:none;

    padding:8px 10px;

    font-size:8px;

    z-index:150;
  }

  #chat{
    left:10px;
    right:10px;
    bottom:10px;

    width:auto;

    height:31vh;

    min-height:190px;
    max-height:270px;

    padding:9px;

    z-index:200;

    background:rgba(0,0,0,.86);
  }

  #chat-title{
    font-size:8px;
    margin-bottom:6px;
  }

  #chat-messages{
    font-size:11px;
    margin-bottom:6px;
  }

  .msg{
    font-size:11px;
    margin-bottom:5px;
  }

  #chat-input{
    height:38px;

    font-size:14px;

    padding:0 9px;
  }

  #chat-send{
    width:44px;

    font-size:18px;
  }

  #hint{
    display:none;
  }

  #zone-label{
    bottom:calc(31vh + 20px);

    font-size:8px;
  }
}

@media(max-width:420px){

  #online-box{
    width:125px;
  }

  #chat{
    height:34vh;
    min-height:185px;
  }

  #zone-label{
    bottom:calc(34vh + 20px);
  }
}



#seat-prompt{
  position:fixed;
  left:50%;
  bottom:52px;
  transform:translateX(-50%);
  z-index:35;
  padding:9px 14px;
  background:rgba(0,0,0,.82);
  border:1px solid #444;
  color:#fff;
  font-size:10px;
  letter-spacing:2px;
  display:none;
  pointer-events:none;
}
#seat-prompt.show{display:block;}
</style>
</head>

<body>

<div id="app">

<canvas id="canvas3d"></canvas>

<div id="css3d-container">
  <div id="css3d-screen">
    <iframe id="media-screen-frame" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen></iframe>
  </div>
</div>

<audio
  id="ews-audio"
  crossorigin="anonymous"
  playsinline
  preload="auto">
</audio>

<!-- =====================================================
     LOGIN
===================================================== -->

<div id="login">

  <div class="login-box">

    <h1>EWS</h1>

    <p>
      SESSIONS / UNDERGROUND CLUB
    </p>

    <div class="tabs">

      <button
        class="tab active"
        onclick="switchTab('login')">
        ВХОД
      </button>

      <button
        class="tab"
        onclick="switchTab('register')">
        РЕГИСТРАЦИЯ
      </button>

    </div>

    <input
      id="f-username"
      placeholder="USERNAME"
      autocomplete="username"
    >

    <input
      id="f-password"
      type="password"
      placeholder="PASSWORD"
      autocomplete="current-password"
    >

    <button
      class="btn"
      id="submitBtn"
      onclick="doLogin()">
      ВОЙТИ
    </button>

    <div
      id="error"
      class="error">
    </div>

  </div>

</div>

<!-- =====================================================
     HUD
===================================================== -->

<div id="hud">

  <div id="top-logo">
    EWS
    <span>SESSIONS</span>
  </div>

  <div id="seat-prompt"></div>

  <button
    id="screen-control"
    onclick="toggleScreenMenu()">
    SCREEN
  </button>

  <div id="screen-menu">
    <div id="screen-menu-title">EWS SESSIONS / CLUB SCREEN</div>
    <div id="screen-menu-row">
      <input
        id="screen-url"
        type="url"
        placeholder="YouTube / Twitch / website URL"
        autocomplete="off"
      >
      <button class="screen-btn" onclick="loadClubScreen()">LOAD</button>
      <button class="screen-btn" onclick="clearClubScreen()">CLEAR</button>
    </div>
    <div id="screen-status">YouTube и Twitch открываются со звуком через официальный embed. Для звука браузер может потребовать первый клик.</div>
  </div>

  <button id="emotes-control" onclick="toggleEmotesMenu()">EMOTES</button>

  <div id="emotes-menu">
    <button class="emote-btn" onclick="playDance(1)">DANCE 01</button>
    <button class="emote-btn" onclick="playDance(2)">DANCE 02</button>
    <button class="emote-btn" onclick="playDance(3)">SHUFFLE</button>
    <button class="emote-btn" onclick="playDance(4)">ROBOT</button>
    <button class="emote-btn" onclick="playDance(5)">BOUNCE</button>
    <button class="emote-btn" onclick="playDance(6)">WAVE</button>
    <button id="emote-stop" class="emote-btn" onclick="stopDance()">STOP DANCE</button>
  </div>

  <div id="lang-bar">

    <select id="lang">

      <option value="ru">RU</option>
      <option value="en">EN</option>
      <option value="es">ES</option>
      <option value="de">DE</option>
      <option value="fr">FR</option>
      <option value="zh">中文</option>
      <option value="ja">日本語</option>
      <option value="ko">한국어</option>
      <option value="ar">AR</option>
      <option value="hi">HI</option>
      <option value="pt">PT</option>
      <option value="it">IT</option>
      <option value="tr">TR</option>
      <option value="uk">UA</option>

    </select>

  </div>

  <div id="online-box">

    <h3>
      ONLINE
    </h3>

    <ul id="online-list"></ul>

  </div>

  <div id="chat">

    <div id="chat-title">
      EWS SESSIONS / CHAT
    </div>

    <div id="chat-messages"></div>

    <form id="chat-form">

      <input
        id="chat-input"
        autocomplete="off"
        placeholder="write something..."
      >

      <button id="chat-send">
        →
      </button>

    </form>

  </div>


  <div id="zone-label">
    MAIN FLOOR
  </div>

  <div id="hint">
    WASD MOVE · MOUSE LOOK · C CHAT
  </div>

</div>

</div>

<script>

let mode='login';

let socket=null;
let currentUser=null;

let scene;
let camera;
let renderer;
let cssScene;
let cssRenderer;
let cssScreenObject;

let keys={};

// JUMP / GRAVITY
let jumpVelocity=0;
let playerY=1.7;
const GROUND_Y=1.7;
const JUMP_FORCE=7.2;
const GRAVITY=18;
let isGrounded=true;

let yaw=0;
let pitch=0;

let pointerLocked=false;
let chatMode=false;

let clock=new THREE.Clock();

let neonObjects=[];
let lightObjects=[];

let particles;

let analyser=null;
let freqData=null;

let audioLevel=0;
let bassLevel=0;

let audioContext=null;
let audioSource=null;

let audioStarted=false;

let hls=null;

let screenTexture;
let screenCanvas;
let screenCtx;
let screenMesh;
let screenMediaActive=false;
let screenMediaUrl='';
let onlineUserList=[];
let remotePlayers=new Map();
let lastPlayerBroadcast=0;
let clubScreenHost=null;
let activeDance=0;
let danceStartedAt=0;

let playerBody;
let collisionBoxes=[];
let seats=[];
let nearbySeat=null;
let seatedSeatId=null;
let localAvatarColor=0xffffff;

/* =========================================================
   EWS TEXTURES
   CC0 seamless textures from ShareTextures
========================================================= */

const EWS_TEXTURES = {
  concrete: 'https://images.sharetextures.com/u/concrete_black_mat-min.webp',
  floor: 'https://images.sharetextures.com/u/stone_floor_1-min.webp'
};

const ewsTextureLoader = new THREE.TextureLoader();

function loadEWSTexture(url, repeatX=4, repeatY=4){
  const texture = ewsTextureLoader.load(url);
  texture.wrapS = THREE.RepeatWrapping;
  texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(repeatX, repeatY);
  texture.anisotropy = Math.min(8, renderer ? renderer.capabilities.getMaxAnisotropy() : 8);
  texture.colorSpace = THREE.SRGBColorSpace;
  return texture;
}

/* =========================================================
   LOGIN
========================================================= */

function switchTab(type){

  mode=type;

  document
    .querySelectorAll('.tab')
    .forEach(
      t=>t.classList.remove('active')
    );

  if(type==='login'){

    document
      .querySelectorAll('.tab')[0]
      .classList.add('active');

    document.getElementById(
      'submitBtn'
    ).textContent='ВОЙТИ';

  }else{

    document
      .querySelectorAll('.tab')[1]
      .classList.add('active');

    document.getElementById(
      'submitBtn'
    ).textContent='СОЗДАТЬ АККАУНТ';

  }

  document.getElementById(
    'error'
  ).textContent='';

}

async function doLogin(){

  const username =
    document
      .getElementById('f-username')
      .value
      .trim();

  const password =
    document
      .getElementById('f-password')
      .value;

  const error =
    document.getElementById('error');

  error.textContent='';

  if(!username || !password){

    error.textContent=
      'Введите логин и пароль';

    return;
  }

  try{

    const res =
      await fetch(
        '/api/'+mode,
        {
          method:'POST',

          headers:{
            'Content-Type':
              'application/json'
          },

          body:JSON.stringify({
            username,
            password
          })
        }
      );

    const data =
      await res.json();

    if(data.error){

      error.textContent=
        data.error;

      return;
    }

    startSession(username);

  }catch(err){

    console.error(err);

    error.textContent=
      'Ошибка соединения';

  }

}

/* =========================================================
   SESSION
========================================================= */

function startSession(username){

  currentUser=username;

  document.getElementById(
    'login'
  ).style.display='none';

  document.getElementById(
    'hud'
  ).style.display='block';

  // SCREEN button is a HUD control and belongs only to mvxtra.
  clubScreenHost='mvxtra';
  const screenButton=document.getElementById('screen-control');
  if(screenButton){
    screenButton.style.display = String(currentUser).toLowerCase()==='mvxtra' ? 'block' : 'none';
  }

  init3D();

  socket=io();

  socket.on('connect',function(){

    socket.emit(
      'join',
      {
        username: currentUser,
        language:
          document.getElementById('lang').value
      }
    );

  });

  socket.on(
    'online-users',
    list=>{

      onlineUserList=Array.isArray(list)?list:[];
      // Screen control belongs ONLY to mvxtra. Never use the first online user as host.
      clubScreenHost='mvxtra';

      const ul =
        document.getElementById('online-list');

      ul.innerHTML='';

      const screenButton=document.getElementById('screen-control');
      if(screenButton){ screenButton.style.display=isClubHost()?'block':'none'; }

      if(!Array.isArray(list)) return;

      list.forEach(user=>{

        const li =
          document.createElement('li');

        const name =
          typeof user === 'string'
            ? user
            : user.username;

        li.textContent =
          name === currentUser
            ? name + ' (YOU)'
            : name;

        ul.appendChild(li);

      });

    }
  );

  socket.on(
    'chat-message',
    message=>{

      const el =
        document.createElement(
          'div'
        );

      el.className='msg';

      const time =
        new Date(
          message.ts
        ).toLocaleTimeString();

      const user =
        document.createElement(
          'span'
        );

      user.className='u';

      user.textContent=
        message.user;

      const text =
        document.createElement(
          'span'
        );

      text.className='t';

      text.textContent=
        ' '+time+' '+message.text;

      el.appendChild(user);

      el.appendChild(
        document.createTextNode(' ')
      );

      el.appendChild(text);

      const box =
        document.getElementById(
          'chat-messages'
        );

      box.appendChild(el);

      box.scrollTop=
        box.scrollHeight;

    }
  );

  socket.on('club-screen-state', state=>{
    applyRemoteClubScreen(state);
  });

  // =====================================================
  // MULTIPLAYER — initial snapshot + live updates
  // =====================================================

  socket.on('players-state', list=>{
    if(!Array.isArray(list)) return;

    // Server sends everyone except the current socket.
    // Rebuild only the missing players so existing objects keep moving smoothly.
    const alive = new Set();

    list.forEach(data=>{
      if(!data || !data.id || data.id===socket.id) return;
      alive.add(data.id);
      updateRemotePlayer(data);
    });

    // Remove players that are no longer present in the server snapshot.
    Array.from(remotePlayers.keys()).forEach(id=>{
      if(!alive.has(id)) removeRemotePlayer(id);
    });
  });

  socket.on('player-joined', data=>{
    if(!data || !data.id || data.id===socket.id) return;
    updateRemotePlayer(data);
  });

  socket.on('player-state', data=>{
    if(!data || !data.id || data.id===socket.id) return;
    updateRemotePlayer(data);
  });

  // Compatibility with the older multiplayer event name.
  socket.on('player-move', data=>{
    if(!data || !data.id || data.id===socket.id) return;
    updateRemotePlayer(data);
  });

  socket.on('player-left', id=>{
    removeRemotePlayer(id);
  });

  socket.on('player-removed', id=>{
    removeRemotePlayer(id);
  });

  // Ask the server for a fresh snapshot after every connection.
  socket.on('joined', ()=>{
    socket.emit('request-players');
    socket.emit('request-club-screen');
  });

}

function createBox(
  w,h,d,
  x,y,z,
  material,
  cast=true,
  receive=true
){

  const mesh =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        w,h,d
      ),
      material
    );

  mesh.position.set(
    x,y,z
  );

  mesh.castShadow=
    cast;

  mesh.receiveShadow=
    receive;

  scene.add(mesh);

  return mesh;

}

function createLight(
  x,y,z,
  color,
  intensity,
  distance
){

  const light =
    new THREE.PointLight(
      color,
      intensity,
      distance
    );

  light.position.set(
    x,y,z
  );

  light.castShadow=true;

  scene.add(light);

  lightObjects.push(
    light
  );

  return light;

}

function addCollisionBox(x,z,w,d,opts={}){
  collisionBoxes.push({x,z,w,d,kind:opts.kind||'solid',seatId:opts.seatId||null});
}

function buildCollisionMap(){
  collisionBoxes=[];
  // Room walls — leave a wide central entrance opening.
  addCollisionBox(0,-17,36,.55,{kind:'wall'});
  addCollisionBox(-17.75,0,.55,34,{kind:'wall'});
  addCollisionBox(17.75,0,.55,34,{kind:'wall'});
  addCollisionBox(-8.0,17,.55,1.1,{kind:'wall'});
  addCollisionBox(8.0,17,.55,1.1,{kind:'wall'});

  // Stage / screen wall.
  addCollisionBox(0,-12.5,17,3,{kind:'stage'});
  addCollisionBox(0,-16.48,14.8,.7,{kind:'screen'});

  // Bar block.
  addCollisionBox(-12,7,8.3,2.3,{kind:'bar'});

  // Lounge sofa + side sofa.
  addCollisionBox(11,8,6,1.7,{kind:'sofa'});
  addCollisionBox(14,8,1.8,5.5,{kind:'sofa'});

  // Columns.
  [[-15,5],[15,5],[-15,-5],[15,-5]].forEach(([x,z])=>addCollisionBox(x,z,1.15,1.15,{kind:'column'}));

  // Main speaker cabinets.
  [[-8,-11],[8,-11],[-11,-10],[11,-10]].forEach(([x,z])=>addCollisionBox(x,z,1.35,.95,{kind:'speaker'}));

  // Seat bases are solid enough to stop players from walking through them.
  seats.forEach(seat=>addCollisionBox(seat.x,seat.z,.72,.72,{kind:'seat',seatId:seat.id}));
}

function circleHitsBox(x,z,r,b){
  const minX=b.x-b.w/2-r, maxX=b.x+b.w/2+r;
  const minZ=b.z-b.d/2-r, maxZ=b.z+b.d/2+r;
  return x>minX && x<maxX && z>minZ && z<maxZ;
}

function isPositionBlocked(x,z,r=.42){
  return collisionBoxes.some(b=>circleHitsBox(x,z,r,b));
}

function moveWithCollision(dx,dz){
  if(seatedSeatId) return;
  const r=.42;
  const x0=camera.position.x, z0=camera.position.z;
  let nx=x0+dx, nz=z0+dz;
  if(!isPositionBlocked(nx,z0,r)) x0=nx;
  if(!isPositionBlocked(x0,nz,r)) z0=nz;
  camera.position.x=THREE.MathUtils.clamp(x0,-17.1,17.1);
  camera.position.z=THREE.MathUtils.clamp(z0,-16.3,16.3);
}

function updateNearbySeat(){
  const prompt=document.getElementById('seat-prompt');
  if(!prompt || !camera) return;
  if(seatedSeatId){
    prompt.textContent='E / SPACE — ВСТАТЬ';
    prompt.classList.add('show');
    nearbySeat=null;
    return;
  }
  let best=null,bestDist=1.25;
  for(const seat of seats){
    const d=Math.hypot(camera.position.x-seat.x,camera.position.z-seat.z);
    if(d<bestDist){best=seat;bestDist=d;}
  }
  nearbySeat=best;
  if(best){
    prompt.textContent='E — СЕСТЬ';
    prompt.classList.add('show');
  }else{
    prompt.classList.remove('show');
  }
}

function requestSeatToggle(){
  if(!socket || !socket.connected) return;
  if(seatedSeatId){ socket.emit('seat-request',{action:'stand',seatId:seatedSeatId}); return; }
  if(nearbySeat) socket.emit('seat-request',{action:'sit',seatId:nearbySeat.id});
}

function applyLocalSeat(state){
  if(!state){ return; }
  seatedSeatId=state.seatId||null;
  if(seatedSeatId){
    const seat=seats.find(s=>s.id===seatedSeatId);
    if(seat){
      camera.position.set(seat.x,seat.y,seat.z);
      yaw=seat.ry||0; pitch=0; isGrounded=true; jumpVelocity=0;
    }
  }
  updateNearbySeat();
}

function createParticles(){

  const count=900;

  const geo =
    new THREE.BufferGeometry();

  const pos =
    new Float32Array(
      count*3
    );

  for(
    let i=0;
    i<count;
    i++
  ){

    pos[i*3]=
      (Math.random()-.5)*34;

    pos[i*3+1]=
      Math.random()*5.8;

    pos[i*3+2]=
      (Math.random()-.5)*34;

  }

  geo.setAttribute(
    'position',
    new THREE.BufferAttribute(
      pos,
      3
    )
  );

  particles =
    new THREE.Points(
      geo,
      new THREE.PointsMaterial({
        color:0xffffff,
        size:.035,
        transparent:true,
        opacity:.28
      })
    );

  scene.add(
    particles
  );

}

function colorFromName(name){
  let h=0; for(const ch of String(name||'player')) h=(h*31+ch.charCodeAt(0))>>>0;
  const palette=[0x9ee7ff,0xd8b4ff,0xffc1d9,0xb7ffcf,0xffe0a6,0xc8d0ff];
  return palette[h%palette.length];
}

function setupAudio(){

  const button=document.getElementById('audio-control');

  if(button) button.style.display='none';

async function unlockEWSAudio(){

  const audio = document.getElementById('ews-audio');
  if(!audio) return false;

  try{
    if(audioContext && audioContext.state === 'suspended'){
      await audioContext.resume();
    }

    if(audioStarted && audio.paused){
      await audio.play();
      return true;
    }

    // If the stream was blocked by autoplay policy, retry the full
    // HLS startup from this real user interaction.
    if(!audioStarted){
      await startSSHAudio();
      return true;
    }
  }catch(err){
    console.warn('[EWS AUDIO UNLOCK]', err);
  }

  return false;
}

async function startSSHAudio(){

  const audio =
    document.getElementById(
      'ews-audio'
    );

  const indicator =
    document.getElementById(
      'stream-indicator'
    );

  const button =
    document.getElementById(
      'audio-control'
    );

  if(!audio)return;

  const hlsUrl =
    window.location.origin+
    '/hls/ews/index.m3u8';

  indicator.classList.remove(
    'error'
  );

  indicator.classList.add(
    'live'
  );

  indicator.textContent=
    'AUDIO: CONNECTING...';

  button.disabled=true;

  button.textContent=
    '● AUDIO: CONNECTING';

  try{

    if(!audioContext){

      audioContext =
        new(
          window.AudioContext ||
          window.webkitAudioContext
        )();

      audioSource =
        audioContext.createMediaElementSource(
          audio
        );

      analyser =
        audioContext.createAnalyser();

      analyser.fftSize=256;

      analyser.smoothingTimeConstant=.82;

      freqData =
        new Uint8Array(
          analyser.frequencyBinCount
        );

      audioSource.connect(
        analyser
      );

      analyser.connect(
        audioContext.destination
      );

    }

    if(
      audioContext.state===
      'suspended'
    ){

      await audioContext.resume();

    }

    if(hls){

      try{
        hls.destroy();
      }catch(e){}

      hls=null;

    }

    if(
      window.Hls &&
      Hls.isSupported()
    ){

      hls =
        new Hls({

          enableWorker:true,

          lowLatencyMode:true,

          backBufferLength:30,

          maxBufferLength:10,

          maxMaxBufferLength:20,

          liveSyncDurationCount:3,

          liveMaxLatencyDurationCount:6

        });

      hls.loadSource(
        hlsUrl
      );

      hls.attachMedia(
        audio
      );

      hls.on(
        Hls.Events.MANIFEST_PARSED,
        async function(){

          indicator.textContent=
            'AUDIO: LIVE';

          button.textContent=
            '● AUDIO: LIVE';

          button.classList.add(
            'live'
          );

          button.disabled=false;

          audioStarted=true;

          try{

            await audio.play();

          }catch(err){

            console.warn(
              'Audio play blocked:',
              err
            );

            indicator.textContent=
              'AUDIO: PRESS START';

            button.textContent=
              '▶ AUDIO: START';

            button.classList.remove(
              'live'
            );

          }

        }
      );

      hls.on(
        Hls.Events.ERROR,
        function(
          event,
          data
        ){

          console.error(
            '[HLS]',
            data
          );

          if(!data.fatal)return;

          if(
            data.type===
            Hls.ErrorTypes.NETWORK_ERROR
          ){

            indicator.textContent=
              'AUDIO: RECONNECTING...';

            button.textContent=
              '● AUDIO: RECONNECTING';

            setTimeout(
              function(){

                if(hls){

                  try{
                    hls.startLoad();
                  }catch(e){}

                }

              },
              1000
            );

          }

          else if(
            data.type===
            Hls.ErrorTypes.MEDIA_ERROR
          ){

            indicator.textContent=
              'AUDIO: RECOVERING...';

            try{

              hls.recoverMediaError();

            }catch(e){

              console.error(e);

            }

          }

          else{

            indicator.textContent=
              'AUDIO: NO STREAM';

            indicator.classList.remove(
              'live'
            );

            indicator.classList.add(
              'error'
            );

            button.textContent=
              '▶ AUDIO: RETRY';

            button.classList.remove(
              'live'
            );

            button.disabled=false;

          }

        }
      );

    }

    else if(
      audio.canPlayType(
        'application/vnd.apple.mpegurl'
      )
    ){

      audio.src=
        hlsUrl;

      audio.addEventListener(
        'loadedmetadata',
        async function(){

          try{

            await audio.play();

          }catch(err){

            console.error(err);

          }

        },
        {
          once:true
        }
      );

    }

    else{

      throw new Error(
        'HLS is not supported by this browser'
      );

    }

    audio.onplaying=function(){

      indicator.textContent=
        'AUDIO: LIVE';

      indicator.classList.add(
        'live'
      );

      indicator.classList.remove(
        'error'
      );

      button.textContent=
        '● AUDIO: LIVE';

      button.classList.add(
        'live'
      );

      button.disabled=false;

      audioStarted=true;

    };

    audio.onpause=function(){

      if(
        audioStarted &&
        !audio.ended
      ){

        indicator.textContent=
          'AUDIO: PAUSED';

        button.textContent=
          '▶ AUDIO: RESUME';

        button.classList.remove(
          'live'
        );

      }

    };

    audio.onerror=function(){

      console.error(
        '[AUDIO]',
        audio.error
      );

      indicator.textContent=
        'AUDIO: ERROR';

      indicator.classList.remove(
        'live'
      );

      indicator.classList.add(
        'error'
      );

      button.textContent=
        '▶ AUDIO: RETRY';

      button.classList.remove(
        'live'
      );

      button.disabled=false;

    };

  }catch(err){

    console.error(
      '[EWS AUDIO ERROR]',
      err
    );

    indicator.textContent=
      'AUDIO: NO STREAM';

    indicator.classList.remove(
      'live'
    );

    indicator.classList.add(
      'error'
    );

    button.textContent=
      '▶ AUDIO: RETRY';

    button.classList.remove(
      'live'
    );

    button.disabled=false;

  }

}

function setupControls(){

  window.addEventListener(
    'resize',
    function(){

      if(
        !camera ||
        !renderer
      ){
        return;
      }

      camera.aspect=
        innerWidth/
        innerHeight;

      camera.updateProjectionMatrix();

      renderer.setSize(
        innerWidth,
        innerHeight
      );

      if(cssRenderer){
        cssRenderer.setSize(innerWidth,innerHeight);
      }

    }
  );

  window.addEventListener(
    'keydown',
    function(e){

      // While typing, movement keys must never get stuck in the 3D controller.
      const active=document.activeElement;
      const typing=active && (active.tagName==='INPUT' || active.tagName==='TEXTAREA');

      if(e.code==='Escape' && chatMode){
        e.preventDefault();
        chatMode=false;
        const input=document.getElementById('chat-input');
        if(input) input.blur();
        keys={};
        return;
      }

      if(typing && !chatMode){
        return;
      }

      if(chatMode && active && active.id==='chat-input'){
        if(e.code==='KeyW' || e.code==='KeyA' || e.code==='KeyS' || e.code==='KeyD' || e.code==='ArrowUp' || e.code==='ArrowDown' || e.code==='ArrowLeft' || e.code==='ArrowRight'){
          return;
        }
      }

      if(!chatMode){
        if(e.code==='KeyE'){ requestSeatToggle(); e.preventDefault(); return; }
        if(e.code==='KeyB'){ toggleEmotesMenu(); e.preventDefault(); return; }
        if(e.code==='Digit1'){ playDance(1); e.preventDefault(); return; }
        if(e.code==='Digit2'){ playDance(2); e.preventDefault(); return; }
        if(e.code==='Digit3'){ playDance(3); e.preventDefault(); return; }
        if(e.code==='Digit4'){ playDance(4); e.preventDefault(); return; }
        if(e.code==='Digit5'){ playDance(5); e.preventDefault(); return; }
        if(e.code==='Digit6'){ playDance(6); e.preventDefault(); return; }
        if(['KeyW','KeyA','KeyS','KeyD','Space'].includes(e.code) && activeDance){ stopDance(); }
      }

      keys[e.code]=true;

      if(
        e.code==='KeyC'
      ){

        chatMode=
          !chatMode;

        toggleChat();

      }

      // SPACE = JUMP
      // Пока открыт чат — пробел остаётся обычным пробелом.
      if(
        e.code==='Space' &&
        !chatMode &&
        pointerLocked &&
        isGrounded
      ){
        if(seatedSeatId){ requestSeatToggle(); e.preventDefault(); return; }

        e.preventDefault();

        jumpVelocity=JUMP_FORCE;
        isGrounded=false;

      }

    }
  );

  window.addEventListener(
    'keyup',
    function(e){

      keys[e.code]=false;

    }
  );

  const canvas =
    document.getElementById(
      'canvas3d'
    );

  canvas.addEventListener(
    'click',
    function(){

      if(!chatMode){

        canvas.requestPointerLock();

      }

    }
  );

  document.addEventListener(
    'pointerlockchange',
    function(){

      pointerLocked=
        document.pointerLockElement===
        canvas;

    }
  );

  document.addEventListener(
    'mousemove',
    function(e){

      if(!pointerLocked)return;

      yaw-=
        e.movementX*.002;

      pitch-=
        e.movementY*.002;

      pitch=
        Math.max(
          -1.45,
          Math.min(
            1.45,
            pitch
          )
        );

    }
  );

}

function toggleScreenMenu(){

function setScreenStatus(text){
  const el=document.getElementById('screen-status');

function youtubeEmbed(url){
  try{
    const u=new URL(url);
    let id='';
    if(u.hostname.includes('youtu.be')){
      id=u.pathname.split('/').filter(Boolean)[0]||'';
    }else if(u.hostname.includes('youtube.com')){
      id=u.searchParams.get('v')||'';
      if(!id && u.pathname.startsWith('/shorts/')) id=u.pathname.split('/')[2]||'';
      if(!id && u.pathname.startsWith('/embed/')) id=u.pathname.split('/')[2]||'';
    }
    if(!id) return null;
    return 'https://www.youtube.com/embed/'+encodeURIComponent(id)+'?autoplay=1&rel=0&playsinline=1';
  }catch(e){ return null; }
}

function twitchEmbed(url){
  try{
    const u=new URL(url);
    if(!u.hostname.includes('twitch.tv')) return null;
    const parts=u.pathname.split('/').filter(Boolean);
    if(!parts.length) return null;
    const parent=location.hostname || 'ews-sessions.onrender.com';
    if(parts[0]==='videos' && parts[1]){
      return 'https://player.twitch.tv/?video='+encodeURIComponent(parts[1])+'&parent='+encodeURIComponent(parent)+'&autoplay=true';
    }
    return 'https://player.twitch.tv/?channel='+encodeURIComponent(parts[0])+'&parent='+encodeURIComponent(parent)+'&autoplay=true';
  }catch(e){ return null; }
}

function normalizeClubScreenUrl(raw){
  const value=String(raw||'').trim();
  if(!value) return null;

  const yt=youtubeEmbed(value);
  if(yt) return {src:yt,name:'YOUTUBE'};

  const tw=twitchEmbed(value);
  if(tw) return {src:tw,name:'TWITCH'};

  try{
    const u=new URL(value);
    if(u.protocol!=='http:' && u.protocol!=='https:') return null;
    return {src:u.href,name:'WEBSITE'};
  }catch(e){
    return null;
  }
}

function isClubHost(){
  return String(currentUser||'').trim().toLowerCase()==='mvxtra';
}

function loadClubScreen(){
  if(!isClubHost()){ setScreenStatus('Только главный пользователь клуба может включать экран.'); return; }
  const input=document.getElementById('screen-url'); const frame=document.getElementById('media-screen-frame'); const panel=document.getElementById('css3d-screen');
  if(!input||!frame||!panel)return; const result=normalizeClubScreenUrl(input.value);
  if(!result){setScreenStatus('Неверная ссылка. Вставь YouTube, Twitch или обычный https:// сайт.');return;}
  frame.src=result.src; panel.classList.add('active'); screenMediaActive=true; screenMediaUrl=result.src;
  setScreenStatus(result.name+' LOADED — экран закреплён. Нажми ESC, чтобы выйти из управления камерой и кликать по плееру.');
  if(socket)socket.emit('club-screen-state',{src:result.src,url:input.value.trim(),name:result.name,active:true,owner:currentUser});
  const menu=document.getElementById('screen-menu'); if(menu)menu.classList.remove('open');
}

// When the user wants to click the embedded player, release pointer lock first.
// The 3D screen remains physically fixed to the wall; only mouse control is released.
function enableScreenInteraction(){

    try{ document.exitPointerLock(); }catch(e){}
  }
  const panel=document.getElementById('css3d-screen');
  if(panel){ panel.style.pointerEvents='auto'; }
}

document.addEventListener('mousedown',function(e){

/* =========================================================
   REMOTE CLUB SCREEN
   The server sends one shared screen state to every guest.
   This function is intentionally separate from loadClubScreen()
   because friends must never need to be the host to display it.
========================================================= */
function applyRemoteClubScreen(state){
  const frame=document.getElementById('media-screen-frame');
  const panel=document.getElementById('css3d-screen');
  if(!frame || !panel) return;

  state=state || {};

  if(state.active !== true || !state.src){
    frame.src='about:blank';
    panel.classList.remove('active');
    screenMediaActive=false;
    screenMediaUrl='';
    return;
  }

  // Prefer the original URL so every guest builds its own embed URL.
  // This is important for Twitch because the embed parent must match the
  // hostname used by the guest's browser, not the host's browser.
  let src='';
  const originalUrl=String(state.url||'').trim();
  if(originalUrl){
    const normalized=normalizeClubScreenUrl(originalUrl);
    src=normalized ? normalized.src : originalUrl;
  }else{
    src=String(state.src||'').trim();
  }
  if(!src) return;

  // Do not reload the iframe every time a duplicate Socket.IO event arrives.
  if(screenMediaUrl !== src){
    frame.src=src;
    screenMediaUrl=src;
  }

  screenMediaActive=true;
  panel.classList.add('active');

  // Make sure the iframe can play media on every guest browser.
  frame.setAttribute('allow','autoplay; fullscreen; encrypted-media; picture-in-picture');
  frame.setAttribute('allowfullscreen','');
}

/* =========================================================
   ANIMATION
========================================================= */

function animate(){

  requestAnimationFrame(
    animate
  );

  if(!scene)return;

  const dt =
    Math.min(
      clock.getDelta(),
      .05
    );

  const time =
    performance.now()/1000;

  let bass=.2;
  let level=.2;

  if(
    analyser &&
    freqData &&
    audioStarted
  ){

    analyser.getByteFrequencyData(
      freqData
    );

    let b=0;

    for(
      let i=0;
      i<10 &&
      i<freqData.length;
      i++
    ){

      b+=freqData[i];

    }

    bass=
      b/
      (
        Math.min(
          10,
          freqData.length
        )*255
      );

    let total=0;

    for(
      let i=0;
      i<freqData.length;
      i++
    ){

      total+=freqData[i];

    }

    level=
      total/
      (
        freqData.length*255
      );

  }

  else{

    bass=
      .25+
      Math.sin(time*3)*.12;

    level=
      .25+
      Math.sin(time*1.5)*.08;

  }

  bassLevel=
    bassLevel*.82+
    bass*.18;

  audioLevel=
    audioLevel*.88+
    level*.12;

  const speed=
    chatMode || activeDance
      ?0
      :5*dt;

  let forward=0;
  let side=0;

  if(
    keys['KeyW']
  ){
    forward+=1;
  }

  if(
    keys['KeyS']
  ){
    forward-=1;
  }

  if(
    keys['KeyA']
  ){
    side-=1;
  }

  if(
    keys['KeyD']
  ){
    side+=1;
  }

  // =========================
  // JUMP PHYSICS
  // =========================

  if(!chatMode){

    jumpVelocity-=
      GRAVITY*dt;

    playerY+=
      jumpVelocity*dt;

    if(playerY<=GROUND_Y){

      playerY=GROUND_Y;
      jumpVelocity=0;
      isGrounded=true;

    }

  }

  if(
    pointerLocked &&
    !chatMode
  ){

    const fx=
      -Math.sin(yaw);

    const fz=
      -Math.cos(yaw);

    const rx=
      Math.cos(yaw);

    const rz=
      -Math.sin(yaw);

    moveWithCollision(
      (fx*forward+rx*side)*speed,
      (fz*forward+rz*side)*speed
    );

  }

  camera.position.x=
    THREE.MathUtils.clamp(
      camera.position.x,
      -16,
      16
    );

  camera.position.z=
    THREE.MathUtils.clamp(
      camera.position.z,
      -15.5,
      15.5
    );

  if(seatedSeatId){
    const seat=seats.find(s=>s.id===seatedSeatId);
    if(seat){ camera.position.x=seat.x; camera.position.z=seat.z; playerY=seat.y; }
  }

  camera.position.y=playerY;
  updateNearbySeat();

  camera.rotation.order=
    'YXZ';

  camera.rotation.y=
    yaw;

  camera.rotation.x=
    pitch;

  if(playerBody){

    playerBody.position.x=
      camera.position.x;

    playerBody.position.z=
      camera.position.z;

    playerBody.visible=false;

  }

  broadcastPlayerState(performance.now());

  if(particles){

    particles.rotation.y+=
      .00015;

    particles.material.opacity=
      .22+
      audioLevel*.18;

  }

  remotePlayers.forEach(p=>{
    const t=performance.now()/1000;
    const swing=p.moving?Math.sin(t*8)*.35:0;
    const limbs=p.group.children.filter(o=>o.isMesh);
    if(limbs.length>=5){ limbs[2].rotation.x=swing; limbs[3].rotation.x=-swing; limbs[4].rotation.x=-swing; }
  });

  neonObjects.forEach(
    (obj,index)=>{

      const pulse=
        .5+
        Math.sin(
          time*3+
          index*.4
        )*.25+
        bassLevel*.7;

      const value=
        Math.min(
          1,
          pulse
        );

      obj.material.color.setRGB(
        value,
        value,
        value
      );

    }
  );

  lightObjects.forEach(
    (light,index)=>{

      light.intensity=
        1+
        bassLevel*2+
        Math.sin(
          time*2+
          index
        )*.15;

    }
  );

  if(screenCtx){

    screenCtx.fillStyle=
      '#050505';

    screenCtx.fillRect(
      0,
      0,
      1024,
      512
    );

    const grd =
      screenCtx.createLinearGradient(
        0,
        0,
        1024,
        0
      );

    const intensity=
      40+
      Math.floor(
        bassLevel*120
      );

    grd.addColorStop(
      0,
      `rgb(${intensity},${intensity},${intensity})`
    );

    grd.addColorStop(
      .5,
      '#050505'
    );

    grd.addColorStop(
      1,
      `rgb(${intensity},${intensity},${intensity})`
    );

    screenCtx.fillStyle=
      grd;

    screenCtx.fillRect(
      0,
      0,
      1024,
      512
    );

    screenCtx.fillStyle=
      '#fff';

    screenCtx.font=
      'bold 80px Arial';

    screenCtx.textAlign=
      'center';

    screenCtx.fillText(
      'EWS SESSIONS',
      512,
      200
    );

    screenCtx.font=
      '22px Arial';

    screenCtx.fillStyle=
      '#777';

    screenCtx.fillText(
      'UNDERGROUND CLUB',
      512,
      245
    );

    const bars=48;

    const bw=
      800/bars;

    for(
      let i=0;
      i<bars;
      i++
    ){

      let value;

      if(
        freqData &&
        audioStarted
      ){

        value=
          freqData[
            Math.floor(
              i*
              freqData.length/
              bars
            )
          ]/255;

      }else{

        value=
          .2+
          Math.sin(
            time*4+
            i*.5
          )*.15;

      }

      const h=
        value*180;

      screenCtx.fillStyle=
        '#fff';

      screenCtx.fillRect(
        112+i*bw,
        450-h,
        bw-3,
        h
      );

    }

    screenTexture.needsUpdate=true;

  }


  remotePlayers.forEach(p=>{
    if(p.dance) animateRemoteDance(p,time);
    else resetRemoteDancePose(p);
  });

  renderer.render(
    scene,
    camera
  );

  // Keep the HTML player exactly on the physical screen anchor.
  if(cssScreenObject && screenMesh){
    cssScreenObject.position.copy(screenMesh.position);
    cssScreenObject.rotation.copy(screenMesh.rotation);
    cssScreenObject.scale.set(0.01,0.01,0.01);
    cssScreenObject.position.z += 0.035;
  }

  if(cssRenderer && cssScene){
    cssRenderer.render(cssScene,camera);
  }

}

/* =========================================================
   REMOTE PLAYERS / SILHOUETTES
========================================================= */
function createRemotePlayer(data){
  if(!scene || !data || !data.id || data.id===socket?.id) return;
  if(remotePlayers.has(data.id)) removeRemotePlayer(data.id);
  const g=createAlienAvatar(data.username||'PLAYER',true);
  const x=Number.isFinite(Number(data.x))?Number(data.x):0;
  const z=Number.isFinite(Number(data.z))?Number(data.z):13;
  const y=Number.isFinite(Number(data.y))?Number(data.y):0;
  const ry=Number.isFinite(Number(data.yaw??data.ry))?Number(data.yaw??data.ry):0;
  g.position.set(x,y,z); g.rotation.y=ry; scene.add(g);
  remotePlayers.set(data.id,{group:g,last:{x,z,yaw:ry},moving:!!data.moving,username:data.username||'PLAYER',dance:Number(data.dance)||0,danceStartedAt:Number(data.danceStartedAt)||0,baseY:y,seated:!!data.seatId,seatId:data.seatId||null,parts:g.userData.parts});
}
function updateRemotePlayer(data){
  if(!data.id || data.id===socket?.id) return;
  if(!remotePlayers.has(data.id)) createRemotePlayer(data);
  const p=remotePlayers.get(data.id);

  const rawX=Number(data.x);
  const rawZ=Number(data.z);
  const rawY=Number(data.y);
  const rawYaw=Number(data.yaw ?? data.ry);

  const nx=Number.isFinite(rawX) ? rawX : p.group.position.x;
  const nz=Number.isFinite(rawZ) ? rawZ : p.group.position.z;
  const ny=Number.isFinite(rawY) ? rawY : p.group.position.y;
  const nyaw=Number.isFinite(rawYaw) ? rawYaw : p.group.rotation.y;

  const dx=nx-p.group.position.x;
  const dz=nz-p.group.position.z;

  p.moving=Boolean(data.moving) || Math.hypot(dx,dz)>.002;
  if(data.dance!==undefined) p.dance=Number(data.dance)||0;
  if(data.danceStartedAt!==undefined) p.danceStartedAt=Number(data.danceStartedAt)||0;
  if(data.seatId!==undefined){ p.seatId=data.seatId||null; p.seated=!!data.seatId; }
  p.group.position.x=nx;
  p.group.position.y=ny;
  p.group.position.z=nz;
  p.group.rotation.y=nyaw;
  p.last={x:nx,z:nz,yaw:nyaw};
}

function removeRemotePlayer(id){
  const p=remotePlayers.get(id);
  if(!p) return;
  scene.remove(p.group);
  p.group.traverse(o=>{ if(o.geometry) o.geometry.dispose(); if(o.material){ if(o.material.map) o.material.map.dispose(); o.material.dispose(); }});
  remotePlayers.delete(id);
}

function broadcastPlayerState(now){
  if(!socket || !socket.connected || !camera) return;
  if(now-lastPlayerBroadcast<50) return;
  lastPlayerBroadcast=now;
  const moving = Math.abs(camera.position.x-(broadcastPlayerState.lastX ?? camera.position.x)) > 0.0005 ||
                 Math.abs(camera.position.z-(broadcastPlayerState.lastZ ?? camera.position.z)) > 0.0005;

  broadcastPlayerState.lastX=camera.position.x;
  broadcastPlayerState.lastZ=camera.position.z;

  socket.emit('player-state',{
    x:camera.position.x,
    y:Math.max(0, playerY-1.7),
    z:camera.position.z,
    yaw:yaw,
    pitch:pitch,
    username:currentUser,
    moving:moving,
    jumping:!isGrounded,
    dance:activeDance,
    danceStartedAt:danceStartedAt,
    seatId:seatedSeatId||null
  });
}



/* =========================================================
   EMOTES / DANCES
========================================================= */
function toggleEmotesMenu(){
  const menu=document.getElementById('emotes-menu');
  if(menu) menu.classList.toggle('open');
}

function playDance(id){
  if(chatMode || !socket) return;
  activeDance=Math.max(1,Math.min(6,Number(id)||1));
  danceStartedAt=Date.now();
  keys={};
  try{ if(document.pointerLockElement) document.exitPointerLock(); }catch(e){}
  const menu=document.getElementById('emotes-menu');
  if(menu) menu.classList.remove('open');
  broadcastPlayerState(Date.now(),true);
}

function stopDance(){
  activeDance=0;
  danceStartedAt=0;
  const menu=document.getElementById('emotes-menu');
  if(menu) menu.classList.remove('open');
  broadcastPlayerState(Date.now(),true);
}

function animateRemoteDance(p,time){
  if(!p || !p.parts) return;
  const q=p.parts;
  const t=Math.max(0,(Date.now()-(p.danceStartedAt||Date.now()))/1000);
  const w=t*Math.PI*2;
  q.torso.rotation.set(0,0,0);
  q.head.rotation.set(0,0,0);
  q.leftArm.rotation.set(0,0,-.12); q.rightArm.rotation.set(0,0,.12);
  q.leftLeg.rotation.set(0,0,0); q.rightLeg.rotation.set(0,0,0);
  if(!p.dance) return;
  if(p.dance===1){
    q.leftArm.rotation.z=-1.1+Math.sin(w*2)*.35; q.rightArm.rotation.z=1.1-Math.sin(w*2)*.35;
    q.leftLeg.rotation.z=Math.sin(w)*.35; q.rightLeg.rotation.z=-Math.sin(w)*.35;
    q.torso.rotation.y=Math.sin(w)*.18;
  }else if(p.dance===2){
    q.leftArm.rotation.z=-.55+Math.sin(w*2)*.9; q.rightArm.rotation.z=.55-Math.sin(w*2)*.9;
    q.leftLeg.rotation.z=Math.sin(w*2)*.28; q.rightLeg.rotation.z=-Math.sin(w*2)*.28;
    q.torso.rotation.z=Math.sin(w)*.16;
  }else if(p.dance===3){
    q.leftArm.rotation.z=-1.25+Math.sin(w*2)*.25; q.rightArm.rotation.z=.25+Math.sin(w*2+.8)*.8;
    q.leftLeg.rotation.z=Math.sin(w*2)*.55; q.rightLeg.rotation.z=-Math.sin(w*2)*.55;
    q.torso.rotation.y=Math.sin(w)*.35;
  }else if(p.dance===4){
    const step=Math.sin(w*2)>0?1:-1;
    q.leftArm.rotation.z=-.85*step; q.rightArm.rotation.z=.85*step;
    q.leftLeg.rotation.z=.35*step; q.rightLeg.rotation.z=-.35*step;
    q.head.rotation.y=Math.sin(w*2)*.35;
  }else if(p.dance===5){
    const bounce=Math.abs(Math.sin(w*2))*0.22;
    p.group.position.y=(p.baseY||p.group.position.y)+bounce;
    q.leftArm.rotation.z=-.8-Math.sin(w*2)*.3; q.rightArm.rotation.z=.8+Math.sin(w*2)*.3;
  }else if(p.dance===6){
    q.leftArm.rotation.z=-1.35+Math.sin(w*3)*.5; q.rightArm.rotation.z=.15;
    q.rightArm.rotation.x=Math.sin(w*2)*.5; q.head.rotation.z=Math.sin(w*2)*.15;
  }
}

function resetRemoteDancePose(p){
  if(!p || !p.parts) return;
  p.group.position.y=p.baseY||0;
  const q=p.parts;
  q.torso.rotation.set(0,0,0); q.head.rotation.set(0,0,0);
  q.leftArm.rotation.set(0,0,-.12); q.rightArm.rotation.set(0,0,.12);
  q.leftLeg.rotation.set(0,0,0); q.rightLeg.rotation.set(0,0,0);
}
