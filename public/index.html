<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0"
>

<title>EWS SESSIONS</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS3DRenderer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>

<script src="/socket.io/socket.io.js"></script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050505;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

#app{
  position:relative;
  width:100vw;
  height:100vh;
}

#canvas3d{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}

/* 3D HTML layer — the club screen is physically anchored in Three.js */
#css3d-container{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  z-index:15;
  pointer-events:none;
  overflow:hidden;
}

#css3d-screen{
  width:1400px;
  height:600px;
  position:absolute;
  left:0;
  top:0;
  background:#000;
  border:1px solid #222;
  box-shadow:0 0 45px rgba(0,0,0,.9);
  pointer-events:auto;
  overflow:hidden;
  display:none;
}

#css3d-screen.active{
  display:block;
}

#css3d-screen iframe{
  width:100%;
  height:100%;
  border:0;
  display:block;
  background:#000;
}


/* =========================================================
   LOGIN
========================================================= */

#login{
  position:absolute;
  inset:0;
  z-index:1000;
  display:flex;
  align-items:center;
  justify-content:center;

  background:
    radial-gradient(
      circle at 50% 40%,
      rgba(255,255,255,.08),
      transparent 25%
    ),
    radial-gradient(
      circle at 50% 50%,
      #171717,
      #030303 70%
    );
}

.login-box{
  width:380px;
  padding:42px;

  background:rgba(5,5,5,.88);

  border:1px solid #444;

  box-shadow:
    0 0 80px rgba(255,255,255,.06),
    inset 0 0 40px rgba(255,255,255,.02);

  text-align:center;
}

.login-box h1{
  font-size:31px;
  letter-spacing:8px;
  font-weight:900;
  color:#fff;
  margin-bottom:8px;
}

.login-box p{
  font-size:10px;
  letter-spacing:5px;
  color:#777;
  margin-bottom:30px;
}

.tabs{
  display:flex;
  margin-bottom:20px;
  border:1px solid #333;
}

.tab{
  flex:1;
  padding:11px;
  border:0;
  background:#0c0c0c;
  color:#666;
  cursor:pointer;
  letter-spacing:2px;
}

.tab.active{
  background:#fff;
  color:#000;
}

input{
  width:100%;
  height:45px;
  margin-bottom:12px;
  padding:0 14px;

  border:1px solid #333;
  background:#080808;
  color:#fff;

  outline:none;
}

input:focus{
  border-color:#aaa;
}

.btn{
  width:100%;
  height:45px;

  border:0;

  background:#fff;
  color:#000;

  font-weight:bold;
  letter-spacing:2px;

  cursor:pointer;
}

.btn:hover{
  background:#ddd;
}

.error{
  min-height:20px;
  margin-top:12px;
  color:#ff5555;
  font-size:12px;
}

/* =========================================================
   HUD
========================================================= */

#hud{
  position:absolute;
  inset:0;
  z-index:20;

  display:none;

  pointer-events:none;
}

#top-logo{
  position:absolute;

  top:18px;
  left:20px;

  font-size:16px;
  font-weight:900;
  letter-spacing:5px;

  text-shadow:0 0 20px #fff;
}

#top-logo span{
  display:block;

  margin-top:4px;

  font-size:8px;
  letter-spacing:3px;
  color:#777;
}

#online-box{
  position:absolute;

  top:18px;
  right:18px;

  width:190px;

  padding:13px;

  background:rgba(0,0,0,.72);

  border:1px solid #333;

  pointer-events:auto;
}

#online-box h3{
  font-size:10px;
  letter-spacing:3px;
  color:#aaa;
  margin-bottom:9px;
}

#online-list{
  list-style:none;

  max-height:180px;
  overflow:auto;

  color:#ddd;
  font-size:12px;
}

#online-list li{
  padding:4px 0;

  border-bottom:1px solid #161616;
}

#online-list li::before{
  content:"●";

  color:#fff;

  margin-right:7px;

  font-size:8px;
}

/* =========================================================
   CHAT
========================================================= */

#chat{
  position:absolute;

  left:18px;
  bottom:18px;

  width:390px;
  height:250px;

  padding:12px;

  display:flex;
  flex-direction:column;

  background:rgba(0,0,0,.75);

  border:1px solid #333;

  pointer-events:auto;
}

#chat-title{
  font-size:9px;
  letter-spacing:3px;
  color:#777;

  margin-bottom:8px;
}

#chat-messages{
  flex:1;

  overflow-y:auto;

  margin-bottom:8px;
}

.msg{
  margin-bottom:7px;

  font-size:12px;
  line-height:1.4;
}

.msg .u{
  color:#fff;
  font-weight:bold;
}

.msg .t{
  color:#aaa;
}

#chat-form{
  display:flex;
  gap:6px;
}

#chat-input{
  flex:1;
  height:35px;
  margin:0;
}

#chat-send{
  width:45px;

  border:0;

  background:#fff;
  color:#000;

  cursor:pointer;
}


/* =========================================================
   CLUB SCREEN / MEDIA
========================================================= */

#screen-control{
  position:fixed;
  top:18px;
  left:50%;
  transform:translateX(-50%);
  z-index:41;
  height:32px;
  padding:0 16px;
  border:1px solid #444;
  background:rgba(0,0,0,.82);
  color:#fff;
  cursor:pointer;
  font-size:10px;
  font-weight:bold;
  letter-spacing:3px;
  pointer-events:auto;
}

#screen-control:hover{
  background:#fff;
  color:#000;
}

#wardrobe-control{
  position:absolute;
  top:18px;
  left:50%;
  transform:translateX(-50%);
  height:32px;
  padding:0 15px;
  border:1px solid #444;
  background:rgba(5,5,5,.92);
  color:#fff;
  cursor:pointer;
  font:10px monospace;
  font-weight:bold;
  letter-spacing:2px;
  pointer-events:auto;
}
#wardrobe-control:hover{background:#fff;color:#000;}

#wardrobe-menu{
  position:fixed;
  top:58px;
  left:50%;
  transform:translateX(-50%);
  z-index:45;
  width:min(560px,calc(100vw - 30px));
  padding:14px;
  background:rgba(5,5,5,.97);
  border:1px solid #444;
  box-shadow:0 20px 70px rgba(0,0,0,.85);
  display:none;
  pointer-events:auto;
}
#wardrobe-menu.open{display:block;}
#wardrobe-title{
  font:10px monospace;
  letter-spacing:3px;
  color:#aaa;
  margin-bottom:12px;
}
#wardrobe-options{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}
.wardrobe-option{
  min-height:58px;
  border:1px solid #333;
  background:#0c0c0c;
  color:#fff;
  cursor:pointer;
  text-align:left;
  padding:10px;
}
.wardrobe-option:hover,
.wardrobe-option.active{
  border-color:#fff;
  background:#181818;
}
.wardrobe-option strong{
  display:block;
  font:11px monospace;
  letter-spacing:2px;
}
.wardrobe-option span{
  display:block;
  margin-top:5px;
  color:#777;
  font:9px monospace;
}
#wardrobe-status{
  margin-top:10px;
  min-height:12px;
  color:#777;
  font:9px monospace;
}
#screen-menu{
  position:fixed;
  top:58px;
  left:50%;
  transform:translateX(-50%);
  z-index:40;
  width:min(520px,calc(100vw - 30px));
  padding:10px;
  background:rgba(5,5,5,.96);
  border:1px solid #444;
  box-shadow:0 18px 60px rgba(0,0,0,.75);
  display:none;
  pointer-events:auto;
}
#screen-menu.open{display:block;}
#screen-menu-row{display:flex;gap:6px;align-items:center;}
#screen-url{
  flex:1;
  min-width:0;
  height:32px;
  box-sizing:border-box;
  padding:0 10px;
  background:#090909;
  border:1px solid #333;
  color:#fff;
  outline:none;
  font:11px monospace;
}
#screen-menu button{
  height:32px;
  padding:0 12px;
  border:1px solid #444;
  background:#111;
  color:#fff;
  cursor:pointer;
  font-size:10px;
  font-weight:bold;
  letter-spacing:1px;
}
#screen-menu button:hover{background:#fff;color:#000;}
#screen-status{
  min-height:14px;
  margin-top:7px;
  color:#777;
  font:9px monospace;
  letter-spacing:1px;
}

@media(max-width:700px){
  #screen-menu-row{flex-wrap:wrap;}
  #screen-url{flex-basis:100%;}
}

/* =========================================================
   EMOTES / DANCES
========================================================= */
.emote-btn{height:36px;border:1px solid #333;background:#111;color:#fff;cursor:pointer;font-size:10px;letter-spacing:1px;}
.emote-btn:hover{background:#fff;color:#000;}
#emote-stop{grid-column:1/-1;}
/* =========================================================
   OTHER HUD
========================================================= */

#hint{
  position:absolute;

  right:18px;
  bottom:18px;

  padding:9px 12px;

  background:rgba(0,0,0,.65);

  border:1px solid #292929;

  color:#777;

  font-size:10px;
  letter-spacing:1px;
}

#stream-indicator{
  position:absolute;

  top:18px;
  left:50%;

  transform:translateX(-50%);

  padding:6px 12px;

  background:rgba(0,0,0,.75);

  border:1px solid #333;

  color:#777;

  font-family:monospace;

  font-size:10px;
  letter-spacing:2px;
}

#stream-indicator.live{
  color:#fff;
  border-color:#aaa;
}

#stream-indicator.error{
  color:#ff5555;
  border-color:#ff5555;
}

#lang-bar{
  position:absolute;

  right:220px;
  top:18px;

  pointer-events:auto;
}

#lang{
  background:#080808;

  border:1px solid #333;

  color:#aaa;

  padding:7px 10px;
}

#zone-label{
  position:absolute;

  left:50%;
  bottom:90px;

  transform:translateX(-50%);

  font-size:10px;

  letter-spacing:5px;

  color:rgba(255,255,255,.4);

  pointer-events:none;
}

#ews-audio{
  position:absolute;

  width:1px;
  height:1px;

  opacity:0;

  pointer-events:none;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

  #top-logo{
    top:12px;
    left:12px;
    font-size:22px;
  }

  #top-logo span{
    font-size:9px;
  }

  #lang-bar{
    right:12px;
    top:12px;
  }

  #lang{
    padding:6px 7px;
    font-size:11px;
  }

  #online-box{
    top:52px;
    right:12px;

    width:145px;

    padding:9px;

    max-height:105px;
  }

  #online-list{
    max-height:62px;
    font-size:10px;
  }

  #online-box h3{
    font-size:8px;
    margin-bottom:5px;
  }

  #online-list li{
    padding:2px 0;
  }

  #stream-indicator{
    top:52px;
    left:12px;

    transform:none;

    padding:5px 8px;

    font-size:8px;
  }

  #screen-control{
    top:12px;
    left:50%;
    height:30px;
    padding:0 12px;
    font-size:9px;
  }

  #chat{
    left:10px;
    right:10px;
    bottom:10px;

    width:auto;

    height:31vh;

    min-height:190px;
    max-height:270px;

    padding:9px;

    z-index:200;

    background:rgba(0,0,0,.86);
  }

  #chat-title{
    font-size:8px;
    margin-bottom:6px;
  }

  #chat-messages{
    font-size:11px;
    margin-bottom:6px;
  }

  .msg{
    font-size:11px;
    margin-bottom:5px;
  }

  #chat-input{
    height:38px;

    font-size:14px;

    padding:0 9px;
  }

  #chat-send{
    width:44px;

    font-size:18px;
  }

  #hint{
    display:none;
  }

  #zone-label{
    bottom:calc(31vh + 20px);

    font-size:8px;
  }
}

@media(max-width:420px){

  #online-box{
    width:125px;
  }

  #chat{
    height:34vh;
    min-height:185px;
  }

  #zone-label{
    bottom:calc(34vh + 20px);
  }
}

</style>
</head>

<body>

<div id="app">

<canvas id="canvas3d"></canvas>

<div id="css3d-container">
  <div id="css3d-screen">
    <iframe id="media-screen-frame" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen></iframe>
  </div>
</div>

<audio
  id="ews-audio"
  crossorigin="anonymous"
  playsinline
  preload="auto">
</audio>

<!-- =====================================================
     LOGIN
===================================================== -->

<div id="login">

  <div class="login-box">

    <h1>EWS</h1>

    <p>
      SESSIONS / UNDERGROUND CLUB
    </p>

    <div class="tabs">

      <button
        class="tab active"
        onclick="switchTab('login')">
        ВХОД
      </button>

      <button
        class="tab"
        onclick="switchTab('register')">
        РЕГИСТРАЦИЯ
      </button>

    </div>

    <input
      id="f-username"
      placeholder="USERNAME"
      autocomplete="username"
    >

    <input
      id="f-password"
      type="password"
      placeholder="PASSWORD"
      autocomplete="current-password"
    >

    <button
      class="btn"
      id="submitBtn"
      onclick="doLogin()">
      ВОЙТИ
    </button>

    <div
      id="error"
      class="error">
    </div>

  </div>

</div>

<!-- =====================================================
     HUD
===================================================== -->

<div id="hud">

  <div id="top-logo">
    EWS
    <span>SESSIONS</span>
  </div>

  <div id="stream-indicator" style="display:none">
    AUDIO: READY
  </div>

  <!-- Hidden compatibility control: audio UI is intentionally not shown. -->
  <button id="audio-control" type="button" aria-hidden="true" tabindex="-1" style="display:none"></button>

  <button id="screen-control" type="button" onclick="toggleScreenMenu()">SCREEN</button>
  <button id="wardrobe-control" type="button" onclick="toggleWardrobe()">WARDROBE</button>

  <div id="wardrobe-menu">
    <div id="wardrobe-title">EWS SESSIONS / AVATAR</div>
    <div id="wardrobe-options">
      <button class="wardrobe-option" data-avatar="male" onclick="selectAvatar('male')">
        <strong>LOOK 01</strong><span>MALE BASE</span>
      </button>
      <button class="wardrobe-option" data-avatar="female" onclick="selectAvatar('female')">
        <strong>LOOK 02</strong><span>FEMALE BASE</span>
      </button>
    </div>
    <div id="wardrobe-status"></div>
  </div>

  <div id="screen-menu">
    <div id="screen-menu-row">
      <input id="screen-url" type="text" placeholder="YouTube / Twitch / https:// site">
      <button type="button" onclick="loadClubScreen()">LOAD</button>
      <button type="button" onclick="clearClubScreen()">CLEAR</button>
    </div>
    <div id="screen-status"></div>
  </div>

  <div id="chat">

    <div id="chat-title">
      EWS SESSIONS / CHAT
    </div>

    <div id="chat-messages"></div>

    <form id="chat-form">

      <input
        id="chat-input"
        autocomplete="off"
        placeholder="write something..."
      >

      <button id="chat-send">
        →
      </button>

    </form>

  </div>




  <div id="hint">
    WASD MOVE · MOUSE LOOK · C CHAT
  </div>

</div>

</div>

<script>

let mode='login';

let socket=null;
let currentUser=null;

let scene;
let camera;
let renderer;
let cssScene;
let cssRenderer;
let cssScreenObject;

let keys={};

// JUMP / GRAVITY
let jumpVelocity=0;
let playerY=1.7;
const GROUND_Y=1.7;
const JUMP_FORCE=7.2;
const GRAVITY=18;
let isGrounded=true;

let yaw=0;
let pitch=0;

let pointerLocked=false;
let chatMode=false;

let clock=new THREE.Clock();

let neonObjects=[];
let lightObjects=[];

let particles;
let fogParticles;
let fogMaterial;
let clubLights=[];
let strobeLights=[];
let musicLightTargets=[];
let laserSystems=[];
let floorWashLights=[];
let fixtureGlows=[];

let analyser=null;
let freqData=null;

let audioLevel=0;
let bassLevel=0;

let audioContext=null;
let audioSource=null;

let audioStarted=false;

let hls=null;

let screenTexture;
let screenCanvas;
let screenCtx;
let screenMesh;
let screenMediaActive=false;
let screenMediaUrl='';
let onlineUserList=[];
let remotePlayers=new Map();
let lastPlayerBroadcast=0;
let clubScreenHost=null;
let activeDance=0;
let danceStartedAt=0;

let playerBody;
let avatarChoice=localStorage.getItem('ewsAvatar')||'male';
let avatarLoader=null;
const AVATAR_MODELS={
  male:'/Universal%20Base%20Characters%5BStandard%5D/Base%20Characters/Godot%20-%20UE/Superhero_Male_FullBody.gltf',
  female:'/Universal%20Base%20Characters%5BStandard%5D/Base%20Characters/Godot%20-%20UE/Superhero_Female_FullBody.gltf'
};

// SOLID CLUB OBJECTS — the local player cannot walk through these.
const collisionBoxes = [
  // Main stage
  {minX:-8.7,maxX:8.7,minZ:-14.2,maxZ:-10.9},
  // Floor PA / subwoofer footprints
  {minX:-8.9,maxX:-6.1,minZ:-11.45,maxZ:-9.65},
  {minX:6.1,maxX:8.9,minZ:-11.45,maxZ:-9.65},
  // Rear entrance frame
  {minX:-3.6,maxX:3.6,minZ:15.7,maxZ:16.7}
];
const PLAYER_RADIUS=.38;

function blockedPosition(x,z){
  for(const b of collisionBoxes){
    const cx=Math.max(b.minX,Math.min(x,b.maxX));
    const cz=Math.max(b.minZ,Math.min(z,b.maxZ));
    const dx=x-cx;
    const dz=z-cz;
    if(dx*dx+dz*dz < PLAYER_RADIUS*PLAYER_RADIUS) return true;
  }
  return false;
}

function tryMovePlayer(dx,dz){
  const nx=THREE.MathUtils.clamp(camera.position.x+dx,-16,16);
  const nz=THREE.MathUtils.clamp(camera.position.z+dz,-15.5,15.5);
  // Resolve X and Z separately so the avatar slides along objects instead of freezing.
  if(!blockedPosition(nx,camera.position.z)) camera.position.x=nx;
  if(!blockedPosition(camera.position.x,nz)) camera.position.z=nz;
}

function createEWSLogo(){
  const loader=new THREE.TextureLoader();
  loader.load('/assets/logo.png',texture=>{
    texture.encoding=THREE.sRGBEncoding;
    const mat=new THREE.MeshBasicMaterial({map:texture,transparent:true,side:THREE.DoubleSide});
    const logo=new THREE.Mesh(new THREE.PlaneGeometry(4.6,4.6),mat);
    logo.position.set(0,3.65,-16.25);
    scene.add(logo);
  },undefined,err=>console.warn('[EWS LOGO]',err));
}

/* =========================================================
   EWS TEXTURES
   CC0 seamless textures from ShareTextures
========================================================= */

const EWS_TEXTURES = {
  concrete: 'https://images.sharetextures.com/u/concrete_black_mat-min.webp',
  floor: 'https://images.sharetextures.com/u/stone_floor_1-min.webp'
};

const ewsTextureLoader = new THREE.TextureLoader();

function loadEWSTexture(url, repeatX=4, repeatY=4){
  const texture = ewsTextureLoader.load(url);
  texture.wrapS = THREE.RepeatWrapping;
  texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(repeatX, repeatY);
  texture.anisotropy = Math.min(8, renderer ? renderer.capabilities.getMaxAnisotropy() : 8);
  texture.encoding = THREE.sRGBEncoding;
  return texture;
}

/* =========================================================
   LOGIN
========================================================= */

function switchTab(type){

  mode=type;

  document
    .querySelectorAll('.tab')
    .forEach(
      t=>t.classList.remove('active')
    );

  if(type==='login'){

    document
      .querySelectorAll('.tab')[0]
      .classList.add('active');

    document.getElementById(
      'submitBtn'
    ).textContent='ВОЙТИ';

  }else{

    document
      .querySelectorAll('.tab')[1]
      .classList.add('active');

    document.getElementById(
      'submitBtn'
    ).textContent='СОЗДАТЬ АККАУНТ';

  }

  document.getElementById(
    'error'
  ).textContent='';

}

async function doLogin(){

  const username =
    document
      .getElementById('f-username')
      .value
      .trim();

  const password =
    document
      .getElementById('f-password')
      .value;

  const error =
    document.getElementById('error');

  error.textContent='';

  if(!username || !password){

    error.textContent=
      'Введите логин и пароль';

    return;
  }

  try{

    const res =
      await fetch(
        '/api/'+mode,
        {
          method:'POST',

          headers:{
            'Content-Type':
              'application/json'
          },

          body:JSON.stringify({
            username,
            password
          })
        }
      );

    const data =
      await res.json();

    if(data.error){

      error.textContent=
        data.error;

      return;
    }

    startSession(username);

  }catch(err){

    console.error(err);

function startSession(username){

  currentUser=username;

  document.getElementById(
    'login'
  ).style.display='none';

  document.getElementById(
    'hud'
  ).style.display='block';

  clubScreenHost='mvxtra';

  init3D();

  socket=io();

  socket.on('connect',function(){

    socket.emit(
      'join',
      {
        username: currentUser,
        language:
          document.getElementById('lang').value,
        avatar: avatarChoice
      }
    );

  });

  socket.on(
    'online-users',
    list=>{

      onlineUserList=Array.isArray(list)?list:[];
      // Screen control belongs ONLY to mvxtra. Never use the first online user as host.
      clubScreenHost='mvxtra';

      const ul =
        document.getElementById('online-list');

      ul.innerHTML='';

      if(!Array.isArray(list)) return;

      list.forEach(user=>{

        const li =
          document.createElement('li');

        const name =
          typeof user === 'string'
            ? user
            : user.username;

        li.textContent =
          name === currentUser
            ? name + ' (YOU)'
            : name;

        ul.appendChild(li);

      });

    }
  );

  socket.on(
    'chat-message',
    message=>{

      const el =
        document.createElement(
          'div'
        );

      el.className='msg';

      const time =
        new Date(
          message.ts
        ).toLocaleTimeString();

      const user =
        document.createElement(
          'span'
        );

      user.className='u';

      user.textContent=
        message.user;

      const text =
        document.createElement(
          'span'
        );

      text.className='t';

      text.textContent=
        ' '+time+' '+message.text;

      el.appendChild(user);

      el.appendChild(
        document.createTextNode(' ')
      );

      el.appendChild(text);

      const box =
        document.getElementById(
          'chat-messages'
        );

      box.appendChild(el);

      box.scrollTop=
        box.scrollHeight;

    }
  );

  socket.on('club-screen-state', state=>{
    applyRemoteClubScreen(state);
  });

  // =====================================================
  // MULTIPLAYER — initial snapshot + live updates
  // =====================================================

  socket.on('players-state', list=>{
    if(!Array.isArray(list)) return;

    // Server sends everyone except the current socket.
    // Rebuild only the missing players so existing objects keep moving smoothly.
    const alive = new Set();

    list.forEach(data=>{
      if(!data || !data.id || data.id===socket.id) return;
      alive.add(data.id);
      updateRemotePlayer(data);
    });

    // Remove players that are no longer present in the server snapshot.
    Array.from(remotePlayers.keys()).forEach(id=>{
      if(!alive.has(id)) removeRemotePlayer(id);
    });
  });

  socket.on('player-joined', data=>{
    if(!data || !data.id || data.id===socket.id) return;
    updateRemotePlayer(data);
  });

  socket.on('player-state', data=>{
    if(!data || !data.id || data.id===socket.id) return;
    updateRemotePlayer(data);
  });

  socket.on('player-left', id=>{
    removeRemotePlayer(id);
  });

  socket.on('player-removed', id=>{
    removeRemotePlayer(id);
  });

  // Ask the server for a fresh snapshot after every connection.
  socket.on('joined', ()=>{
    socket.emit('request-players');
    socket.emit('request-club-screen');
  });

}

function createBox(
  w,h,d,
  x,y,z,
  material,
  cast=true,
  receive=true
){

  const mesh =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        w,h,d
      ),
      material
    );

  mesh.position.set(
    x,y,z
  );

  mesh.castShadow=
    cast;

  mesh.receiveShadow=
    receive;

  scene.add(mesh);

  return mesh;

}

function createLight(
  x,y,z,
  color,
  intensity,
  distance
){

  const light =
    new THREE.PointLight(
      color,
      intensity,
      distance
    );

  light.position.set(
    x,y,z
  );

  light.castShadow=true;

  scene.add(light);

  lightObjects.push(
    light
  );

  return light;

}

function createSpeakers(){

  // PRO PA — stage stacks grounded on the stage, wall fills on real floor stands.
  const cabinet=new THREE.MeshStandardMaterial({color:0x080808,metalness:.58,roughness:.38});
  const grille=new THREE.MeshStandardMaterial({color:0x181818,metalness:.05,roughness:.92});
  const rubber=new THREE.MeshStandardMaterial({color:0x020202,roughness:.82});
  const metal=new THREE.MeshStandardMaterial({color:0x262626,metalness:.82,roughness:.3});
  const led=new THREE.MeshBasicMaterial({color:0x22ccff,transparent:true,opacity:.72});

  function speakerBox(w,h,d){
    const g=new THREE.Group();
    const body=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),cabinet);
    body.castShadow=true; body.receiveShadow=true; g.add(body);

    const face=new THREE.Mesh(new THREE.BoxGeometry(w*.88,h*.84,.035),grille);
    face.position.z=-d/2-.02; g.add(face);

    const woofer=new THREE.Mesh(
      new THREE.CylinderGeometry(Math.min(w,h)*.25,Math.min(w,h)*.25,.055,32),
      rubber
    );
    woofer.rotation.x=Math.PI/2;
    woofer.position.set(0,-h*.12,-d/2-.055);
    g.add(woofer);

    const wooferRing=new THREE.Mesh(
      new THREE.TorusGeometry(Math.min(w,h)*.25,.035,8,32),
      new THREE.MeshBasicMaterial({color:0x555555})
    );
    wooferRing.rotation.x=Math.PI/2;
    wooferRing.position.set(0,-h*.12,-d/2-.09);
    g.add(wooferRing);

    const horn=new THREE.Mesh(new THREE.BoxGeometry(w*.34,h*.16,.07),rubber);
    horn.position.set(0,h*.27,-d/2-.06); g.add(horn);

    const line=new THREE.Mesh(new THREE.BoxGeometry(w*.7,.025,.025),led);
    line.position.set(0,-h*.45,-d/2-.07); g.add(line);
    return g;
  }

  // MAIN STAGE PA — moved toward the center/front edge of the stage and rotated toward dancers.
  function stageStack(x,side){
    const g=new THREE.Group();

    // x is deliberately closer to center; y=stage deck, so nothing hangs.
    g.position.set(x,0,-12.0);
    // Front (-Z) points into the room; slight inward toe-in.
    g.rotation.y=side<0 ? 0.12 : -0.12;

    // Sub sits directly on the stage.
    const sub=new THREE.Mesh(new THREE.BoxGeometry(2.15,1.05,1.15),cabinet);
    sub.position.y=.525;
    sub.castShadow=true; sub.receiveShadow=true;
    g.add(sub);

    const subGrille=new THREE.Mesh(new THREE.BoxGeometry(1.9,.80,.035),grille);
    subGrille.position.set(0,.525,-.592);
    g.add(subGrille);

    // Top cabinet is physically sitting on the sub via a short riser.
    const riser=new THREE.Mesh(new THREE.BoxGeometry(1.05,.16,.72),metal);
    riser.position.y=1.13;
    g.add(riser);

    const top=speakerBox(1.58,2.18,.78);
    top.position.y=2.30;
    g.add(top);

    // Small rubber feet at the stage contact point.
    [-.72,.72].forEach(px=>{
      const foot=new THREE.Mesh(new THREE.BoxGeometry(.22,.08,.35),rubber);
      foot.position.set(px,0.04,.30);
      g.add(foot);
    });

    scene.add(g);
  }

  // Close to the center of the stage, symmetric left/right.
  stageStack(-4.9,-1);
  stageStack(4.9,1);

  // WALL FILLS — each has a proper floor-standing support column/base.
  function wallSpeaker(x,z,side){
    const g=new THREE.Group();
    // Base is on the floor; the speaker is NOT floating.
    g.position.set(x,0,z);
    g.rotation.y=side<0 ? -Math.PI/2 : Math.PI/2;

    const base=new THREE.Mesh(new THREE.BoxGeometry(1.45,.22,1.25),metal);
    base.position.y=.11;
    base.castShadow=true; base.receiveShadow=true;
    g.add(base);

    const pole=new THREE.Mesh(new THREE.CylinderGeometry(.09,.12,2.25,16),metal);
    pole.position.y=1.25;
    pole.castShadow=true;
    g.add(pole);

    const mount=new THREE.Mesh(new THREE.BoxGeometry(.55,.18,.45),metal);
    mount.position.y=2.36;
    g.add(mount);

    const box=speakerBox(1.18,1.65,.78);
    box.position.y=3.22;
    g.add(box);

    // Secondary rear brace visually anchors the speaker to the wall.
    const brace=new THREE.Mesh(new THREE.BoxGeometry(.16,1.0,.16),metal);
    brace.position.set(side<0?.56:-.56,2.75,.34);
    brace.rotation.z=side<0?.28:-.28;
    g.add(brace);

    scene.add(g);
  }

  wallSpeaker(-15.15,-5.6,-1);
  wallSpeaker(15.15,-5.6,1);
}
function createFog(){
  const count=420;
  const geo=new THREE.BufferGeometry();
  const pos=new Float32Array(count*3);
  const scale=new Float32Array(count);
  for(let i=0;i<count;i++){
    pos[i*3]=(Math.random()-.5)*32;
    pos[i*3+1]=.45+Math.random()*3.8;
    pos[i*3+2]=(Math.random()-.5)*31;
    scale[i]=1.5+Math.random()*2.8;
  }
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  geo.setAttribute('aScale',new THREE.BufferAttribute(scale,1));
  const canvas=document.createElement('canvas');
  canvas.width=128; canvas.height=128;
  const ctx=canvas.getContext('2d');
  const g=ctx.createRadialGradient(64,64,4,64,64,62);
  g.addColorStop(0,'rgba(255,255,255,.18)');
  g.addColorStop(.45,'rgba(210,210,210,.08)');
  g.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,128,128);
  const tex=new THREE.CanvasTexture(canvas);
  fogMaterial=new THREE.PointsMaterial({map:tex,size:2.7,transparent:true,opacity:.18,depthWrite:false,blending:THREE.AdditiveBlending,sizeAttenuation:true});
  fogParticles=new THREE.Points(geo,fogMaterial);
  scene.add(fogParticles);
}

function createClubLighting(){

    const color=colors[i%colors.length];

    const spot=new THREE.SpotLight(
      color,

    spot.position.set(p[0],p[1],p[2]);
    spot.target.position.set(0,.9,-2);

  ];

  washPositions.forEach((p,i)=>{

    );

  // LOW SIDE LIGHT — soft definition along the dancefloor without washing the room.
  [-1,1].forEach((side)=>{

  // FRONT-TRUSS STROBES
  for(let i=0;i<4;i++){

    );

    strobe.position.set(-9+i*6,4.9,-8);
    scene.add(strobe);
    strobeLights.push(strobe);
  }

  // LASER GUNS
  const laserPositions=[
    [-13.4,5.15,-8.8],
    [-4.6,5.35,-12.3],
    [4.6,5.35,-12.3],
    [13.4,5.15,-8.8],
    [-8.8,5.2,2.5],
    [8.8,5.2,2.5]
  ];

  laserPositions.forEach((p,i)=>{

    const group=new THREE.Group();

      new THREE.MeshStandardMaterial({

      })

    group.add(housing);

    const muzzle=new THREE.Mesh(

        depthWrite:false
      })

    muzzle.rotation.x=Math.PI/2;
    muzzle.position.z=-.42;
    group.add(muzzle);
    scene.add(group);

    const coreMat=new THREE.LineBasicMaterial({
      color:color,
      transparent:true,
      opacity:.82,

    });

    const glowMat=new THREE.LineBasicMaterial({

function setupAudio(){

  const indicator =
    document.getElementById(
      'stream-indicator'
    );

    document.getElementById(

    );

async function unlockEWSAudio(){

  const audio = document.getElementById('ews-audio');
  if(!audio) return false;

  try{
    if(audioContext && audioContext.state === 'suspended'){
      await audioContext.resume();
    }

    if(audioStarted && audio.paused){
      await audio.play();
      return true;
    }

    // If the stream was blocked by autoplay policy, retry the full
    // HLS startup from this real user interaction.
    if(!audioStarted){
      await startSSHAudio();
      return true;
    }
  }catch(err){
    console.warn('[EWS AUDIO UNLOCK]', err);
  }

  return false;
}

async function startSSHAudio(){

  const audio =
    document.getElementById(
      'ews-audio'
    );

  const indicator =
    document.getElementById(
      'stream-indicator'
    );

  const button =
    document.getElementById(
      'audio-control'
    );

  if(!audio)return;

  const hlsUrl =
    window.location.origin+
    '/hls/ews/index.m3u8';

  indicator.classList.remove(
    'error'
  );

  indicator.classList.add(
    'live'
  );

  indicator.textContent=
    'AUDIO: CONNECTING...';

  button.disabled=true;

  button.textContent=
    '● AUDIO: CONNECTING';

  try{

    if(!audioContext){

      audioContext =
        new(
          window.AudioContext ||
          window.webkitAudioContext
        )();

      audioSource =
        audioContext.createMediaElementSource(
          audio
        );

      analyser =
        audioContext.createAnalyser();

      analyser.fftSize=256;

      analyser.smoothingTimeConstant=.82;

      freqData =
        new Uint8Array(
          analyser.frequencyBinCount
        );

      audioSource.connect(
        analyser
      );

      analyser.connect(
        audioContext.destination
      );

    }

    if(
      audioContext.state===
      'suspended'
    ){

      await audioContext.resume();

    }

    if(hls){

      try{
        hls.destroy();
      }catch(e){}

      hls=null;

    }

    if(
      window.Hls &&
      Hls.isSupported()
    ){

      hls =
        new Hls({

          enableWorker:true,

          lowLatencyMode:true,

          backBufferLength:30,

          maxBufferLength:10,

          maxMaxBufferLength:20,

          liveSyncDurationCount:3,

          liveMaxLatencyDurationCount:6

        });

      hls.loadSource(
        hlsUrl
      );

      hls.attachMedia(
        audio
      );

      hls.on(
        Hls.Events.MANIFEST_PARSED,
        async function(){

          indicator.textContent=
            'AUDIO: LIVE';

          button.textContent=
            '● AUDIO: LIVE';

          button.classList.add(
            'live'
          );

          button.disabled=false;

          audioStarted=true;

          try{

            await audio.play();

          }catch(err){

            console.warn(
              'Audio play blocked:',
              err
            );

            indicator.textContent=
              'AUDIO: PRESS START';

            button.textContent=
              '▶ AUDIO: START';

            button.classList.remove(
              'live'
            );

          }

        }
      );

      hls.on(
        Hls.Events.ERROR,
        function(
          event,
          data
        ){

          console.error(
            '[HLS]',
            data
          );

          if(!data.fatal)return;

          if(
            data.type===
            Hls.ErrorTypes.NETWORK_ERROR
          ){

            indicator.textContent=
              'AUDIO: RECONNECTING...';

            button.textContent=
              '● AUDIO: RECONNECTING';

            setTimeout(
              function(){

                if(hls){

                  try{
                    hls.startLoad();
                  }catch(e){}

                }

              },
              1000
            );

          }

          else if(
            data.type===
            Hls.ErrorTypes.MEDIA_ERROR
          ){

            indicator.textContent=
              'AUDIO: RECOVERING...';

            try{

              hls.recoverMediaError();

            }catch(e){

              console.error(e);

            }

          }

          else{

            indicator.textContent=
              'AUDIO: NO STREAM';

            indicator.classList.remove(
              'live'
            );

            indicator.classList.add(
              'error'
            );

            button.textContent=
              '▶ AUDIO: RETRY';

            button.classList.remove(
              'live'
            );

            button.disabled=false;

          }

        }
      );

    }

    else if(
      audio.canPlayType(
        'application/vnd.apple.mpegurl'
      )
    ){

      audio.src=
        hlsUrl;

      audio.addEventListener(
        'loadedmetadata',
        async function(){

          try{

            await audio.play();

          }catch(err){

            console.error(err);

          }

        },
        {
          once:true
        }
      );

    }

    else{

      throw new Error(
        'HLS is not supported by this browser'
      );

    }

    audio.onplaying=function(){

      indicator.textContent=
        'AUDIO: LIVE';

      indicator.classList.add(
        'live'
      );

      indicator.classList.remove(
        'error'
      );

      button.textContent=
        '● AUDIO: LIVE';

      button.classList.add(
        'live'
      );

      button.disabled=false;

      audioStarted=true;

    };

    audio.onpause=function(){

      if(
        audioStarted &&
        !audio.ended
      ){

        indicator.textContent=
          'AUDIO: PAUSED';

        button.textContent=
          '▶ AUDIO: RESUME';

        button.classList.remove(
          'live'
        );

      }

    };

    audio.onerror=function(){

      console.error(
        '[AUDIO]',
        audio.error
      );

      indicator.textContent=
        'AUDIO: ERROR';

      indicator.classList.remove(
        'live'
      );

      indicator.classList.add(
        'error'
      );

      button.textContent=
        '▶ AUDIO: RETRY';

      button.classList.remove(
        'live'
      );

      button.disabled=false;

    };

  }catch(err){

    console.error(
      '[EWS AUDIO ERROR]',
      err
    );

    indicator.textContent=
      'AUDIO: NO STREAM';

    indicator.classList.remove(
      'live'
    );

    indicator.classList.add(
      'error'
    );

    button.textContent=
      '▶ AUDIO: RETRY';

    button.classList.remove(
      'live'
    );

    button.disabled=false;

  }

}

/* =========================================================
   CONTROLS
========================================================= */

function setupControls(){

  window.addEventListener(
    'resize',
    function(){

      if(
        !camera ||
        !renderer
      ){
        return;
      }

      camera.aspect=
        innerWidth/
        innerHeight;

      camera.updateProjectionMatrix();

      renderer.setSize(
        innerWidth,
        innerHeight
      );

      if(cssRenderer){
        cssRenderer.setSize(innerWidth,innerHeight);
      }

    }
  );

  window.addEventListener(
    'keydown',
    function(e){

      // While typing, movement keys must never get stuck in the 3D controller.
      const active=document.activeElement;
      const typing=active && (active.tagName==='INPUT' || active.tagName==='TEXTAREA');

      if(e.code==='Escape' && chatMode){
        e.preventDefault();
        chatMode=false;
        const input=document.getElementById('chat-input');
        if(input) input.blur();
        keys={};
        return;
      }

      if(typing && !chatMode){
        return;
      }

      if(chatMode && active && active.id==='chat-input'){
        if(e.code==='KeyW' || e.code==='KeyA' || e.code==='KeyS' || e.code==='KeyD' || e.code==='ArrowUp' || e.code==='ArrowDown' || e.code==='ArrowLeft' || e.code==='ArrowRight'){
          return;
        }
      }

      if(!chatMode){
        if(e.code==='Digit1'){ playDance(1); e.preventDefault(); return; }
        if(e.code==='Digit2'){ playDance(2); e.preventDefault(); return; }
        if(e.code==='Digit3'){ playDance(3); e.preventDefault(); return; }
        if(e.code==='Digit4'){ playDance(4); e.preventDefault(); return; }
        if(e.code==='Digit5'){ playDance(5); e.preventDefault(); return; }
        if(e.code==='Digit6'){ playDance(6); e.preventDefault(); return; }
        if(['KeyW','KeyA','KeyS','KeyD','Space'].includes(e.code) && activeDance){ stopDance(); }
      }

      keys[e.code]=true;

      if(
        e.code==='KeyC'
      ){

        chatMode=
          !chatMode;

        toggleChat();

      }

      // SPACE = JUMP
      // Пока открыт чат — пробел остаётся обычным пробелом.
      if(
        e.code==='Space' &&
        !chatMode &&
        pointerLocked &&
        isGrounded
      ){

        e.preventDefault();

        jumpVelocity=JUMP_FORCE;
        isGrounded=false;

      }

    }
  );

  window.addEventListener(
    'keyup',
    function(e){

      keys[e.code]=false;

    }
  );

  const canvas =
    document.getElementById(
      'canvas3d'
    );

  canvas.addEventListener(
    'click',
    function(){

      if(!chatMode){

        canvas.requestPointerLock();

      }

    }
  );

  document.addEventListener(
    'pointerlockchange',
    function(){

      pointerLocked=
        document.pointerLockElement===
        canvas;

    }
  );

  document.addEventListener(
    'mousemove',
    function(e){

      if(!pointerLocked)return;

      yaw-=
        e.movementX*.002;

      pitch-=
        e.movementY*.002;

      pitch=
        Math.max(
          -1.45,
          Math.min(
            1.45,
            pitch
          )
        );

    }
  );

}

/* =========================================================
   AUDIO AUTOPLAY UNLOCK
   Browsers may block live audio after a reconnect/re-entry.
   The first click/touch/key interaction gives the page a real
   user gesture, so we use it to resume the existing HLS audio.
========================================================= */
(function(){
  const unlock=async function(){
    const ok=await unlockEWSAudio();
    if(ok){
      document.removeEventListener('pointerdown',unlock);
      document.removeEventListener('touchstart',unlock);
      document.removeEventListener('keydown',unlock);
    }
  };

  document.addEventListener('pointerdown',unlock,{passive:true});
  document.addEventListener('touchstart',unlock,{passive:true});
  document.addEventListener('keydown',unlock,{passive:true});
})();

function toggleChat(){

  const input =
    document.getElementById(
      'chat-input'
    );

  if(chatMode){

    if(document.pointerLockElement) document.exitPointerLock();

    input.focus();

  }else{

    input.blur();
    keys={};
    const canvas=document.getElementById('canvas3d');
    if(canvas && document.pointerLockElement!==canvas){
      try{ canvas.requestPointerLock(); }catch(err){}
    }

  }

}

function toggleScreenMenu(){

function setScreenStatus(text){
  const el=document.getElementById('screen-status');
  if(el) el.textContent=text;
}

function youtubeEmbed(url){
  try{
    const u=new URL(url);
    let id='';
    if(u.hostname.includes('youtu.be')){
      id=u.pathname.split('/').filter(Boolean)[0]||'';
    }else if(u.hostname.includes('youtube.com')){
      id=u.searchParams.get('v')||'';
      if(!id && u.pathname.startsWith('/shorts/')) id=u.pathname.split('/')[2]||'';
      if(!id && u.pathname.startsWith('/embed/')) id=u.pathname.split('/')[2]||'';
    }
    if(!id) return null;
    return 'https://www.youtube.com/embed/'+encodeURIComponent(id)+'?autoplay=1&rel=0&playsinline=1';
  }catch(e){ return null; }
}

function twitchEmbed(url){
  try{
    const u=new URL(url);
    if(!u.hostname.includes('twitch.tv')) return null;
    const parts=u.pathname.split('/').filter(Boolean);
    if(!parts.length) return null;
    const parent=location.hostname || 'ews-sessions.onrender.com';
    if(parts[0]==='videos' && parts[1]){
      return 'https://player.twitch.tv/?video='+encodeURIComponent(parts[1])+'&parent='+encodeURIComponent(parent)+'&autoplay=true';
    }
    return 'https://player.twitch.tv/?channel='+encodeURIComponent(parts[0])+'&parent='+encodeURIComponent(parent)+'&autoplay=true';
  }catch(e){ return null; }
}

function normalizeClubScreenUrl(raw){
  const value=String(raw||'').trim();
  if(!value) return null;

  const yt=youtubeEmbed(value);
  if(yt) return {src:yt,name:'YOUTUBE'};

  const tw=twitchEmbed(value);
  if(tw) return {src:tw,name:'TWITCH'};

  try{
    const u=new URL(value);
    if(u.protocol!=='http:' && u.protocol!=='https:') return null;
    return {src:u.href,name:'WEBSITE'};
  }catch(e){
    return null;
  }
}

function isClubHost(){
  return String(currentUser||'').trim().toLowerCase()==='mvxtra';
}

function loadClubScreen(){
  if(!isClubHost()){ setScreenStatus('Только главный пользователь клуба может включать экран.'); return; }
  const input=document.getElementById('screen-url'); const frame=document.getElementById('media-screen-frame'); const panel=document.getElementById('css3d-screen');
  if(!input||!frame||!panel)return; const result=normalizeClubScreenUrl(input.value);
  if(!result){setScreenStatus('Неверная ссылка. Вставь YouTube, Twitch или обычный https:// сайт.');return;}
  frame.src=result.src; panel.classList.add('active'); screenMediaActive=true; screenMediaUrl=result.src;
  setScreenStatus(result.name+' LOADED — экран закреплён. Нажми ESC, чтобы выйти из управления камерой и кликать по плееру.');
  if(socket)socket.emit('club-screen-state',{src:result.src,url:input.value.trim(),name:result.name,active:true,owner:currentUser});
  const menu=document.getElementById('screen-menu'); if(menu)menu.classList.remove('open');
}

function clearClubScreen(){
  if(!isClubHost())return; const frame=document.getElementById('media-screen-frame'); const panel=document.getElementById('css3d-screen');
  if(frame)frame.src='about:blank'; if(panel)panel.classList.remove('active'); screenMediaActive=false; screenMediaUrl='';
  if(socket)socket.emit('club-screen-state',{active:false,owner:currentUser}); setScreenStatus('Экран очищен. Можно загрузить YouTube, Twitch или сайт.');
}

// When the user wants to click the embedded player, release pointer lock first.
// The 3D screen remains physically fixed to the wall; only mouse control is released.
function enableScreenInteraction(){
  if(document.pointerLockElement){
    try{ document.exitPointerLock(); }catch(e){}
  }
  const panel=document.getElementById('css3d-screen');
  if(panel){ panel.style.pointerEvents='auto'; }
}

document.addEventListener('mousedown',function(e){
  const screen=e.target && e.target.closest ? e.target.closest('#css3d-screen') : null;
  if(screen) enableScreenInteraction();
});

/* =========================================================
   REMOTE CLUB SCREEN
   The server sends one shared screen state to every guest.
   This function is intentionally separate from loadClubScreen()
   because friends must never need to be the host to display it.
========================================================= */
function applyRemoteClubScreen(state){
  const frame=document.getElementById('media-screen-frame');
  const panel=document.getElementById('css3d-screen');
  if(!frame || !panel) return;

  state=state || {};

  if(state.active !== true || !state.src){
    frame.src='about:blank';
    panel.classList.remove('active');
    screenMediaActive=false;
    screenMediaUrl='';
    return;
  }

  // Prefer the original URL so every guest builds its own embed URL.
  // This is important for Twitch because the embed parent must match the
  // hostname used by the guest's browser, not the host's browser.
  let src='';
  const originalUrl=String(state.url||'').trim();
  if(originalUrl){
    const normalized=normalizeClubScreenUrl(originalUrl);
    src=normalized ? normalized.src : originalUrl;
  }else{
    src=String(state.src||'').trim();
  }
  if(!src) return;

  // Do not reload the iframe every time a duplicate Socket.IO event arrives.
  if(screenMediaUrl !== src){
    frame.src=src;
    screenMediaUrl=src;
  }

  screenMediaActive=true;
  panel.classList.add('active');

  // Make sure the iframe can play media on every guest browser.
  frame.setAttribute('allow','autoplay; fullscreen; encrypted-media; picture-in-picture');
  frame.setAttribute('allowfullscreen','');
}

   ANIMATION

function animate(){

  requestAnimationFrame(
    animate
  );

  if(!scene)return;

  const dt =
    Math.min(
      clock.getDelta(),
      .05
    );

  const time =
    performance.now()/1000;

  let bass=.2;
  let level=.2;

  if(
    analyser &&
    freqData &&
    audioStarted
  ){

    analyser.getByteFrequencyData(
      freqData
    );

    let b=0;

    for(
      let i=0;
      i<10 &&
      i<freqData.length;
      i++
    ){

      b+=freqData[i];

    }

    bass=
      b/
      (
        Math.min(
          10,
          freqData.length
        )*255
      );

    let total=0;

    for(
      let i=0;
      i<freqData.length;
      i++
    ){

      total+=freqData[i];

    }

    level=
      total/
      (
        freqData.length*255
      );

  }

  else{

    bass=
      .25+
      Math.sin(time*3)*.12;

    level=
      .25+
      Math.sin(time*1.5)*.08;

  }

  bassLevel=
    bassLevel*.82+
    bass*.18;

  audioLevel=
    audioLevel*.88+
    level*.12;

  const speed=
    chatMode || activeDance
      ?0
      :5*dt;

  let forward=0;
  let side=0;

  if(
    keys['KeyW']
  ){
    forward+=1;
  }

  if(
    keys['KeyS']
  ){
    forward-=1;
  }

  if(
    keys['KeyA']
  ){
    side-=1;
  }

  if(
    keys['KeyD']
  ){
    side+=1;
  }

  // =========================
  // JUMP PHYSICS
  // =========================

  if(!chatMode){

    jumpVelocity-=
      GRAVITY*dt;

    playerY+=
      jumpVelocity*dt;

    if(playerY<=GROUND_Y){

      playerY=GROUND_Y;
      jumpVelocity=0;
      isGrounded=true;

    }

  }

  if(
    pointerLocked &&
    !chatMode
  ){

    const fx=
      -Math.sin(yaw);

    const fz=
      -Math.cos(yaw);

    const rx=
      Math.cos(yaw);

    const rz=
      -Math.sin(yaw);

    tryMovePlayer(
      (fx*forward+rx*side)*speed,
      (fz*forward+rz*side)*speed
    );

  }

  camera.position.x=
    THREE.MathUtils.clamp(
      camera.position.x,
      -16,
      16
    );

  camera.position.z=
    THREE.MathUtils.clamp(
      camera.position.z,
      -15.5,
      15.5
    );

  camera.position.y=playerY;

  camera.rotation.order=
    'YXZ';

  camera.rotation.y=
    yaw;

  camera.rotation.x=
    pitch;

  if(playerBody){

    playerBody.position.x=
      camera.position.x;

    playerBody.position.z=
      camera.position.z;

    playerBody.visible=false;

  }

  broadcastPlayerState(performance.now());

  if(particles){
    particles.rotation.y+=.00015;
    particles.material.opacity=.22+audioLevel*.18;
  }

  if(fogParticles){
    fogParticles.rotation.y+=dt*.006;
    fogParticles.position.x=Math.sin(time*.12)*.7;
    fogParticles.position.z=Math.cos(time*.10)*.55;
    fogMaterial.opacity=.12+audioLevel*.16+bassLevel*.08;
    fogMaterial.size=2.5+bassLevel*1.2;
  }

  clubLights.forEach((light,i)=>{
    const sweepX=Math.sin(time*(.32+i*.055)+i)*7.8;
    const sweepZ=-2+Math.cos(time*(.26+i*.043)+i*.7)*8.2;

    light.target.position.x=sweepX;
    light.target.position.y=.7+Math.sin(time*(.7+i*.08))*1.1;
    light.target.position.z=sweepZ;

    light.intensity=1.15+bassLevel*5.8+audioLevel*1.4;
  });

  floorWashLights.forEach((light,i)=>{
    const wave=.5+.5*Math.sin(time*2.3+i*.85);
    light.intensity=.28+wave*.38+bassLevel*1.55;
  });

  fixtureGlows.forEach((ring,i)=>{
    ring.material.opacity=Math.min(
      1,
      .58+bassLevel*.9+Math.sin(time*4+i)*.12
    );
  });

  strobeLights.forEach((light,i)=>{
    const hit=Math.max(0,bassLevel-.34);
    light.intensity=Math.min(
      12,
      hit*24*(i%2?.72:1)
    );
  });

  laserSystems.forEach((laser,i)=>{
    const aimX=Math.sin(time*laser.speed+laser.phase)*11.5;
    const aimY=1.0+Math.sin(time*(laser.speed*.77)+laser.phase*1.7)*2.15;
    const aimZ=-1.5+Math.cos(time*(laser.speed*.83)+laser.phase)*10.5;
    const target=new THREE.Vector3(aimX,aimY,aimZ);

    laser.group.lookAt(target);

    const origin=laser.group.position;
    const end=origin.clone()
      .add(target.clone().sub(origin).normalize().multiplyScalar(34));

    const ca=laser.core.geometry.attributes.position.array;
    ca[0]=origin.x;
    ca[1]=origin.y;
    ca[2]=origin.z;
    ca[3]=end.x;
    ca[4]=end.y;
    ca[5]=end.z;
    laser.core.geometry.attributes.position.needsUpdate=true;

    const ga=laser.glow.geometry.attributes.position.array;
    ga[0]=origin.x;
    ga[1]=origin.y;
    ga[2]=origin.z;
    ga[3]=end.x;
    ga[4]=end.y;
    ga[5]=end.z;
    laser.glow.geometry.attributes.position.needsUpdate=true;

    const pulse=.55+bassLevel*.8;
    laser.core.material.opacity=Math.min(1,.58+pulse*.32);
    laser.glow.material.opacity=Math.min(.26,.08+pulse*.10);
  });

  remotePlayers.forEach(p=>{
    const t=performance.now()/1000;
    const swing=p.moving?Math.sin(t*8)*.35:0;
    const limbs=p.group.children.filter(o=>o.isMesh);
    if(limbs.length>=5){ limbs[2].rotation.x=swing; limbs[3].rotation.x=-swing; limbs[4].rotation.x=-swing; }
  });

  neonObjects.forEach(
    (obj,index)=>{
      const pulse=.72+Math.sin(time*3+index*.4)*.16+bassLevel*.55;
      const base=new THREE.Color(obj.userData.neonColor || 0xffffff);
      const boost=Math.min(1.65,pulse);

      obj.material.color.copy(base).multiplyScalar(boost);
      obj.material.opacity=Math.min(
        1,
        .78+audioLevel*.22+bassLevel*.16
      );

      if(obj.material.emissive){
        obj.material.emissive.copy(base).multiplyScalar(boost*.6);
      }
    }
  );

  lightObjects.forEach(
    (light,index)=>{

      light.intensity=
        1+
        bassLevel*2+
        Math.sin(
          time*2+
          index
        )*.15;

    }
  );

  if(screenCtx){

    screenCtx.fillStyle=
      '#050505';

    screenCtx.fillRect(
      0,
      0,
      1024,
      512
    );

    const grd =
      screenCtx.createLinearGradient(
        0,
        0,
        1024,
        0
      );

    const intensity=
      40+
      Math.floor(
        bassLevel*120
      );

    grd.addColorStop(
      0,
      `rgb(${intensity},${intensity},${intensity})`
    );

    grd.addColorStop(
      .5,
      '#050505'
    );

    grd.addColorStop(
      1,
      `rgb(${intensity},${intensity},${intensity})`
    );

    screenCtx.fillStyle=
      grd;

    screenCtx.fillRect(
      0,
      0,
      1024,
      512
    );

    screenCtx.fillStyle=
      '#fff';

    screenCtx.font=
      'bold 80px Arial';

    screenCtx.textAlign=
      'center';

    screenCtx.fillText(
      'EWS SESSIONS',
      512,
      200
    );

    screenCtx.font=
      '22px Arial';

    screenCtx.fillStyle=
      '#777';

    screenCtx.fillText(
      'UNDERGROUND CLUB',
      512,
      245
    );

    const bars=48;

    const bw=
      800/bars;

    for(
      let i=0;
      i<bars;
      i++
    ){

      let value;

      if(
        freqData &&
        audioStarted
      ){

        value=
          freqData[
            Math.floor(
              i*
              freqData.length/
              bars
            )
          ]/255;

      }else{

        value=
          .2+
          Math.sin(
            time*4+
            i*.5
          )*.15;

      }

      const h=
        value*180;

      screenCtx.fillStyle=
        '#fff';

      screenCtx.fillRect(
        112+i*bw,
        450-h,
        bw-3,
        h
      );

    }

    screenTexture.needsUpdate=true;

  }


  remotePlayers.forEach(p=>{
    if(p.dance) animateRemoteDance(p,time);
    else resetRemoteDancePose(p);
  });

  renderer.render(
    scene,
    camera
  );

  // Keep the HTML player exactly on the physical screen anchor.
  if(cssScreenObject && screenMesh){
    cssScreenObject.position.copy(screenMesh.position);
    cssScreenObject.rotation.copy(screenMesh.rotation);
    cssScreenObject.scale.set(0.01,0.01,0.01);
    cssScreenObject.position.z += 0.035;
  }

  if(cssRenderer && cssScene){
    cssRenderer.render(cssScene,camera);
  }

}

/* =========================================================
   REMOTE PLAYERS / SILHOUETTES
========================================================= */
function getAvatarModelPath(choice){
  return AVATAR_MODELS[choice]||AVATAR_MODELS.male;
}

function applyAvatarMaterials(root){
  root.traverse(o=>{
    if(!o.isMesh) return;
    o.castShadow=true;
    o.receiveShadow=true;
    if(Array.isArray(o.material)){
      o.material=o.material.map(m=>m.clone());
    }else if(o.material){
      o.material=o.material.clone();
    }
  });
}

function loadRemoteAvatar(p,choice){
  if(!p || !p.group) return;
  p.avatar=choice||'male';

  if(!avatarLoader) avatarLoader=new THREE.GLTFLoader();
  const requestChoice=p.avatar;
  const token=Date.now()+Math.random();
  p.avatarLoadToken=token;

  avatarLoader.load(
    getAvatarModelPath(requestChoice),
    gltf=>{
      if(!p.group || p.avatarLoadToken!==token) return;

      if(p.model){
        p.group.remove(p.model);
        p.model.traverse(o=>{
          if(o.geometry)o.geometry.dispose();
          if(o.material){
            if(o.material.map)o.material.map.dispose();
            o.material.dispose();
          }
        });
      }

      const model=gltf.scene.clone(true);
      applyAvatarMaterials(model);

      const box=new THREE.Box3().setFromObject(model);
      const size=new THREE.Vector3();
      box.getSize(size);
      const height=Math.max(size.y,0.001);
      const targetHeight=1.72;
      model.scale.setScalar(targetHeight/height);

      const scaledBox=new THREE.Box3().setFromObject(model);
      const center=new THREE.Vector3();
      scaledBox.getCenter(center);
      model.position.y=-scaledBox.min.y;
      model.position.x=-center.x;
      model.position.z=-center.z;
      model.rotation.y=Math.PI;

      p.group.add(model);
      p.model=model;
      p.parts=null;
    },
    undefined,
    err=>console.warn('[EWS AVATAR]',requestChoice,err)
  );
}

function createRemotePlayer(data){
  if(!scene || !data || !data.id || data.id===socket?.id) return;

  if(remotePlayers.has(data.id)) removeRemotePlayer(data.id);

  const g=new THREE.Group();
  g.userData.username=data.username||'PLAYER';

  const placeholder=new THREE.Mesh(
    new THREE.CylinderGeometry(.22,.30,.85,8),
    new THREE.MeshStandardMaterial({color:0x333333,roughness:1})
  );
  placeholder.position.y=.43;
  g.add(placeholder);

  const labelCanvas=document.createElement('canvas');
  labelCanvas.width=256; labelCanvas.height=64;
  const ctx=labelCanvas.getContext('2d');
  ctx.clearRect(0,0,256,64);
  ctx.font='bold 24px Arial';
  ctx.textAlign='center';
  ctx.fillStyle='#ffffff';
  ctx.fillText(g.userData.username,128,32);
  const tex=new THREE.CanvasTexture(labelCanvas);
  const label=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false}));
  label.scale.set(1.7,.42,1);
  label.position.y=1.95;
  g.add(label);

  const x=Number.isFinite(Number(data.x)) ? Number(data.x) : 0;
  const z=Number.isFinite(Number(data.z)) ? Number(data.z) : 13;
  const y=Number.isFinite(Number(data.y)) ? Number(data.y) : 0;
  const ry=Number.isFinite(Number(data.yaw ?? data.ry)) ? Number(data.yaw ?? data.ry) : 0;

  g.position.set(x,y,z);
  g.rotation.y=ry;
  g.visible=true;
  scene.add(g);

  const p={
    group:g,
    last:{x,z,yaw:ry},
    moving:!!data.moving,
    username:data.username||'PLAYER',
    avatar:data.avatar||'male',
    dance:Number(data.dance)||0,
    danceStartedAt:Number(data.danceStartedAt)||0,
    parts:null,
    model:null,
    baseY:y
  };
  remotePlayers.set(data.id,p);
  loadRemoteAvatar(p,p.avatar);
}
function updateRemotePlayer(data){
  if(!data.id || data.id===socket?.id) return;
  if(!remotePlayers.has(data.id)) createRemotePlayer(data);
  const p=remotePlayers.get(data.id);

  const rawX=Number(data.x);
  const rawZ=Number(data.z);
  const rawY=Number(data.y);
  const rawYaw=Number(data.yaw ?? data.ry);

  const nx=Number.isFinite(rawX) ? rawX : p.group.position.x;
  const nz=Number.isFinite(rawZ) ? rawZ : p.group.position.z;
  const ny=Number.isFinite(rawY) ? rawY : p.group.position.y;
  const nyaw=Number.isFinite(rawYaw) ? rawYaw : p.group.rotation.y;

  const dx=nx-p.group.position.x;
  const dz=nz-p.group.position.z;

  p.moving=Boolean(data.moving) || Math.hypot(dx,dz)>.002;
  if(data.dance!==undefined) p.dance=Number(data.dance)||0;
  if(data.danceStartedAt!==undefined) p.danceStartedAt=Number(data.danceStartedAt)||0;
  if(data.avatar && data.avatar!==p.avatar) loadRemoteAvatar(p,data.avatar);
  p.group.position.x=nx;
  p.group.position.y=ny;
  p.group.position.z=nz;
  p.group.rotation.y=nyaw;
  p.last={x:nx,z:nz,yaw:nyaw};
}

function removeRemotePlayer(id){
  const p=remotePlayers.get(id);
  if(!p) return;
  scene.remove(p.group);
  p.group.traverse(o=>{ if(o.geometry) o.geometry.dispose(); if(o.material){ if(o.material.map) o.material.map.dispose(); o.material.dispose(); }});
  remotePlayers.delete(id);
}

function broadcastPlayerState(now){
  if(!socket || !socket.connected || !camera) return;
  if(now-lastPlayerBroadcast<50) return;
  lastPlayerBroadcast=now;
  const moving = Math.abs(camera.position.x-(broadcastPlayerState.lastX ?? camera.position.x)) > 0.0005 ||
                 Math.abs(camera.position.z-(broadcastPlayerState.lastZ ?? camera.position.z)) > 0.0005;

  broadcastPlayerState.lastX=camera.position.x;
  broadcastPlayerState.lastZ=camera.position.z;

  socket.emit('player-state',{
    x:camera.position.x,
    y:Math.max(0, playerY-1.7),
    z:camera.position.z,
    yaw:yaw,
    pitch:pitch,
    username:currentUser,
    moving:moving,
    jumping:!isGrounded,
    avatar:avatarChoice,
    dance:activeDance,
    danceStartedAt:danceStartedAt
  });
}



/* =========================================================
   EMOTES / DANCES
========================================================= */


function setWardrobeStatus(text){
  const el=document.getElementById('wardrobe-status');
  if(el) el.textContent=text||'';
}

function updateWardrobeButtons(){
  document.querySelectorAll('.wardrobe-option').forEach(btn=>{
    btn.classList.toggle('active',btn.dataset.avatar===avatarChoice);
  });
}

function toggleWardrobe(){
  const menu=document.getElementById('wardrobe-menu');
  if(!menu)return;
  menu.classList.toggle('open');
  updateWardrobeButtons();
  setWardrobeStatus('SELECT YOUR LOOK');
  try{ if(document.pointerLockElement) document.exitPointerLock(); }catch(e){}
}

function selectAvatar(choice){
  if(!AVATAR_MODELS[choice]) return;
  avatarChoice=choice;
  localStorage.setItem('ewsAvatar',avatarChoice);
  updateWardrobeButtons();
  setWardrobeStatus('LOOK SAVED');
  if(socket && socket.connected){
    socket.emit('player-avatar',{avatar:avatarChoice});
    broadcastPlayerState(Date.now(),true);
  }
}

function playDance(id){
  if(chatMode || !socket) return;
  activeDance=Math.max(1,Math.min(6,Number(id)||1));
  danceStartedAt=Date.now();
  keys={};
  try{ if(document.pointerLockElement) document.exitPointerLock(); }catch(e){}
  const menu=document.getElementById('emotes-menu');
  if(menu) menu.classList.remove('open');
  broadcastPlayerState(Date.now(),true);
}

function stopDance(){
  activeDance=0;
  danceStartedAt=0;
  const menu=document.getElementById('emotes-menu');
  if(menu) menu.classList.remove('open');
  broadcastPlayerState(Date.now(),true);
}

function animateRemoteDance(p,time){
  if(!p || !p.parts) return;
  const q=p.parts;
  const t=Math.max(0,(Date.now()-(p.danceStartedAt||Date.now()))/1000);
  const w=t*Math.PI*2;
  q.torso.rotation.set(0,0,0);
  q.head.rotation.set(0,0,0);
  q.leftArm.rotation.set(0,0,-.12); q.rightArm.rotation.set(0,0,.12);
  q.leftLeg.rotation.set(0,0,0); q.rightLeg.rotation.set(0,0,0);
  if(!p.dance) return;
  if(p.dance===1){
    q.leftArm.rotation.z=-1.1+Math.sin(w*2)*.35; q.rightArm.rotation.z=1.1-Math.sin(w*2)*.35;
    q.leftLeg.rotation.z=Math.sin(w)*.35; q.rightLeg.rotation.z=-Math.sin(w)*.35;
    q.torso.rotation.y=Math.sin(w)*.18;
  }else if(p.dance===2){
    q.leftArm.rotation.z=-.55+Math.sin(w*2)*.9; q.rightArm.rotation.z=.55-Math.sin(w*2)*.9;
    q.leftLeg.rotation.z=Math.sin(w*2)*.28; q.rightLeg.rotation.z=-Math.sin(w*2)*.28;
    q.torso.rotation.z=Math.sin(w)*.16;
  }else if(p.dance===3){
    q.leftArm.rotation.z=-1.25+Math.sin(w*2)*.25; q.rightArm.rotation.z=.25+Math.sin(w*2+.8)*.8;
    q.leftLeg.rotation.z=Math.sin(w*2)*.55; q.rightLeg.rotation.z=-Math.sin(w*2)*.55;
    q.torso.rotation.y=Math.sin(w)*.35;
  }else if(p.dance===4){
    const step=Math.sin(w*2)>0?1:-1;
    q.leftArm.rotation.z=-.85*step; q.rightArm.rotation.z=.85*step;
    q.leftLeg.rotation.z=.35*step; q.rightLeg.rotation.z=-.35*step;
    q.head.rotation.y=Math.sin(w*2)*.35;
  }else if(p.dance===5){
    const bounce=Math.abs(Math.sin(w*2))*0.22;
    p.group.position.y=(p.baseY||p.group.position.y)+bounce;
    q.leftArm.rotation.z=-.8-Math.sin(w*2)*.3; q.rightArm.rotation.z=.8+Math.sin(w*2)*.3;
  }else if(p.dance===6){
    q.leftArm.rotation.z=-1.35+Math.sin(w*3)*.5; q.rightArm.rotation.z=.15;
    q.rightArm.rotation.x=Math.sin(w*2)*.5; q.head.rotation.z=Math.sin(w*2)*.15;
  }
}

function resetRemoteDancePose(p){
  if(!p || !p.parts) return;
  p.group.position.y=p.baseY||0;
  const q=p.parts;
  q.torso.rotation.set(0,0,0); q.head.rotation.set(0,0,0);
  q.leftArm.rotation.set(0,0,-.12); q.rightArm.rotation.set(0,0,.12);
  q.leftLeg.rotation.set(0,0,0); q.rightLeg.rotation.set(0,0,0);
}

    try{

      if(hls){
        hls.destroy();
      }

    }catch(e){}

    try{

      if(audioContext){
        audioContext.close();
      }

    }catch(e){}

  }
);
