<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>EWS SESSIONS</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030303;color:#fff;font-family:Arial,Helvetica,sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
#app{position:fixed;inset:0;background:#030303}
#game{position:absolute;inset:0}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block}
#ui{position:absolute;inset:0;pointer-events:none;z-index:10}
.panel{pointer-events:auto;background:rgba(4,4,4,.88);border:1px solid rgba(255,255,255,.18);box-shadow:0 18px 60px rgba(0,0,0,.65);backdrop-filter:blur(10px)}
#auth{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#171717 0,#050505 45%,#000 100%);z-index:20}
.authbox{width:min(420px,calc(100vw - 32px));padding:30px}
.logo{font-weight:900;letter-spacing:.28em;font-size:30px;text-align:center;margin-bottom:8px}
.sub{text-align:center;color:#888;font-size:12px;letter-spacing:.16em;margin-bottom:26px}
.field{width:100%;margin:8px 0;padding:13px 14px;border:1px solid #333;background:#090909;color:#fff;outline:none}
.field:focus{border-color:#aaa}
.row{display:flex;gap:8px}
.action{flex:1;padding:12px;border:1px solid #666;background:#fff;color:#000;font-weight:800}
.action.alt{background:#111;color:#fff;border-color:#444}
#authMsg{min-height:20px;margin-top:12px;text-align:center;color:#bbb;font-size:12px}
#hud{display:none;position:absolute;inset:0}
#topbar{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.badge{padding:8px 11px;background:rgba(0,0,0,.62);border:1px solid #292929;font-size:12px;letter-spacing:.08em}
#online{position:absolute;top:58px;right:14px;width:210px;padding:12px;max-height:260px;overflow:auto}
.title{font-size:10px;color:#888;letter-spacing:.2em;margin-bottom:8px}
.user{font-size:12px;padding:5px 0;border-bottom:1px solid #171717}
.user:last-child{border-bottom:0}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#fff;margin-right:7px}
#chat{position:absolute;left:14px;bottom:14px;width:min(390px,calc(100vw - 28px))}
#messages{height:180px;overflow:auto;padding:10px;margin-bottom:7px;background:linear-gradient(transparent,rgba(0,0,0,.7));mask-image:linear-gradient(transparent 0,#000 18%)}
.msg{font-size:12px;line-height:1.45;margin:4px 0;text-shadow:0 2px 5px #000}
.msg b{font-weight:800}
#chatInput{width:100%;padding:11px;background:rgba(0,0,0,.8);border:1px solid #333;color:#fff;outline:0}
#controls{position:absolute;bottom:14px;right:14px;width:auto;pointer-events:auto;z-index:30}
#screenControl{display:none;padding:10px;width:250px;margin-bottom:7px}
#screenControl input{width:100%;margin:4px 0;padding:9px;background:#090909;color:#fff;border:1px solid #333}
#screenActions{display:flex;gap:6px;margin-top:7px}
#screenButton,#screenPlay{padding:9px 16px;border:1px solid #666;background:#080808;color:#fff;font-weight:800;letter-spacing:.12em}
#screenButton:hover,#screenPlay:hover{background:#fff;color:#000}
#screenPlay{display:none}
#screenStatus{font-size:10px;color:#888;margin-top:7px;line-height:1.35}
#help{position:absolute;top:14px;left:50%;transform:translateX(-50%);font-size:10px;color:#aaa;letter-spacing:.12em;background:rgba(0,0,0,.5);padding:7px 10px}
#crosshair{position:absolute;left:50%;top:50%;width:12px;height:12px;transform:translate(-50%,-50%);opacity:.55}
#crosshair:before,#crosshair:after{content:"";position:absolute;background:#fff}
#crosshair:before{width:12px;height:1px;top:5px}
#crosshair:after{height:12px;width:1px;left:5px}
#screenOverlay{position:absolute;inset:0;pointer-events:none;z-index:4}
#toast{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);padding:9px 13px;background:#111;border:1px solid #444;font-size:12px;opacity:0;transition:.2s}
#toast.show{opacity:1}
@media(max-width:700px){
 #online{width:170px}
 #help{display:none}
 #controls{width:190px}
 #screenOverlay{width:88vw}
}
</style>
</head>
<body>
<div id="app">
  <div id="auth">
    <div class="authbox panel">
      <div class="logo">EWS SESSIONS</div>
      <div class="sub">UNDERGROUND CLUB / LIVE</div>
      <input id="username" class="field" autocomplete="username" placeholder="Username">
      <input id="password" class="field" autocomplete="current-password" type="password" placeholder="Password">
      <div class="row">
        <button id="loginBtn" class="action">ВХОД</button>
        <button id="registerBtn" class="action alt">РЕГИСТРАЦИЯ</button>
      </div>
      <div id="authMsg"></div>
    </div>
  </div>

  <div id="game">
    <canvas id="scene"></canvas>
    <div id="screenOverlay"></div>
  </div>

  <div id="ui">
    <div id="hud">
      <div id="topbar">
        <div class="badge">EWS SESSIONS <span id="me"></span></div>
        <div class="badge"><span id="langLabel">EN</span> · ENTER = CHAT</div>
      </div>

      <div id="help">CLICK TO LOCK MOUSE · WASD MOVE · SPACE JUMP · 1–4 EMOTES · ENTER CHAT</div>
      <div id="crosshair"></div>

      <div id="online" class="panel">
        <div class="title">ONLINE</div>
        <div id="onlineList"></div>
      </div>

      <div id="chat">
        <div id="messages"></div>
        <input id="chatInput" maxlength="240" autocomplete="off" placeholder="Нажми ENTER и напиши сообщение...">
      </div>

      <div id="controls">
        <div id="screenControl" class="panel">
          <div class="title">SCREEN</div>
          <input id="screenSrc" autocomplete="off" placeholder="Twitch / HLS ссылка">
          <div id="screenActions">
            <button id="screenPlay" type="button">PLAY</button>
          </div>
          <div id="screenStatus">Вставь ссылку и нажми PLAY</div>
        </div>
        <button id="screenButton" type="button">SCREEN</button>
      </div>
    </div>
  </div>
  <div id="toast"></div>
</div>

<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS3DRenderer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script>
(() => {
'use strict';

const $ = id => document.getElementById(id);
const HOST = 'mvxtra';
const LANGS = ['ru','en','es','de','fr','zh','ja','ko','ar','hi','pt','it','tr','uk','nl','pl'];
const LANG_NAMES = {ru:'RU',en:'EN',es:'ES',de:'DE',fr:'FR',zh:'ZH',ja:'JA',ko:'KO',ar:'AR',hi:'HI',pt:'PT',it:'IT',tr:'TR',uk:'UK',nl:'NL',pl:'PL'};

let socket = null;
let username = '';
let language = localStorage.getItem('ews-language') || 'en';
let host = false;
let joined = false;
let hls = null;
let screenVideo = null;
let screenTexture = null;
let screenMesh = null;
let screenModel = null;

let renderer, cssRenderer, scene, camera, screenCssObject, screenCssFrame;
let clock = new THREE.Clock();
let yaw = 0, pitch = 0;
let px = 0, py = 0, pz = 8;
let vy = 0, grounded = true;
const keys = {};
const remotes = new Map();
let lastState = 0;

const authMsg = $('authMsg');

function toast(text) {
  const el = $('toast');
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => el.classList.remove('show'), 2200);
}

function setAuthMessage(text) {
  authMsg.textContent = text || '';
}

function setLoggedIn(name, token) {
  username = name;
  if(token) localStorage.setItem('ews-session-token', token);
  localStorage.setItem('ews-username', name);
  $('auth').style.display = 'none';
  $('hud').style.display = 'block';
  $('me').textContent = '· ' + name;
}

async function api(path, body) {
  const r = await fetch(path, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(body)
  });
  const data = await r.json().catch(() => ({ok:false,error:'Server response error'}));
  if (!r.ok || !data.ok) throw new Error(data.error || 'Ошибка сервера');
  return data;
}

$('loginBtn').onclick = async () => {
  setAuthMessage('Вход...');
  try {
    const data = await api('/api/login', {
      username: $('username').value,
      password: $('password').value
    });
    setLoggedIn(data.username, data.token);
    startClub();
  } catch(e) {
    setAuthMessage(e.message);
  }
};

$('registerBtn').onclick = async () => {
  setAuthMessage('Регистрация...');
  try {
    const data = await api('/api/register', {
      username: $('username').value,
      password: $('password').value
    });
    setLoggedIn(data.username);
    startClub();
  } catch(e) {
    setAuthMessage(e.message);
  }
};

$('password').addEventListener('keydown', e => {
  if (e.key === 'Enter') $('loginBtn').click();
});

function buildWorld() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x030303);
  scene.fog = new THREE.FogExp2(0x030303, 0.022);

  camera = new THREE.PerspectiveCamera(72, innerWidth/innerHeight, .05, 100);
  camera.rotation.order = 'YXZ';

  renderer = new THREE.WebGLRenderer({canvas:$('scene'), antialias:true, powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);

  cssRenderer = new THREE.CSS3DRenderer();
  cssRenderer.setSize(innerWidth, innerHeight);

  // Twitch is a real iframe/CSS3D surface. It must be above the WebGL
  // canvas or the physical black backing plane will hide it completely.
  cssRenderer.domElement.style.position = 'absolute';
  cssRenderer.domElement.style.inset = '0';
  cssRenderer.domElement.style.pointerEvents = 'none';
  cssRenderer.domElement.style.zIndex = '3';

  renderer.domElement.style.position = 'absolute';
  renderer.domElement.style.inset = '0';
  renderer.domElement.style.zIndex = '2';

  $('game').appendChild(cssRenderer.domElement);
  $('game').appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0xffffff, .16));

  const floorMat = new THREE.MeshStandardMaterial({color:0x080808,roughness:.86,metalness:.18});
  const floor = new THREE.Mesh(new THREE.BoxGeometry(32,.25,28), floorMat);
  floor.position.y=-.13;
  floor.receiveShadow=true;
  scene.add(floor);

  const grid = new THREE.GridHelper(30,30,0xaaaaaa,0x555555);
  grid.position.y=.01;
  grid.material.transparent=true;
  grid.material.opacity=.17;
  scene.add(grid);

  // White club roof
  const roofMat = new THREE.MeshStandardMaterial({color:0xffffff,roughness:.72,metalness:.12,side:THREE.DoubleSide});
  const roof = new THREE.Mesh(new THREE.BoxGeometry(32,.22,28), roofMat);
  roof.position.set(0,7.05,0);
  roof.receiveShadow = true;
  scene.add(roof);

  // Back wall and side walls
  const wallMat = new THREE.MeshStandardMaterial({color:0x0a0a0a,roughness:.78,metalness:.3});
  addBox(32,7,.3,0,3.5,-14,wallMat);
  addBox(.3,7,28,-16,3.5,0,wallMat);
  addBox(.3,7,28,16,3.5,0,wallMat);

  // Stage
  addBox(18,.7,4,0,.35,-11.5,new THREE.MeshStandardMaterial({color:0x111111,roughness:.55,metalness:.35}));
  addBox(17,5,.18,0,3.0,-13.85,new THREE.MeshStandardMaterial({color:0x151515,roughness:.5,metalness:.5}));


  // Physical club screen: this is a real Three.js object fixed to the back wall.
  createPhysicalScreen();

  // Speaker stacks / imported model slots.
  // Fallbacks are kept only if the imported large speaker model cannot load.
  addSpeaker(-7.15,-10.9);
  addSpeaker(7.15,-10.9);
  loadSpeakerModel();

  // Ceiling rig
  const rigMat = new THREE.MeshStandardMaterial({color:0x111111,roughness:.4,metalness:.8});
  addBox(17,.14,.14,0,6.4,-10.5,rigMat);
  addBox(17,.14,.14,0,6.4,-3,rigMat);
  addBox(17,.14,.14,0,6.4,5,rigMat);

  // PROFESSIONAL CLUB LIGHTING RIG
  setupClubLighting();

  // No text/logo is placed over the screen surface.
  // The screen must remain a clean video texture / Twitch surface.
  // Fog/dust
  const count = 500;
  const pos = new Float32Array(count*3);
  for(let i=0;i<count;i++){
    pos[i*3] = Math.random()*30-15;
    pos[i*3+1] = Math.random()*6+.2;
    pos[i*3+2] = Math.random()*26-13;
  }
  const pg = new THREE.BufferGeometry();
  pg.setAttribute('position', new THREE.BufferAttribute(pos,3));
  scene.add(new THREE.Points(pg,new THREE.PointsMaterial({
    color:0x999999,size:.025,transparent:true,opacity:.3,depthWrite:false
  })));

  for(let i=0;i<5;i++){
    const light = new THREE.PointLight(0xffffff,.35,12);
    light.position.set(-10+i*5,4,-4);
    scene.add(light);
  }

  window.addEventListener('resize', resize);
  document.addEventListener('mousemove', mouseLook);
  document.addEventListener('pointerlockchange', () => {
    $('help').style.opacity = document.pointerLockElement ? '.18' : '.7';
  });

  $('scene').addEventListener('click', () => {
    if (document.activeElement === $('chatInput')) return;
    if(screenVideo) screenVideo.play().catch(()=>{});
    $('scene').requestPointerLock?.();
  });
}

function addBox(w,h,d,x,y,z,mat) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.position.set(x,y,z);
  scene.add(m);
  return m;
}

function createPhysicalScreen() {
  const backing = new THREE.Mesh(
    new THREE.PlaneGeometry(11.6, 5.45),
    new THREE.MeshBasicMaterial({ color: 0x000000 })
  );
  backing.position.set(0, 3.175, -13.48);
  scene.add(backing);
  screenMesh = backing;
}

function loadSpeakerModel() {
  if (!THREE.GLTFLoader) return;

  const candidates = [
    '/models/speakers big.glb',
    '/models/колонки.glb',
    '/models/speakers.glb',
    '/models/speaker.glb',
    '/models/column.glb',
    '/assets/speakers.glb',
    '/assets/speaker.glb',
    '/media/speakers.glb',
    '/media/speaker.glb'
  ];

  const loader = new THREE.GLTFLoader();
  let index = 0;

  const tryNext = () => {
    if (index >= candidates.length) return;
    const url = candidates[index++];
    loader.load(url, gltf => {
      // Use the imported speaker as two physical stacks beside the screen.
      const source = gltf.scene;
      source.traverse(o => {
        if (o.isMesh) {
          o.castShadow = true;
          o.receiveShadow = true;
        }
      });

      const left = source.clone(true);
      const right = source.clone(true);

      // Place the imported large speakers directly beside the screen.
      // They replace the old fallback speaker stacks.
      left.scale.setScalar(0.62);
      right.scale.setScalar(0.62);
      // Large speakers stand directly on the dance-floor, symmetrically beside the screen.
      left.position.set(-6.55, 0, -13.25);
      right.position.set(6.55, 0, -13.25);

      // Face the dance floor / center of the club.
      left.rotation.y = 0;
      right.rotation.y = Math.PI;

      scene.add(left);
      scene.add(right);
      screenModel = {left,right};

      // Hide the old center speaker model/fallbacks so nothing sits in front of the screen.
      const fallback = scene.userData.fallbackSpeakers;
      if (fallback) fallback.forEach(o => o.visible = false);

      toast('Колонки поставлены по краям экрана');
    }, undefined, () => tryNext());
  };

  tryNext();
}

function setupClubLighting() {
  scene.userData.clubLights = [];
  scene.userData.clubBeams = [];
  scene.userData.strobe = [];

  // Stage wash: two strong professional spotlights aimed at the dance floor.
  const stageSpots = [
    {x:-5.5, y:6.0, z:-10.5, color:0xffffff},
    {x: 5.5, y:6.0, z:-10.5, color:0xffffff}
  ];

  for (const p of stageSpots) {
    const spot = new THREE.SpotLight(p.color, 8.0, 25, Math.PI/7, 0.55, 1.3);
    spot.position.set(p.x,p.y,p.z);
    spot.target.position.set(p.x*0.25,0,1.5);
    scene.add(spot.target);
    scene.add(spot);
    spot.castShadow = true;
    scene.userData.clubLights.push(spot);
  }

  // Colored moving-head fixtures across the ceiling.
  const colors = [0xff1744,0x247bff,0x8a2be2,0x00e5ff,0xffffff,0xff1744];
  [-7.5,-4.5,-1.5,1.5,4.5,7.5].forEach((x,i)=>{
    const housing = new THREE.Mesh(
      new THREE.BoxGeometry(.62,.32,.62),
      new THREE.MeshStandardMaterial({color:0x050505,roughness:.3,metalness:.95})
    );
    housing.position.set(x,6.12,-7.5);
    scene.add(housing);

    const beam = new THREE.SpotLight(colors[i], 5.5, 22, Math.PI/10, .72, 1.5);
    beam.position.set(x,5.95,-7.5);
    beam.target.position.set(x*.55,0,1.0);
    scene.add(beam.target);
    scene.add(beam);
    scene.userData.clubBeams.push({light:beam,target:beam.target,phase:i*.75,baseX:x});
  });

  // Side/back washes make the room read like a real venue instead of a flat dark box.
  [
    [-15,3.2,-6,0xff1744],
    [ 15,3.2,-6,0x247bff],
    [-13,3.0, 7,0x8a2be2],
    [ 13,3.0, 7,0x00e5ff]
  ].forEach(([x,y,z,color])=>{
    const l = new THREE.PointLight(color, 2.8, 13);
    l.position.set(x,y,z);
    scene.add(l);
    scene.userData.clubLights.push(l);
  });

  // Two narrow laser-like beam fixtures aimed across the dance floor.
  [-1,1].forEach(side=>{
    const beam = new THREE.SpotLight(side<0?0xff1744:0x247bff, 4.2, 30, Math.PI/35, .25, 1.0);
    beam.position.set(side*7.8,5.8,-8.8);
    beam.target.position.set(-side*7.0,0,5.5);
    scene.add(beam.target);
    scene.add(beam);
    scene.userData.clubBeams.push({light:beam,target:beam.target,phase:side*1.7,laser:true,baseX:side*7.8});
  });

  // Strobe fixtures at the front truss. Normally dim, then flash in short pulses.
  [-6,-2,2,6].forEach(x=>{
    const l = new THREE.PointLight(0xffffff,0,18);
    l.position.set(x,5.9,-10.4);
    scene.add(l);
    scene.userData.strobe.push(l);
  });
}

function updateClubLighting(t) {
  const beams = scene.userData.clubBeams || [];
  beams.forEach((b,i)=>{
    const a = t*0.72 + b.phase;
    if (b.laser) {
      b.target.position.x = Math.sin(a)*7;
      b.target.position.z = 4.5 + Math.cos(a*0.8)*4;
      b.light.intensity = 3.0 + (Math.sin(t*2.2+b.phase)+1)*1.1;
    } else {
      b.target.position.x = Math.sin(a)*8;
      b.target.position.z = -1 + Math.cos(a*0.67)*10;
      b.target.position.y = 0.4 + Math.sin(a*0.55)*1.2;
      b.light.intensity = 3.8 + (Math.sin(t*2.0+b.phase)+1)*1.7;
    }
  });

  const washes = scene.userData.clubLights || [];
  washes.forEach((l,i)=>{
    if (l.isPointLight) l.intensity = 1.8 + (Math.sin(t*1.15+i*1.7)+1)*0.9;
  });

  const pulse = Math.sin(t*5.5);
  const hit = pulse > 0.88 ? 7.5 : 0;
  (scene.userData.strobe || []).forEach(l=>l.intensity=hit);
}

function addSpeaker(x,z) {
  const group=new THREE.Group();
  const cabinetMaterial=new THREE.MeshStandardMaterial({
    color:0x080808,roughness:.43,metalness:.38
  });
  const edgeMaterial=new THREE.MeshStandardMaterial({
    color:0x202020,roughness:.62,metalness:.14
  });

  const sub=new THREE.Mesh(new THREE.BoxGeometry(1.85,1.55,1.18),cabinetMaterial);
  sub.position.y=.78;
  group.add(sub);

  const top=new THREE.Mesh(new THREE.BoxGeometry(1.45,2.85,.98),cabinetMaterial);
  top.position.y=2.98;
  group.add(top);

  const subRing=new THREE.Mesh(new THREE.TorusGeometry(.42,.055,12,36),edgeMaterial);
  subRing.position.set(0,.78,.61);
  group.add(subRing);

  const subCone=new THREE.Mesh(
    new THREE.CircleGeometry(.37,36),
    new THREE.MeshStandardMaterial({color:0x141414,roughness:.72,metalness:.04})
  );
  subCone.position.set(0,.78,.615);
  group.add(subCone);

  for(let i=0;i<3;i++){
    const y=2.16+i*.72;
    const ring=new THREE.Mesh(new THREE.TorusGeometry(.245,.036,10,28),edgeMaterial);
    ring.position.set(0,y,.505);
    group.add(ring);

    const driver=new THREE.Mesh(
      new THREE.CircleGeometry(.21,30),
      new THREE.MeshStandardMaterial({color:0x161616,roughness:.76,metalness:.03})
    );
    driver.position.set(0,y,.51);
    group.add(driver);
  }

  group.position.set(x,0,z);
  group.rotation.y=Math.PI;
  group.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});
  scene.add(group);

  scene.userData.fallbackSpeakers=scene.userData.fallbackSpeakers||[];
  scene.userData.fallbackSpeakers.push(group);
  return group;
}

function makeTextSprite(text,size) {
  const c=document.createElement('canvas');
  c.width=512;c.height=180;
  const ctx=c.getContext('2d');
  ctx.clearRect(0,0,512,180);
  ctx.fillStyle='#fff';
  ctx.font='900 110px Arial';
  ctx.textAlign='center';
  ctx.fillText(text,256,120);
  const tex=new THREE.CanvasTexture(c);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true}));
  s.scale.set(size,size*.35,1);
  return s;
}

function resize() {
  if(!camera || !renderer) return;
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  if(cssRenderer) cssRenderer.setSize(innerWidth,innerHeight);
}

function mouseLook(e) {
  if(document.pointerLockElement !== $('scene')) return;

  // Mouse look is rotation ONLY. Never change the player's world position here.
  // Movement of X/Z is handled exclusively by WASD in animate().
  const keepX = px;
  const keepZ = pz;

  yaw -= e.movementX * 0.0022;
  pitch -= e.movementY * 0.0022;
  pitch = THREE.MathUtils.clamp(pitch,-1.3,1.3);

  // Hard guard: rotating the mouse can never make the player orbit/drift.
  px = keepX;
  pz = keepZ;
}

function animate() {
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.05);

  const forward=(keys.KeyW?1:0)-(keys.KeyS?1:0);
  const side=(keys.KeyD?1:0)-(keys.KeyA?1:0);

  if(document.pointerLockElement === $('scene') && (forward||side)) {
    const len=Math.hypot(forward,side)||1;
    const f=forward/len, s=side/len;
    const fx=-Math.sin(yaw), fz=-Math.cos(yaw);
    const rx=Math.cos(yaw), rz=-Math.sin(yaw);
    px+=(fx*f+rx*s)*4.5*dt;
    pz+=(fz*f+rz*s)*4.5*dt;
    px=THREE.MathUtils.clamp(px,-15,15);
    pz=THREE.MathUtils.clamp(pz,-13,13);
  }

  if(document.pointerLockElement === $('scene')) {
    vy -= 18*dt;
    py += vy*dt;
    if(py<=0){py=0;vy=0;grounded=true}
  }

  camera.position.set(px,1.65+py,pz);
  camera.rotation.set(pitch,yaw,0);

  const now=performance.now();
  if(socket?.connected && now-lastState>70){
    lastState=now;
    socket.emit('player:state',{
      x:px,z:pz,yaw,moving:Boolean(forward||side)
    });
  }

  updateRemotes(now/1000);
  updateClubLighting(now/1000);
  renderer.render(scene,camera);
  if(cssRenderer) cssRenderer.render(scene,camera);
}

document.addEventListener('keydown', e => {
  if(e.target?.tagName==='INPUT' || e.target?.tagName==='SELECT') return;

  if(e.code==='Space' && grounded){
    vy=7;
    grounded=false;
    e.preventDefault();
  }

  if(e.code==='Enter'){
    e.preventDefault();
    $('chatInput').focus();
    return;
  }

  keys[e.code]=true;
  if(socket?.connected && /^[1-4]$/.test(e.key)) socket.emit('player:emote',Number(e.key));
});

document.addEventListener('keyup',e => keys[e.code]=false);

$('chatInput').addEventListener('keydown', async e => {
  if(e.key!=='Enter') return;
  e.preventDefault();
  const text=$('chatInput').value.trim();
  $('chatInput').value='';
  $('chatInput').blur();
  if(text && socket?.connected) socket.emit('chat:send',text);
});

function createAvatar(data) {
  const g=new THREE.Group();
  const seed=hash(data.id||data.username);
  const bodyColor=[0x454545,0x666666,0x303030,0x777777][seed%4];
  const bodyMat=new THREE.MeshStandardMaterial({color:bodyColor,roughness:.75});
  const dark=new THREE.MeshStandardMaterial({color:0x151515,roughness:.85});
  const headMat=new THREE.MeshStandardMaterial({color:0xbcbcbc,roughness:.7});

  const body=new THREE.Mesh(new THREE.BoxGeometry(.8,1.25,.45),bodyMat);
  body.position.y=1.3;g.add(body);

  const head=new THREE.Mesh(new THREE.SphereGeometry(.38,16,12),headMat);
  head.position.y=2.22;g.add(head);

  const eyeMat=new THREE.MeshBasicMaterial({color:0x111111});
  for(const sx of [-.12,.12]){
    const eye=new THREE.Mesh(new THREE.BoxGeometry(.08,.07,.03),eyeMat);
    eye.position.set(sx,2.25,.35);g.add(eye);
  }

  const l1=new THREE.Mesh(new THREE.BoxGeometry(.22,.9,.23),dark);
  l1.position.set(-.2,.45,0);g.add(l1);
  const l2=l1.clone();l2.position.x=.2;g.add(l2);

  const a1=new THREE.Mesh(new THREE.BoxGeometry(.2,1,.22),bodyMat);
  a1.position.set(-.54,1.3,0);g.add(a1);
  const a2=a1.clone();a2.position.x=.54;g.add(a2);

  const label=makeTextSprite(data.username,1.65);
  // Nickname: clearly above the character and always visible.
  label.position.set(0,3.8,0);
  label.scale.set(1.8,.45,1);
  if(label.material){ label.material.depthTest=false; label.material.depthWrite=false; label.renderOrder=1000; }
  g.add(label);

  g.position.set(Number(data.x)||0,0,Number(data.z)||0);
  g.rotation.y=Number(data.yaw)||0;
  scene.add(g);

  // mvxtra uses the dedicated alien model from /public/models.
  // The procedural avatar stays visible until the GLB finishes loading.
  if(String(data.username||'').toLowerCase()==='mvxtra' && THREE.GLTFLoader){
    const loader=new THREE.GLTFLoader();
    loader.load('/models/аватар%20mvxtra.glb', gltf=>{
      const alien=gltf.scene;
      alien.traverse(o=>{
        if(o.isMesh){
          o.castShadow=true;
          o.receiveShadow=true;
        }
      });

      // Keep only the nickname sprite; replace the temporary body.
      const keep=[];
      g.children.forEach(child=>{
        if(child===label) keep.push(child);
      });
      g.clear();
      keep.forEach(child=>g.add(child));

      alien.scale.setScalar(1.45);
      alien.position.set(0,0,0);
      label.position.set(0,3.8,0);
      alien.rotation.y=Math.PI;
      g.add(alien);

      // Animation setup:
      // 1) Prefer an animation already embedded in the GLB.
      // 2) Also load the supplied FBX run animation and retarget its tracks
      //    onto the GLB skeleton by matching normalized bone names.
      const mixer=new THREE.AnimationMixer(alien);
      g.userData.alienMixer=mixer;
      g.userData.alienClock=new THREE.Clock();
      g.userData.alienWalk=null;
      g.userData.alienDance=null;
      g.userData.alienAnimationReady=false;

      function boneKey(name){
        return String(name||'')
          .replace(/^.*[:|]/,'')
          .replace(/[^a-z0-9]/gi,'')
          .toLowerCase()
          .replace(/mixamorig/g,'');
      }

      function retargetClip(clip, targetRoot){
        const bones={};
        targetRoot.traverse(o=>{
          if(o.isBone) bones[boneKey(o.name)]=o.name;
        });

        const tracks=clip.tracks.map(track=>{
          const dot=track.name.indexOf('.');
          if(dot<0) return track;
          const path=track.name.slice(0,dot);
          const prop=track.name.slice(dot+1);
          const raw=path.split('/').pop();
          const key=boneKey(raw);
          const target=bones[key];
          if(!target) return null;
          const clone=track.clone();
          clone.name=target+'.'+prop;
          return clone;
        }).filter(Boolean);

        return new THREE.AnimationClip(
          clip.name,
          clip.duration,
          tracks
        );
      }

      if(gltf.animations && gltf.animations.length){
        const clips=gltf.animations;
        const walkClip=THREE.AnimationClip.findByName(alien,'Walk')
          || clips.find(c=>/walk|run|locomotion/i.test(c.name))
          || clips[0];
        g.userData.alienWalk=mixer.clipAction(walkClip);
        g.userData.alienWalk.loop=THREE.LoopRepeat;
        g.userData.alienWalk.enabled=true;
        g.userData.alienWalk.paused=true;
        g.userData.alienAnimationReady=true;
      }

      // Load the uploaded FBX only for the dedicated mvxtra character.
      if(THREE.FBXLoader){
        const fbxLoader=new THREE.FBXLoader();
        fbxLoader.load('/animations/Mutant%20Run.fbx', fbx=>{
          const sourceClip=fbx.animations && fbx.animations[0];
          if(!sourceClip) return;
          const clip=retargetClip(sourceClip,alien);
          if(!clip.tracks.length) return;
          if(g.userData.alienWalk) g.userData.alienWalk.stop();
          const action=mixer.clipAction(clip);
          action.loop=THREE.LoopRepeat;
          action.enabled=true;
          action.paused=true;
          g.userData.alienWalk=action;
          g.userData.alienAnimationReady=true;
          g.userData.alienRunSource='Mutant Run.fbx';
        },undefined,()=>{});
      }

      g.userData.alien=alien;
    },undefined,()=>{
      // If the alien asset fails, the normal avatar remains.
    });
  }

  return {g,targetX:g.position.x,targetZ:g.position.z,targetYaw:g.rotation.y,data};
}

function hash(s){
  let n=0;
  for(let i=0;i<String(s).length;i++) n=((n<<5)-n+String(s).charCodeAt(i))|0;
  return Math.abs(n);
}

function upsertRemote(data){
  if(data.id===socket?.id) return;
  let r=remotes.get(data.id);
  if(!r){r=createAvatar(data);remotes.set(data.id,r)}
  r.data=data;
  r.targetX=Number(data.x)||0;
  r.targetZ=Number(data.z)||0;
  r.targetYaw=Number(data.yaw)||0;
}

function removeRemote(id){
  const r=remotes.get(id);
  if(!r) return;
  scene.remove(r.g);
  remotes.delete(id);
}

function updateRemotes(t){
  remotes.forEach(r=>{
    r.g.position.x += (r.targetX-r.g.position.x)*.22;
    r.g.position.z += (r.targetZ-r.g.position.z)*.22;
    let d=r.targetYaw-r.g.rotation.y;
    while(d>Math.PI)d-=Math.PI*2;
    while(d<-Math.PI)d+=Math.PI*2;
    r.g.rotation.y += d*.22;

    const moving=!!r.data?.moving;

    // Alien walk animation (GLB first, then retargeted Mutant Run FBX).
    if(r.g.userData.alienMixer){
      const clock=r.g.userData.alienClock;
      const dt=Math.min(clock.getDelta(),.05);
      r.g.userData.alienMixer.update(dt);
      const action=r.g.userData.alienWalk;
      if(action){
        if(moving){
          action.paused=false;
          action.enabled=true;
          action.play();
        }else{
          action.paused=true;
          action.enabled=true;
        }
      }
    }

    // Fallback procedural walk animation for non-GLB avatars.
    const swing=moving?Math.sin(t*9)*.28:0;
    if(r.g.children[4])r.g.children[4].rotation.x=swing;
    if(r.g.children[5])r.g.children[5].rotation.x=-swing;
    if(r.data?.emote){
      r.g.rotation.z=Math.sin(t*7+(r.data.emoteAt||0)/300)*.16;
    } else {
      r.g.rotation.z*=.9;
    }
  });
}

function connect() {
  socket=io({
    transports:['websocket','polling'],
    reconnection:true,
    reconnectionAttempts:Infinity,
    timeout:10000
  });

  socket.on('connect',()=>{
    socket.emit('join',{username,language});
  });

  socket.on('connect_error',()=>toast('Соединение с клубом...'));

  socket.on('club:ready',data=>{
    joined=true;
    host=!!data.host;
    $('screenControl').style.display='none';
    $('screenPlay').style.display=host?'block':'none';
    if(data.screen) applyScreen(data.screen);
  });

  socket.on('world:state',data=>{
    for(const r of remotes.values()) scene.remove(r.g);
    remotes.clear();
    (data.players||[]).forEach(upsertRemote);
    if(data.screen) applyScreen(data.screen);
  });

  socket.on('player:joined',upsertRemote);
  socket.on('player:state',upsertRemote);
  socket.on('player:left',removeRemote);
  socket.on('online:state',renderOnline);
  socket.on('screen:state',applyScreen);

  socket.on('language:state',lang=>{
    language=lang;
    localStorage.setItem('ews-language',lang);
    $('langLabel').textContent=LANG_NAMES[lang]||lang.toUpperCase();
  });

  socket.on('chat:message',msg=>renderMessage(msg));
}

function renderOnline(users) {
  $('onlineList').innerHTML='';
  (users||[]).forEach(u=>{
    const div=document.createElement('div');
    div.className='user';
    const dot=document.createElement('span');
    dot.className='dot';
    div.append(dot,document.createTextNode(u.username + (u.username.toLowerCase()===HOST?' ★':'')));
    $('onlineList').appendChild(div);
  });
}

async function renderMessage(msg) {
  const div=document.createElement('div');
  div.className='msg';
  const b=document.createElement('b');
  b.textContent=msg.user+': ';
  div.appendChild(b);

  const span=document.createElement('span');
  span.textContent=msg.text;
  div.appendChild(span);
  $('messages').appendChild(div);
  $('messages').scrollTop=$('messages').scrollHeight;

  if(language==='en' || language==='ru' || language) {
    try {
      const r=await fetch('/api/translate',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({text:msg.text,target:language})
      });
      const data=await r.json();
      if(data.ok && data.text && data.text!==msg.text) span.textContent=msg.text+' → '+data.text;
    } catch {}
  }
}

function twitchEmbedUrl(value) {
  const raw=String(value||'').trim();
  if(!raw) return null;

  let url;
  try { url=new URL(raw, location.origin); } catch { return null; }

  const hostName=url.hostname.toLowerCase();
  const parent=location.hostname;

  // Twitch channel URL: https://www.twitch.tv/mvxtra
  if(hostName==='twitch.tv' || hostName==='www.twitch.tv'){
    const parts=url.pathname.split('/').filter(Boolean);
    if(parts.length>=1 && parts[0] && parts[0]!=='videos' && parts[0]!=='directory'){
      return 'https://player.twitch.tv/?channel='+encodeURIComponent(parts[0])+
        '&parent='+encodeURIComponent(parent)+'&autoplay=true&muted=false';
    }
    // Twitch VOD URL: /videos/123456789
    if(parts[0]==='videos' && parts[1]){
      return 'https://player.twitch.tv/?video=v'+encodeURIComponent(parts[1])+
        '&parent='+encodeURIComponent(parent)+'&autoplay=true&muted=false';
    }
  }

  // Already a Twitch player URL.
  if(hostName==='player.twitch.tv'){
    url.searchParams.set('parent',parent);
    return url.toString();
  }

  return null;
}

function clearCssScreen() {
  if(screenCssObject){
    scene.remove(screenCssObject);
    screenCssObject=null;
  }
  screenCssFrame=null;
}

function createTwitchWallScreen(src) {
  clearCssScreen();

  const frame=document.createElement('div');
  frame.style.width='1160px';
  frame.style.height='545px';
  frame.style.background='#000';
  frame.style.border='0';
  frame.style.overflow='hidden';
  frame.style.pointerEvents='none';

  const iframe=document.createElement('iframe');
  iframe.src=src;
  iframe.allow='autoplay; fullscreen; picture-in-picture';
  iframe.setAttribute('allowtransparency','true');
  iframe.allowFullscreen=true;
  iframe.style.width='1160px';
  iframe.style.height='545px';
  iframe.style.border='0';
  iframe.style.display='block';
  frame.appendChild(iframe);

  screenCssFrame=frame;
  screenCssObject=new THREE.CSS3DObject(frame);
  screenCssObject.position.set(0,3.175,-13.42);
  screenCssObject.scale.set(0.01,0.01,0.01);
  screenCssObject.rotation.set(0,0,0);
  scene.add(screenCssObject);
}

function applyScreen(state) {
  $('screenOverlay').innerHTML='';
  $('screenOverlay').style.display='none';

  clearCssScreen();

  if(hls){ hls.destroy(); hls=null; }
  if(screenTexture){ screenTexture.dispose(); screenTexture=null; }
  if(screenVideo){
    screenVideo.pause();
    screenVideo.removeAttribute('src');
    screenVideo.load();
    screenVideo=null;
  }

  if(screenMesh){
    screenMesh.material.map=null;
    screenMesh.material.color.setHex(0x000000);
    screenMesh.material.needsUpdate=true;
  }

  if(!state?.active || !state.src){
    if(host) $('screenStatus').textContent='SCREEN OFF';
    return;
  }

  const twitch=twitchEmbedUrl(state.src);

  // Twitch is rendered as a CSS3D object at the exact wall position.
  if(twitch){
    createTwitchWallScreen(twitch);
    if(host) $('screenStatus').textContent='Twitch · '+(state.title||'EWS SESSIONS');
    return;
  }

  // HLS / normal video is rendered directly onto the physical Three.js wall.
  const video=document.createElement('video');
  screenVideo=video;
  video.autoplay=true;
  video.muted=false;
  video.controls=false;
  video.loop=false;
  video.playsInline=true;
  video.setAttribute('playsinline','');
  video.crossOrigin='anonymous';

  screenTexture=new THREE.VideoTexture(video);
  screenTexture.minFilter=THREE.LinearFilter;
  screenTexture.magFilter=THREE.LinearFilter;
  screenTexture.format=THREE.RGBAFormat;
  screenTexture.encoding=THREE.sRGBEncoding;

  if(screenMesh){
    screenMesh.material.map=screenTexture;
    screenMesh.material.color.setHex(0xffffff);
    screenMesh.material.needsUpdate=true;
  }

  if(window.Hls && Hls.isSupported() && /\\.m3u8($|\\?)/i.test(state.src)){
    hls=new Hls({enableWorker:true,lowLatencyMode:true});
    hls.loadSource(state.src);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play().catch(()=>toast('Нажми на экран для звука')));
  }else{
    video.src=state.src;
    video.play().catch(()=>{});
  }

  if(host) $('screenStatus').textContent='VIDEO · '+(state.title||'EWS SESSIONS');
}

function sendScreen() {
  if(!host || !socket?.connected) return;

  const src=$('screenSrc').value.trim();
  if(!src){
    socket.emit('screen:set',{src:''});
    $('screenStatus').textContent='SCREEN OFF';
    return;
  }

  const twitch=twitchEmbedUrl(src);
  const type=twitch?'twitch':'video';

  socket.emit('screen:set',{
    src,
    type,
    title:'EWS SESSIONS'
  });

  $('screenStatus').textContent=twitch
    ? 'PLAY · Twitch запущен'
    : 'PLAY · ссылка отправлена';
}

$('screenButton').onclick=()=>{
  if(!host) return;

  const panel=$('screenControl');
  const opening=panel.style.display!=='block';
  panel.style.display=opening?'block':'none';

  if(opening){
    $('screenSrc').focus();
  }
};

$('screenPlay').onclick=sendScreen;

$('screenSrc').addEventListener('keydown',e=>{
  if(e.key!=='Enter') return;
  e.preventDefault();
  sendScreen();
});

function startClub() {
  buildWorld();
  connect();
  animate();
  $('langLabel').textContent=LANG_NAMES[language]||language.toUpperCase();
  $('chatInput').placeholder='ENTER → чат';
  $('screenSrc').value='';
}

// Keep the user signed in on this browser after the first successful login.
const saved=localStorage.getItem('ews-username');
if(saved) $('username').value=saved;

async function restoreSession() {
  const token=localStorage.getItem('ews-session-token');
  if(!token) return;

  try {
    const data=await api('/api/session',{token});
    setLoggedIn(data.username,data.token);
    startClub();
  } catch {
    localStorage.removeItem('ews-session-token');
  }
}

restoreSession();

})();
