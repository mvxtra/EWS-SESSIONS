<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>EWS SESSIONS</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>

<style>
*{
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
    background:#000;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    user-select:none;
}

#game{
    position:fixed;
    inset:0;
}

canvas{
    display:block;
}

/* =========================
   LOGIN
========================= */

#login{
    position:fixed;
    inset:0;
    z-index:1000;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            ellipse at center,
            #111 0%,
            #050505 38%,
            #000 78%
        );
}

.login{
    width:350px;
    padding:38px 34px;

    background:rgba(0,0,0,.88);

    border:1px solid #292929;

    box-shadow:
        0 0 80px rgba(255,255,255,.025),
        0 30px 100px rgba(0,0,0,.95);
}

.logo{
    text-align:center;

    font-size:42px;
    line-height:1;

    font-weight:900;
    letter-spacing:13px;

    margin-left:13px;
}

.logoLine{
    width:100%;
    height:1px;

    margin:18px 0;

    background:#252525;
}

.subtitle{
    text-align:center;

    color:#666;

    font-size:8px;
    letter-spacing:5px;

    margin-bottom:28px;
}

.login input{
    width:100%;
    height:44px;

    margin-top:9px;

    padding:0 13px;

    outline:none;

    border:1px solid #222;

    background:#080808;

    color:#eee;

    font-size:11px;

    letter-spacing:1px;
}

.login input:focus{
    border-color:#555;
}

.login button{
    width:100%;
    height:44px;

    margin-top:14px;

    border:0;

    background:#eee;
    color:#050505;

    font-size:10px;
    font-weight:bold;

    letter-spacing:3px;

    cursor:pointer;
}

.login button:hover{
    background:#fff;
}

#switch{
    margin-top:18px;

    text-align:center;

    color:#555;

    font-size:9px;
    letter-spacing:2px;

    cursor:pointer;
}

#switch:hover{
    color:#aaa;
}

#loginMessage{
    min-height:16px;

    margin-top:12px;

    text-align:center;

    color:#777;

    font-size:10px;
}

/* =========================
   HUD
========================= */

#hud{
    position:fixed;
    inset:0;

    z-index:50;

    pointer-events:none;
}

.hidden{
    display:none!important;
}

#logoHud{
    position:absolute;

    top:24px;
    left:27px;
}

#logoHud .big{
    font-size:17px;
    font-weight:900;
    letter-spacing:5px;
}

#logoHud .small{
    margin-top:3px;

    color:#555;

    font-size:7px;
    letter-spacing:4px;
}

#online{
    position:absolute;

    top:25px;
    right:27px;

    text-align:right;

    color:#777;

    font-size:8px;
    letter-spacing:3px;
}

#online strong{
    color:#ddd;
}

/* =========================
   ONLINE PANEL
========================= */

#onlinePanel{
    position:absolute;

    right:27px;
    top:57px;

    width:175px;

    padding:13px;

    pointer-events:none;

    background:rgba(0,0,0,.48);

    border:1px solid rgba(255,255,255,.07);

    backdrop-filter:blur(12px);
}

.panelTitle{
    color:#444;

    font-size:7px;
    letter-spacing:3px;

    margin-bottom:9px;
}

.user{
    padding:5px 0;

    border-bottom:1px solid rgba(255,255,255,.04);

    color:#aaa;

    font-size:10px;
}

.user:last-child{
    border-bottom:0;
}

.user::before{
    content:"";

    display:inline-block;

    width:4px;
    height:4px;

    margin-right:7px;

    border-radius:50%;

    background:#888;
}

/* =========================
   CHAT
========================= */

#chat{
    position:absolute;

    left:27px;
    bottom:27px;

    width:330px;
    height:205px;

    pointer-events:auto;

    display:flex;
    flex-direction:column;

    background:rgba(0,0,0,.45);

    border:1px solid rgba(255,255,255,.08);

    backdrop-filter:blur(12px);
}

#messages{
    flex:1;

    padding:12px;

    overflow-y:auto;

    scrollbar-width:none;
}

#messages::-webkit-scrollbar{
    display:none;
}

.msg{
    margin-bottom:8px;

    font-size:10px;
    line-height:1.4;

    color:#999;
}

.msg b{
    margin-right:5px;

    color:#ddd;

    font-weight:600;
}

.msg.system{
    color:#444;

    font-size:9px;
}

#chatForm{
    height:38px;

    display:flex;

    border-top:1px solid rgba(255,255,255,.07);
}

#chatInput{
    flex:1;

    min-width:0;

    border:0;
    outline:0;

    padding:0 12px;

    background:#050505;

    color:#ddd;

    font-size:10px;
}

#chatInput::placeholder{
    color:#444;
}

#send{
    width:60px;

    border:0;

    background:#ddd;
    color:#050505;

    font-size:8px;
    font-weight:bold;

    letter-spacing:1px;

    cursor:pointer;
}

#send:hover{
    background:#fff;
}

/* =========================
   AUDIO
========================= */

#audio{
    position:absolute;

    right:27px;
    bottom:27px;

    width:145px;
    height:32px;

    pointer-events:auto;

    border:1px solid rgba(255,255,255,.12);

    background:rgba(0,0,0,.55);

    color:#888;

    font-size:8px;
    letter-spacing:2px;

    cursor:pointer;
}

#audio:hover{
    color:#fff;

    border-color:#444;
}

/* =========================
   FADE
========================= */

#fade{
    position:fixed;
    inset:0;

    z-index:900;

    background:#000;

    pointer-events:none;

    opacity:1;

    transition:opacity 1.2s ease;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    #chat{
        left:12px;
        bottom:12px;

        width:calc(100% - 24px);
    }

    #onlinePanel{
        right:12px;
        top:55px;

        width:145px;
    }

    #audio{
        right:12px;
        bottom:230px;
    }

    #logoHud{
        left:14px;
        top:14px;
    }

    #online{
        right:14px;
        top:16px;
    }

}
</style>
</head>

<body>

<div id="game"></div>

<div id="fade"></div>

<!-- LOGIN -->

<div id="login">

    <div class="login">

        <div class="logo">EWS</div>

        <div class="logoLine"></div>

        <div class="subtitle">
            SESSIONS / UNDERGROUND CLUB
        </div>

        <input
            id="username"
            placeholder="USERNAME"
            autocomplete="username"
        >

        <input
            id="password"
            type="password"
            placeholder="PASSWORD"
            autocomplete="current-password"
        >

        <button id="loginButton">
            ENTER
        </button>

        <div id="switch">
            CREATE ACCOUNT
        </div>

        <div id="loginMessage"></div>

    </div>

</div>

<!-- HUD -->

<div id="hud" class="hidden">

    <div id="logoHud">

        <div class="big">EWS</div>

        <div class="small">
            SESSIONS
        </div>

    </div>

    <div id="online">

        <strong id="onlineCount">0</strong>
        ONLINE

    </div>

    <div id="onlinePanel">

        <div class="panelTitle">
            IN THE CLUB
        </div>

        <div id="onlineUsers"></div>

    </div>

    <div id="chat">

        <div id="messages"></div>

        <form id="chatForm">

            <input
                id="chatInput"
                autocomplete="off"
                maxlength="500"
                placeholder="message..."
            >

            <button id="send">
                SEND
            </button>

        </form>

    </div>

    <button id="audio">
        STREAM / OFF
    </button>

</div>

<audio
    id="stream"
    playsinline
></audio>

<script>

/* ============================================================
   CONNECTION
============================================================ */

const socket = io({
    transports:[
        'websocket',
        'polling'
    ]
});

/* ============================================================
   STATE
============================================================ */

let username = '';
let language =
    (navigator.language || 'en')
    .toLowerCase()
    .split('-')[0];

let loggedIn = false;
let registerMode = false;

let gameStarted = false;

let scene;
let camera;
let renderer;
let clock;

let player;
let playerGroup;

const remotePlayers = new Map();

const keys = {};

let yaw = 0;
let pitch = 0.25;

let pointerLocked = false;

let velocity =
    new THREE.Vector3();

let grounded = true;

let walkingTime = 0;

let sendTimer = 0;

const colliders = [];

/* ============================================================
   DOM
============================================================ */

const login = document.getElementById('login');
const hud = document.getElementById('hud');

const usernameInput =
    document.getElementById('username');

const passwordInput =
    document.getElementById('password');

const loginButton =
    document.getElementById('loginButton');

const switchButton =
    document.getElementById('switch');

const loginMessage =
    document.getElementById('loginMessage');

const messages =
    document.getElementById('messages');

const onlineUsers =
    document.getElementById('onlineUsers');

const onlineCount =
    document.getElementById('onlineCount');

const chatForm =
    document.getElementById('chatForm');

const chatInput =
    document.getElementById('chatInput');

const audioButton =
    document.getElementById('audio');

const stream =
    document.getElementById('stream');

/* ============================================================
   LOGIN
============================================================ */

switchButton.onclick = ()=>{

    registerMode =
        !registerMode;

    loginButton.textContent =
        registerMode
            ? 'CREATE ACCOUNT'
            : 'ENTER';

    switchButton.textContent =
        registerMode
            ? 'BACK TO LOGIN'
            : 'CREATE ACCOUNT';

    loginMessage.textContent = '';

};

loginButton.onclick = async ()=>{

    const user =
        usernameInput.value.trim();

    const pass =
        passwordInput.value;

    if(!user || !pass){

        loginMessage.textContent =
            'ENTER USERNAME AND PASSWORD';

        return;
    }

    loginButton.disabled = true;

    try{

        const endpoint =
            registerMode
                ? '/api/register'
                : '/api/login';

        const response =
            await fetch(
                endpoint,
                {
                    method:'POST',

                    headers:{
                        'Content-Type':
                            'application/json'
                    },

                    body:JSON.stringify({
                        username:user,
                        password:pass
                    })
                }
            );

        const data =
            await response.json();

        if(!data.ok){

            loginMessage.textContent =
                data.message ||
                'ERROR';

            loginButton.disabled = false;

            return;
        }

        if(registerMode){

            registerMode = false;

            loginButton.textContent =
                'ENTER';

            switchButton.textContent =
                'CREATE ACCOUNT';

            loginMessage.textContent =
                'ACCOUNT CREATED';

            loginButton.disabled = false;

            return;
        }

        enterClub(
            data.username || user
        );

    }catch(error){

        console.error(error);

        loginMessage.textContent =
            'SERVER ERROR';

    }

    loginButton.disabled = false;

};

passwordInput.onkeydown = e=>{

    if(e.key === 'Enter'){
        loginButton.click();
    }

};

usernameInput.onkeydown = e=>{

    if(e.key === 'Enter'){
        passwordInput.focus();
    }

};

/* ============================================================
   ENTER CLUB
============================================================ */

function enterClub(name){

    username = name;

    loggedIn = true;

    login.classList.add('hidden');

    hud.classList.remove('hidden');

    document.getElementById('fade')
        .style.opacity = '0';

    init();

    socket.emit(
        'join',
        {
            username,
            language
        }
    );

    socket.emit(
        'request-online'
    );

    socket.emit(
        'request-players'
    );

    addSystem(
        `WELCOME TO EWS SESSIONS`
    );

}

/* ============================================================
   SOCKET
============================================================ */

socket.on('connect',()=>{

    if(loggedIn){

        socket.emit(
            'join',
            {
                username,
                language
            }
        );

        socket.emit(
            'request-online'
        );

        socket.emit(
            'request-players'
        );

    }

});

/* ONLINE */

socket.on(
    'online-users',
    users=>{

        if(!Array.isArray(users)){
            return;
        }

        onlineCount.textContent =
            users.length;

        onlineUsers.innerHTML = '';

        users.forEach(user=>{

            const el =
                document.createElement('div');

            el.className =
                'user';

            el.textContent =
                user.username ||
                user.user ||
                'Guest';

            onlineUsers.appendChild(el);

        });

    }
);

/* SYSTEM */

socket.on(
    'system-message',
    data=>{

        if(data && data.text){
            addSystem(data.text);
        }

    }
);

/* CHAT */

socket.on(
    'chat-message',
    data=>{

        if(!data) return;

        /*
         * ВАЖНО:
         * server.js уже отправляет каждому
         * пользователю его перевод.
         *
         * Поэтому здесь показываем
         * только data.text.
         *
         * original НЕ выводим.
         */

        addMessage(
            data.username ||
            data.user ||
            'Guest',

            data.text || ''
        );

    }
);

/* PLAYERS */

socket.on(
    'players-state',
    players=>{

        if(!Array.isArray(players)){
            return;
        }

        players.forEach(data=>{

            if(
                data.id === socket.id
            ){
                return;
            }

            createRemote(data);

        });

    }
);

socket.on(
    'player-joined',
    data=>{

        if(!data) return;

        if(
            data.id === socket.id
        ){
            return;
        }

        createRemote(data);

    }
);

socket.on(
    'player-move',
    data=>{

        if(!data) return;

        if(
            data.id === socket.id
        ){
            return;
        }

        updateRemoteTarget(data);

    }
);

socket.on(
    'player-left',
    id=>{

        removeRemote(id);

    }
);

/* ============================================================
   CHAT UI
============================================================ */

chatForm.onsubmit = e=>{

    e.preventDefault();

    const text =
        chatInput.value.trim();

    if(!text) return;

    socket.emit(
        'chat-message',
        {
            text
        }
    );

    chatInput.value = '';

};

function addMessage(
    user,
    text
){

    const row =
        document.createElement('div');

    row.className =
        'msg';

    const name =
        document.createElement('b');

    name.textContent =
        user + ':';

    const body =
        document.createElement('span');

    body.textContent =
        text;

    row.appendChild(name);
    row.appendChild(body);

    messages.appendChild(row);

    while(
        messages.children.length > 100
    ){
        messages.removeChild(
            messages.firstChild
        );
    }

    messages.scrollTop =
        messages.scrollHeight;

}

function addSystem(text){

    const row =
        document.createElement('div');

    row.className =
        'msg system';

    row.textContent =
        text;

    messages.appendChild(row);

    messages.scrollTop =
        messages.scrollHeight;

}

/* ============================================================
   THREE INIT
============================================================ */

function init(){

    if(gameStarted){
        return;
    }

    gameStarted = true;

    scene =
        new THREE.Scene();

    /*
     * ГЛАВНОЕ:
     * сцена действительно чёрная.
     */

    scene.background =
        new THREE.Color(
            0x010101
        );

    scene.fog =
        new THREE.FogExp2(
            0x010101,
            0.025
        );

    camera =
        new THREE.PerspectiveCamera(
            67,
            innerWidth / innerHeight,
            .1,
            180
        );

    renderer =
        new THREE.WebGLRenderer({
            antialias:true,
            powerPreference:
                'high-performance'
        });

    renderer.setPixelRatio(
        Math.min(
            devicePixelRatio,
            2
        )
    );

    renderer.setSize(
        innerWidth,
        innerHeight
    );

    renderer.shadowMap.enabled = true;

    renderer.shadowMap.type =
        THREE.PCFSoftShadowMap;

    renderer.outputEncoding =
        THREE.sRGBEncoding;

    document
        .getElementById('game')
        .appendChild(renderer.domElement);

    clock =
        new THREE.Clock();

    createClubLighting();

    createClub();

    createLocalPlayer();

    bindControls();

    addEventListener(
        'resize',
        resize
    );

    animate();

}

/* ============================================================
   MATERIALS
============================================================ */

function material(
    color,
    roughness=.9
){

    return new THREE.MeshStandardMaterial({

        color,

        roughness,

        metalness:.05

    });

}

const FLOOR =
    material(0x020202);

const WALL =
    material(0x050505);

const BLACK =
    material(0x080808);

const DARK =
    material(0x101010);

const DETAIL =
    material(0x181818);

const HUMAN =
    material(0x111111);

const WHITE =
    material(0xbcbcbc);

/* ============================================================
   CLUB LIGHTING
============================================================ */

function createClubLighting(){

    /*
     * Очень слабый общий свет.
     * Он НЕ должен превращать клуб в серую комнату.
     */

    const ambient =
        new THREE.AmbientLight(
            0xffffff,
            .045
        );

    scene.add(ambient);

    /*
     * Центральный мягкий overhead light.
     */

    const center =
        new THREE.PointLight(
            0xffffff,
            2.0,
            18,
            2
        );

    center.position.set(
        0,
        7,
        -1
    );

    center.castShadow = true;

    center.shadow.mapSize.width =
        1024;

    center.shadow.mapSize.height =
        1024;

    scene.add(center);

    /*
     * Боковые клубные пятна.
     */

    createSpot(
        -10,
        5.5,
        -7,
        0xffffff,
        2.2,
        Math.PI / 5
    );

    createSpot(
        10,
        5.5,
        -7,
        0xffffff,
        2.2,
        Math.PI / 5
    );

    createSpot(
        -10,
        5.5,
        8,
        0xbcbcbc,
        1.4,
        Math.PI / 5
    );

    createSpot(
        10,
        5.5,
        8,
        0xbcbcbc,
        1.4,
        Math.PI / 5
    );

    /*
     * Очень слабая задняя подсветка.
     */

    const rear =
        new THREE.PointLight(
            0xffffff,
            .75,
            15
        );

    rear.position.set(
        0,
        3.5,
        -14
    );

    scene.add(rear);

}

function createSpot(
    x,
    y,
    z,
    color,
    intensity,
    angle
){

    const light =
        new THREE.SpotLight(
            color,
            intensity,
            24,
            angle,
            .72,
            1.8
        );

    light.position.set(
        x,
        y,
        z
    );

    light.target.position.set(
        x * .35,
        0,
        z * .15
    );

    light.castShadow = true;

    scene.add(
        light.target
    );

    scene.add(light);

}

/* ============================================================
   WORLD
============================================================ */

function cube(
    x,y,z,
    sx,sy,sz,
    mat,
    collision=false
){

    const mesh =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                sx,sy,sz
            ),
            mat
        );

    mesh.position.set(
        x,y,z
    );

    mesh.castShadow = true;
    mesh.receiveShadow = true;

    scene.add(mesh);

    if(collision){

        colliders.push({

            minX:x-sx/2,
            maxX:x+sx/2,

            minZ:z-sz/2,
            maxZ:z+sz/2,

            minY:y-sy/2,
            maxY:y+sy/2

        });

    }

    return mesh;

}

function createClub(){

    /*
     * Большой чёрный пол.
     */

    cube(
        0,
        -.3,
        0,
        44,
        .6,
        36,
        FLOOR
    );

    /*
     * Чёрные стены.
     */

    cube(
        0,
        4,
        -18,
        44,
        8,
        1,
        WALL,
        true
    );

    cube(
        -22,
        4,
        0,
        1,
        8,
        36,
        WALL,
        true
    );

    cube(
        22,
        4,
        0,
        1,
        8,
        36,
        WALL,
        true
    );

    cube(
        0,
        4,
        18,
        44,
        8,
        1,
        WALL,
        true
    );

    /*
     * Архитектура.
     * Не серые кубы — почти чёрные объёмы.
     */

    cube(
        -15,
        2,
        -11,
        5,
        4,
        5,
        BLACK,
        true
    );

    cube(
        15,
        2,
        -11,
        5,
        4,
        5,
        BLACK,
        true
    );

    cube(
        -15,
        1.3,
        9,
        5,
        2.6,
        6,
        DARK,
        true
    );

    cube(
        15,
        1.3,
        9,
        5,
        2.6,
        6,
        DARK,
        true
    );

    /*
     * Центральная задняя архитектура.
     */

    cube(
        0,
        2.7,
        -15.5,
        19,
        5.4,
        1.2,
        BLACK,
        true
    );

    /*
     * Узкие вертикальные элементы.
     */

    for(
        let x=-18;
        x<=18;
        x+=6
    ){

        cube(
            x,
            3.5,
            -5,
            .5,
            7,
            .5,
            DETAIL,
            true
        );

    }

    /*
     * Потолочные балки.
     */

    for(
        let x=-18;
        x<=18;
        x+=6
    ){

        cube(
            x,
            7.5,
            0,
            .45,
            .35,
            34,
            BLACK
        );

    }

    /*
     * Тонкие архитектурные линии.
     * Они НЕ освещают всю комнату.
     */

    createLightLine(
        -21.35,
        5.5,
        0,
        .08,
        .08,
        27
    );

    createLightLine(
        21.35,
        5.5,
        0,
        .08,
        .08,
        27
    );

    /*
     * Задняя вывеска EWS.
     */

    createLogo();

}

/* ============================================================
   LIGHT LINES
============================================================ */

function createLightLine(
    x,y,z,
    sx,sy,sz
){

    const mesh =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                sx,sy,sz
            ),

            new THREE.MeshBasicMaterial({
                color:0x666666
            })

        );

    mesh.position.set(
        x,y,z
    );

}

/* ============================================================
   LOGO
============================================================ */

function createLogo(){

    const canvas =
        document.createElement(
            'canvas'
        );

    canvas.width = 1000;
    canvas.height = 300;

    const ctx =
        canvas.getContext('2d');

    ctx.fillStyle =
        '#030303';

    ctx.fillRect(
        0,
        0,
        1000,
        300
    );

    ctx.textAlign =
        'center';

    ctx.textBaseline =
        'middle';

    ctx.fillStyle =
        '#bdbdbd';

    ctx.font =
        '900 150px Arial';

    ctx.fillText(
        'EWS',
        500,
        125
    );

    ctx.fillStyle =
        '#555';

    ctx.font =
        '24px Arial';

    ctx.fillText(
        'SESSIONS',
        500,
        220
    );

    const texture =
        new THREE.CanvasTexture(
            canvas
        );

    const mesh =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                9,
                2.7
            ),

            new THREE.MeshBasicMaterial({
                map:texture
            })

    mesh.position.set(
        0,
        4.1,
        -17.4
    );

    scene.add(mesh);

}

/* ============================================================

============================================================ */

function createLocalPlayer(){

    playerGroup =

    playerGroup.position.set(

    );

    scene.add(

    );

    player =

    );

}

            ),

        );

        2.05;

                12
            ),

        );

        3.0;

    head.castShadow = true;

    root.add(head);

    const neck =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .11,
                .13,
                .18,

            ),

        );

    neck.position.y =
        2.68;

    root.add(neck);

    const leftArm =
        limb(
            .16,
            .82,
            .17
        );

    leftArm.position.set(
        -.47,
        2.15,
        0
    );

    root.add(leftArm);

    const rightArm =
        limb(
            .16,
            .82,
            .17
        );

    rightArm.position.set(
        .47,
        2.15,
        0
    );

    root.add(rightArm);

    const hips =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .7,
                .28,
                .4
            ),

        );

    hips.position.y =
        1.38;

    root.add(hips);

    const leftLeg =

        );

                .45
            ),

        );

/* ============================================================
   CONTROLS
============================================================ */

function bindControls(){

    addEventListener(
        'keydown',
        e=>{

            if(
                e.code === 'Space'
            ){
                e.preventDefault();
            }

            keys[e.code] = true;

            if(
                e.code === 'Space' &&
                grounded
            ){

                velocity.y =
                    7.2;

                grounded = false;

            }

        }
    );

    addEventListener(
        'keyup',
        e=>{

            keys[e.code] = false;

        }
    );

    renderer.domElement.onclick =
        ()=>{

            renderer.domElement
                .requestPointerLock();

        };

    document.addEventListener(
        'pointerlockchange',
        ()=>{

            pointerLocked =
                document.pointerLockElement ===
                renderer.domElement;

        }
    );

    document.addEventListener(
        'mousemove',
        e=>{

            if(!pointerLocked){
                return;
            }

            yaw -=
                e.movementX * .0024;

            pitch -=
                e.movementY * .0018;

            pitch =
                Math.max(
                    -.1,
                    Math.min(
                        .55,
                        pitch
                    )
                );

        }
    );

}

/* ============================================================
   MOVEMENT
============================================================ */

function updatePlayer(dt){

    const forward =
        new THREE.Vector3(
            -Math.sin(yaw),
            0,
            -Math.cos(yaw)
        );

    const right =
        new THREE.Vector3(
            Math.cos(yaw),
            0,
            -Math.sin(yaw)
        );

    const direction =
        new THREE.Vector3();

    if(keys.KeyW)
        direction.add(forward);

    if(keys.KeyS)
        direction.sub(forward);

    if(keys.KeyD)
        direction.add(right);

    if(keys.KeyA)
        direction.sub(right);

    const moving =
        direction.lengthSq() > .001;

    if(moving){

        direction.normalize();

        const acceleration =
            22 * dt;

        velocity.x +=
            direction.x *
            acceleration;

        velocity.z +=
            direction.z *
            acceleration;

        const speed =
            Math.sqrt(
                velocity.x *
                velocity.x +
                velocity.z *
                velocity.z
            );

        const max =
            4.8;

        if(speed > max){

            velocity.x *=
                max / speed;

            velocity.z *=
                max / speed;

        }

        /*
         * Поворачиваем тело
         * в сторону движения.
         */

        const target =
            Math.atan2(
                direction.x,
                direction.z
            );

        rotateSmooth(
            playerGroup,
            target,
            dt * 12
        );

    }else{

        /*
         * Настоящее торможение,
         * а не резкая остановка.
         */

        const friction =
            Math.pow(
                .0005,
                dt
            );

        velocity.x *= friction;
        velocity.z *= friction;

    }

    velocity.y -=
        19 * dt;

    const nextX =
        playerGroup.position.x +
        velocity.x * dt;

    const nextZ =
        playerGroup.position.z +
        velocity.z * dt;

    if(
        !blocked(
            nextX,
            playerGroup.position.z,
            .4
        )
    ){

        playerGroup.position.x =
            nextX;

    }else{

        velocity.x = 0;

    }

    if(
        !blocked(
            playerGroup.position.x,
            nextZ,
            .4
        )
    ){

        playerGroup.position.z =
            nextZ;

    }else{

        velocity.z = 0;

    }

    playerGroup.position.y +=
        velocity.y * dt;

    if(
        playerGroup.position.y <= 0
    ){

        playerGroup.position.y = 0;

        velocity.y = 0;

        grounded = true;

    }

    const horizontal =
        Math.sqrt(
            velocity.x *
            velocity.x +
            velocity.z *
            velocity.z
        );

    animateHuman(
        player,
        horizontal,
        dt
    );

}

/* ============================================================
   WALK ANIMATION
============================================================ */

function animateHuman(
    human,
    speed,
    dt
){

    const p =
        human.userData.parts;

    if(!p) return;

    if(speed > .12){

        walkingTime +=
            dt *
            (7 + speed * 2);

        const amount =
            Math.min(
                .55,
                speed * .13
            );

        const swing =
            Math.sin(
                walkingTime
            ) *
            amount;

        /*
         * Ноги идут навстречу рукам.
         */

        p.leftLeg.rotation.x =
            swing;

        p.rightLeg.rotation.x =
            -swing;

        p.leftArm.rotation.x =
            -swing * .7;

        p.rightArm.rotation.x =
            swing * .7;

    }else{

        p.leftLeg.rotation.x *= .82;
        p.rightLeg.rotation.x *= .82;

        p.leftArm.rotation.x *= .82;
        p.rightArm.rotation.x *= .82;

    }

}

/* ============================================================
   COLLISION
============================================================ */

function blocked(
    x,
    z,
    radius
){

    for(
        const c of colliders
    ){

        if(
            x + radius > c.minX &&
            x - radius < c.maxX &&
            z + radius > c.minZ &&
            z - radius < c.maxZ
        ){

            return true;

        }

    }

    return false;

}

/* ============================================================
   ROTATION
============================================================ */

function rotateSmooth(
    object,
    target,
    amount
){

    let diff =
        target -
        object.rotation.y;

    while(
        diff > Math.PI
    ){
        diff -=
            Math.PI * 2;
    }

    while(
        diff < -Math.PI
    ){
        diff +=
            Math.PI * 2;
    }

    object.rotation.y +=
        diff *
        Math.min(
            1,
            amount
        );

}

/* ============================================================
   CAMERA
============================================================ */

function updateCamera(){

    if(!playerGroup){
        return;
    }

    const distance = 5.8;

    const target =
        playerGroup.position.clone();

    target.y +=
        2.0;

    const offset =
        new THREE.Vector3(
            Math.sin(yaw) *
                distance,

            2.4 +
                Math.sin(pitch) *
                1.5,

            Math.cos(yaw) *
                distance
        );

    const desired =
        target.clone()
            .add(offset);

    camera.position.lerp(
        desired,
        .1
    );

    camera.lookAt(
        target
    );

}

/* ============================================================
   REMOTE PLAYERS
============================================================ */

function createRemote(data){

    if(
        !data ||
        !data.id ||
        data.id === socket.id
    ){
        return;
    }

    if(
        remotePlayers.has(data.id)
    ){
        updateRemoteTarget(data);
        return;
    }

    const group =
        new THREE.Group();

    group.position.set(
        Number(data.x) || 0,
        Number(data.y) || 0,
        Number(data.z) || 0
    );

    group.rotation.y =
        Number(data.ry) || 0;

    const human =
        createHuman();

    group.add(
        human
    );

    group.userData.target =
        group.position.clone();

    group.userData.targetRotation =
        group.rotation.y;

    group.userData.human =
        human;

    scene.add(
        group
    );

    remotePlayers.set(
        data.id,
        group
    );

}

function updateRemoteTarget(data){

    const group =
        remotePlayers.get(data.id);

    if(!group){

        createRemote(data);

        return;

    }

    group.userData.target.set(
        Number(data.x) || 0,
        Number(data.y) || 0,
        Number(data.z) || 0
    );

    group.userData.targetRotation =
        Number(data.ry) || 0;

}

function updateRemotePlayers(dt){

    remotePlayers.forEach(
        group=>{

            const old =
                group.position.clone();

            group.position.lerp(
                group.userData.target,
                Math.min(
                    1,
                    dt * 12
                )
            );

            rotateSmooth(
                group,
                group.userData.targetRotation,
                dt * 10
            );

            const moved =
                old.distanceTo(
                    group.position
                );

            animateHuman(
                group.userData.human,
                moved * 60,
                dt
            );

        }
    );

}

function removeRemote(id){

    const group =
        remotePlayers.get(id);

    if(!group){
        return;
    }

    scene.remove(
        group
    );

    remotePlayers.delete(
        id
    );

}

/* ============================================================
   PLAYER SYNC
============================================================ */

function syncPlayer(dt){

    sendTimer += dt;

    if(
        sendTimer < .05
    ){
        return;
    }

    sendTimer = 0;

    if(
        !loggedIn ||
        !playerGroup
    ){
        return;
    }

    socket.emit(
        'player-move',
        {
            x:
                playerGroup.position.x,

            y:
                playerGroup.position.y,

            z:
                playerGroup.position.z,

            ry:
                playerGroup.rotation.y,

            jumping:
                !grounded
        }
    );

}

/* ============================================================
   HLS
============================================================ */

let hls = null;

function startStream(){

    const url =
        '/hls/ews/index.m3u8';

    if(
        window.Hls &&
        Hls.isSupported()
    ){

        hls =
            new Hls({
                enableWorker:true,
                lowLatencyMode:true,
                liveSyncDurationCount:2
            });

        hls.loadSource(url);

        hls.attachMedia(
            stream
        );

        hls.on(
            Hls.Events.MANIFEST_PARSED,
            ()=>{
                console.log(
                    '[EWS] STREAM READY'
                );
            }
        );

        hls.on(
            Hls.Events.ERROR,
            (event,data)=>{
                console.log(
                    '[EWS HLS]',
                    data.type,
                    data.details
                );
            }
        );

    }else{

        stream.src = url;

    }

}

startStream();

audioButton.onclick =
    async()=>{

        try{

            if(
                stream.paused
            ){

                await stream.play();

                audioButton.textContent =
                    'STREAM / ON';

            }else{

                stream.pause();

                audioButton.textContent =
                    'STREAM / OFF';

            }

        }catch(error){

            console.log(
                '[AUDIO]',
                error
            );

        }

    };

/* ============================================================
   RENDER
============================================================ */

function animate(){

    requestAnimationFrame(
        animate
    );

    if(
        !gameStarted
    ){
        return;
    }

    const dt =
        Math.min(
            clock.getDelta(),
            .05
        );

    updatePlayer(dt);

    updateRemotePlayers(dt);

    updateCamera();

    syncPlayer(dt);

    renderer.render(
        scene,
        camera
    );

}

/* ============================================================
   RESIZE
============================================================ */

function resize(){

    if(
        !camera ||
        !renderer
    ){
        return;
    }

    camera.aspect =
        innerWidth /
        innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        innerWidth,
        innerHeight
    );

}
