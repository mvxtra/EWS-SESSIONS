<script>

/* =========================================================
   GLOBAL STATE
========================================================= */

let mode = 'login';

let socket = null;

let currentUser = null;

let scene;
let camera;
let renderer;

let clock = new THREE.Clock();

let keys = {};

let yaw = 0;
let pitch = 0;

let pointerLocked = false;

let chatMode = false;

let thirdPerson = true;

let playerBody = null;

let playerPos =
    new THREE.Vector3(0,0,13);

let playerVelocityY = 0;

let grounded = true;

let remotePlayers = {};

let lastNetworkUpdate = 0;

let jumpWasPressed = false;

const PLAYER_RADIUS = .38;

const GRAVITY = 17;

const JUMP_FORCE = 6.7;

const MOVE_SPEED = 5.2;

const colliders = [];

let neonObjects = [];

let lightObjects = [];

let particles;

let analyser = null;

let freqData = null;

let audioLevel = 0;

let bassLevel = 0;

let audioSource = null;

let audioStarted = false;

let hls = null;

/* =========================================================
   AUTH
========================================================= */

function switchTab(type){

    mode = type;

    document
        .getElementById('login-tab')
        .classList.toggle(
            'active',
            type === 'login'
        );

    document
        .getElementById('register-tab')
        .classList.toggle(
            'active',
            type === 'register'
        );

    document
        .getElementById('login-message')
        .textContent = '';

    document
        .getElementById('password')
        .value = '';
}


async function submitAuth(){

    const username =
        document
            .getElementById('username')
            .value
            .trim();

    const password =
        document
            .getElementById('password')
            .value;

    const message =
        document.getElementById(
            'login-message'
        );

    if(!username || !password){

        message.textContent =
            'ENTER USERNAME AND PASSWORD';

        return;
    }

    message.textContent =
        'CONNECTING...';

    try{

        const endpoint =
            mode === 'login'
                ? '/api/login'
                : '/api/register';

        const response =
            await fetch(
                endpoint,
                {
                    method:'POST',

                    headers:{
                        'Content-Type':
                            'application/json'
                    },

                    body:JSON.stringify({
                        username,
                        password
                    })
                }
            );

        const data =
            await response.json();

        if(!data.ok){

            message.textContent =
                data.message ||
                data.error ||
                'ERROR';

            return;
        }

        startSession(
            data.username ||
            username
        );

    }catch(error){

        console.error(error);

        message.textContent =
            'SERVER CONNECTION ERROR';
    }
}


/* =========================================================
   SESSION
========================================================= */

function startSession(username){

    currentUser = username;

    document
        .getElementById('login')
        .style.display = 'none';

    document
        .getElementById('hud')
        .style.display = 'block';

    init3D();

    socket = io({
        transports:[
            'websocket',
            'polling'
        ]
    });

    socket.on('connect',()=>{

        console.log(
            '[SOCKET] CONNECTED',
            socket.id
        );

        socket.emit(
            'join',
            {
                username:currentUser,

                language:
                    document.getElementById(
                        'lang'
                    ).value
            }
        );

        setTimeout(()=>{
            socket.emit(
                'request-online'
            );
        },300);
    });


    socket.on('disconnect',()=>{

        console.log(
            '[SOCKET] DISCONNECTED'
        );
    });


    socket.on('joined',data=>{

        console.log(
            '[JOINED]',
            data
        );
    });


    /* =====================================================
       ONLINE USERS
    ===================================================== */

    socket.on(
        'online-users',
        list=>{

            const ul =
                document.getElementById(
                    'online-list'
                );

            ul.innerHTML = '';

            if(!Array.isArray(list)){
                return;
            }

            list.forEach(user=>{

                const li =
                    document.createElement(
                        'li'
                    );

                const name =
                    typeof user === 'string'
                        ? user
                        : user.username;

                li.textContent =
                    name === currentUser
                        ? name + ' (YOU)'
                        : name;

                ul.appendChild(li);
            });
        }
    );


    /* =====================================================
       EXISTING PLAYERS
    ===================================================== */

    socket.on(
        'players-state',
        list=>{

            if(!Array.isArray(list)){
                return;
            }

            list.forEach(data=>{

                if(!data.id){
                    return;
                }

                if(data.id === socket.id){
                    return;
                }

                createOrUpdateRemotePlayer(
                    data
                );
            });
        }
    );


    /* =====================================================
       PLAYER JOINED
    ===================================================== */

    socket.on(
        'player-joined',
        data=>{

            if(!data || !data.id){
                return;
            }

            if(data.id === socket.id){
                return;
            }

            createOrUpdateRemotePlayer(
                data
            );
        }
    );


    /* =====================================================
       PLAYER MOVEMENT
    ===================================================== */

    socket.on(
        'player-move',
        data=>{

            if(!data || !data.id){
                return;
            }

            if(data.id === socket.id){
                return;
            }

            createOrUpdateRemotePlayer(
                data
            );

            const player =
                remotePlayers[data.id];

            if(!player){
                return;
            }

            player.userData.targetPosition.set(
                Number(data.x) || 0,
                Number(data.y) || 0,
                Number(data.z) || 0
            );

            player.userData.targetRotation =
                Number(data.rotation) || 0;

            player.userData.moving = true;
        }
    );


    /* =====================================================
       PLAYER LEFT
    ===================================================== */

    socket.on(
        'player-left',
        data=>{

            if(!data || !data.id){
                return;
            }

            removeRemotePlayer(
                data.id
            );
        }
    );


    /* =====================================================
       CHAT
    ===================================================== */

    socket.on(
        'chat-message',
        message=>{

            addChatMessage(
                message.user ||
                message.username ||
                'USER',

                message.text || '',

                message.ts
            );
        }
    );


    socket.on(
        'system-message',
        message=>{

            addChatMessage(
                'SYSTEM',
                message.text || '',
                message.ts
            );
        }
    );


    socket.on(
        'connect_error',
        error=>{

            console.log(
                '[SOCKET ERROR]',
                error.message
            );
        }
    );
}


/* =========================================================
   CHAT
========================================================= */

function addChatMessage(
    username,
    text,
    timestamp
){

    const el =
        document.createElement(
            'div'
        );

    el.className = 'msg';

    const user =
        document.createElement(
            'span'
        );

    user.className = 'u';

    user.textContent =
        username;

    const content =
        document.createElement(
            'span'
        );

    content.className = 't';

    const time =
        timestamp
            ? new Date(
                timestamp
              ).toLocaleTimeString()
            : '';

    content.textContent =
        ' ' +
        time +
        ' ' +
        text;

    el.appendChild(user);

    el.appendChild(
        document.createTextNode(' ')
    );

    el.appendChild(content);

    const box =
        document.getElementById(
            'chat-messages'
        );

    box.appendChild(el);

    box.scrollTop =
        box.scrollHeight;
}


document
    .getElementById('chat-form')
    .addEventListener(
        'submit',
        function(e){

            e.preventDefault();

            if(!socket){
                return;
            }

            const input =
                document.getElementById(
                    'chat-input'
                );

            const text =
                input.value.trim();

            if(!text){
                return;
            }

            socket.emit(
                'chat-message',
                {
                    user:currentUser,
                    text:text,
                    lang:
                        document.getElementById(
                            'lang'
                        ).value
                }
            );

            input.value = '';
        }
    );


document
    .getElementById('lang')
    .addEventListener(
        'change',
        function(){

            if(socket){

                socket.emit(
                    'language-change',
                    this.value
                );
            }
        }
    );

/* =========================================================
   MATERIAL HELPERS
========================================================= */

function mat(
    color = 0xffffff,
    roughness = .6,
    metalness = .1
){

    return new THREE.MeshStandardMaterial({
        color,
        roughness,
        metalness
    });
}


function box(
    w,
    h,
    d,
    material
){

    const mesh =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                w,
                h,
                d
            ),
            material
        );

    mesh.castShadow = true;
    mesh.receiveShadow = true;

    return mesh;
}


/* =========================================================
   COLLISION
========================================================= */

function addCollider(
    x,
    z,
    width,
    depth
){

    colliders.push({
        minX:x - width / 2,
        maxX:x + width / 2,

        minZ:z - depth / 2,
        maxZ:z + depth / 2
    });
}


function collidesAt(
    x,
    z
){

    for(
        const c of colliders
    ){

        const closestX =
            Math.max(
                c.minX,
                Math.min(
                    x,
                    c.maxX
                )
            );

        const closestZ =
            Math.max(
                c.minZ,
                Math.min(
                    z,
                    c.maxZ
                )
            );

        const dx =
            x - closestX;

        const dz =
            z - closestZ;

        if(
            dx * dx +
            dz * dz <
            PLAYER_RADIUS *
            PLAYER_RADIUS
        ){

            return true;
        }
    }

    return false;
}


function movePlayer(
    dx,
    dz
){

    const nx =
        playerPos.x + dx;

    const nz =
        playerPos.z + dz;


    if(
        nx > -17.25 &&
        nx < 17.25 &&
        !collidesAt(
            nx,
            playerPos.z
        )
    ){

        playerPos.x = nx;
    }


    if(
        nz > -16.25 &&
        nz < 16.25 &&
        !collidesAt(
            playerPos.x,
            nz
        )
    ){

        playerPos.z = nz;
    }
}


/* =========================================================
   FLOOR
========================================================= */

function createFloor(){

    const floor =
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                36,
                42
            ),
            mat(
                0x101010,
                .8
            )
        );

    floor.rotation.x =
        -Math.PI / 2;

    floor.receiveShadow = true;

    scene.add(floor);


    const grid =
        new THREE.GridHelper(
            36,
            36,
            0x444444,
            0x111111
        );

    grid.position.y =
        .015;

    grid.scale.z =
        42 / 36;

    scene.add(grid);
}

========================================================= */

function createCeiling(){

        box(

            .3,
            42,
            mat(0x080808)
        );

    ceiling.position.y = 6;

    scene.add(ceiling);
}


/* =========================================================

            .5,
            wallMaterial
        );

        0,
        3,
        17
    );

    scene.add(front);

    addCollider(

        17,

    const left =

    left.position.set(

        3,
        0

    scene.add(left);

    addCollider(

        .5,
        34
    );


    const right =

    right.position.set(

    );

    scene.add(right);

/* =========================================================
   REMOTE PLAYER CREATE / UPDATE
========================================================= */

function createOrUpdateRemotePlayer(
    data
){

    if(
        !data ||
        !data.id
    ){

        return null;
    }

    if(
        socket &&
        data.id === socket.id
    ){

        return null;
    }


    let player =
        remotePlayers[data.id];


    if(!player){

        player =
            createRemotePlayer(
                data.username ||
                'Guest'
            );

        remotePlayers[data.id] =
            player;
    }


    if(data.x !== undefined){

        player.position.set(
            Number(data.x) || 0,
            Number(data.y) || 0,
            Number(data.z) || 0
        );
    }


    if(data.rotation !== undefined){

        player.rotation.y =
            Number(data.rotation) || 0;
    }


    player.userData.targetPosition.copy(
        player.position
    );

    player.userData.targetRotation =
        player.rotation.y;


    return player;
}


/* =========================================================
   REMOVE REMOTE PLAYER
========================================================= */

function removeRemotePlayer(
    id
){

    const player =
        remotePlayers[id];

    if(!player){
        return;
    }

    scene.remove(
        player
    );

    delete remotePlayers[id];
}


/* =========================================================
   CONTROLS
========================================================= */

function setupControls(){

    window.addEventListener(
        'resize',
        function(){

            if(
                !camera ||
                !renderer
            ){

                return;
            }

            camera.aspect =
                innerWidth /
                innerHeight;

            camera.updateProjectionMatrix();

            renderer.setSize(
                innerWidth,
                innerHeight
            );
        }
    );


    window.addEventListener(
        'keydown',
        function(e){

            keys[e.code] = true;


            /*
                CHAT
            */

            if(
                e.code === 'KeyC' &&
                !e.repeat
            ){

                chatMode =
                    !chatMode;

                toggleChat();

                return;
            }


            /*
                THIRD / FIRST PERSON
            */

            if(
                e.code === 'KeyV' &&
                !e.repeat
            ){

                thirdPerson =
                    !thirdPerson;

                return;
            }


            /*
                JUMP
            */

            if(
                e.code === 'Space' &&
                !e.repeat
            ){

                jumpWasPressed = true;

                e.preventDefault();
            }
        }
    );


    window.addEventListener(
        'keyup',
        function(e){

            keys[e.code] = false;
        }
    );


    const canvas =
        document.getElementById(
            'canvas3d'
        );


    canvas.addEventListener(
        'click',
        function(){

            if(!chatMode){

                canvas.requestPointerLock();
            }
        }
    );


    document.addEventListener(
        'pointerlockchange',
        function(){

            pointerLocked =
                document.pointerLockElement ===
                canvas;
        }
    );


    document.addEventListener(
        'mousemove',
        function(e){

            if(!pointerLocked){
                return;
            }

            yaw -=
                e.movementX *
                .002;

            pitch -=
                e.movementY *
                .002;

            pitch =
                Math.max(
                    -1.15,
                    Math.min(
                        1.15,
                        pitch
                    )
                );
        }
    );
}


/* =========================================================
   CHAT MODE
========================================================= */

function toggleChat(){

    const input =
        document.getElementById(
            'chat-input'
        );


    if(chatMode){

        if(
            document.pointerLockElement
        ){

            document.exitPointerLock();
        }

        input.focus();

    }else{

        input.blur();
    }
}

async function startSSHAudio(){

    const audio =
        document.getElementById(
            'ews-audio'
        );

    const indicator =
        document.getElementById(
            'stream-indicator'
        );

    const button =
        document.getElementById(
            'audio-control'
        );


    try{

        if(!audioContext){

            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

            audioSource =
                audioContext.createMediaElementSource(
                    audio
                );

            analyser =
                audioContext.createAnalyser();

            analyser.fftSize =
                256;

            freqData =
                new Uint8Array(
                    analyser.frequencyBinCount
                );

            audioSource.connect(
                analyser
            );

            analyser.connect(
                audioContext.destination
            );
        }


        if(
            audioContext.state ===
            'suspended'
        ){

            await audioContext.resume();
        }


        const streamUrl =
            window.location.origin +
            '/hls/ews/index.m3u8';


        if(
            window.Hls &&
            Hls.isSupported()
        ){

            if(hls){

                hls.destroy();
            }

            hls =
                new Hls({
                    enableWorker:true,

                    lowLatencyMode:true,

                    backBufferLength:10,

                    maxBufferLength:10
                });


            hls.loadSource(
                streamUrl
            );

            hls.attachMedia(
                audio
            );


            hls.on(
                Hls.Events.MANIFEST_PARSED,
                async()=>{

                    try{

                        await audio.play();

                        audioStarted =
                            true;

                        indicator.textContent =
                            '● LIVE';

                        button.textContent =
                            '■ AUDIO ON';

                    }catch(error){

                        console.log(
                            '[AUDIO PLAY]',
                            error
                        );
                    }
                }
            );


            hls.on(
                Hls.Events.ERROR,
                (
                    event,
                    data
                )=>{

                    console.log(
                        '[HLS]',
                        data
                    );

                    if(
                        data &&
                        data.fatal
                    ){

                        indicator.textContent =
                            'STREAM ERROR';
                    }
                }
            );


        }else if(
            audio.canPlayType(
                'application/vnd.apple.mpegurl'
            )
        ){

            audio.src =
                streamUrl;

            await audio.play();

            audioStarted =
                true;

            indicator.textContent =
                '● LIVE';

            button.textContent =
                '■ AUDIO ON';

        }else{

            indicator.textContent =
                'HLS NOT SUPPORTED';
        }


        audio.onplaying = ()=>{

            indicator.textContent =
                '● LIVE';
        };


        audio.onpause = ()=>{

            if(audioStarted){

                indicator.textContent =
                    'STREAM PAUSED';
            }
        };


        audio.onerror = ()=>{

            indicator.textContent =
                'STREAM OFFLINE';
        };


    }catch(error){

        console.error(
            '[AUDIO]',
            error
        );

        indicator.textContent =
            'STREAM OFFLINE';
    }
}


/* =========================================================
   MOVEMENT
========================================================= */

function updatePlayer(
    dt
){

    if(!playerBody){
        return;
    }


    const canMove =
        !chatMode &&
        pointerLocked;


    let forward = 0;

    let side = 0;


    if(canMove){

        if(keys['KeyW']){
            forward += 1;
        }

        if(keys['KeyS']){
            forward -= 1;
        }

        if(keys['KeyA']){
            side -= 1;
        }

        if(keys['KeyD']){
            side += 1;
        }
    }


    let length =
        Math.sqrt(
            forward * forward +
            side * side
        );


    if(length > 0){

        forward /= length;
        side /= length;
    }


    const fx =
        -Math.sin(yaw);

    const fz =
        -Math.cos(yaw);

    const rx =
        Math.cos(yaw);

    const rz =
        -Math.sin(yaw);


    const dx =
        (
            fx * forward +
            rx * side
        ) *
        MOVE_SPEED *
        dt;


    const dz =
        (
            fz * forward +
            rz * side
        ) *
        MOVE_SPEED *
        dt;


    if(canMove){

        movePlayer(
            dx,
            dz
        );
    }


    /*
        JUMP
    */

    if(
        jumpWasPressed &&
        grounded &&
        canMove
    ){

        playerVelocityY =
            JUMP_FORCE;

        grounded = false;
    }

    jumpWasPressed = false;


    /*
        GRAVITY
    */

    playerVelocityY -=
        GRAVITY * dt;


    playerPos.y +=
        playerVelocityY * dt;


    if(
        playerPos.y <= 0
    ){

        playerPos.y = 0;

        playerVelocityY = 0;

        grounded = true;
    }


    /*
        PLAYER
    */

    playerBody.position.copy(
        playerPos
    );

    playerBody.rotation.y =
        yaw;


    /*
        Simple walking animation
    */

    if(length > 0){

        const walk =
            Math.sin(
                performance.now() * .012
            ) * .08;

        playerBody.position.y +=
            Math.abs(walk);
    }
}


/* =========================================================
   CAMERA
========================================================= */

function updateCamera(){

    if(!playerBody){
        return;
    }


    const target =
        new THREE.Vector3(
            playerPos.x,
            playerPos.y + 1.15,
            playerPos.z
        );


    if(thirdPerson){

        const distance = 4.4;

        const horizontal =
            Math.cos(pitch) *
            distance;

        const vertical =
            Math.sin(pitch) *
            distance;


        const desired =
            new THREE.Vector3(

                target.x +
                Math.sin(yaw) *
                horizontal,

                target.y +
                1.25 -
                vertical,

                target.z +
                Math.cos(yaw) *
                horizontal
            );


        camera.position.lerp(
            desired,
            .16
        );


        camera.lookAt(
            target
        );


    }else{

        camera.position.set(
            playerPos.x,
            playerPos.y + 1.62,
            playerPos.z
        );


        camera.rotation.order =
            'YXZ';

        camera.rotation.y =
            yaw;

        camera.rotation.x =
            pitch;
    }
}


/* =========================================================
   REMOTE PLAYERS UPDATE
========================================================= */

function updateRemotePlayers(){

    for(
        const id in remotePlayers
    ){

        const player =
            remotePlayers[id];

        if(!player){
            continue;
        }


        if(
            player.userData &&
            player.userData.targetPosition
        ){

            player.position.lerp(
                player.userData.targetPosition,
                .22
            );


            let targetRotation =
                player.userData
                    .targetRotation;


            let diff =
                targetRotation -
                player.rotation.y;


            while(
                diff > Math.PI
            ){

                diff -=
                    Math.PI * 2;
            }


            while(
                diff < -Math.PI
            ){

                diff +=
                    Math.PI * 2;
            }


            player.rotation.y +=
                diff * .22;
        }
    }
}


/* =========================================================
   NETWORK UPDATE
========================================================= */

function sendPlayerPosition(){

    if(
        !socket ||
        !socket.connected ||
        !playerBody
    ){

        return;
    }


    const now =
        performance.now();


    if(
        now -
        lastNetworkUpdate <
        50
    ){

        return;
    }


    lastNetworkUpdate =
        now;


    socket.emit(
        'player-move',
        {
            x:playerPos.x,
            y:playerPos.y,
            z:playerPos.z,
            rotation:yaw
        }
    );
}


/* =========================================================
   ANIMATION
========================================================= */

function animate(){

    requestAnimationFrame(
        animate
    );


    const dt =
        Math.min(
            clock.getDelta(),
            .05
        );


    updatePlayer(
        dt
    );


    updateCamera();


    updateRemotePlayers();


    sendPlayerPosition();


    /*
        Particles
    */

    if(particles){

        particles.rotation.y +=
            dt * .015;
    }


    /*
        Neon
    */

    if(
        neonObjects.length
    ){

        const pulse =
            .75 +
            Math.sin(
                performance.now() *
                .003
            ) *
            .2;

        neonObjects.forEach(
            object=>{

                if(
                    object.material &&
                    object.material.opacity !== undefined
                ){

                    object.material.opacity =
                        pulse;
                }
            }
        );
    }


    /*
        Audio analyser
    */

    if(
        analyser &&
        freqData
    ){

        analyser.getByteFrequencyData(
            freqData
        );


        let sum = 0;

        let bass = 0;


        for(
            let i = 0;
            i < freqData.length;
            i++
        ){

            sum +=
                freqData[i];

            if(i < 10){

                bass +=
                    freqData[i];
            }
        }


        audioLevel =
            sum /
            freqData.length /
            255;


        bassLevel =
            bass /
            Math.min(
                10,
                freqData.length
            ) /
            255;
    }


    /*
        Screen pulse
    */

    if(screenTexture){

        const glow =
            20 +
            Math.floor(
                bassLevel * 80
            );

        screenCtx.fillStyle =
            `rgb(${glow},${glow},${glow})`;

        screenCtx.fillRect(
            0,
            0,
            800,
            300
        );

        screenCtx.fillStyle =
            '#ffffff';

        screenCtx.font =
            'bold 80px Arial';

        screenCtx.textAlign =
            'center';

        screenCtx.fillText(
            'EWS SESSIONS',
            400,
            160
        );

        screenTexture.needsUpdate =
            true;
    }


    renderer.render(
        scene,
        camera
    );
}
