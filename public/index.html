<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>EWS SESSIONS</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030303;color:#fff;font-family:Arial,Helvetica,sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
#app{position:fixed;inset:0;background:#030303}
#game{position:absolute;inset:0}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block}
#ui{position:absolute;inset:0;pointer-events:none}
.panel{pointer-events:auto;background:rgba(4,4,4,.88);border:1px solid rgba(255,255,255,.18);box-shadow:0 18px 60px rgba(0,0,0,.65);backdrop-filter:blur(10px)}
#auth{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#171717 0,#050505 45%,#000 100%);z-index:20}
.authbox{width:min(420px,calc(100vw - 32px));padding:30px}
.logo{font-weight:900;letter-spacing:.28em;font-size:30px;text-align:center;margin-bottom:8px}
.sub{text-align:center;color:#888;font-size:12px;letter-spacing:.16em;margin-bottom:26px}
.field{width:100%;margin:8px 0;padding:13px 14px;border:1px solid #333;background:#090909;color:#fff;outline:none}
.field:focus{border-color:#aaa}
.row{display:flex;gap:8px}
.action{flex:1;padding:12px;border:1px solid #666;background:#fff;color:#000;font-weight:800}
.action.alt{background:#111;color:#fff;border-color:#444}
#authMsg{min-height:20px;margin-top:12px;text-align:center;color:#bbb;font-size:12px}
#hud{display:none;position:absolute;inset:0}
#topbar{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.badge{padding:8px 11px;background:rgba(0,0,0,.62);border:1px solid #292929;font-size:12px;letter-spacing:.08em}
#online{position:absolute;top:58px;right:14px;width:210px;padding:12px;max-height:260px;overflow:auto}
.title{font-size:10px;color:#888;letter-spacing:.2em;margin-bottom:8px}
.user{font-size:12px;padding:5px 0;border-bottom:1px solid #171717}
.user:last-child{border-bottom:0}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#fff;margin-right:7px}
#chat{position:absolute;left:14px;bottom:14px;width:min(390px,calc(100vw - 28px))}
#messages{height:180px;overflow:auto;padding:10px;margin-bottom:7px;background:linear-gradient(transparent,rgba(0,0,0,.7));mask-image:linear-gradient(transparent 0,#000 18%)}
.msg{font-size:12px;line-height:1.45;margin:4px 0;text-shadow:0 2px 5px #000}
.msg b{font-weight:800}
#chatInput{width:100%;padding:11px;background:rgba(0,0,0,.8);border:1px solid #333;color:#fff;outline:0}
#controls{position:absolute;bottom:14px;right:14px;width:240px}
#screenControl{display:none;padding:12px}
#screenControl input,#screenControl select{width:100%;margin:4px 0;padding:9px;background:#090909;color:#fff;border:1px solid #333}
.smallbtn{width:100%;padding:9px;margin-top:5px;border:1px solid #555;background:#111;color:#fff}
#help{position:absolute;top:14px;left:50%;transform:translateX(-50%);font-size:10px;color:#aaa;letter-spacing:.12em;background:rgba(0,0,0,.5);padding:7px 10px}
#screenStatus{font-size:10px;color:#888;margin-top:7px}
#crosshair{position:absolute;left:50%;top:50%;width:12px;height:12px;transform:translate(-50%,-50%);opacity:.55}
#crosshair:before,#crosshair:after{content:"";position:absolute;background:#fff}
#crosshair:before{width:12px;height:1px;top:5px}
#crosshair:after{height:12px;width:1px;left:5px}
#screenOverlay{position:absolute;left:50%;top:50%;width:min(760px,70vw);aspect-ratio:16/9;transform:translate(-50%,-50%);pointer-events:none;display:none}
#screenOverlay iframe,#screenOverlay video{width:100%;height:100%;border:0;background:#000;object-fit:contain}
#toast{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);padding:9px 13px;background:#111;border:1px solid #444;font-size:12px;opacity:0;transition:.2s}
#toast.show{opacity:1}
@media(max-width:700px){
 #online{width:170px}
 #help{display:none}
 #controls{width:190px}
 #screenOverlay{width:88vw}
}
</style>
</head>
<body>
<div id="app">
  <div id="auth">
    <div class="authbox panel">
      <div class="logo">EWS SESSIONS</div>
      <div class="sub">UNDERGROUND CLUB / LIVE</div>
      <input id="username" class="field" autocomplete="username" placeholder="Username">
      <input id="password" class="field" autocomplete="current-password" type="password" placeholder="Password">
      <div class="row">
        <button id="loginBtn" class="action">ВХОД</button>
        <button id="registerBtn" class="action alt">РЕГИСТРАЦИЯ</button>
      </div>
      <div id="authMsg"></div>
    </div>
  </div>

  <div id="game">
    <canvas id="scene"></canvas>
    <div id="screenOverlay"></div>
  </div>

  <div id="ui">
    <div id="hud">
      <div id="topbar">
        <div class="badge">EWS SESSIONS <span id="me"></span></div>
        <div class="badge"><span id="langLabel">EN</span> · ENTER = CHAT</div>
      </div>

      <div id="help">CLICK TO LOCK MOUSE · WASD MOVE · SPACE JUMP · 1–4 EMOTES · ENTER CHAT</div>
      <div id="crosshair"></div>

      <div id="online" class="panel">
        <div class="title">ONLINE</div>
        <div id="onlineList"></div>
      </div>

      <div id="chat">
        <div id="messages"></div>
        <input id="chatInput" maxlength="240" autocomplete="off" placeholder="Нажми ENTER и напиши сообщение...">
      </div>

      <div id="controls">
        <div id="screenControl" class="panel">
          <div class="title">SCREEN — HOST ONLY</div>
          <select id="screenType">
            <option value="video">HLS / VIDEO</option>
            <option value="iframe">WEB / TWITCH EMBED</option>
          </select>
          <input id="screenSrc" placeholder="/hls/ews/index.m3u8">
          <input id="screenTitle" placeholder="EWS SESSIONS">
          <button id="screenOn" class="smallbtn">SHOW ON SCREEN</button>
          <button id="screenOff" class="smallbtn">HIDE SCREEN</button>
          <div id="screenStatus"></div>
        </div>
      </div>
    </div>
  </div>
  <div id="toast"></div>
</div>

<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script>
(() => {
'use strict';

const $ = id => document.getElementById(id);
const HOST = 'mvxtra';
const LANGS = ['ru','en','es','de','fr','zh','ja','ko','ar','hi','pt','it','tr','uk','nl','pl'];
const LANG_NAMES = {ru:'RU',en:'EN',es:'ES',de:'DE',fr:'FR',zh:'ZH',ja:'JA',ko:'KO',ar:'AR',hi:'HI',pt:'PT',it:'IT',tr:'TR',uk:'UK',nl:'NL',pl:'PL'};

let socket = null;
let username = '';
let language = localStorage.getItem('ews-language') || 'en';
let host = false;
let joined = false;
let hls = null;
let screenVideo = null;
let screenTexture = null;
let screenMesh = null;
let screenModel = null;

let renderer, scene, camera;
let clock = new THREE.Clock();
let yaw = 0, pitch = 0;
let px = 0, py = 0, pz = 8;
let vy = 0, grounded = true;
const keys = {};
const remotes = new Map();
let lastState = 0;

const authMsg = $('authMsg');

function toast(text) {
  const el = $('toast');
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => el.classList.remove('show'), 2200);
}

function setAuthMessage(text) {
  authMsg.textContent = text || '';
}

function setLoggedIn(name, token) {
  username = name;
  if(token) localStorage.setItem('ews-session-token', token);
  localStorage.setItem('ews-username', name);
  $('auth').style.display = 'none';
  $('hud').style.display = 'block';
  $('me').textContent = '· ' + name;
}

async function api(path, body) {
  const r = await fetch(path, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(body)
  });
  const data = await r.json().catch(() => ({ok:false,error:'Server response error'}));
  if (!r.ok || !data.ok) throw new Error(data.error || 'Ошибка сервера');
  return data;
}

$('loginBtn').onclick = async () => {
  setAuthMessage('Вход...');
  try {
    const data = await api('/api/login', {
      username: $('username').value,
      password: $('password').value
    });
    setLoggedIn(data.username, data.token);
    startClub();
  } catch(e) {
    setAuthMessage(e.message);
  }
};

$('registerBtn').onclick = async () => {
  setAuthMessage('Регистрация...');
  try {
    const data = await api('/api/register', {
      username: $('username').value,
      password: $('password').value
    });
    setLoggedIn(data.username);
    startClub();
  } catch(e) {
    setAuthMessage(e.message);
  }
};

$('password').addEventListener('keydown', e => {
  if (e.key === 'Enter') $('loginBtn').click();
});

function buildWorld() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x030303);
  scene.fog = new THREE.FogExp2(0x030303, 0.022);

  camera = new THREE.PerspectiveCamera(72, innerWidth/innerHeight, .05, 100);
  camera.rotation.order = 'YXZ';

  renderer = new THREE.WebGLRenderer({canvas:$('scene'), antialias:true, powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);

  scene.add(new THREE.AmbientLight(0xffffff, .16));

  const floorMat = new THREE.MeshStandardMaterial({color:0x080808,roughness:.86,metalness:.18});
  const floor = new THREE.Mesh(new THREE.BoxGeometry(32,.25,28), floorMat);
  floor.position.y=-.13;
  floor.receiveShadow=true;
  scene.add(floor);

  const grid = new THREE.GridHelper(30,30,0xaaaaaa,0x555555);
  grid.position.y=.01;
  grid.material.transparent=true;
  grid.material.opacity=.17;
  scene.add(grid);

  // Back wall and side walls
  const wallMat = new THREE.MeshStandardMaterial({color:0x0a0a0a,roughness:.78,metalness:.3});
  addBox(32,7,.3,0,3.5,-14,wallMat);
  addBox(.3,7,28,-16,3.5,0,wallMat);
  addBox(.3,7,28,16,3.5,0,wallMat);

  // Stage
  addBox(18,.7,4,0,.35,-11.5,new THREE.MeshStandardMaterial({color:0x111111,roughness:.55,metalness:.35}));
  addBox(17,5,.18,0,3.0,-13.85,new THREE.MeshStandardMaterial({color:0x151515,roughness:.5,metalness:.5}));

  // Screen frame
  const frameMat = new THREE.MeshBasicMaterial({color:0xffffff});
  addBox(12,.16,.16,0,6.0,-13.55,frameMat);
  addBox(12,.16,.16,0,.35,-13.55,frameMat);
  addBox(.16,5.8,.16,-6,3.15,-13.55,frameMat);
  addBox(.16,5.8,.16,6,3.15,-13.55,frameMat);

  // Physical club screen: this is a real Three.js object fixed to the back wall.
  createPhysicalScreen();

  // Speaker stacks / imported model slots.
  addSpeaker(-8.1,-12.9);
  addSpeaker(8.1,-12.9);
  loadSpeakerModel();

  // Ceiling rig
  const rigMat = new THREE.MeshStandardMaterial({color:0x111111,roughness:.4,metalness:.8});
  addBox(17,.14,.14,0,6.4,-10.5,rigMat);
  addBox(17,.14,.14,0,6.4,-3,rigMat);
  addBox(17,.14,.14,0,6.4,5,rigMat);

  // Moving heads
  for (const x of [-6,-2,2,6]) {
    const lamp = new THREE.Mesh(
      new THREE.BoxGeometry(.55,.35,.55),
      new THREE.MeshStandardMaterial({color:0x050505,roughness:.35,metalness:.9})
    );
    lamp.position.set(x,6.05,-10.5);
    scene.add(lamp);
  }

  // Logo-like EWS wall sign
  const sign = makeTextSprite('EWS', 2.8);
  sign.position.set(0,4.2,-13.7);
  scene.add(sign);

  // Fog/dust
  const count = 500;
  const pos = new Float32Array(count*3);
  for(let i=0;i<count;i++){
    pos[i*3] = Math.random()*30-15;
    pos[i*3+1] = Math.random()*6+.2;
    pos[i*3+2] = Math.random()*26-13;
  }
  const pg = new THREE.BufferGeometry();
  pg.setAttribute('position', new THREE.BufferAttribute(pos,3));
  scene.add(new THREE.Points(pg,new THREE.PointsMaterial({
    color:0x999999,size:.025,transparent:true,opacity:.3,depthWrite:false
  })));

  for(let i=0;i<5;i++){
    const light = new THREE.PointLight(0xffffff,.35,12);
    light.position.set(-10+i*5,4,-4);
    scene.add(light);
  }

  window.addEventListener('resize', resize);
  document.addEventListener('mousemove', mouseLook);
  document.addEventListener('pointerlockchange', () => {
    $('help').style.opacity = document.pointerLockElement ? '.18' : '.7';
  });

  $('scene').addEventListener('click', () => {
    if (document.activeElement === $('chatInput')) return;
    if(screenVideo) screenVideo.play().catch(()=>{});
    $('scene').requestPointerLock?.();
  });
}

function addBox(w,h,d,x,y,z,mat) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.position.set(x,y,z);
  scene.add(m);
  return m;
}

function createPhysicalScreen() {
  const backing = new THREE.Mesh(
    new THREE.PlaneGeometry(11.6, 5.45),
    new THREE.MeshBasicMaterial({ color: 0x000000 })
  );
  backing.position.set(0, 3.175, -13.43);
  scene.add(backing);
  screenMesh = backing;
}

function loadSpeakerModel() {
  if (!THREE.GLTFLoader) return;

  const candidates = [
    '/models/speakers.glb',
    '/models/speaker.glb',
    '/models/columns.glb',
    '/models/column.glb',
    '/assets/speakers.glb',
    '/assets/speaker.glb',
    '/media/speakers.glb',
    '/media/speaker.glb'
  ];

  const loader = new THREE.GLTFLoader();
  let index = 0;

  const tryNext = () => {
    if (index >= candidates.length) return;
    const url = candidates[index++];
    loader.load(url, gltf => {
      screenModel = gltf.scene;
      screenModel.traverse(o => {
        if (o.isMesh) {
          o.castShadow = true;
          o.receiveShadow = true;
        }
      });
      screenModel.scale.setScalar(1.35);
      screenModel.position.set(0, 0, -12.75);
      scene.add(screenModel);

      // The imported model replaces the simple speaker blocks visually.
      const fallback = scene.userData.fallbackSpeakers;
      if (fallback) fallback.forEach(o => o.visible = false);
      toast('Модель колонок загружена');
    }, undefined, () => tryNext());
  };

  tryNext();
}

function addSpeaker(x,z) {
  const group=new THREE.Group();
  const cabinetMaterial=new THREE.MeshStandardMaterial({
    color:0x080808,roughness:.43,metalness:.38
  });
  const edgeMaterial=new THREE.MeshStandardMaterial({
    color:0x202020,roughness:.62,metalness:.14
  });

  const sub=new THREE.Mesh(new THREE.BoxGeometry(1.85,1.55,1.18),cabinetMaterial);
  sub.position.y=.78;
  group.add(sub);

  const top=new THREE.Mesh(new THREE.BoxGeometry(1.45,2.85,.98),cabinetMaterial);
  top.position.y=2.98;
  group.add(top);

  const subRing=new THREE.Mesh(new THREE.TorusGeometry(.42,.055,12,36),edgeMaterial);
  subRing.position.set(0,.78,.61);
  group.add(subRing);

  const subCone=new THREE.Mesh(
    new THREE.CircleGeometry(.37,36),
    new THREE.MeshStandardMaterial({color:0x141414,roughness:.72,metalness:.04})
  );
  subCone.position.set(0,.78,.615);
  group.add(subCone);

  for(let i=0;i<3;i++){
    const y=2.16+i*.72;
    const ring=new THREE.Mesh(new THREE.TorusGeometry(.245,.036,10,28),edgeMaterial);
    ring.position.set(0,y,.505);
    group.add(ring);

    const driver=new THREE.Mesh(
      new THREE.CircleGeometry(.21,30),
      new THREE.MeshStandardMaterial({color:0x161616,roughness:.76,metalness:.03})
    );
    driver.position.set(0,y,.51);
    group.add(driver);
  }

  group.position.set(x,0,z);
  group.rotation.y=Math.PI;
  group.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});
  scene.add(group);

  scene.userData.fallbackSpeakers=scene.userData.fallbackSpeakers||[];
  scene.userData.fallbackSpeakers.push(group);
  return group;
}

function makeTextSprite(text,size) {
  const c=document.createElement('canvas');
  c.width=512;c.height=180;
  const ctx=c.getContext('2d');
  ctx.clearRect(0,0,512,180);
  ctx.fillStyle='#fff';
  ctx.font='900 110px Arial';
  ctx.textAlign='center';
  ctx.fillText(text,256,120);
  const tex=new THREE.CanvasTexture(c);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true}));
  s.scale.set(size,size*.35,1);
  return s;
}

function resize() {
  if(!camera || !renderer) return;
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
}

function mouseLook(e) {
  if(document.pointerLockElement !== $('scene')) return;
  yaw -= e.movementX*.0022;
  pitch -= e.movementY*.0022;
  pitch = THREE.MathUtils.clamp(pitch,-1.3,1.3);
}

function animate() {
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.05);

  const forward=(keys.KeyW?1:0)-(keys.KeyS?1:0);
  const side=(keys.KeyD?1:0)-(keys.KeyA?1:0);

  if(document.pointerLockElement === $('scene') && (forward||side)) {
    const len=Math.hypot(forward,side)||1;
    const f=forward/len, s=side/len;
    const fx=-Math.sin(yaw), fz=-Math.cos(yaw);
    const rx=Math.cos(yaw), rz=-Math.sin(yaw);
    px+=(fx*f+rx*s)*4.5*dt;
    pz+=(fz*f+rz*s)*4.5*dt;
    px=THREE.MathUtils.clamp(px,-15,15);
    pz=THREE.MathUtils.clamp(pz,-13,13);
  }

  if(document.pointerLockElement === $('scene')) {
    vy -= 18*dt;
    py += vy*dt;
    if(py<=0){py=0;vy=0;grounded=true}
  }

  camera.position.set(px,1.65+py,pz);
  camera.rotation.set(pitch,yaw,0);

  const now=performance.now();
  if(socket?.connected && now-lastState>70){
    lastState=now;
    socket.emit('player:state',{
      x:px,z:pz,yaw,moving:Boolean(forward||side)
    });
  }

  updateRemotes(now/1000);
  renderer.render(scene,camera);
}

document.addEventListener('keydown', e => {
  if(e.target?.tagName==='INPUT' || e.target?.tagName==='SELECT') return;

  if(e.code==='Space' && grounded){
    vy=7;
    grounded=false;
    e.preventDefault();
  }

  if(e.code==='Enter'){
    e.preventDefault();
    $('chatInput').focus();
    return;
  }

  keys[e.code]=true;
  if(socket?.connected && /^[1-4]$/.test(e.key)) socket.emit('player:emote',Number(e.key));
});

document.addEventListener('keyup',e => keys[e.code]=false);

$('chatInput').addEventListener('keydown', async e => {
  if(e.key!=='Enter') return;
  e.preventDefault();
  const text=$('chatInput').value.trim();
  $('chatInput').value='';
  $('chatInput').blur();
  if(text && socket?.connected) socket.emit('chat:send',text);
});

function createAvatar(data) {
  const g=new THREE.Group();
  const seed=hash(data.id||data.username);
  const bodyColor=[0x454545,0x666666,0x303030,0x777777][seed%4];
  const bodyMat=new THREE.MeshStandardMaterial({color:bodyColor,roughness:.75});
  const dark=new THREE.MeshStandardMaterial({color:0x151515,roughness:.85});
  const headMat=new THREE.MeshStandardMaterial({color:0xbcbcbc,roughness:.7});

  const body=new THREE.Mesh(new THREE.BoxGeometry(.8,1.25,.45),bodyMat);
  body.position.y=1.3;g.add(body);

  const head=new THREE.Mesh(new THREE.SphereGeometry(.38,16,12),headMat);
  head.position.y=2.22;g.add(head);

  const eyeMat=new THREE.MeshBasicMaterial({color:0x111111});
  for(const sx of [-.12,.12]){
    const eye=new THREE.Mesh(new THREE.BoxGeometry(.08,.07,.03),eyeMat);
    eye.position.set(sx,2.25,.35);g.add(eye);
  }

  const l1=new THREE.Mesh(new THREE.BoxGeometry(.22,.9,.23),dark);
  l1.position.set(-.2,.45,0);g.add(l1);
  const l2=l1.clone();l2.position.x=.2;g.add(l2);

  const a1=new THREE.Mesh(new THREE.BoxGeometry(.2,1,.22),bodyMat);
  a1.position.set(-.54,1.3,0);g.add(a1);
  const a2=a1.clone();a2.position.x=.54;g.add(a2);

  const label=makeTextSprite(data.username,1.65);
  label.position.y=3.0;
  g.add(label);

  g.position.set(Number(data.x)||0,0,Number(data.z)||0);
  g.rotation.y=Number(data.yaw)||0;
  scene.add(g);

  return {g,targetX:g.position.x,targetZ:g.position.z,targetYaw:g.rotation.y,data};
}

function hash(s){
  let n=0;
  for(let i=0;i<String(s).length;i++) n=((n<<5)-n+String(s).charCodeAt(i))|0;
  return Math.abs(n);
}

function upsertRemote(data){
  if(data.id===socket?.id) return;
  let r=remotes.get(data.id);
  if(!r){r=createAvatar(data);remotes.set(data.id,r)}
  r.data=data;
  r.targetX=Number(data.x)||0;
  r.targetZ=Number(data.z)||0;
  r.targetYaw=Number(data.yaw)||0;
}

function removeRemote(id){
  const r=remotes.get(id);
  if(!r) return;
  scene.remove(r.g);
  remotes.delete(id);
}

function updateRemotes(t){
  remotes.forEach(r=>{
    r.g.position.x += (r.targetX-r.g.position.x)*.22;
    r.g.position.z += (r.targetZ-r.g.position.z)*.22;
    let d=r.targetYaw-r.g.rotation.y;
    while(d>Math.PI)d-=Math.PI*2;
    while(d<-Math.PI)d+=Math.PI*2;
    r.g.rotation.y += d*.22;

    const moving=!!r.data?.moving;
    const swing=moving?Math.sin(t*9)*.28:0;
    if(r.g.children[4])r.g.children[4].rotation.x=swing;
    if(r.g.children[5])r.g.children[5].rotation.x=-swing;
    if(r.data?.emote){
      r.g.rotation.z=Math.sin(t*7+(r.data.emoteAt||0)/300)*.16;
    } else {
      r.g.rotation.z*=.9;
    }
  });
}

function connect() {
  socket=io({
    transports:['websocket','polling'],
    reconnection:true,
    reconnectionAttempts:Infinity,
    timeout:10000
  });

  socket.on('connect',()=>{
    socket.emit('join',{username,language});
  });

  socket.on('connect_error',()=>toast('Соединение с клубом...'));

  socket.on('club:ready',data=>{
    joined=true;
    host=!!data.host;
    $('screenControl').style.display=host?'block':'none';
    if(data.screen) applyScreen(data.screen);
  });

  socket.on('world:state',data=>{
    for(const r of remotes.values()) scene.remove(r.g);
    remotes.clear();
    (data.players||[]).forEach(upsertRemote);
    if(data.screen) applyScreen(data.screen);
  });

  socket.on('player:joined',upsertRemote);
  socket.on('player:state',upsertRemote);
  socket.on('player:left',removeRemote);
  socket.on('online:state',renderOnline);
  socket.on('screen:state',applyScreen);

  socket.on('language:state',lang=>{
    language=lang;
    localStorage.setItem('ews-language',lang);
    $('langLabel').textContent=LANG_NAMES[lang]||lang.toUpperCase();
  });

  socket.on('chat:message',msg=>renderMessage(msg));
}

function renderOnline(users) {
  $('onlineList').innerHTML='';
  (users||[]).forEach(u=>{
    const div=document.createElement('div');
    div.className='user';
    const dot=document.createElement('span');
    dot.className='dot';
    div.append(dot,document.createTextNode(u.username + (u.username.toLowerCase()===HOST?' ★':'')));
    $('onlineList').appendChild(div);
  });
}

async function renderMessage(msg) {
  const div=document.createElement('div');
  div.className='msg';
  const b=document.createElement('b');
  b.textContent=msg.user+': ';
  div.appendChild(b);

  const span=document.createElement('span');
  span.textContent=msg.text;
  div.appendChild(span);
  $('messages').appendChild(div);
  $('messages').scrollTop=$('messages').scrollHeight;

  if(language==='en' || language==='ru' || language) {
    try {
      const r=await fetch('/api/translate',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({text:msg.text,target:language})
      });
      const data=await r.json();
      if(data.ok && data.text && data.text!==msg.text) span.textContent=msg.text+' → '+data.text;
    } catch {}
  }
}

function applyScreen(state) {
  const wrap=$('screenOverlay');
  wrap.innerHTML='';
  wrap.style.display='none';

  if(hls){ hls.destroy(); hls=null; }
  if(screenTexture){ screenTexture.dispose(); screenTexture=null; }
  if(screenVideo){
    screenVideo.pause();
    screenVideo.removeAttribute('src');
    screenVideo.load();
    screenVideo=null;
  }

  if(!state?.active || !state.src){
    if(screenMesh) screenMesh.material.map=null;
    if(host) $('screenStatus').textContent='SCREEN OFF';
    return;
  }

  // VIDEO/HLS is rendered directly onto the physical Three.js screen.
  if(state.type!=='iframe'){
    const video=document.createElement('video');
    screenVideo=video;
    video.autoplay=true;
    video.muted=false;
    video.controls=false;
    video.loop=false;
    video.playsInline=true;
    video.setAttribute('playsinline','');
    video.crossOrigin='anonymous';

    screenTexture=new THREE.VideoTexture(video);
    screenTexture.minFilter=THREE.LinearFilter;
    screenTexture.magFilter=THREE.LinearFilter;
    screenTexture.format=THREE.RGBAFormat;
    screenTexture.encoding=THREE.sRGBEncoding;

    if(screenMesh){
      screenMesh.material.map=screenTexture;
      screenMesh.material.needsUpdate=true;
    }

    if(window.Hls && Hls.isSupported() && /\.m3u8($|\?)/i.test(state.src)){
      hls=new Hls({enableWorker:true, lowLatencyMode:true});
      hls.loadSource(state.src);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED,()=>{
        video.play().catch(()=>toast('Нажми один раз по экрану для звука'));
      });
    } else {
      video.src=state.src;
      video.play().catch(()=>{});
    }
  } else {
    // Non-video embeds stay supported, but the normal EWS screen is physical video.
    const iframe=document.createElement('iframe');
    iframe.src=state.src;
    iframe.allow='autoplay; fullscreen; picture-in-picture';
    iframe.allowFullscreen=true;
    wrap.style.display='block';
    wrap.appendChild(iframe);
  }

  if(host) $('screenStatus').textContent='SCREEN ON · '+(state.title||'');
}

$('screenOn').onclick=()=>{
  if(!host || !socket?.connected) return;
  socket.emit('screen:set',{
    src:$('screenSrc').value.trim(),
    type:$('screenType').value,
    title:$('screenTitle').value.trim() || 'EWS SESSIONS'
  });
};

$('screenOff').onclick=()=>{
  if(host && socket?.connected) socket.emit('screen:set',{src:''});
};

function startClub() {
  buildWorld();
  connect();
  animate();
  $('langLabel').textContent=LANG_NAMES[language]||language.toUpperCase();
  $('chatInput').placeholder='ENTER → чат';
  // The screen URL is intentionally editable only for the host.
  $('screenSrc').value='/hls/ews/index.m3u8';
  $('screenTitle').value='EWS SESSIONS';
}

// Keep the user signed in on this browser after the first successful login.
const saved=localStorage.getItem('ews-username');
if(saved) $('username').value=saved;

async function restoreSession() {
  const token=localStorage.getItem('ews-session-token');
  if(!token) return;

  try {
    const data=await api('/api/session',{token});
    setLoggedIn(data.username,data.token);
    startClub();
  } catch {
    localStorage.removeItem('ews-session-token');
  }
}

restoreSession();

})();
</script>
