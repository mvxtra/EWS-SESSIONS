<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0"
>

<title>EWS SESSIONS</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<script src="/socket.io/socket.io.js"></script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050505;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

#app{
  position:relative;
  width:100vw;
  height:100vh;
}

#canvas3d{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}

/* =========================================================
   LOGIN
========================================================= */

#login{
  position:absolute;
  inset:0;
  z-index:1000;
  display:flex;
  align-items:center;
  justify-content:center;

  background:
    radial-gradient(
      circle at 50% 40%,
      rgba(255,255,255,.08),
      transparent 25%
    ),
    radial-gradient(
      circle at 50% 50%,
      #171717,
      #030303 70%
    );
}

.login-box{
  width:380px;
  padding:42px;

  background:rgba(5,5,5,.88);

  border:1px solid #444;

  box-shadow:
    0 0 80px rgba(255,255,255,.06),
    inset 0 0 40px rgba(255,255,255,.02);

  text-align:center;
}

.login-box h1{
  font-size:31px;
  letter-spacing:8px;
  font-weight:900;
  color:#fff;
  margin-bottom:8px;
}

.login-box p{
  font-size:10px;
  letter-spacing:5px;
  color:#777;
  margin-bottom:30px;
}

.tabs{
  display:flex;
  margin-bottom:20px;
  border:1px solid #333;
}

.tab{
  flex:1;
  padding:11px;
  border:0;
  background:#0c0c0c;
  color:#666;
  cursor:pointer;
  letter-spacing:2px;
}

.tab.active{
  background:#fff;
  color:#000;
}

input{
  width:100%;
  height:45px;
  margin-bottom:12px;
  padding:0 14px;

  border:1px solid #333;
  background:#080808;
  color:#fff;

  outline:none;
}

input:focus{
  border-color:#aaa;
}

.btn{
  width:100%;
  height:45px;

  border:0;

  background:#fff;
  color:#000;

  font-weight:bold;
  letter-spacing:2px;

  cursor:pointer;
}

.btn:hover{
  background:#ddd;
}

.error{
  min-height:20px;
  margin-top:12px;
  color:#ff5555;
  font-size:12px;
}

/* =========================================================
   HUD
========================================================= */

#hud{
  position:absolute;
  inset:0;
  z-index:20;

  display:none;

  pointer-events:none;
}

#top-logo{
  position:absolute;

  top:18px;
  left:20px;

  font-size:16px;
  font-weight:900;
  letter-spacing:5px;

  text-shadow:0 0 20px #fff;
}

#top-logo span{
  display:block;

  margin-top:4px;

  font-size:8px;
  letter-spacing:3px;
  color:#777;
}

#online-box{
  position:absolute;

  top:18px;
  right:18px;

  width:190px;

  padding:13px;

  background:rgba(0,0,0,.72);

  border:1px solid #333;

  pointer-events:auto;
}

#online-box h3{
  font-size:10px;
  letter-spacing:3px;
  color:#aaa;
  margin-bottom:9px;
}

#online-list{
  list-style:none;

  max-height:180px;
  overflow:auto;

  color:#ddd;
  font-size:12px;
}

#online-list li{
  padding:4px 0;

  border-bottom:1px solid #161616;
}

#online-list li::before{
  content:"●";

  color:#fff;

  margin-right:7px;

  font-size:8px;
}

/* =========================================================
   CHAT
========================================================= */

#chat{
  position:absolute;

  left:18px;
  bottom:18px;

  width:390px;
  height:250px;

  padding:12px;

  display:flex;
  flex-direction:column;

  background:rgba(0,0,0,.75);

  border:1px solid #333;

  pointer-events:auto;
}

#chat-title{
  font-size:9px;
  letter-spacing:3px;
  color:#777;

  margin-bottom:8px;
}

#chat-messages{
  flex:1;

  overflow-y:auto;

  margin-bottom:8px;
}

.msg{
  margin-bottom:7px;

  font-size:12px;
  line-height:1.4;
}

.msg .u{
  color:#fff;
  font-weight:bold;
}

.msg .t{
  color:#aaa;
}

#chat-form{
  display:flex;
  gap:6px;
}

#chat-input{
  flex:1;
  height:35px;
  margin:0;
}

#chat-send{
  width:45px;

  border:0;

  background:#fff;
  color:#000;

  cursor:pointer;
}

/* =========================================================
   CLUB SCREEN
========================================================= */

#screen-control{
  display:none;

  position:absolute;
  top:18px;
  left:50%;
  transform:translateX(-50%);

  z-index:31;

  pointer-events:auto;

  height:34px;
  padding:0 18px;

  border:1px solid #444;
  background:rgba(0,0,0,.78);
  color:#fff;

  font-size:10px;
  font-weight:bold;
  letter-spacing:3px;

  cursor:pointer;
}

#screen-control:hover{
  background:#fff;
  color:#000;
}

#screen-menu{
  position:absolute;

  top:62px;
  left:50%;

  transform:translateX(-50%);

  z-index:40;

  width:min(560px,calc(100vw - 30px));

  padding:16px;

  background:rgba(4,4,4,.96);

  border:1px solid #444;

  box-shadow:0 20px 70px rgba(0,0,0,.7);

  display:none;

  pointer-events:auto;
}

#screen-menu.open{
  display:block;
}

#screen-menu-title{
  font-size:10px;
  letter-spacing:3px;
  color:#fff;
  margin-bottom:10px;
}

#screen-menu-row{
  display:flex;
  gap:7px;
}

#screen-url{
  flex:1;
  margin:0;
  height:38px;
}

.screen-btn{
  height:38px;
  padding:0 13px;

  border:1px solid #444;

  background:#111;
  color:#fff;

  cursor:pointer;

  font-size:10px;
  letter-spacing:1px;
}

.screen-btn:hover{
  background:#fff;
  color:#000;
}

#screen-status{
  margin-top:9px;

  color:#777;

  font-size:10px;

  line-height:1.4;
}

/* =========================================================
   EXTERNAL SCREEN
========================================================= */

#media-screen{
  position:absolute;

  z-index:15;

  display:none;

  overflow:hidden;

  background:#000;

  border:1px solid #222;

  box-shadow:0 0 45px rgba(0,0,0,.9);

  pointer-events:auto;
}

#media-screen.active{
  display:block;
}

#media-screen iframe{
  width:100%;
  height:100%;

  border:0;

  display:block;

  background:#000;
}

#media-screen-close{
  position:absolute;

  top:7px;
  right:7px;

  z-index:2;

  width:28px;
  height:28px;

  border:1px solid #555;

  background:rgba(0,0,0,.85);

  color:#fff;

  cursor:pointer;

  font-size:14px;
  line-height:26px;
}

/* =========================================================
   PAUSE
========================================================= */

#pause-panel{
  position:absolute;

  left:18px;
  bottom:18px;

  z-index:50;

  width:260px;

  padding:14px;

  background:rgba(0,0,0,.90);

  border:1px solid #333;

  box-shadow:0 15px 50px rgba(0,0,0,.65);

  display:none;

  pointer-events:auto;
}

#pause-panel.open{
  display:block;
}

#pause-title{
  font-size:10px;
  letter-spacing:3px;
  margin-bottom:12px;
  color:#fff;
}

.pause-row{
  display:flex;
  align-items:center;
  gap:10px;
  margin:9px 0;
}

.pause-row label{
  font-size:9px;
  letter-spacing:2px;
  color:#888;
  width:65px;
}

.pause-row input[type=range]{
  flex:1;
  accent-color:#fff;
}

#pause-volume-value{
  font-size:9px;
  color:#fff;
  width:32px;
  text-align:right;
}

.pause-control-btn{
  width:100%;
  height:34px;

  margin-top:8px;

  border:1px solid #444;

  background:#111;

  color:#fff;

  font-size:10px;

  letter-spacing:2px;

  cursor:pointer;
}

.pause-control-btn:hover{
  background:#fff;
  color:#000;
}

#pause-toggle{
  width:100%;
  height:34px;

  border:1px solid #555;

  background:#111;

  color:#fff;

  font-size:10px;

  letter-spacing:2px;

  cursor:pointer;
}

#pause-toggle:hover{
  background:#fff;
  color:#000;
}

#pause-backdrop{
  position:absolute;

  inset:0;

  z-index:45;

  background:rgba(0,0,0,.45);

  display:none;

  pointer-events:auto;
}

#pause-backdrop.open{
  display:block;
}

/* =========================================================
   AUDIO / STREAM
========================================================= */

#stream-indicator{
  position:absolute;

  top:18px;
  left:50%;

  transform:translateX(-50%);

  padding:6px 12px;

  background:rgba(0,0,0,.75);

  border:1px solid #333;

  color:#777;

  font-family:monospace;

  font-size:10px;

  letter-spacing:2px;
}

#stream-indicator.live{
  color:#fff;
  border-color:#aaa;
}

#stream-indicator.error{
  color:#ff5555;
  border-color:#ff5555;
}

#audio-control{
  position:absolute;

  top:58px;
  left:50%;

  transform:translateX(-50%);

  z-index:100;

  pointer-events:auto;

  padding:9px 14px;

  border:1px solid #444;

  background:rgba(0,0,0,.78);

  color:#aaa;

  font-family:monospace;

  font-size:10px;

  letter-spacing:2px;

  cursor:pointer;
}

#audio-control.live{
  color:#fff;
  border-color:#aaa;
}

#audio-control:disabled{
  opacity:.7;
  cursor:wait;
}

#ews-video{
  position:absolute;

  width:1px;
  height:1px;

  opacity:0;

  pointer-events:none;

  left:-10px;
  top:-10px;
}

#ews-audio{
  position:absolute;

  width:1px;
  height:1px;

  opacity:0;

  pointer-events:none;
}

/* =========================================================
   LANGUAGE
========================================================= */

#lang-bar{
  position:absolute;

  right:220px;
  top:18px;

  pointer-events:auto;
}

#lang{
  background:#080808;

  border:1px solid #333;

  color:#aaa;

  padding:7px 10px;
}

/* =========================================================
   OTHER HUD
========================================================= */

#zone-label{
  position:absolute;

  left:50%;
  bottom:90px;

  transform:translateX(-50%);

  font-size:10px;

  letter-spacing:5px;

  color:rgba(255,255,255,.4);

  pointer-events:none;
}

#hint{
  position:absolute;

  right:18px;
  bottom:18px;

  padding:9px 12px;

  background:rgba(0,0,0,.65);

  border:1px solid #292929;

  color:#777;

  font-size:10px;

  letter-spacing:1px;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

  #top-logo{
    top:12px;
    left:12px;
    font-size:22px;
  }

  #top-logo span{
    font-size:9px;
  }

  #lang-bar{
    right:12px;
    top:12px;
  }

  #lang{
    padding:6px 7px;
    font-size:11px;
  }

  #online-box{
    top:52px;
    right:12px;

    width:145px;

    padding:9px;

    max-height:105px;
  }

  #online-list{
    max-height:62px;
    font-size:10px;
  }

  #online-box h3{
    font-size:8px;
    margin-bottom:5px;
  }

  #online-list li{
    padding:2px 0;
  }

  #stream-indicator{
    top:52px;
    left:12px;

    transform:none;

    padding:5px 8px;

    font-size:8px;
  }

  #audio-control{
    top:84px;
    left:12px;

    transform:none;

    padding:8px 10px;

    font-size:8px;

    z-index:150;
  }

  #chat{
    left:10px;
    right:10px;
    bottom:10px;

    width:auto;

    height:31vh;

    min-height:190px;
    max-height:270px;

    padding:9px;

    z-index:200;

    background:rgba(0,0,0,.86);
  }

  #chat-title{
    font-size:8px;
    margin-bottom:6px;
  }

  #chat-messages{
    font-size:11px;
    margin-bottom:6px;
  }

  .msg{
    font-size:11px;
    margin-bottom:5px;
  }

  #chat-input{
    height:38px;

    font-size:14px;

    padding:0 9px;
  }

  #chat-send{
    width:44px;

    font-size:18px;
  }

  #hint{
    display:none;
  }

  #zone-label{
    bottom:calc(31vh + 20px);

    font-size:8px;
  }

}

@media(max-width:420px){

  #online-box{
    width:125px;
  }

  #chat{
    height:34vh;
    min-height:185px;
  }

  #zone-label{
    bottom:calc(34vh + 20px);
  }

}

</style>
</head>

<body>

<div id="app">

<canvas id="canvas3d"></canvas>

<!-- HLS VIDEO STREAM -->
<video
  id="ews-video"
  crossorigin="anonymous"
  playsinline
  preload="none"
></video>

<!-- BACKUP AUDIO ELEMENT -->
<audio
  id="ews-audio"
  crossorigin="anonymous"
  playsinline
  preload="none">
</audio>

<!-- =====================================================
     LOGIN
===================================================== -->

<div id="login">

  <div class="login-box">

    <h1>EWS</h1>

    <p>
      SESSIONS / UNDERGROUND CLUB
    </p>

    <div class="tabs">

      <button
        class="tab active"
        onclick="switchTab('login')">
        ВХОД
      </button>

      <button
        class="tab"
        onclick="switchTab('register')">
        РЕГИСТРАЦИЯ
      </button>

    </div>

    <input
      id="f-username"
      placeholder="USERNAME"
      autocomplete="username"
    >

    <input
      id="f-password"
      type="password"
      placeholder="PASSWORD"
      autocomplete="current-password"
    >

    <button
      class="btn"
      id="submitBtn"
      onclick="doLogin()">
      ВОЙТИ
    </button>

    <div
      id="error"
      class="error">
    </div>

  </div>

</div>

<!-- =====================================================
     HUD
===================================================== -->

<div id="hud">

  <div id="top-logo">
    EWS
    <span>SESSIONS</span>
  </div>

  <div id="stream-indicator">
    STREAM: OFFLINE
  </div>

  <button
    id="audio-control"
    onclick="startSSHAudio()">
    ▶ START STREAM
  </button>

  <!-- HOST SCREEN CONTROL -->
  <button
    id="screen-control"
    onclick="toggleScreenMenu()">
    SCREEN
  </button>

  <div id="screen-menu">

    <div id="screen-menu-title">
      EWS SESSIONS / HOST CONTROL
    </div>

    <div id="screen-menu-row">

      <input
        id="screen-url"
        type="url"
        placeholder="YouTube / Twitch / website URL"
        autocomplete="off"
      >

      <button
        class="screen-btn"
        onclick="loadClubScreen()">
        LOAD
      </button>

      <button
        class="screen-btn"
        onclick="clearClubScreen()">
        CLEAR
      </button>

    </div>

    <div id="screen-status">
      Только mvxtra может управлять этим экраном.
    </div>

  </div>

  <div id="lang-bar">

    <select id="lang">

      <option value="ru">RU</option>
      <option value="en">EN</option>
      <option value="es">ES</option>
      <option value="de">DE</option>
      <option value="fr">FR</option>
      <option value="zh">中文</option>
      <option value="ja">日本語</option>
      <option value="ko">한국어</option>
      <option value="ar">AR</option>
      <option value="hi">HI</option>
      <option value="pt">PT</option>
      <option value="it">IT</option>
      <option value="tr">TR</option>
      <option value="uk">UA</option>

    </select>

  </div>

  <div id="online-box">

    <h3>
      ONLINE
    </h3>

    <ul id="online-list"></ul>

  </div>

  <div id="chat">

    <div id="chat-title">
      EWS SESSIONS / CHAT
    </div>

    <div id="chat-messages"></div>

    <form id="chat-form">

      <input
        id="chat-input"
        autocomplete="off"
        placeholder="write something..."
      >

      <button id="chat-send">
        →
      </button>

    </form>

  </div>

  <div id="pause-backdrop"></div>

  <div id="pause-panel">

    <div id="pause-title">
      EWS SESSIONS / PAUSE
    </div>

    <button
      id="pause-toggle"
      onclick="togglePause()">
      PAUSE
    </button>

    <button
      id="pause-audio"
      class="pause-control-btn"
      onclick="startSSHAudio()">
      ▶ START STREAM
    </button>

    <button
      id="pause-mute"
      class="pause-control-btn"
      onclick="toggleMute()">
      MUTE
    </button>

    <div class="pause-row">

      <label>VOLUME</label>

      <input
        id="pause-volume"
        type="range"
        min="0"
        max="100"
        value="100"
      >

      <span id="pause-volume-value">
        100%
      </span>

    </div>

    <div
      style="
        font-size:9px;
        color:#666;
        line-height:1.5;
        margin-top:10px;
      ">
      ESC — pause/resume · SPACE — jump
    </div>

  </div>

  <!-- EXTERNAL MEDIA -->
  <div id="media-screen">

    <button
      id="media-screen-close"
      onclick="clearClubScreen()">
      ×
    </button>

    <iframe
      id="media-screen-frame"
      allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
      allowfullscreen>
    </iframe>

  </div>

  <div id="zone-label">
    MAIN FLOOR
  </div>

  <div id="hint">
    WASD MOVE · MOUSE LOOK · C CHAT
  </div>

</div>

</div>

<script>

/* =========================================================
   GLOBAL
========================================================= */

let mode='login';

let socket=null;

let currentUser=null;

let scene;
let camera;
let renderer;

let keys={};

let yaw=0;
let pitch=0;

let verticalVelocity=0;

let grounded=true;

let playerHeight=1.7;

let pointerLocked=false;
let chatMode=false;

let clock=new THREE.Clock();

let neonObjects=[];
let lightObjects=[];

let particles;

let analyser=null;
let freqData=null;

let audioLevel=0;
let bassLevel=0;

let audioContext=null;
let audioSource=null;

let audioStarted=false;
let audioMuted=false;

let hls=null;

let streamVideo=null;

let streamVideoTexture=null;

let streamVideoMaterial=null;

let streamIsLive=false;

let screenTexture;
let screenCanvas;
let screenCtx;
let screenMesh;

let screenMediaActive=false;
let screenMediaUrl='';

let onlineUserList=[];

let remotePlayers=new Map();

let lastPlayerBroadcast=0;

let clubScreenHost=null;

let playerBody;

let paused=false;

/* =========================================================
   TEXTURES
========================================================= */

const EWS_TEXTURES={

  concrete:
    'https://images.sharetextures.com/u/concrete_black_mat-min.webp',

  floor:
    'https://images.sharetextures.com/u/stone_floor_1-min.webp'

};

const ewsTextureLoader=
  new THREE.TextureLoader();

function loadEWSTexture(
  url,
  repeatX=4,
  repeatY=4
){

  const texture=
    ewsTextureLoader.load(url);

  texture.wrapS=
    THREE.RepeatWrapping;

  texture.wrapT=
    THREE.RepeatWrapping;

  texture.repeat.set(
    repeatX,
    repeatY
  );

  texture.anisotropy=
    Math.min(
      8,
      renderer
        ? renderer.capabilities.getMaxAnisotropy()
        : 8
    );

  texture.colorSpace=
    THREE.SRGBColorSpace;

  return texture;

}

/* =========================================================
   LOGIN
========================================================= */

function switchTab(type){

  mode=type;

  document
    .querySelectorAll('.tab')
    .forEach(
      t=>t.classList.remove('active')
    );

  if(type==='login'){

    document
      .querySelectorAll('.tab')[0]
      .classList.add('active');

    document.getElementById(
      'submitBtn'
    ).textContent='ВОЙТИ';

  }else{

    document
      .querySelectorAll('.tab')[1]
      .classList.add('active');

    document.getElementById(
      'submitBtn'
    ).textContent='СОЗДАТЬ АККАУНТ';

  }

  document.getElementById(
    'error'
  ).textContent='';

}

async function doLogin(){

  const username=
    document
      .getElementById('f-username')
      .value
      .trim();

  const password=
    document
      .getElementById('f-password')
      .value;

  const error=
    document.getElementById('error');

  error.textContent='';

  if(!username || !password){

    error.textContent=
      'Введите логин и пароль';

    return;

  }

  try{

    const res=
      await fetch(
        '/api/'+mode,
        {
          method:'POST',

          headers:{
            'Content-Type':
              'application/json'
          },

          body:JSON.stringify({
            username,
            password
          })
        }
      );

    const data=
      await res.json();

    /*
      FIX:
      server.js возвращает message,
      а не error.
    */

    if(!data.ok){

      error.textContent=
        data.message ||
        'Ошибка входа';

      return;

    }

    /*
      Используем username, который
      реально вернул сервер.
    */

    startSession(
      data.username ||
      username
    );

  }catch(err){

    console.error(
      '[LOGIN]',
      err
    );

    error.textContent=
      'Ошибка соединения с сервером';

  }

}

/* =========================================================
   SESSION
========================================================= */

function startSession(username){

  currentUser=
    String(username||'').trim();

  if(!currentUser){

    return;

  }

  document.getElementById(
    'login'
  ).style.display='none';

  document.getElementById(
    'hud'
  ).style.display='block';

  init3D();

  setupPauseControls();

  updateHostUI();

  connectSocket();

}

/* =========================================================
   SOCKET
========================================================= */

function connectSocket(){

  if(socket){

    try{
      socket.disconnect();
    }catch(e){}

  }

  socket=
    io({
      transports:[
        'websocket',
        'polling'
      ],
      reconnection:true,
      reconnectionAttempts:Infinity,
      reconnectionDelay:1000
    });

  socket.on('connect',()=>{

    console.log(
      '[EWS] SOCKET CONNECTED',
      socket.id
    );

    socket.emit(
      'join',
      {
        username:currentUser,

        language:
          document.getElementById(
            'lang'
          ).value
      }
    );

  });

  socket.on('connect_error',err=>{

    console.error(
      '[EWS SOCKET]',
      err
    );

  });

  socket.on('disconnect',reason=>{

    console.warn(
      '[EWS] DISCONNECTED',
      reason
    );

  });

  /* =======================================================
     ONLINE USERS
  ======================================================= */

  socket.on(
    'online-users',
    list=>{

      onlineUserList=
        Array.isArray(list)
          ? list
          : [];

      renderOnlineUsers();

    }
  );

  /* =======================================================
     PLAYERS STATE
  ======================================================= */

  socket.on(
    'players-state',
    list=>{

      if(!Array.isArray(list))
        return;

      list.forEach(
        player=>{

          if(
            player &&
            player.id &&
            player.id!==socket.id
          ){

            updateRemotePlayer(
              player
            );

          }

        }
      );

    }
  );

  /*
    Старые/новые варианты сервера.
  */

  socket.on(
    'player-joined',
    player=>{

      if(
        player &&
        player.id &&
        player.id!==socket.id
      ){

        updateRemotePlayer(
          player
        );

      }

    }
  );

  socket.on(
    'player-state',
    data=>{

      if(
        !data ||
        !data.id ||
        data.id===socket.id
      ){

        return;

      }

      updateRemotePlayer(
        data
      );

    }
  );

  socket.on(
    'player-left',
    id=>{

      removeRemotePlayer(id);

    }
  );

  /* =======================================================
     CHAT
  ======================================================= */

  socket.on(
    'chat-message',
    message=>{

      if(!message)
        return;

      addChatMessage(
        message
      );

    }
  );

  /* =======================================================
     SCREEN HOST
  ======================================================= */

  socket.on(
    'screen-host',
    data=>{

      let host=null;

      if(
        typeof data==='string'
      ){

        host=data;

      }else if(data){

        host=
          data.username ||
          data.host ||
          data.owner ||
          null;

      }

      if(host){

        clubScreenHost=
          String(host);

      }

      updateHostUI();

    }
  );

  /* =======================================================
     CLUB SCREEN
  ======================================================= */

  socket.on(
    'club-screen-state',
    state=>{

      if(!state)
        return;

      if(state.owner){

        clubScreenHost=
          String(state.owner);

      }

      updateHostUI();

      if(
        !state.active ||
        !state.src
      ){

        const frame=
          document.getElementById(
            'media-screen-frame'
          );

        const panel=
          document.getElementById(
            'media-screen'
          );

        if(frame)
          frame.src='about:blank';

        if(panel)
          panel.classList.remove(
            'active'
          );

        screenMediaActive=false;

        screenMediaUrl='';

        return;

      }

      applyRemoteClubScreen(
        state
      );

    }
  );

}

function renderOnlineUsers(){

function addChatMessage(message){

  const box=
    document.getElementById(
      'chat-messages'
    );

  if(!box)
    return;

  const el=
    document.createElement(
      'div'
    );

  el.className='msg';

  const time=
    message.ts
      ? new Date(
          message.ts
        ).toLocaleTimeString()
      : new Date()
          .toLocaleTimeString();

  const user=
    document.createElement(
      'span'
    );

  user.className='u';

  user.textContent=
    message.user ||
    'PLAYER';

  const text=
    document.createElement(
      'span'
    );

  text.className='t';

  text.textContent=
    ' '+
    time+
    ' '+
    (
      message.text ||
      ''
    );

  el.appendChild(user);

  el.appendChild(
    document.createTextNode(' ')
  );

  el.appendChild(text);

  box.appendChild(el);

  box.scrollTop=
    box.scrollHeight;

}

function createBox(
  w,h,d,
  x,y,z,
  material,
  cast=true,
  receive=true
){

  const mesh=
    new THREE.Mesh(
      new THREE.BoxGeometry(
        w,h,d
      ),
      material
    );

  mesh.position.set(
    x,y,z
  );

  mesh.castShadow=
    cast;

  mesh.receiveShadow=
    receive;

  scene.add(mesh);

  return mesh;

}

function createLight(
  x,y,z,
  color,
  intensity,
  distance
){

  const light=
    new THREE.PointLight(
      color,
      intensity,
      distance
    );

  light.position.set(
    x,y,z
  );

  light.castShadow=true;

  scene.add(light);

  lightObjects.push(
    light
  );

  return light;

}

function createTablesAndChairs(){

    });

  const edgeMat=
    new THREE.MeshStandardMaterial({
      color:0x202020,

    });

  const chairMat=
    new THREE.MeshStandardMaterial({
      color:0x090909,
      metalness:.25,
      roughness:.78
    });

  function chair(
    x,
    z,
    ry=0
  ){

    const g=
      new THREE.Group();

    const seat=
      new THREE.Mesh(
        new THREE.BoxGeometry(
          .75,.16,.75
        ),
        chairMat
      );

    seat.position.y=.72;

    g.add(seat);

        new THREE.BoxGeometry(

    );

    const legGeo=
      new THREE.BoxGeometry(
        .10,.72,.10
      );

    [
      [-.27,-.27],
      [.27,-.27],
      [-.27,.27],
      [.27,.27]
    ].forEach(
      ([lx,lz])=>{

        const leg=
          new THREE.Mesh(
            legGeo,
            chairMat
          );

        leg.position.set(
          lx,.36,lz
        );

        g.add(leg);

      }
    );

    g.position.set(
      x,0,z
    );

    g.rotation.y=ry;

    scene.add(g);

  }

  function table(x,z){

    const g=
      new THREE.Group();

    const top=
      new THREE.Mesh(
        new THREE.CylinderGeometry(
          1.05,
          1.05,
          .16,

        ),

        new THREE.CylinderGeometry(

        tableMat

      x+1.35,

    );

    chair(

      z-1.25,
      0
    );

    chair(
      x,
      z+1.25,

    );

/* =========================================================
   SMOKE
========================================================= */

function createSmoke(){

  const smokeGroup=
    new THREE.Group();

  const canvas=
    document.createElement(
      'canvas'
    );

  canvas.width=128;
  canvas.height=128;

  const ctx=
    canvas.getContext('2d');

  const g=
    ctx.createRadialGradient(
      64,64,4,
      64,64,62
    );

  g.addColorStop(
    0,
    'rgba(255,255,255,.16)'
  );

  g.addColorStop(
    .35,
    'rgba(210,210,210,.09)'
  );

  g.addColorStop(
    1,
    'rgba(0,0,0,0)'
  );

  ctx.fillStyle=g;

  ctx.fillRect(
    0,0,128,128
  );

  const tex=
    new THREE.CanvasTexture(
      canvas
    );

  for(
    let i=0;
    i<38;
    i++
  ){

    const mat=
      new THREE.SpriteMaterial({
        map:tex,
        transparent:true,
        opacity:.12+
          Math.random()*.10,
        depthWrite:false,
        blending:
          THREE.NormalBlending
      });

    const sp=
      new THREE.Sprite(mat);

    sp.position.set(
      (Math.random()-.5)*30,
      .8+Math.random()*3.8,
      (Math.random()-.5)*28
    );

    const size=
      2.5+
      Math.random()*4.5;

    sp.scale.set(
      size,
      size*.65,
      1
    );

    sp.userData={
      baseX:sp.position.x,
      baseY:sp.position.y,
      baseZ:sp.position.z,
      phase:Math.random()*Math.PI*2,
      speed:.08+
        Math.random()*.12
    };

    smokeGroup.add(sp);

  }

  scene.add(
    smokeGroup
  );

  window.ewsSmoke=
    smokeGroup;

}

async function startSSHAudio(){

  const video=
    document.getElementById(
      'ews-video'
    );

  if(!video)
    return;

  const indicator=
    document.getElementById(
      'stream-indicator'
    );

  const button=
    document.getElementById(
      'audio-control'
    );

  const hlsUrl=
    window.location.origin+
    '/hls/ews/index.m3u8';

  indicator.classList.remove(
    'error'
  );

  indicator.classList.add(
    'live'
  );

  indicator.textContent=
    'STREAM: CONNECTING...';

  button.disabled=true;

  button.textContent=
    '● CONNECTING...';

  try{

    /*
      AudioContext создаём только
      после пользовательского клика.
    */

    if(!audioContext){

      audioContext=
        new(
          window.AudioContext ||
          window.webkitAudioContext
        )();

      audioSource=
        audioContext.createMediaElementSource(
          video
        );

      analyser=
        audioContext.createAnalyser();

      analyser.fftSize=256;

      analyser.smoothingTimeConstant=.82;

      freqData=
        new Uint8Array(
          analyser.frequencyBinCount
        );

      audioSource.connect(
        analyser
      );

      analyser.connect(
        audioContext.destination
      );

    }

    if(
      audioContext.state===
      'suspended'
    ){

      await audioContext.resume();

    }

    if(hls){

      try{
        hls.destroy();
      }catch(e){}

      hls=null;

    }

    if(
      window.Hls &&
      Hls.isSupported()
    ){

      hls=
        new Hls({

          enableWorker:true,

          lowLatencyMode:true,

          backBufferLength:30,

          maxBufferLength:10,

          maxMaxBufferLength:20,

          liveSyncDurationCount:3,

          liveMaxLatencyDurationCount:6

        });

      hls.loadSource(
        hlsUrl
      );

      hls.attachMedia(
        video
      );

      hls.on(
        Hls.Events.MANIFEST_PARSED,
        async()=>{

          try{

            await video.play();

          }catch(err){

            console.warn(
              '[EWS] PLAY BLOCKED',
              err
            );

            indicator.textContent=
              'STREAM: PRESS START';

            button.textContent=
              '▶ START STREAM';

            button.disabled=false;

          }

        }
      );

      hls.on(
        Hls.Events.ERROR,
        (
          event,
          data
        )=>{

          console.error(
            '[EWS HLS]',
            data
          );

          if(!data.fatal)
            return;

          if(
            data.type===
            Hls.ErrorTypes.NETWORK_ERROR
          ){

            indicator.textContent=
              'STREAM: RECONNECTING...';

            button.textContent=
              '● RECONNECTING...';

            setTimeout(
              ()=>{

                if(hls){

                  try{
                    hls.startLoad();
                  }catch(e){}

                }

              },
              1000
            );

          }else if(
            data.type===
            Hls.ErrorTypes.MEDIA_ERROR
          ){

            try{

              hls.recoverMediaError();

            }catch(e){

              console.error(e);

            }

          }else{

            onStreamError();

          }

        }
      );

    }else if(
      video.canPlayType(
        'application/vnd.apple.mpegurl'
      )
    ){

      video.src=
        hlsUrl;

      video.addEventListener(
        'loadedmetadata',
        async()=>{

          try{

            await video.play();

          }catch(e){

            console.error(e);

          }

        },
        {once:true}
      );

    }else{

      throw new Error(
        'HLS not supported'
      );

    }

  }catch(err){

    console.error(
      '[EWS STREAM]',
      err
    );

    onStreamError();

  }

}

(function setupChatKeyboard(){

  input.addEventListener(
    'focus',
    ()=>{

      chatMode=true;

      if(
        document.pointerLockElement
      ){

        document.exitPointerLock();

      }

    }
  );

  input.addEventListener(
    'blur',
    ()=>{

      chatMode=false;

      Object.keys(keys)
        .forEach(
          k=>keys[k]=false
        );

    }
  );

  input.addEventListener(
    'keydown',
    e=>{

      e.stopPropagation();

    }
  );

})();

/* =========================================================
   CONTROLS
========================================================= */

function setupControls(){

  window.addEventListener(
    'resize',
    ()=>{

      if(
        !camera ||
        !renderer
      )
        return;

      camera.aspect=
        innerWidth/
        innerHeight;

      camera.updateProjectionMatrix();

      renderer.setSize(
        innerWidth,
        innerHeight
      );

    }
  );

  window.addEventListener(
    'keydown',
    e=>{

      const active=
        document.activeElement;

      const typing=
        active &&
        (
          active.tagName==='INPUT' ||
          active.tagName==='TEXTAREA' ||
          active.isContentEditable
        );

      if(typing)
        return;

      if(e.code==='Escape'){

        e.preventDefault();

        togglePause();

        return;

      }

      if(e.code==='Space'){

        e.preventDefault();

        if(
          !paused &&
          !chatMode &&
          grounded
        ){

          verticalVelocity=5.2;

          grounded=false;

        }

        return;

      }

      if(!paused)
        keys[e.code]=true;

      if(e.code==='KeyC'){

        chatMode=
          !chatMode;

        toggleChat();

      }

    }
  );

  window.addEventListener(
    'keyup',
    e=>{

      keys[e.code]=false;

    }
  );

  const canvas=
    document.getElementById(
      'canvas3d'
    );

  canvas.addEventListener(
    'click',
    ()=>{

      if(!chatMode){

        canvas.requestPointerLock();

      }

    }
  );

  document.addEventListener(
    'pointerlockchange',
    ()=>{

      pointerLocked=
        document.pointerLockElement===
        canvas;

    }
  );

  document.addEventListener(
    'mousemove',
    e=>{

      if(!pointerLocked)
        return;

      yaw-=
        e.movementX*.002;

      pitch-=
        e.movementY*.002;

      pitch=
        Math.max(
          -1.45,
          Math.min(
            1.45,
            pitch
          )
        );

    }
  );

}

function toggleChat(){

  const input=
    document.getElementById(
      'chat-input'
    );

  if(chatMode){

    if(document.pointerLockElement)
      document.exitPointerLock();

    input.focus();

  }else{

    input.blur();

  }

}

/* =========================================================
   YOUTUBE
========================================================= */

function youtubeEmbed(url){

  try{

    const u=
      new URL(url);

    let id='';

    if(
      u.hostname.includes(
        'youtu.be'
      )
    ){

      id=
        u.pathname
          .split('/')
          .filter(Boolean)[0] ||
        '';

    }else if(
      u.hostname.includes(
        'youtube.com'
      )
    ){

      id=
        u.searchParams.get(
          'v'
        ) ||
        '';

      if(
        !id &&
        u.pathname.startsWith(
          '/shorts/'
        )
      ){

        id=
          u.pathname
            .split('/')[2] ||
          '';

      }

      if(
        !id &&
        u.pathname.startsWith(
          '/embed/'
        )
      ){

        id=
          u.pathname
            .split('/')[2] ||
          '';

      }

    }

    if(!id)
      return null;

    return (
      'https://www.youtube.com/embed/' +
      encodeURIComponent(id) +
      '?autoplay=1&rel=0&playsinline=1'
    );

  }catch(e){

    return null;

  }

}

/* =========================================================
   TWITCH
========================================================= */

function twitchEmbed(url){

  try{

    const u=
      new URL(url);

    if(
      !u.hostname.includes(
        'twitch.tv'
      )
    )
      return null;

    const parts=
      u.pathname
        .split('/')
        .filter(Boolean);

    if(!parts.length)
      return null;

    const parent=
      location.hostname ||
      'ews-sessions.onrender.com';

    if(
      parts[0]==='videos' &&
      parts[1]
    ){

      return (
        'https://player.twitch.tv/?video=' +
        encodeURIComponent(parts[1]) +
        '&parent=' +
        encodeURIComponent(parent) +
        '&autoplay=true'
      );

    }

    return (
      'https://player.twitch.tv/?channel=' +
      encodeURIComponent(parts[0]) +
      '&parent=' +
      encodeURIComponent(parent) +
      '&autoplay=true'
    );

  }catch(e){

    return null;

  }

}

/* =========================================================
   SCREEN URL
========================================================= */

function normalizeClubScreenUrl(raw){

  const value=
    String(raw||'').trim();

  if(!value)
    return null;

  const yt=
    youtubeEmbed(value);

  if(yt){

    return {
      src:yt,
      name:'YOUTUBE'
    };

  }

  const tw=
    twitchEmbed(value);

  if(tw){

    return {
      src:tw,
      name:'TWITCH'
    };

  }

  try{

    const u=
      new URL(value);

    if(
      u.protocol!=='http:' &&
      u.protocol!=='https:'
    ){

      return null;

    }

    return {
      src:u.href,
      name:'WEBSITE'
    };

  }catch(e){

    return null;

  }

}

/* =========================================================
   HOMOGRAPHY
========================================================= */

function solveHomography(
  src,
  dst
){

  const A=[];
  const b=[];

  for(
    let i=0;
    i<4;
    i++
  ){

    const x=
      src[i][0];

    const y=
      src[i][1];

    const X=
      dst[i][0];

    const Y=
      dst[i][1];

    A.push([
      x,y,1,
      0,0,0,
      -X*x,
      -X*y
    ]);

    b.push(X);

    A.push([
      0,0,0,
      x,y,1,
      -Y*x,
      -Y*y
    ]);

    b.push(Y);

  }

  for(
    let i=0;
    i<8;
    i++
  ){

    let max=i;

    for(
      let r=i+1;
      r<8;
      r++
    ){

      if(
        Math.abs(
          A[r][i]
        )>
        Math.abs(
          A[max][i]
        )
      ){

        max=r;

      }

    }

    [
      A[i],
      A[max]
    ]=[
      A[max],
      A[i]
    ];

    [
      b[i],
      b[max]
    ]=[
      b[max],
      b[i]
    ];

    const pivot=
      A[i][i] ||
      1e-12;

    for(
      let c=i;
      c<8;
      c++
    ){

      A[i][c]/=pivot;

    }

    b[i]/=pivot;

    for(
      let r=0;
      r<8;
      r++
    ){

      if(r===i)
        continue;

      const f=
        A[r][i];

      if(!f)
        continue;

      for(
        let c=i;
        c<8;
        c++
      ){

        A[r][c]-=
          f*A[i][c];

      }

      b[r]-=
        f*b[i];

    }

  }

  return [
    b[0],b[3],0,b[6],
    b[1],b[4],0,b[7],
    0,0,1,0,
    b[2],b[5],0,1
  ];

}

function updateClubScreenOverlay(){

  const panel=
    document.getElementById(
      'media-screen'
    );

  if(
    !panel ||
    !screenMesh ||
    !camera ||
    !renderer
  )
    return;

  const w=
    renderer.domElement.clientWidth;

  const h=
    renderer.domElement.clientHeight;

  if(!w || !h)
    return;

  const corners=[
    new THREE.Vector3(
      -7.75,3.25,0
    ),
    new THREE.Vector3(
      7.75,3.25,0
    ),
    new THREE.Vector3(
      7.75,-3.25,0
    ),
    new THREE.Vector3(
      -7.75,-3.25,0
    )
  ].map(
    v=>
      screenMesh
        .localToWorld(v)
        .project(camera)
  );

  const pts=
    corners.map(
      p=>[
        (p.x*.5+.5)*w,
        (-p.y*.5+.5)*h
      ]
    );

  const minX=
    Math.min(
      ...pts.map(
        p=>p[0]
      )
    );

  const maxX=
    Math.max(
      ...pts.map(
        p=>p[0]
      )
    );

  const minY=
    Math.min(
      ...pts.map(
        p=>p[1]
      )
    );

  const maxY=
    Math.max(
      ...pts.map(
        p=>p[1]
      )
    );

  const allBehind=
    corners.every(
      p=>p.z>1
    );

  const tooSmall=
    maxX-minX<10 ||
    maxY-minY<10;

  const wildlyOff=
    maxX<-w ||
    minX>2*w ||
    maxY<-h ||
    minY>2*h;

  if(
    allBehind ||
    tooSmall ||
    wildlyOff
  ){

    panel.style.display='none';

    return;

  }

  panel.style.display='block';

  panel.style.left='0px';

  panel.style.top='0px';

  panel.style.width=
    w+'px';

  panel.style.height=
    h+'px';

  panel.style.transformOrigin=
    '0 0';

  panel.style.transform=
    'matrix3d('+
    solveHomography(
      [
        [0,0],
        [w,0],
        [w,h],
        [0,h]
      ],
      pts
    ).join(',')+
    ')';

}

/* =========================================================
   REMOTE PLAYERS
========================================================= */

function createRemotePlayer(
  data
){

  if(
    !data ||
    !data.id ||
    !scene
  )
    return;

  if(
    remotePlayers.has(
      data.id
    )
  )
    return;

  const g=
    new THREE.Group();

  g.userData.username=
    data.username ||
    'PLAYER';

  const mat=
    new THREE.MeshStandardMaterial({
      color:0x777777,
      roughness:1,
      metalness:0
    });

  const dark=
    new THREE.MeshStandardMaterial({
      color:0x151515,
      roughness:1
    });

  const torso=
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        .22,.30,.85,8
      ),
      mat
    );

  torso.position.y=.78;

  g.add(torso);

  const head=
    new THREE.Mesh(
      new THREE.SphereGeometry(
        .23,12,12
      ),
      mat
    );

  head.position.y=1.42;

  g.add(head);

  const armGeo=
    new THREE.CylinderGeometry(
      .075,.09,.72,6
    );

  const legGeo=
    new THREE.CylinderGeometry(
      .09,.11,.82,6
    );

  const leftArm=
    new THREE.Mesh(
      armGeo,
      dark
    );

  leftArm.position.set(
    -.34,.80,0
  );

  leftArm.rotation.z=-.12;

  g.add(leftArm);

  const rightArm=
    new THREE.Mesh(
      armGeo,
      dark
    );

  rightArm.position.set(
    .34,.80,0
  );

  rightArm.rotation.z=.12;

  g.add(rightArm);

  const leftLeg=
    new THREE.Mesh(
      legGeo,
      dark
    );

  leftLeg.position.set(
    -.13,.30,0
  );

  g.add(leftLeg);

  const rightLeg=
    new THREE.Mesh(
      legGeo,
      dark
    );

  rightLeg.position.set(
    .13,.30,0
  );

  g.add(rightLeg);

  const labelCanvas=
    document.createElement(
      'canvas'
    );

  labelCanvas.width=256;
  labelCanvas.height=64;

  const ctx=
    labelCanvas.getContext(
      '2d'
    );

  ctx.clearRect(
    0,0,256,64
  );

  ctx.font=
    'bold 24px Arial';

  ctx.textAlign='center';

  ctx.fillStyle='#ffffff';

  ctx.fillText(
    g.userData.username,
    128,
    32
  );

  const tex=
    new THREE.CanvasTexture(
      labelCanvas
    );

  const label=
    new THREE.Sprite(
      new THREE.SpriteMaterial({
        map:tex,
        transparent:true,
        depthTest:false
      })
    );

  label.scale.set(
    1.7,.42,1
  );

  label.position.y=1.95;

  g.add(label);

  g.position.set(
    Number(data.x)||0,
    0,
    Number(data.z)||0
  );

  g.rotation.y=
    Number(data.yaw)||0;

  scene.add(g);

  remotePlayers.set(
    data.id,
    {
      group:g,
      last:{
        x:g.position.x,
        z:g.position.z,
        yaw:g.rotation.y
      },
      moving:false
    }
  );

}

function updateRemotePlayer(
  data
){

  if(
    !data ||
    !data.id ||
    !socket ||
    data.id===socket.id
  )
    return;

  if(
    !remotePlayers.has(
      data.id
    )
  ){

    createRemotePlayer(
      data
    );

  }

  const p=
    remotePlayers.get(
      data.id
    );

  if(!p)
    return;

  const nx=
    Number(data.x)||0;

  const nz=
    Number(data.z)||0;

  const dx=
    nx-
    p.group.position.x;

  const dz=
    nz-
    p.group.position.z;

  p.moving=
    Math.hypot(
      dx,
      dz
    )>.002;

  p.group.position.x=
    nx;

  p.group.position.z=
    nz;

  p.group.rotation.y=
    Number(data.yaw)||0;

}

function removeRemotePlayer(
  id
){

  if(!id)
    return;

  const p=
    remotePlayers.get(id);

  if(!p)
    return;

  scene.remove(
    p.group
  );

  p.group.traverse(
    o=>{

      if(o.geometry)
        o.geometry.dispose();

      if(o.material){

        if(o.material.map)
          o.material.map.dispose();

        o.material.dispose();

      }

    }
  );

  remotePlayers.delete(
    id
  );

}

/* =========================================================
   PLAYER BROADCAST
========================================================= */

function broadcastPlayerState(
  now
){

  if(
    !socket ||
    !socket.connected ||
    !camera
  )
    return;

  if(
    now-lastPlayerBroadcast<
    50
  )
    return;

  lastPlayerBroadcast=
    now;

  socket.emit(
    'player-state',
    {
      x:camera.position.x,
      z:camera.position.z,
      yaw:yaw,
      pitch:pitch,
      username:currentUser
    }
  );

}

/* =========================================================
   PAUSE
========================================================= */

function togglePause(){

  paused=
    !paused;

  const panel=
    document.getElementById(
      'pause-panel'
    );

  const backdrop=
    document.getElementById(
      'pause-backdrop'
    );

  const button=
    document.getElementById(
      'pause-toggle'
    );

  if(panel){

    panel.classList.toggle(
      'open',
      paused
    );

  }

  if(backdrop){

    backdrop.classList.toggle(
      'open',
      paused
    );

  }

  if(button){

    button.textContent=
      paused
        ? 'RESUME'
        : 'PAUSE';

  }

  if(paused){

    Object.keys(keys)
      .forEach(
        k=>keys[k]=false
      );

    if(
      document.pointerLockElement
    ){

      document.exitPointerLock();

    }

  }

}

function toggleMute(){

  const video=
    document.getElementById(
      'ews-video'
    );

  const button=
    document.getElementById(
      'pause-mute'
    );

  if(!video)
    return;

  audioMuted=
    !audioMuted;

  video.muted=
    audioMuted;

  if(button){

    button.textContent=
      audioMuted
        ? 'UNMUTE'
        : 'MUTE';

  }

}

function setupPauseControls(){

  const range=
    document.getElementById(
      'pause-volume'
    );

  const value=
    document.getElementById(
      'pause-volume-value'
    );

  const video=
    document.getElementById(
      'ews-video'
    );

  if(!range)
    return;

  const apply=()=>{

    const v=
      Number(
        range.value
      )/100;

    if(video)
      video.volume=v;

    if(value)
      value.textContent=
        range.value+'%';

  };

  range.addEventListener(
    'input',
    apply
  );

  apply();

}

/* =========================================================
   ANIMATION
========================================================= */

function animate(){

  requestAnimationFrame(
    animate
  );

  if(!scene)
    return;

  const dt=
    Math.min(
      clock.getDelta(),
      .05
    );

  const time=
    performance.now()/1000;

  let bass=.2;
  let level=.2;

  if(
    analyser &&
    freqData &&
    audioStarted
  ){

    analyser.getByteFrequencyData(
      freqData
    );

    let b=0;

    for(
      let i=0;
      i<10 &&
      i<freqData.length;
      i++
    ){

      b+=freqData[i];

    }

    bass=
      b/
      (
        Math.min(
          10,
          freqData.length
        )*255
      );

    let total=0;

    for(
      let i=0;
      i<freqData.length;
      i++
    ){

      total+=freqData[i];

    }

    level=
      total/
      (
        freqData.length*255
      );

  }else{

    bass=
      .25+
      Math.sin(time*3)*.12;

    level=
      .25+
      Math.sin(time*1.5)*.08;

  }

  bassLevel=
    bassLevel*.82+
    bass*.18;

  audioLevel=
    audioLevel*.88+
    level*.12;

  const speed=
    (
      chatMode ||
      paused
    )
      ?0
      :5*dt;

  let forward=0;
  let side=0;

  if(keys['KeyW'])
    forward+=1;

  if(keys['KeyS'])
    forward-=1;

  if(keys['KeyA'])
    side-=1;

  if(keys['KeyD'])
    side+=1;

  if(
    pointerLocked &&
    !chatMode
  ){

    const fx=
      -Math.sin(yaw);

    const fz=
      -Math.cos(yaw);

    const rx=
      Math.cos(yaw);

    const rz=
      -Math.sin(yaw);

    camera.position.x+=
      (
        fx*forward+
        rx*side
      )*speed;

    camera.position.z+=
      (
        fz*forward+
        rz*side
      )*speed;

  }

  camera.position.x=
    THREE.MathUtils.clamp(
      camera.position.x,
      -16,
      16
    );

  camera.position.z=
    THREE.MathUtils.clamp(
      camera.position.z,
      -15.5,
      15.5
    );

  if(
    !paused &&
    !chatMode
  ){

    verticalVelocity-=14*dt;

    camera.position.y+=
      verticalVelocity*dt;

    if(
      camera.position.y<=
      playerHeight
    ){

      camera.position.y=
        playerHeight;

      verticalVelocity=0;

      grounded=true;

    }

  }

  camera.rotation.order=
    'YXZ';

  camera.rotation.y=
    yaw;

  camera.rotation.x=
    pitch;

  if(playerBody){

    playerBody.position.x=
      camera.position.x;

    playerBody.position.z=
      camera.position.z;

    playerBody.visible=false;

  }

  broadcastPlayerState(
    performance.now()
  );

  /* =======================================================
     REMOTE PLAYER ANIMATION
  ======================================================= */

  remotePlayers.forEach(
    p=>{

      const t=
        performance.now()/1000;

      const swing=
        p.moving
          ? Math.sin(t*8)*.35
          : 0;

      const limbs=
        p.group.children
          .filter(
            o=>o.isMesh
          );

      if(limbs.length>=5){

        limbs[2].rotation.x=
          swing;

        limbs[3].rotation.x=
          -swing;

        limbs[4].rotation.x=
          -swing;

      }

    }
  );

  /* =======================================================
     PARTICLES
  ======================================================= */

  if(particles){

    particles.rotation.y+=
      .00015;

    particles.material.opacity=
      .22+
      audioLevel*.18;

  }

  /* =======================================================
     SMOKE
  ======================================================= */

  if(window.ewsSmoke){

    window.ewsSmoke.children.forEach(
      sp=>{

        const u=
          sp.userData;

        sp.position.x=
          u.baseX+
          Math.sin(
            time*u.speed+
            u.phase
          )*.45;

        sp.position.y=
          u.baseY+
          Math.sin(
            time*u.speed*.7+
            u.phase
          )*.18;

        sp.position.z=
          u.baseZ+
          Math.cos(
            time*u.speed*.8+
            u.phase
          )*.35;

        sp.material.opacity=
          .07+
          audioLevel*.11;

      }
    );

  }

  /* =======================================================
     LIGHTS
  ======================================================= */

  if(window.ewsRedLights){

    window.ewsRedLights.forEach(
      (light,i)=>{

        const pulse=
          .55+
          bassLevel*2.2+
          Math.sin(
            time*1.4+
            i*.8
          )*.08;

        light.intensity=
          pulse;

        light.color.setHSL(
          0,
          1,
          .16+
          .035*bassLevel
        );

      }
    );

  }

  lightObjects.forEach(
    (light,index)=>{

      light.intensity=
        1+
        bassLevel*2+
        Math.sin(
          time*2+
          index
        )*.15;

    }
  );

  /* =======================================================
     3D SCREEN
  ======================================================= */

  if(
    streamIsLive &&
    streamVideo &&
    streamVideo.readyState>=2 &&
    screenMesh &&
    streamVideoTexture
  ){

    if(
      screenMesh.material.map!==
      streamVideoTexture
    ){

      screenMesh.material=
        streamVideoMaterial;

    }

    streamVideoTexture.needsUpdate=true;

  }else if(
    screenCtx
  ){

    /*
      OFFLINE / NO STREAM:
      обычный EWS экран.
    */

    screenCtx.fillStyle=
      '#050505';

    screenCtx.fillRect(
      0,
      0,
      1024,
      512
    );

    const grd=
      screenCtx.createLinearGradient(
        0,
        0,
        1024,
        0
      );

    const intensity=
      40+
      Math.floor(
        bassLevel*120
      );

    grd.addColorStop(
      0,
      `rgb(${intensity},${intensity},${intensity})`
    );

    grd.addColorStop(
      .5,
      '#050505'
    );

    grd.addColorStop(
      1,
      `rgb(${intensity},${intensity},${intensity})`
    );

    screenCtx.fillStyle=
      grd;

    screenCtx.fillRect(
      0,
      0,
      1024,
      512
    );

    screenCtx.fillStyle=
      '#fff';

    screenCtx.font=
      'bold 80px Arial';

    screenCtx.textAlign=
      'center';

    screenCtx.fillText(
      'EWS SESSIONS',
      512,
      200
    );

    screenCtx.font=
      '22px Arial';

    screenCtx.fillStyle=
      '#777';

    screenCtx.fillText(
      'UNDERGROUND CLUB',
      512,
      245
    );

    const bars=48;

    const bw=
      800/bars;

    for(
      let i=0;
      i<bars;
      i++
    ){

      let value;

      if(
        freqData &&
        audioStarted
      ){

        value=
          freqData[
            Math.floor(
              i*
              freqData.length/
              bars
            )
          ]/255;

      }else{

        value=
          .2+
          Math.sin(
            time*4+
            i*.5
          )*.15;

      }

      const h=
        value*180;

      screenCtx.fillStyle=
        '#fff';

      screenCtx.fillRect(
        112+i*bw,
        450-h,
        bw-3,
        h
      );

    }

    screenTexture.needsUpdate=true;

    if(
      screenMesh.material.map!==
      screenTexture
    ){

      screenMesh.material=
        new THREE.MeshBasicMaterial({
          map:screenTexture
        });

    }

  }

  updateClubScreenOverlay();

  renderer.render(
    scene,
    camera
  );

}

/* =========================================================
   CLEANUP
========================================================= */

window.addEventListener(
  'beforeunload',
  ()=>{

    try{

      if(hls)
        hls.destroy();

    }catch(e){}

    try{

      if(audioContext)
        audioContext.close();

    }catch(e){}

  }
);

</script>
