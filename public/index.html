<script>

/* ============================================================
   EWS SESSIONS
   CLIENT
============================================================ */

const socket = io({
    transports:['websocket','polling']
});

let username = '';
let language = localStorage.getItem('ews-language') || (
    navigator.language || 'en'
).slice(0,2);

let loggedIn = false;

/* ============================================================
   DOM
============================================================ */

const loginScreen = document.getElementById('login');
const hud = document.getElementById('hud');
const loginButton = document.getElementById('loginButton');
const registerSwitch = document.getElementById('registerSwitch');
const loginMessage = document.getElementById('loginMessage');

const usernameInput = document.getElementById('username');
const passwordInput = document.getElementById('password');

const messages = document.getElementById('messages');
const onlineUsers = document.getElementById('onlineUsers');
const onlineCount = document.getElementById('onlineCount');

const chatForm = document.getElementById('chatForm');
const chatInput = document.getElementById('chatInput');

const audioButton = document.getElementById('audioButton');
const stream = document.getElementById('stream');

/* ============================================================
   LOGIN / REGISTER
============================================================ */

let registerMode = false;

registerSwitch.addEventListener('click',()=>{
    registerMode = !registerMode;

    loginButton.textContent =
        registerMode ? 'CREATE ACCOUNT' : 'ENTER';

    registerSwitch.textContent =
        registerMode ? 'BACK TO LOGIN' : 'CREATE ACCOUNT';

    loginMessage.textContent = '';
});

loginButton.addEventListener('click',async()=>{

    const user = usernameInput.value.trim();
    const pass = passwordInput.value;

    if(!user || !pass){
        loginMessage.textContent = 'ENTER USERNAME AND PASSWORD';
        return;
    }

    loginButton.disabled = true;

    try{

        const endpoint = registerMode
            ? '/api/register'
            : '/api/login';

        const response = await fetch(endpoint,{
            method:'POST',
            headers:{
                'Content-Type':'application/json'
            },
            body:JSON.stringify({
                username:user,
                password:pass
            })
        });

        const result = await response.json();

        if(!result.ok){

            loginMessage.textContent =
                result.message || 'ERROR';

            loginButton.disabled = false;
            return;
        }

        if(registerMode){

            registerMode = false;

            loginButton.textContent = 'ENTER';
            registerSwitch.textContent = 'CREATE ACCOUNT';

            loginMessage.textContent =
                'ACCOUNT CREATED';

            loginButton.disabled = false;
            return;
        }

        enterClub(result.username || user);

    }catch(error){

        console.error(error);

        loginMessage.textContent =
            'SERVER CONNECTION ERROR';

    }

    loginButton.disabled = false;
});

passwordInput.addEventListener('keydown',e=>{
    if(e.key === 'Enter'){
        loginButton.click();
    }
});

usernameInput.addEventListener('keydown',e=>{
    if(e.key === 'Enter'){
        passwordInput.focus();
    }
});

function enterClub(name){

    username = name;

    localStorage.setItem(
        'ews-username',
        username
    );

    loggedIn = true;

    loginScreen.classList.add('hidden');
    hud.classList.remove('hidden');

    setTimeout(()=>{
        document.getElementById('fade').style.opacity = '0';
    },100);

    initGame();

    socket.emit('join',{
        username,
        language
    });

    socket.emit('request-online');
    socket.emit('request-players');

    addSystemMessage(
        `WELCOME TO EWS SESSIONS, ${username}`
    );
}

/* ============================================================
   SOCKET
============================================================ */

socket.on('connect',()=>{

    console.log('[EWS] socket connected');

    if(loggedIn){

        socket.emit('join',{
            username,
            language
        });

    }

});

socket.on('online-users',users=>{

    onlineUsers.innerHTML = '';

    const list = Array.isArray(users) ? users : [];

    onlineCount.textContent = list.length;

    list.forEach(user=>{

        const div = document.createElement('div');

        div.className = 'online-user';

        div.textContent =
            user.username || user.user || 'Guest';

        onlineUsers.appendChild(div);

    });

});

socket.on('system-message',data=>{

    if(data && data.text){
        addSystemMessage(data.text);
    }

});

socket.on('chat-message',data=>{

    if(!data) return;

    addMessage(
        data.username || data.user || 'Guest',
        data.text || ''
    );

});

socket.on('players-state',list=>{

    if(!Array.isArray(list)) return;

    list.forEach(data=>{
        createRemotePlayer(data);
        updateRemotePlayer(data);
    });

});

socket.on('player-joined',data=>{

    if(!data || data.id === socket.id) return;

    createRemotePlayer(data);

});

socket.on('player-move',data=>{

    if(!data || data.id === socket.id) return;

    updateRemotePlayer(data);

});

socket.on('player-left',id=>{

    removeRemotePlayer(id);

});

/* ============================================================
   CHAT
============================================================ */

chatForm.addEventListener('submit',e=>{

    e.preventDefault();

    const text = chatInput.value.trim();

    if(!text) return;

    socket.emit('chat-message',{
        text
    });

    chatInput.value = '';

});

function addMessage(user,text){

    const div = document.createElement('div');

    div.className = 'message';

    const name = document.createElement('b');

    name.textContent = user;

    const body = document.createElement('span');

    body.textContent = text;

    div.appendChild(name);
    div.appendChild(body);

    messages.appendChild(div);

    messages.scrollTop = messages.scrollHeight;

}

function addSystemMessage(text){

    const div = document.createElement('div');

    div.className = 'message system';

    div.textContent = text;

    messages.appendChild(div);

    messages.scrollTop = messages.scrollHeight;

}

/* ============================================================
   THREE.JS
============================================================ */

let scene;
let camera;
let renderer;

let player;
let playerGroup;

let clock;

let gameStarted = false;

/* player physics */

const velocity = new THREE.Vector3();

let onGround = true;

const moveSpeed = 5.4;
const jumpPower = 7.5;
const gravity = 20;

const keys = {};

let cameraYaw = 0;
let cameraPitch = 0.22;

let mouseLocked = false;

/* ============================================================
   REMOTE PLAYERS
============================================================ */

const remotePlayers = new Map();

/* ============================================================
   WORLD COLLIDERS
============================================================ */

const colliders = [];

/* ============================================================
   MATERIALS
============================================================ */

function mat(color,roughness=.9){

    return new THREE.MeshStandardMaterial({
        color,
        roughness,
        metalness:0
    });

}

const blackMat = mat(0x080808);
const darkMat = mat(0x111111);
const grayMat = mat(0x292929);
const whiteMat = mat(0xd8d8d8);
const softWhiteMat = mat(0x777777);

/* ============================================================
   INIT
============================================================ */

function initGame(){

    if(gameStarted) return;

    gameStarted = true;

    scene = new THREE.Scene();

    scene.background = new THREE.Color(0x030303);

    scene.fog = new THREE.FogExp2(
        0x030303,
        0.035
    );

    camera = new THREE.PerspectiveCamera(
        68,
        window.innerWidth / window.innerHeight,
        0.1,
        200
    );

    renderer = new THREE.WebGLRenderer({
        antialias:true,
        powerPreference:'high-performance'
    });

    renderer.setPixelRatio(
        Math.min(window.devicePixelRatio,2)
    );

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type =
        THREE.PCFSoftShadowMap;

    document.getElementById('game')
        .appendChild(renderer.domElement);

    clock = new THREE.Clock();

    createLighting();
    createClub();
    createPlayer();

    camera.position.set(
        0,
        2.5,
        6
    );

    bindControls();

    window.addEventListener(
        'resize',
        resize
    );

    animate();

}

/* ============================================================
   LIGHTING
============================================================ */

function createLighting(){

    const ambient =
        new THREE.AmbientLight(
            0xffffff,
            .22
        );

    scene.add(ambient);

    const main =
        new THREE.DirectionalLight(
            0xffffff,
            .55
        );

    main.position.set(
        0,
        12,
        4
    );

    main.castShadow = true;

    main.shadow.mapSize.width = 1024;
    main.shadow.mapSize.height = 1024;

    main.shadow.camera.left = -25;
    main.shadow.camera.right = 25;
    main.shadow.camera.top = 25;
    main.shadow.camera.bottom = -25;

    scene.add(main);

    const lights = [

        [-9,5,-10,.7],
        [9,5,-10,.7],
        [-9,4,8,.35],
        [9,4,8,.35],
        [0,8,-12,.5]

    ];

    lights.forEach(p=>{

        const light =
            new THREE.PointLight(
                0xffffff,
                p[3],
                18
            );

        light.position.set(
            p[0],
            p[1],
            p[2]
        );

        scene.add(light);

    });

}

/* ============================================================
   CLUB
============================================================ */

function box(
    x,
    y,
    z,
    sx,
    sy,
    sz,
    material=darkMat,
    collision=false
){

    const geometry =
        new THREE.BoxGeometry(
            sx,sy,sz
        );

    const mesh =
        new THREE.Mesh(
            geometry,
            material
        );

    mesh.position.set(
        x,y,z
    );

    mesh.castShadow = true;
    mesh.receiveShadow = true;

    scene.add(mesh);

    if(collision){

        colliders.push({
            minX:x-sx/2,
            maxX:x+sx/2,
            minZ:z-sz/2,
            maxZ:z+sz/2,
            minY:y-sy/2,
            maxY:y+sy/2
        });

    }

    return mesh;
}

function createClub(){

    /* floor */

    box(
        0,
        -.3,
        0,
        44,
        .6,
        38,
        blackMat,
        true
    );

    /* outer walls */

    box(
        0,
        4,
        -19,
        44,
        8,
        1,
        darkMat,
        true
    );

    box(
        -22,
        4,
        0,
        1,
        8,
        38,
        darkMat,
        true
    );

    box(
        22,
        4,
        0,
        1,
        8,
        38,
        darkMat,
        true
    );

    box(
        0,
        4,
        19,
        44,
        8,
        1,
        darkMat,
        true
    );

    /* architectural blocks */

    box(
        -15,
        2.2,
        -11,
        5,
        4.4,
        4,
        grayMat,
        true
    );

    box(
        15,
        2.2,
        -11,
        5,
        4.4,
        4,
        grayMat,
        true
    );

    box(
        -15,
        1.5,
        9,
        5,
        3,
        6,
        darkMat,
        true
    );

    box(
        15,
        1.5,
        9,
        5,
        3,
        6,
        darkMat,
        true
    );

    /* rear architecture */

    box(
        0,
        3.2,
        -16,
        20,
        6.4,
        1.4,
        darkMat,
        true
    );

    /* central raised platform */

    box(
        0,
        .45,
        -10,
        13,
        .9,
        5,
        grayMat,
        true
    );

    /* ceiling beams */

    for(let x=-18;x<=18;x+=6){

        box(
            x,
            7.5,
            0,
            .55,
            .5,
            34,
            darkMat
        );

    }

    /* vertical architectural columns */

    for(let x=-18;x<=18;x+=6){

        box(
            x,
            4,
            -5,
            .65,
            8,
            .65,
            grayMat,
            true
        );

    }

    /* subtle white strips */

    createStrip(
        -20,
        5.9,
        0,
        .12,
        .12,
        28
    );

    createStrip(
        20,
        5.9,
        0,
        .12,
        .12,
        28
    );

    createStrip(
        0,
        6.8,
        -18.2,
        26,
        .12,
        .12
    );

    /* wall panels */

    for(let x=-12;x<=12;x+=4){

        box(
            x,
            3,
            -18.35,
            2.4,
            5.5,
            .12,
            grayMat
        );

    }

    /* EWS wall mark */

    createWallLogo();

}

function createStrip(
    x,y,z,
    sx,sy,sz
){

    const geometry =
        new THREE.BoxGeometry(
            sx,sy,sz
        );

    const mesh =
        new THREE.Mesh(
            geometry,
            new THREE.MeshBasicMaterial({
                color:0xffffff
            })
        );

    mesh.position.set(
        x,y,z
    );

    scene.add(mesh);

}

function createWallLogo(){

    const canvas =
        document.createElement('canvas');

    canvas.width = 1024;
    canvas.height = 256;

    const ctx =
        canvas.getContext('2d');

    ctx.fillStyle =
        '#050505';

    ctx.fillRect(
        0,0,1024,256
    );

    ctx.fillStyle =
        '#eeeeee';

    ctx.font =
        '900 150px Arial';

    ctx.textAlign =
        'center';

    ctx.textBaseline =
        'middle';

    ctx.fillText(
        'EWS',
        512,
        125
    );

    ctx.font =
        '28px Arial';

    ctx.fillStyle =
        '#777';

    ctx.fillText(
        'SESSIONS',
        512,
        205
    );

    const texture =
        new THREE.CanvasTexture(canvas);

    const material =
        new THREE.MeshBasicMaterial({
            map:texture,
            transparent:true
        });

    const mesh =
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                11,
                2.75
            ),
            material
        );

    mesh.position.set(
        0,
        4.2,
        -18.15
    );

    scene.add(mesh);

}

/* ============================================================
   PLAYER
============================================================ */

function createPlayer(){

    playerGroup =
        new THREE.Group();

    playerGroup.position.set(
        0,
        0,
        7
    );

    scene.add(playerGroup);

    player = createHuman(
        true
    );

    playerGroup.add(player);

}

/* ============================================================
   HUMAN
============================================================ */

function createHuman(local=false){

    const root =
        new THREE.Group();

    const bodyMat =
        local
            ? new THREE.MeshStandardMaterial({
                color:0x171717,
                roughness:.82,

/* ============================================================
   INPUT
============================================================ */

function bindControls(){

    window.addEventListener('keydown',e=>{

        if(
            e.code === 'Space' ||
            e.code.startsWith('Arrow')
        ){
            e.preventDefault();
        }

        keys[e.code] = true;

        if(
            e.code === 'Space' &&
            onGround
        ){

            velocity.y =
                jumpPower;

            onGround = false;

        }

    });

    window.addEventListener('keyup',e=>{

        keys[e.code] = false;

    });

    renderer.domElement.addEventListener(
        'click',
        ()=>{
            if(!mouseLocked){
                renderer.domElement.requestPointerLock();
            }
        }
    );

    document.addEventListener(
        'pointerlockchange',
        ()=>{
            mouseLocked =
                document.pointerLockElement ===
                renderer.domElement;
        }
    );

    document.addEventListener(
        'mousemove',
        e=>{

            if(!mouseLocked) return;

            cameraYaw -=
                e.movementX * .0025;

            cameraPitch -=
                e.movementY * .0018;

            cameraPitch =
                Math.max(
                    -.15,
                    Math.min(
                        .65,
                        cameraPitch
                    )
                );

        }
    );

}

/* ============================================================
   MOVEMENT
============================================================ */

function updatePlayer(dt){

    if(!playerGroup) return;

    const forward =
        new THREE.Vector3(
            -Math.sin(cameraYaw),
            0,
            -Math.cos(cameraYaw)
        );

    const right =
        new THREE.Vector3(
            Math.cos(cameraYaw),
            0,
            -Math.sin(cameraYaw)
        );

    const direction =
        new THREE.Vector3();

    if(keys.KeyW) direction.add(forward);
    if(keys.KeyS) direction.sub(forward);
    if(keys.KeyD) direction.add(right);
    if(keys.KeyA) direction.sub(right);

    if(direction.lengthSq() > 0){

        direction.normalize();

        const acceleration =
            24 * dt;

        velocity.x +=
            direction.x *
            acceleration;

        velocity.z +=
            direction.z *
            acceleration;

        const horizontalSpeed =
            Math.sqrt(
                velocity.x * velocity.x +
                velocity.z * velocity.z
            );

        if(horizontalSpeed > moveSpeed){

            const factor =
                moveSpeed /
                horizontalSpeed;

            velocity.x *= factor;
            velocity.z *= factor;

        }

        playerGroup.rotation.y =
            Math.atan2(
                direction.x,
                direction.z
            );

    }else{

        const damping =
            Math.pow(.001,dt);

        velocity.x *= damping;
        velocity.z *= damping;

    }

    /* gravity */

    velocity.y -=
        gravity * dt;

    const next =
        playerGroup.position.clone();

    next.x += velocity.x * dt;
    next.y += velocity.y * dt;
    next.z += velocity.z * dt;

    /* floor */

    if(next.y <= 0){

        next.y = 0;

        velocity.y = 0;

        onGround = true;

    }

    /* collisions */

    const radius = .42;

    if(!blocked(
        next.x,
        next.z,
        radius
    )){

        playerGroup.position.x =
            next.x;

        playerGroup.position.z =
            next.z;

    }else{

        velocity.x = 0;
        velocity.z = 0;

    }

    playerGroup.position.y =
        next.y;

    animateHuman(
        player,
        dt,
        Math.abs(velocity.x) +
        Math.abs(velocity.z)
    );

}

/* ============================================================
   COLLISION
============================================================ */

function blocked(x,z,radius){

    for(const c of colliders){

        if(
            x + radius > c.minX &&
            x - radius < c.maxX &&
            z + radius > c.minZ &&
            z - radius < c.maxZ
        ){

            if(
                c.maxY > 0 &&
                c.minY < 2
            ){
                return true;
            }

        }

    }

    return false;
}

/* ============================================================
   HUMAN ANIMATION
============================================================ */

let walkTime = 0;

function animateHuman(
    human,
    dt,
    movement
){

    if(!human) return;

    const parts =
        human.userData.parts;

    if(!parts) return;

    const walking =
        movement > .15;

    if(walking){

        walkTime +=
            dt *
            (7 + movement);

        const swing =
            Math.sin(
                walkTime
            ) * .48;

        parts.leftArm.rotation.x =
            swing;

        parts.rightArm.rotation.x =
            -swing;

        parts.leftLeg.rotation.x =
            -swing;

        parts.rightLeg.rotation.x =
            swing;

    }else{

        parts.leftArm.rotation.x *= .82;
        parts.rightArm.rotation.x *= .82;

        parts.leftLeg.rotation.x *= .82;
        parts.rightLeg.rotation.x *= .82;

    }

}

/* ============================================================
   CAMERA
============================================================ */

function updateCamera(){

    if(!playerGroup) return;

    const distance = 6.2;

    const height = 2.8;

    const offset =
        new THREE.Vector3(
            Math.sin(cameraYaw) * distance,
            height +
                Math.sin(cameraPitch) * 2,
            Math.cos(cameraYaw) * distance
        );

    const target =
        playerGroup.position.clone();

    target.y += 2.05;

    const desired =
        target.clone().add(offset);

    camera.position.lerp(
        desired,
        .12
    );

    camera.lookAt(
        target
    );

}

/* ============================================================
   REMOTE PLAYERS
============================================================ */

function createRemotePlayer(data){

    if(!data || !data.id) return;

    if(
        data.id === socket.id ||
        remotePlayers.has(data.id)
    ){
        return;
    }

    const group =
        new THREE.Group();

    group.position.set(
        Number(data.x) || 0,
        Number(data.y) || 0,
        Number(data.z) || 0
    );

    group.rotation.y =
        Number(data.ry) || 0;

    const human =
        createHuman(false);

    group.add(human);

    group.userData.username =
        data.username || 'Guest';

    group.userData.target =
        new THREE.Vector3(
            group.position.x,
            group.position.y,
            group.position.z
        );

    group.userData.targetRotation =
        group.rotation.y;

    scene.add(group);

    remotePlayers.set(
        data.id,
        group
    );

}

function updateRemotePlayer(data){

    const group =
        remotePlayers.get(data.id);

    if(!group){

        createRemotePlayer(data);
        return;

    }

    group.userData.target.set(
        Number(data.x) || 0,
        Number(data.y) || 0,
        Number(data.z) || 0
    );

    group.userData.targetRotation =
        Number(data.ry) || 0;

}

function updateRemotePlayers(dt){

    remotePlayers.forEach(group=>{

        group.position.lerp(
            group.userData.target,
            Math.min(
                1,
                dt * 12
            )
        );

        const targetRotation =
            group.userData.targetRotation;

        let diff =
            targetRotation -
            group.rotation.y;

        while(diff > Math.PI)
            diff -= Math.PI * 2;

        while(diff < -Math.PI)
            diff += Math.PI * 2;

        group.rotation.y +=
            diff *
            Math.min(
                1,
                dt * 10
            );

        const human =
            group.children[0];

        animateHuman(
            human,
            dt,
            group.position.distanceTo(
                group.userData.target
            ) * 10
        );

    });

}

function removeRemotePlayer(id){

    const group =
        remotePlayers.get(id);

    if(!group) return;

    scene.remove(group);

    remotePlayers.delete(id);

}

/* ============================================================
   SEND PLAYER
============================================================ */

let sendTimer = 0;

function syncPlayer(dt){

    sendTimer += dt;

    if(sendTimer < .05) return;

    sendTimer = 0;

    if(!loggedIn || !playerGroup) return;

    socket.emit('player-move',{

        x:playerGroup.position.x,
        y:playerGroup.position.y,
        z:playerGroup.position.z,

        ry:playerGroup.rotation.y,

        jumping:!onGround

    });

}

let hls = null;

function setupStream(){

    const url =
        '/hls/ews/index.m3u8';

    if(Hls.isSupported()){

        hls =
            new Hls({
                enableWorker:true,
                lowLatencyMode:true,
                liveSyncDurationCount:2
            });

        hls.loadSource(url);

        hls.attachMedia(stream);

        hls.on(
            Hls.Events.MANIFEST_PARSED,
            ()=>{
                console.log(
                    '[EWS] HLS READY'
                );
            }
        );

        hls.on(
            Hls.Events.ERROR,
            (event,data)=>{

                console.log(
                    '[EWS HLS]',
                    data.type,
                    data.details
                );

            }
        );

    }else if(
        stream.canPlayType(
            'application/vnd.apple.mpegurl'
        )
    ){

        stream.src = url;

    }

}

setupStream();

audioButton.addEventListener(
    'click',
    async()=>{

        try{

            if(stream.paused){

                await stream.play();

                audioButton.textContent =
                    'AUDIO / STREAM ON';

            }else{

                stream.pause();

                audioButton.textContent =
                    'AUDIO / STREAM OFF';

            }

        }catch(error){

            console.log(
                '[AUDIO]',
                error
            );

        }

    }
);

/* ============================================================
   RENDER
============================================================ */

function animate(){

    requestAnimationFrame(
        animate
    );

    if(!gameStarted) return;

    const dt =
        Math.min(
            clock.getDelta(),
            .05
        );

    updatePlayer(dt);

    updateRemotePlayers(dt);

    updateCamera();

    syncPlayer(dt);

    renderer.render(
        scene,
        camera
    );

}

   RESIZE
============================================================ */

function resize(){

    if(!camera || !renderer) return;

    camera.aspect =
        window.innerWidth /
        window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

}
