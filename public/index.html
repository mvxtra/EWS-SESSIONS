<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>EWS SESSIONS</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030303;color:#fff;font-family:Arial,Helvetica,sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
#app{position:fixed;inset:0;background:#030303}
#game{position:absolute;inset:0}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block}
#ui{position:absolute;inset:0;pointer-events:none;z-index:10}
.panel{pointer-events:auto;background:rgba(4,4,4,.88);border:1px solid rgba(255,255,255,.18);box-shadow:0 18px 60px rgba(0,0,0,.65);backdrop-filter:blur(10px)}
#auth{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#171717 0,#050505 45%,#000 100%);z-index:20}
.authbox{width:min(420px,calc(100vw - 32px));padding:30px}
.logo{font-weight:900;letter-spacing:.28em;font-size:30px;text-align:center;margin-bottom:8px}
.sub{text-align:center;color:#888;font-size:12px;letter-spacing:.16em;margin-bottom:26px}
.field{width:100%;margin:8px 0;padding:13px 14px;border:1px solid #333;background:#090909;color:#fff;outline:none}
.field:focus{border-color:#aaa}
.row{display:flex;gap:8px}
.action{flex:1;padding:12px;border:1px solid #666;background:#fff;color:#000;font-weight:800}
.action.alt{background:#111;color:#fff;border-color:#444}
#authMsg{min-height:20px;margin-top:12px;text-align:center;color:#bbb;font-size:12px}
#hud{display:none;position:absolute;inset:0}
#topbar{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.badge{padding:8px 11px;background:rgba(0,0,0,.62);border:1px solid #292929;font-size:12px;letter-spacing:.08em}
#online{position:absolute;top:58px;right:14px;width:210px;padding:12px;max-height:260px;overflow:auto}
.title{font-size:10px;color:#888;letter-spacing:.2em;margin-bottom:8px}
.user{font-size:12px;padding:5px 0;border-bottom:1px solid #171717}
.user:last-child{border-bottom:0}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#fff;margin-right:7px}
#chat{position:absolute;left:14px;bottom:14px;width:min(390px,calc(100vw - 28px))}
#messages{height:180px;overflow:auto;padding:10px;margin-bottom:7px;background:linear-gradient(transparent,rgba(0,0,0,.7));mask-image:linear-gradient(transparent 0,#000 18%)}
.msg{font-size:12px;line-height:1.45;margin:4px 0;text-shadow:0 2px 5px #000}
.msg b{font-weight:800}
#chatInput{width:100%;padding:11px;background:rgba(0,0,0,.8);border:1px solid #333;color:#fff;outline:0}
#controls{position:absolute;bottom:14px;right:14px;width:auto;pointer-events:auto;z-index:30}
#screenControl{display:none;padding:10px;width:250px;margin-bottom:7px}
#screenControl input{width:100%;margin:4px 0;padding:9px;background:#090909;color:#fff;border:1px solid #333}
#screenActions{display:flex;gap:6px;margin-top:7px}
#screenButton,#screenPlay{padding:9px 16px;border:1px solid #666;background:#080808;color:#fff;font-weight:800;letter-spacing:.12em}
#screenButton:hover,#screenPlay:hover{background:#fff;color:#000}
#screenPlay{display:none}
#screenStatus{font-size:10px;color:#888;margin-top:7px;line-height:1.35}
#help{position:absolute;top:14px;left:50%;transform:translateX(-50%);font-size:10px;color:#aaa;letter-spacing:.12em;background:rgba(0,0,0,.5);padding:7px 10px}
#crosshair{position:absolute;left:50%;top:50%;width:12px;height:12px;transform:translate(-50%,-50%);opacity:.55}
#crosshair:before,#crosshair:after{content:"";position:absolute;background:#fff}
#crosshair:before{width:12px;height:1px;top:5px}
#crosshair:after{height:12px;width:1px;left:5px}
#screenOverlay{position:absolute;inset:0;pointer-events:none;z-index:4}
#toast{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);padding:9px 13px;background:#111;border:1px solid #444;font-size:12px;opacity:0;transition:.2s}
#toast.show{opacity:1}
@media(max-width:700px){
 #online{width:170px}
 #help{display:none}
 #controls{width:190px}
 #screenOverlay{width:88vw}
}
</style>
</head>
<body>
<div id="app">
  <div id="auth">
    <div class="authbox panel">
      <div class="logo">EWS SESSIONS</div>
      <div class="sub">UNDERGROUND CLUB / LIVE</div>
      <input id="username" class="field" autocomplete="username" placeholder="Username">
      <input id="password" class="field" autocomplete="current-password" type="password" placeholder="Password">
      <div class="row">
        <button id="loginBtn" class="action">ВХОД</button>
        <button id="registerBtn" class="action alt">РЕГИСТРАЦИЯ</button>
      </div>
      <div id="authMsg"></div>
    </div>
  </div>

  <div id="game">
    <canvas id="scene"></canvas>
    <div id="screenOverlay"></div>
  </div>

  <div id="ui">
    <div id="hud">
      <div id="topbar">
        <div class="badge">EWS SESSIONS <span id="me"></span></div>
      </div>

      <div id="crosshair"></div>

      <div id="online" class="panel">
        <div class="title">ONLINE</div>
        <div id="onlineList"></div>
      </div>

      <div id="chat">
        <div id="messages"></div>
        <input id="chatInput" maxlength="240" autocomplete="off" placeholder="Нажми ENTER и напиши сообщение...">
      </div>

      <div id="controls">
        <div id="screenControl" class="panel">
          <div class="title">SCREEN</div>
          <input id="screenSrc" autocomplete="off" placeholder="Twitch / HLS ссылка">
          <div id="screenActions">
            <button id="screenPlay" type="button">PLAY</button>
          </div>
          <div id="screenStatus">Вставь ссылку и нажми PLAY</div>
        </div>
        <button id="screenButton" type="button">SCREEN</button>
      </div>
    </div>
  </div>
  <div id="toast"></div>
</div>

<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS3DRenderer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fflate@0.6.10/umd/index.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script>
(() => {
'use strict';

const $ = id => document.getElementById(id);
const HOST = 'mvxtra';
const LANGS = ['ru','en','es','de','fr','zh','ja','ko','ar','hi','pt','it','tr','uk','nl','pl'];
const LANG_NAMES = {ru:'RU',en:'EN',es:'ES',de:'DE',fr:'FR',zh:'ZH',ja:'JA',ko:'KO',ar:'AR',hi:'HI',pt:'PT',it:'IT',tr:'TR',uk:'UK',nl:'NL',pl:'PL'};

let socket = null;
let username = '';
let language = localStorage.getItem('ews-language') || 'en';
let host = false;
let joined = false;
let hls = null;
let screenVideo = null;
let screenTexture = null;
let screenMesh = null;
let screenModel = null;

let renderer, cssRenderer, scene, camera, screenCssObject, screenCssFrame;
let player = null;
let clock = new THREE.Clock();
let yaw = 0, pitch = 0;
let px = 0, py = 0, pz = 8;
let vy = 0, grounded = true;
const keys = {};
const remotes = new Map();
let avatarModelPromise = null;
let runningAnimationPromise = null;
let lastState = 0;

const authMsg = $('authMsg');

function toast(text) {
  const el = $('toast');
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => el.classList.remove('show'), 2200);
}

function setAuthMessage(text) {
  authMsg.textContent = text || '';
}

function setLoggedIn(name, token) {
  username = name;
  if(token) localStorage.setItem('ews-session-token', token);
  localStorage.setItem('ews-username', name);
  $('auth').style.display = 'none';
  $('hud').style.display = 'block';
  $('me').textContent = '· ' + name;
}

async function api(path, body) {
  const r = await fetch(path, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(body)
  });
  const data = await r.json().catch(() => ({ok:false,error:'Server response error'}));
  if (!r.ok || !data.ok) throw new Error(data.error || 'Ошибка сервера');
  return data;
}

$('loginBtn').onclick = async () => {
  setAuthMessage('Вход...');
  try {
    const data = await api('/api/login', {
      username: $('username').value,
      password: $('password').value
    });
    setLoggedIn(data.username, data.token);
    startClub();
  } catch(e) {
    setAuthMessage(e.message);
  }
};

$('registerBtn').onclick = async () => {
  setAuthMessage('Регистрация...');
  try {
    const data = await api('/api/register', {
      username: $('username').value,
      password: $('password').value
    });
    setLoggedIn(data.username);
    startClub();
  } catch(e) {
    setAuthMessage(e.message);
  }
};

$('password').addEventListener('keydown', e => {
  if (e.key === 'Enter') $('loginBtn').click();
});

function buildWorld() {
  scene = new THREE.Scene();
  // Transparent WebGL canvas: the Twitch CSS3D screen remains visible behind
  // the 3D club, while real meshes can occlude it by normal depth.
  scene.background = null;
  scene.fog = new THREE.FogExp2(0x030303, 0.022);

  camera = new THREE.PerspectiveCamera(72, innerWidth/innerHeight, .05, 100);
  camera.rotation.order = 'YXZ';

  // The player is a fixed pivot point. Mouse look rotates this pivot in place;
  // it never orbits the player. WASD is the only thing that changes its X/Z.
  player = new THREE.Group();
  player.position.set(px, py, pz);
  scene.add(player);
  player.add(camera);
  // First-person camera: no visible local avatar.
  camera.position.set(0, 1.65, 0);
  camera.rotation.set(0, 0, 0);

  renderer = new THREE.WebGLRenderer({canvas:$('scene'), antialias:true, alpha:true, powerPreference:'high-performance'});
  renderer.setClearColor(0x000000,0);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);

  cssRenderer = new THREE.CSS3DRenderer();
  cssRenderer.setSize(innerWidth, innerHeight);

  // Twitch is a real iframe/CSS3D surface. It must be above the WebGL
  // canvas or the physical black backing plane will hide it completely.
  cssRenderer.domElement.style.position = 'absolute';
  cssRenderer.domElement.style.inset = '0';
  cssRenderer.domElement.style.pointerEvents = 'none';
  cssRenderer.domElement.style.zIndex = '4';

  renderer.domElement.style.position = 'absolute';
  renderer.domElement.style.inset = '0';
  // WebGL is ABOVE the CSS3D screen. This gives normal 3D occlusion:
  // every real mesh rendered by WebGL can physically cover the screen.
  // WebGL stays above the CSS3D iframe so club geometry occludes the screen.
  renderer.domElement.style.zIndex = '2';

  $('game').appendChild(cssRenderer.domElement);
  $('game').appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0xffffff, .16));

  // Clean white main floor — no grid/cells.
  const floorMat = new THREE.MeshStandardMaterial({
    color:0xffffff,
    roughness:.62,
    metalness:.22
  });
  const floor = new THREE.Mesh(new THREE.BoxGeometry(32,.25,28), floorMat);
  floor.position.y=-.13;
  floor.receiveShadow=true;
  scene.add(floor);

  // Central EWS dancefloor — flush with the main floor so it never affects movement.
  const dance = new THREE.Group();
  dance.name = 'EWS_DANCEFLOOR';
  dance.position.set(0,0.012,1.0);
  scene.add(dance);

  const danceSurface = new THREE.Mesh(
    new THREE.BoxGeometry(18.6,0.055,12.6),
    new THREE.MeshStandardMaterial({
      color:0x0d0d0d,
      roughness:.28,
      metalness:.52
    })
  );
  danceSurface.position.y = 0;
  danceSurface.receiveShadow = true;
  dance.add(danceSurface);

  // Crisp white rectangular neon border.
  const borderMat = new THREE.LineBasicMaterial({
    color:0xffffff,
    transparent:true,
    opacity:.9,
    depthWrite:false
  });
  const bw=18.35, bd=12.35, by=.055;
  const borderPts = [
    new THREE.Vector3(-bw/2,by,-bd/2), new THREE.Vector3(bw/2,by,-bd/2),
    new THREE.Vector3(bw/2,by,-bd/2), new THREE.Vector3(bw/2,by,bd/2),
    new THREE.Vector3(bw/2,by,bd/2), new THREE.Vector3(-bw/2,by,bd/2),
    new THREE.Vector3(-bw/2,by,bd/2), new THREE.Vector3(-bw/2,by,-bd/2)
  ];
  const borderGeo = new THREE.BufferGeometry().setFromPoints(borderPts);
  dance.add(new THREE.LineSegments(borderGeo,borderMat));

  // Straight white grid lines, slightly brighter toward the centre.
  const gridMat = new THREE.LineBasicMaterial({
    color:0xffffff,
    transparent:true,
    opacity:.30,
    depthWrite:false
  });
  const gridPts=[];
  for(let x=-8;x<=8;x+=2){
    gridPts.push(new THREE.Vector3(x,by+.002,-6),new THREE.Vector3(x,by+.002,6));
  }
  for(let z=-6;z<=6;z+=2){
    gridPts.push(new THREE.Vector3(-9,by+.002,z),new THREE.Vector3(9,by+.002,z));
  }
  const danceGridGeo = new THREE.BufferGeometry().setFromPoints(gridPts);
  dance.add(new THREE.LineSegments(danceGridGeo,gridMat));

  // Four soft corner strips give the floor a premium club edge without adding colour clutter.
  const edgeMat = new THREE.MeshBasicMaterial({
    color:0xffffff,
    transparent:true,
    opacity:.10,
    blending:THREE.AdditiveBlending,
    depthWrite:false
  });
  const edgeH = .018;
  const edges = [
    [18.0,edgeH,.055,0,by+.02,-6.18],
    [18.0,edgeH,.055,0,by+.02, 6.18],
    [.055,edgeH,12.25,-9.0,by+.02,0],
    [.055,edgeH,12.25, 9.0,by+.02,0]
  ];
  edges.forEach(([w,h,d,x,y,z])=>{
    const e=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),edgeMat);
    e.position.set(x,y,z);
    dance.add(e);
  });

  // Subtle central reflection so the dancefloor feels polished under the moving lights.
  const sheen = new THREE.Mesh(
    new THREE.PlaneGeometry(14.5,8.0),
    new THREE.MeshBasicMaterial({
      color:0xffffff,
      transparent:true,
      opacity:.025,
      blending:THREE.AdditiveBlending,
      depthWrite:false
    })
  );
  sheen.rotation.x=-Math.PI/2;
  sheen.position.y=.041;
  dance.add(sheen);

  // White club roof
  const roofMat = new THREE.MeshStandardMaterial({color:0xffffff,roughness:.72,metalness:.12,side:THREE.DoubleSide});
  const roof = new THREE.Mesh(new THREE.BoxGeometry(32,.22,28), roofMat);
  roof.position.set(0,7.05,0);
  roof.receiveShadow = true;
  scene.add(roof);

  // Back wall and side walls
  const wallMat = new THREE.MeshStandardMaterial({color:0x0a0a0a,roughness:.78,metalness:.3});
  addBox(32,7,.3,0,3.5,-14,wallMat);
  addBox(.3,7,28,-16,3.5,0,wallMat);
  addBox(.3,7,28,16,3.5,0,wallMat);

  // Stage removed. The wall-mounted screen stays in place, and the DJ table + CDJ remain.
  // Central DJ table and one Pioneer CDJ-3000.
  createDJSetup();

  // Physical club screen: this is a real Three.js object fixed to the back wall.
  createPhysicalScreen();

  // EWS logo mounted on the wall behind the DJ booth.
  createWallLogo();

// Ceiling: three long hospital-style fluorescent fixtures.
  const ceilingLampGroups = [];
  const lampHousingMat = new THREE.MeshStandardMaterial({color:0x171717,roughness:.45,metalness:.7});
  const lampGlowMat = new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:1,depthWrite:false});

  [-10.5,-3,5].forEach((z,i)=>{
    const g=new THREE.Group();
    g.name='CEILING_HOSPITAL_LAMP_'+(i+1);
    g.position.set(0,6.86,z);

    const housing=new THREE.Mesh(new THREE.BoxGeometry(15.5,.12,.48),lampHousingMat);
    housing.position.y=.02;
    g.add(housing);

    const glow=new THREE.Mesh(new THREE.BoxGeometry(14.9,.035,.30),lampGlowMat.clone());
    glow.position.y=-.055;
    g.add(glow);

    [-7.75,7.75].forEach(x=>{
      const cap=new THREE.Mesh(new THREE.BoxGeometry(.12,.10,.52),lampHousingMat);
      cap.position.set(x,0,0);
      g.add(cap);
    });

    const lampLight=new THREE.PointLight(0xffffff,0,18);
    lampLight.position.set(0,-.15,0);
    g.add(lampLight);

    g.userData.glow=glow;
    g.userData.light=lampLight;
    g.userData.phase=i*1.73;
    ceilingLampGroups.push(g);
    scene.add(g);
  });

  scene.userData.ceilingLamps=ceilingLampGroups;
  setupClubLighting();

  // No text/logo is placed over the screen surface.
  // The screen must remain a clean video texture / Twitch surface.
  // Fog/dust
  const count = 500;
  const pos = new Float32Array(count*3);
  for(let i=0;i<count;i++){
    pos[i*3] = Math.random()*30-15;
    pos[i*3+1] = Math.random()*6+.2;
    pos[i*3+2] = Math.random()*26-13;
  }
  const pg = new THREE.BufferGeometry();
  pg.setAttribute('position', new THREE.BufferAttribute(pos,3));
  scene.add(new THREE.Points(pg,new THREE.PointsMaterial({
    color:0x999999,size:.025,transparent:true,opacity:.3,depthWrite:false
  })));

  window.addEventListener('resize', resize);
  document.addEventListener('mousemove', mouseLook);
  document.addEventListener('pointerlockchange', () => {
    $('help').style.opacity = document.pointerLockElement ? '.18' : '.7';
  });

  $('scene').addEventListener('click', () => {
    if (document.activeElement === $('chatInput')) return;
    if(screenVideo) screenVideo.play().catch(()=>{});
    enableTwitchAudio();
    $('scene').requestPointerLock?.();
  });
}

function addBox(w,h,d,x,y,z,mat) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.position.set(x,y,z);
  scene.add(m);
  return m;
}


function createWallLogo() {
  const logoTexture = new THREE.TextureLoader().load('/assets/logo.png');
  logoTexture.colorSpace = THREE.SRGBColorSpace || undefined;

  const logo = new THREE.Mesh(
    new THREE.PlaneGeometry(5.8, 2.9),
    new THREE.MeshBasicMaterial({
      map: logoTexture,
      transparent: true,
      depthWrite: false,
      side: THREE.DoubleSide
    })
  );

  logo.name = 'EWS_WALL_LOGO';
  logo.position.set(0, 3.55, -13.78);
  logo.rotation.y = 0;
  scene.add(logo);

  // Only a thin neon outline remains around the logo.
  const edgeMat = new THREE.MeshBasicMaterial({
    color: 0xffffff,
    transparent: true,
    opacity: .85,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });

  [
    [6.05,.055,.06,0,5.01,-13.93],
    [6.05,.055,.06,0,2.09,-13.93],
    [.055,2.97,.06,-3.00,3.55,-13.93],
    [.055,2.97,.06,3.00,3.55,-13.93]
  ].forEach(([w,h,d,x,y,z])=>{
    const e=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),edgeMat);
    e.position.set(x,y,z);
    scene.add(e);
  });
}

function createPhysicalScreen() {
  // Black screen body.
  const backing = new THREE.Mesh(
    new THREE.PlaneGeometry(11.6, 5.45),
    new THREE.MeshBasicMaterial({ color: 0x000000 })
  );
  backing.position.set(0, 3.175, 13.48);
  backing.rotation.y = Math.PI;
  scene.add(backing);
  screenMesh = backing;

  // Heavy industrial frame matching the underground EWS club.
  const frame = new THREE.Mesh(
    new THREE.BoxGeometry(12.15, 5.98, .16),
    new THREE.MeshStandardMaterial({
      color: 0x050505,
      roughness: .25,
      metalness: .86
    })
  );
  frame.name = 'EWS_SCREEN_FRAME';
  frame.position.set(0, 3.175, 13.64);
  frame.rotation.y = Math.PI;
  scene.add(frame);

  // Thin white luminous trim.
  const trimMat = new THREE.MeshBasicMaterial({
    color: 0xffffff,
    transparent: true,
    opacity: .88,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });
  const trim = [
    [12.25,.07,.10,0,6.16,13.55],
    [12.25,.07,.10,0,.19,13.55],
    [.07,5.97,.10,-6.09,3.175,13.55],
    [.07,5.97,.10,6.09,3.175,13.55]
  ];
  trim.forEach(([w,h,d,x,y,z])=>{
    const e = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), trimMat);
    e.position.set(x,y,z);
    e.rotation.y = Math.PI;
    scene.add(e);
  });
}

function createDJSetup() {
  const table = new THREE.Group();
  table.name = 'EWS_DJ_TABLE';
  table.position.set(0,0,-9.2);
  scene.add(table);

  const darkMat = new THREE.MeshStandardMaterial({
    color:0x0b0b0b,
    roughness:.38,
    metalness:.62
  });

  const top = new THREE.Mesh(new THREE.BoxGeometry(4.2,.18,1.25), darkMat);
  top.position.y=.90;
  top.castShadow=true;
  top.receiveShadow=true;
  table.add(top);

  const legGeo = new THREE.BoxGeometry(.16,.9,.16);
  [[-1.85,-.48],[-1.85,.48],[1.85,-.48],[1.85,.48]].forEach(([x,z])=>{
    const leg=new THREE.Mesh(legGeo,darkMat);
    leg.position.set(x,.45,z);
    leg.castShadow=true;
    table.add(leg);
  });

  const shelf = new THREE.Mesh(new THREE.BoxGeometry(3.8,.10,.95),darkMat);
  shelf.position.y=.38;
  shelf.castShadow=true;
  table.add(shelf);

  const edgeMat = new THREE.MeshBasicMaterial({
    color:0xffffff,
    transparent:true,
    opacity:.42,
    blending:THREE.AdditiveBlending,
    depthWrite:false
  });
  const frontEdge = new THREE.Mesh(new THREE.BoxGeometry(4.05,.025,.025),edgeMat);
  frontEdge.position.set(0,.995,.61);
  table.add(frontEdge);

  const cdjGroup = new THREE.Group();
  cdjGroup.name='PIONEER_CDJ_3000';
  cdjGroup.position.set(0,1.02,0);
  table.add(cdjGroup);

  const fallback = new THREE.Group();
  const base = new THREE.Mesh(
    new THREE.BoxGeometry(1.12,.12,.74),
    new THREE.MeshStandardMaterial({color:0x101010,roughness:.3,metalness:.75})
  );
  fallback.add(base);
  const jog = new THREE.Mesh(
    new THREE.CylinderGeometry(.245,.245,.045,32),
    new THREE.MeshStandardMaterial({color:0x555555,roughness:.22,metalness:.8})
  );
  jog.rotation.x=Math.PI/2;
  jog.position.set(0,.085,.015);
  fallback.add(jog);
  const display = new THREE.Mesh(
    new THREE.BoxGeometry(.30,.035,.12),
    new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.65})
  );
  display.position.set(-.22,.09,-.23);
  fallback.add(display);
  cdjGroup.add(fallback);

  const loader = new THREE.GLTFLoader();
  const gltfCandidates = [
    '/models/pioneer_cdj_3000.glb',
    '/models/pioneer_cdj_3000.gltf',
    '/models/Pioneer_CDj_3000.glb',
    '/models/Pioneer_CDj_3000.gltf'
  ];

  let loaded=false;
  const tryGLTF = (i=0) => {
    if(i>=gltfCandidates.length) return;
    loader.load(gltfCandidates[i], gltf=>{
      if(loaded) return;
      loaded=true;
      const model=gltf.scene;
      model.traverse(o=>{
        if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}
      });
      const box=new THREE.Box3().setFromObject(model);
      const size=box.getSize(new THREE.Vector3());
      const targetWidth=1.12;
      if(size.x>0) model.scale.multiplyScalar(targetWidth/size.x);
      const b2=new THREE.Box3().setFromObject(model);
      model.position.y-=b2.min.y;
      model.rotation.y=Math.PI;
      fallback.visible=false;
      cdjGroup.add(model);
    },undefined,()=>tryGLTF(i+1));
  };
  tryGLTF();

  // Two Technics SL-1210MK2 turntables, one on each side of the CDJ.
  const technicsLoader = new THREE.GLTFLoader();
  const technicsPath = '/models/technics_sl-1210mk2.glb';

  [-1,1].forEach(side=>{
    const turntableGroup = new THREE.Group();
    turntableGroup.name = side < 0 ? 'TECHNICS_SL1210MK2_LEFT' : 'TECHNICS_SL1210MK2_RIGHT';
    turntableGroup.position.set(side*1.28,1.02,0);
    table.add(turntableGroup);

    technicsLoader.load(technicsPath, gltf=>{
      const model = gltf.scene;
      model.traverse(o=>{
        if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}
      });

      const box = new THREE.Box3().setFromObject(model);
      const size = box.getSize(new THREE.Vector3());
      const targetWidth = 1.12;
      if(size.x > 0) model.scale.multiplyScalar(targetWidth/size.x);

      const fitted = new THREE.Box3().setFromObject(model);
      model.position.y -= fitted.min.y;
      model.rotation.y = Math.PI;
      turntableGroup.add(model);
    },undefined,()=>{});
  });

  // Large subwoofers on both sides of the DJ table. No top speakers.
  const subwooferLoader = new THREE.GLTFLoader();

  [-1,1].forEach(side=>{
    const subGroup=new THREE.Group();
    subGroup.name=side<0?'SUBWOOFER_LEFT':'SUBWOOFER_RIGHT';
    subGroup.position.set(side*4.15,0,-0.02);
    table.add(subGroup);

    subwooferLoader.load('/models/%D1%81%D0%B0%D0%B1%D1%83%D1%84%D0%B5%D1%80.glb',gltf=>{
      const model=gltf.scene;
      model.traverse(o=>{
      if(o.isMesh){
        o.castShadow=true;
        o.receiveShadow=true;
        // Opaque physical objects: no see-through materials.
        if(o.material){
          const mats=Array.isArray(o.material)?o.material:[o.material];
          mats.forEach(m=>{
            if(!m) return;
            m.transparent=false;
            m.opacity=1;
            m.depthWrite=true;
            m.depthTest=true;
          });
        }
      }
    });
      const box=new THREE.Box3().setFromObject(model);
      const size=box.getSize(new THREE.Vector3());
      if(size.x>0) model.scale.multiplyScalar(4.35/size.x);
      const fitted=new THREE.Box3().setFromObject(model);
      model.position.y-=fitted.min.y;
      model.rotation.y=Math.PI*2;
      subGroup.add(model);

      // Gopnik stands BESIDE the LEFT subwoofer, never inside it.
      if(side < 0){
        const gopnikLoader = new THREE.GLTFLoader();
        gopnikLoader.load('/models/gopnik.glb',gltf2=>{
          const gopnik = gltf2.scene;
          gopnik.name = 'GOPNIK_BESIDE_SUBWOOFER';
          gopnik.traverse(o=>{
            if(o.isMesh){
              o.castShadow=true;
              o.receiveShadow=true;
            }
          });

          // Smaller character with feet on the floor.
          const gb = new THREE.Box3().setFromObject(gopnik);
          const gs = gb.getSize(new THREE.Vector3());
          if(gs.y > 0) gopnik.scale.multiplyScalar(1.9/gs.y);

          // Move him completely outside the subwoofer, toward the back wall.
          // x=0 keeps him beside the cabinet; z=-2.8 moves him closer to the wall.
          gopnik.position.x = 0;
          gopnik.position.z = -2.8;

          // Re-align the model's actual feet to the club floor.
          const floorBox = new THREE.Box3().setFromObject(gopnik);
          gopnik.position.y -= floorBox.min.y;

          // Rotate exactly 180 degrees.
          gopnik.rotation.y = Math.PI;
          subGroup.add(gopnik);
        },undefined,err=>console.warn('[EWS GOPNIK] load failed',err));
      }
    },undefined,()=>{});
  });

  // Keep the setup visually centred and facing the DJ, without moving the screen.
  table.rotation.y=0;
}

function setupClubLighting() {
  // Старую светомузыку и движущиеся лучи убираем.

  scene.userData.strobe = [];

function updateClubLighting(t) {
  const lamps=scene.userData.ceilingLamps || [];
  lamps.forEach((lamp,i)=>{
    const p=lamp.userData.phase || 0;
    const wave=Math.sin(t*7.2+p)+0.45*Math.sin(t*13.7+p*2.1);
    const on=wave>0.72;
    const brightness=on ? 0.72+0.28*(0.5+0.5*Math.sin(t*18+p)) : 0.025;
    lamp.userData.glow.material.opacity=brightness;
    lamp.userData.light.intensity=on ? 1.7+brightness*1.4 : 0;
  });
}

function resize() {
  if(!camera || !renderer) return;
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  if(cssRenderer) cssRenderer.setSize(innerWidth,innerHeight);

function mouseLook(e) {
  if(document.pointerLockElement !== $('scene')) return;

  // FPS-style look: rotate the player pivot itself.
  // There is deliberately NO position/orbit calculation here.
  yaw -= e.movementX * 0.0022;
  pitch -= e.movementY * 0.0022;
  pitch = THREE.MathUtils.clamp(pitch,-1.3,1.3);

  if(player){
    player.rotation.y = yaw;
    camera.rotation.x = pitch;
    camera.rotation.y = 0;
  }
}

const PLAYER_COLLISION_RADIUS = 0.42;
const playerCollisionBox = new THREE.Box3();
const playerCollisionSize = new THREE.Vector3();

function canPlayerOccupy(x,z){
  if(!scene) return true;

  for(const obj of scene.children){
    // Check all descendants without treating the player's own body/camera as a wall.
    let blocked=false;
    obj.traverse?.(node=>{
      if(blocked || !node.isMesh) return;
      if(node.userData?.noCollision) return;
      if(node.userData?.isFloor) return;

      // Never collide with the local player or CSS3D screen objects.
      if(player && (node===player || player.getObjectById(node.id))) return;
      if(screenMesh && (node===screenMesh || screenMesh.getObjectById(node.id))) {
        // The physical screen backing is a real wall and should block movement.
      }

      playerCollisionBox.setFromObject(node);
      if(!Number.isFinite(playerCollisionBox.min.x) || !Number.isFinite(playerCollisionBox.max.x)) return;

      const h=playerCollisionBox.max.y-playerCollisionBox.min.y;
      const bottom=playerCollisionBox.min.y;

      // Ignore the flat main floor and tiny decorative meshes.
      if(playerCollisionBox.max.y < 0.12) return;
      if(h < 0.18 && bottom < 0.25) return;

      // The player's body occupies the lower ~1.8m. Objects entirely above
      // the head do not prevent walking underneath them.
      if(playerCollisionBox.min.y > 1.85) return;

      const minX=playerCollisionBox.min.x-PLAYER_COLLISION_RADIUS;
      const maxX=playerCollisionBox.max.x+PLAYER_COLLISION_RADIUS;
      const minZ=playerCollisionBox.min.z-PLAYER_COLLISION_RADIUS;
      const maxZ=playerCollisionBox.max.z+PLAYER_COLLISION_RADIUS;

      if(x>=minX && x<=maxX && z>=minZ && z<=maxZ){
        // Very large horizontal surfaces are usually the floor/ceiling.
        const w=playerCollisionBox.max.x-playerCollisionBox.min.x;
        const d=playerCollisionBox.max.z-playerCollisionBox.min.z;
        if(w>28 && d>20) return;
        blocked=true;
      }
    });
    if(blocked) return false;
  }
  return true;
}

function tryMovePlayer(nx,nz){
  // Resolve X and Z independently so the player can slide along walls/objects
  // instead of getting completely stuck on a corner.
  if(canPlayerOccupy(nx,pz)) px=nx;
  if(canPlayerOccupy(px,nz)) pz=nz;
}

function animate() {
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.05);

  const forward=(keys.KeyW?1:0)-(keys.KeyS?1:0);
  const side=(keys.KeyD?1:0)-(keys.KeyA?1:0);

  if(document.pointerLockElement === $('scene') && (forward||side)) {
    const len=Math.hypot(forward,side)||1;
    const f=forward/len, s=side/len;
    const fx=-Math.sin(yaw), fz=-Math.cos(yaw);
    const rx=Math.cos(yaw), rz=-Math.sin(yaw);
    const moveX=(fx*f+rx*s)*4.5*dt;
    const moveZ=(fz*f+rz*s)*4.5*dt;
    tryMovePlayer(
      THREE.MathUtils.clamp(px+moveX,-15,15),
      THREE.MathUtils.clamp(pz+moveZ,-13,13)
    );
  }

  if(document.pointerLockElement === $('scene')) {
    vy -= 18*dt;
    py += vy*dt;
    if(py<=0){py=0;vy=0;grounded=true}
  }

  if(player){
    player.position.set(px,py,pz);
    player.rotation.y = yaw;

    // First-person camera stays at the player's head position.
    camera.position.set(0, 1.65, 0);
    camera.rotation.x = pitch;
    camera.rotation.y = 0;
  }

  const now=performance.now();
  if(socket?.connected && now-lastState>70){
    lastState=now;
    socket.emit('player:state',{
      x:px,z:pz,yaw,moving:Boolean(forward||side)
    });
  }

  updateRemotes(now/1000,dt);
  updateClubLighting(now/1000);
  renderer.render(scene,camera);
  if(cssRenderer) cssRenderer.render(scene,camera);
}

document.addEventListener('keydown', e => {
  if(e.target?.tagName==='INPUT' || e.target?.tagName==='SELECT') return;

  if(e.code==='Space' && grounded){
    vy=7;
    grounded=false;
    e.preventDefault();
  }

  if(e.code==='Enter'){
    e.preventDefault();
    $('chatInput').focus();
    return;
  }

  keys[e.code]=true;
});

document.addEventListener('keyup',e => keys[e.code]=false);

$('chatInput').addEventListener('keydown', async e => {
  if(e.key!=='Enter') return;
  e.preventDefault();
  const text=$('chatInput').value.trim();
  $('chatInput').value='';
  $('chatInput').blur();
  if(text && socket?.connected) socket.emit('chat:send',text);
});

function createEWSRig(model) {
  // EWS-01 rig layer: X Bot remains the visual base, but movement is driven
  // by our own named bone map and procedural club animation instead of
  // Running.fbx/Mixamo animation clips.
  const bones = {};
  model.traverse(o => {
    if(o.isBone) bones[o.name] = o;
  });

  const find = (...names) => {
    for(const name of names){
      if(bones[name]) return bones[name];
    }
    const wanted = names.map(n => String(n).toLowerCase());
    const key = Object.keys(bones).find(k => wanted.includes(String(k).toLowerCase()));
    return key ? bones[key] : null;
  };

  const rig = {
    hips: find('mixamorigHips','Hips'),
    spine: find('mixamorigSpine','Spine'),
    spine1: find('mixamorigSpine1','Spine1','mixamorigSpine2','Spine2'),
    spine2: find('mixamorigSpine2','Spine2'),
    neck: find('mixamorigNeck','Neck'),
    head: find('mixamorigHead','Head'),
    lUpperArm: find('mixamorigLeftArm','LeftArm'),
    lForearm: find('mixamorigLeftForeArm','LeftForeArm'),
    lHand: find('mixamorigLeftHand','LeftHand'),
    rUpperArm: find('mixamorigRightArm','RightArm'),
    rForearm: find('mixamorigRightForeArm','RightForeArm'),
    rHand: find('mixamorigRightHand','RightHand'),
    lThigh: find('mixamorigLeftUpLeg','LeftUpLeg'),
    lShin: find('mixamorigLeftLeg','LeftLeg'),
    lFoot: find('mixamorigLeftFoot','LeftFoot'),
    rThigh: find('mixamorigRightUpLeg','RightUpLeg'),
    rShin: find('mixamorigRightLeg','RightLeg'),
    rFoot: find('mixamorigRightFoot','RightFoot')
  };

  rig.rest = new Map();
  Object.values(rig).forEach(b=>{
    if(!b || b===rig.rest) return;
    if(b.isBone) rig.rest.set(b,b.rotation.clone());
  });

  rig.apply = (time, moving, dt) => {
    const wave = moving ? Math.sin(time*10.5) : Math.sin(time*1.8);
    const step = moving ? wave : 0;
    const sway = Math.sin(time*(moving?5.25:.9));

    const setRot = (bone,x,y,z) => {
      if(!bone) return;
      const base=rig.rest.get(bone);
      if(!base) return;
      bone.rotation.set(base.x+x,base.y+y,base.z+z);
    };

    // Reset/drive only the bones EWS needs. This keeps the character's
    // existing skinning intact while giving us our own animation language.
    setRot(rig.spine, moving ? Math.sin(time*5.25)*.025 : Math.sin(time*1.5)*.012, 0, moving ? sway*.018 : sway*.010);
    setRot(rig.spine1, moving ? -Math.abs(step)*.018 : Math.sin(time*1.7)*.010, 0, moving ? sway*.014 : 0);
    setRot(rig.spine2, moving ? Math.sin(time*5.25)*.018 : 0, 0, 0);
    setRot(rig.neck, 0, moving ? Math.sin(time*2.6)*.035 : Math.sin(time*.8)*.025, 0);
    setRot(rig.head, moving ? Math.sin(time*2.6)*.018 : Math.sin(time*1.1)*.035, moving ? Math.sin(time*1.3)*.025 : 0, 0);

    setRot(rig.lUpperArm, moving ? -step*.42 : Math.sin(time*1.2)*.025, 0, moving ? .06 : .02);
    setRot(rig.rUpperArm, moving ? step*.42 : -Math.sin(time*1.2)*.025, 0, moving ? -.06 : -.02);
    setRot(rig.lForearm, moving ? Math.max(0,step)*.10 : 0, 0, 0);
    setRot(rig.rForearm, moving ? Math.max(0,-step)*.10 : 0, 0, 0);

    setRot(rig.lThigh, moving ? step*.55 : Math.sin(time*1.2)*.018, 0, 0);
    setRot(rig.rThigh, moving ? -step*.55 : -Math.sin(time*1.2)*.018, 0, 0);
    setRot(rig.lShin, moving ? Math.max(0,-step)*.22 : 0, 0, 0);
    setRot(rig.rShin, moving ? Math.max(0,step)*.22 : 0, 0, 0);
    setRot(rig.lFoot, moving ? Math.max(0,step)*.12 : 0, 0, 0);
    setRot(rig.rFoot, moving ? Math.max(0,-step)*.12 : 0, 0, 0);

    // Small hand motion makes the walk feel less robotic.
    setRot(rig.lHand, moving ? Math.sin(time*10.5)*.035 : Math.sin(time*1.5)*.018, 0, 0);
    setRot(rig.rHand, moving ? -Math.sin(time*10.5)*.035 : -Math.sin(time*1.5)*.018, 0, 0);
  };

  rig.ready = !!(rig.hips && rig.spine && rig.head && rig.lThigh && rig.rThigh);
  console.log('[EWS-01] custom rig ready:', rig.ready, Object.keys(rig).filter(k=>rig[k]?.isBone));
  return rig;
}

function createAvatar(data) {
  const g=new THREE.Group();
  const seed=hash(data.id||data.username);
  const bodyColor=[0x454545,0x666666,0x303030,0x777777][seed%4];
  const bodyMat=new THREE.MeshStandardMaterial({color:bodyColor,roughness:.75});
  const dark=new THREE.MeshStandardMaterial({color:0x151515,roughness:.85});
  const headMat=new THREE.MeshStandardMaterial({color:0xbcbcbc,roughness:.7});

  // Safe fallback remains visible until the real Mixamo character loads.
  const fallback=new THREE.Group();
  const body=new THREE.Mesh(new THREE.BoxGeometry(.8,1.25,.45),bodyMat);
  body.position.y=1.3;fallback.add(body);

  const head=new THREE.Mesh(new THREE.SphereGeometry(.38,16,12),headMat);
  head.position.y=2.22;fallback.add(head);

  const eyeMat=new THREE.MeshBasicMaterial({color:0x111111});
  for(const sx of [-.12,.12]){
    const eye=new THREE.Mesh(new THREE.BoxGeometry(.08,.07,.03),eyeMat);
    eye.position.set(sx,2.25,.35);fallback.add(eye);
  }

  const l1=new THREE.Mesh(new THREE.BoxGeometry(.22,.9,.23),dark);
  l1.position.set(-.2,.45,0);fallback.add(l1);
  const l2=l1.clone();l2.position.x=.2;fallback.add(l2);

  const a1=new THREE.Mesh(new THREE.BoxGeometry(.2,1,.22),bodyMat);
  a1.position.set(-.54,1.3,0);fallback.add(a1);
  const a2=a1.clone();a2.position.x=.54;fallback.add(a2);
  g.add(fallback);

  const avatarHolder=new THREE.Group();
  g.add(avatarHolder);

  const label=makeTextSprite(data.username,1.65);
  label.position.set(0,3.8,0);
  label.scale.set(1.8,.45,1);
  if(label.material){ label.material.depthTest=false; label.material.depthWrite=false; label.renderOrder=1000; }
  g.add(label);

  g.position.set(Number(data.x)||0,0,Number(data.z)||0);
  g.rotation.y=Number(data.yaw)||0;
  scene.add(g);

  if(!avatarModelPromise){
    avatarModelPromise=new Promise((resolve,reject)=>{
      if(!THREE.FBXLoader) return reject(new Error('FBXLoader unavailable'));
      const loader=new THREE.FBXLoader();
      loader.load(
        '/models/avatars/X%20Bot.fbx',
        model=>resolve(model),
        undefined,
        err=>reject(err)
      );
    });
  }

  // Running.fbx remains on disk as a rollback asset, but EWS-01 no longer
  // depends on it for movement. The custom rig below drives the X Bot bones.
  if(!runningAnimationPromise){
    runningAnimationPromise=new Promise((resolve,reject)=>{
      if(!THREE.FBXLoader) return reject(new Error('FBXLoader unavailable'));
      const loader=new THREE.FBXLoader();
      loader.load(
        '/models/avatars/Running.fbx',
        model=>{
          const clip=model.animations && model.animations[0] ? model.animations[0] : null;
          console.log('[EWS AVATAR] Running.fbx loaded:', !!clip, clip?.name || 'no clip');
          resolve({source:model,clip});
        },
        undefined,
        err=>reject(err)
      );
    });
  }

  Promise.all([avatarModelPromise,runningAnimationPromise]).then(([source,runData])=>{
    const model=THREE.SkeletonUtils && THREE.SkeletonUtils.clone
      ? THREE.SkeletonUtils.clone(source)
      : source.clone(true);

    model.traverse(o=>{
      if(o.isMesh){
        o.castShadow=true;
        o.receiveShadow=true;
      }
    });

    // Normalize the imported Mixamo character to a predictable club height.
    const box=new THREE.Box3().setFromObject(model);
    const size=box.getSize(new THREE.Vector3());
    if(size.y>0){
      const targetHeight=3.0;
      model.scale.multiplyScalar(targetHeight/size.y);
    }

    const normalizedBox=new THREE.Box3().setFromObject(model);
    model.position.y -= normalizedBox.min.y;

    // Mixamo X Bot faces the opposite direction from the EWS movement yaw.
    // Rotate the visual model only; keep the network/player yaw unchanged.
    model.rotation.y = Math.PI;

    avatarHolder.add(model);
    fallback.visible=false;

    // ANIMATION ENGINE
    // X Bot and Running.fbx are both Mixamo rigs. First try the original
    // Mixamo clip directly; this is the most reliable path when bone names match.
    // Retargeting is only used as a fallback for differently named rigs.
    let mixer=null;
    let runAction=null;
    const runSource=runData?.source || null;
    const rawRunClip=runData?.clip || null;

    const findSkinnedMesh = root => {
      let found=null;
      root?.traverse?.(o => {
        if(!found && o.isSkinnedMesh) found=o;
      });
      return found;
    };

    const targetSkin=findSkinnedMesh(model);
    const sourceSkin=findSkinnedMesh(runSource);

    console.log('[EWS AVATAR] target skin:', targetSkin?.name || 'NONE');
    console.log('[EWS AVATAR] source skin:', sourceSkin?.name || 'NONE');
    console.log('[EWS AVATAR] running clip:', rawRunClip?.name || 'NONE',
      'tracks:', rawRunClip?.tracks?.length || 0);

    // Mixer is attached to the complete character hierarchy so tracks such as
    // mixamorigHips.quaternion can resolve against the actual target bones.
    if(rawRunClip){
      try{
        mixer=new THREE.AnimationMixer(model);
        runAction=mixer.clipAction(rawRunClip);
        runAction.setLoop(THREE.LoopRepeat,Infinity);
        runAction.setEffectiveWeight(1);
        runAction.enabled=true;
        runAction.play();
        runAction.paused=true;

        // If the clip has no resolvable bindings, Three.js will still create
        // the action but the bones will not change. Keep a retarget fallback.
        const boundTracks = rawRunClip.tracks.filter(track=>{
          try{
            return !!mixer.clipAction(rawRunClip).getRoot();
          }catch(_){ return false; }
        }).length;

        console.log('[EWS AVATAR] Direct Mixamo animation prepared:',{
          tracks:rawRunClip.tracks.length,
          boundTracks
        });
      }catch(err){
        console.error('[EWS AVATAR] Direct animation FAILED:',err);
        mixer=null;
        runAction=null;
      }
    }

    // Retarget fallback for rigs whose track names do not bind directly.
    if(!runAction && targetSkin && sourceSkin && rawRunClip && THREE.SkeletonUtils?.retargetClip){
      try{
        const targetBones=targetSkin.skeleton?.bones || [];
        const sourceBones=sourceSkin.skeleton?.bones || [];
        const sourceNames=new Set(sourceBones.map(b=>b.name));
        const sourceByShortName=new Map(
          sourceBones.map(b=>[String(b.name).split(':').pop(),b.name])
        );
        const names={};
        targetBones.forEach(b=>{
          const exact=b.name;
          const short=String(b.name).split(':').pop();
          if(sourceNames.has(exact)) names[exact]=exact;
          else if(sourceByShortName.has(short)) names[exact]=sourceByShortName.get(short);
        });

        const retargeted=THREE.SkeletonUtils.retargetClip(
          targetSkin,
          sourceSkin,
          rawRunClip,
          {hip:'mixamorigHips',names}
        );

        mixer=new THREE.AnimationMixer(targetSkin);
        runAction=mixer.clipAction(retargeted);
        runAction.setLoop(THREE.LoopRepeat,Infinity);
        runAction.setEffectiveWeight(1);
        runAction.enabled=true;
        runAction.play();
        runAction.paused=true;

        console.log('[EWS AVATAR] RETARGET fallback prepared. mapped bones:',Object.keys(names).length);
      }catch(err){
        console.error('[EWS AVATAR] Retarget fallback FAILED:',err);
        mixer=null;
        runAction=null;
      }
    }

    if(!runAction){
      console.error('[EWS AVATAR] NO WORKING RUN ANIMATION. Check Running.fbx bone names.');
    }else{
      // Start paused; movement code controls play/pause.
      runAction.paused=true;
      runAction.setEffectiveWeight(1);
    }

    // Store animation state on this avatar instance.
    avatar._mixer=null;
    avatar._runAction=null;
    avatar._visualModel=model;
    avatar._ewsRig=createEWSRig(model);
    avatar._idleTime=0;
    avatar._idleBaseY=model.position.y;
    avatar._running=false;
    if(runAction && avatar.data?.moving){
      avatar._running=true;
      runAction.reset();
      runAction.setEffectiveWeight(1);
      runAction.play();
    }

    const finalBox=new THREE.Box3().setFromObject(model);
    const h=finalBox.max.y-finalBox.min.y;
    label.position.y=Math.max(3.45,h+.65);

  }).catch(err=>{
    console.error('[EWS AVATAR] X Bot.fbx failed to load:', err);
    console.error('[EWS AVATAR] URL:', location.origin + '/models/avatars/X%20Bot.fbx');
    console.error('[EWS AVATAR] Check Network tab for the FBX request and its HTTP status.');
    // Keep the fallback avatar so the club remains usable.
  });

  const avatar = {
    g,
    targetX:g.position.x,
    targetZ:g.position.z,
    targetYaw:g.rotation.y,
    data,
    _mixer:null,
    _runAction:null,
    _ewsRig:null,
    _visualModel:null,
    _idleTime:0,
    _idleBaseY:0,
    _running:false
  };

  return avatar;
}

function hash(s){
  let n=0;
  for(let i=0;i<String(s).length;i++) n=((n<<5)-n+String(s).charCodeAt(i))|0;
  return Math.abs(n);
}

function upsertRemote(data){
  if(data.id===socket?.id) return;
  let r=remotes.get(data.id);
  if(!r){r=createAvatar(data);remotes.set(data.id,r)}
  r.data=data;
  r.targetX=Number(data.x)||0;
  r.targetZ=Number(data.z)||0;
  r.targetYaw=Number(data.yaw)||0;
}

function removeRemote(id){
  const r=remotes.get(id);
  if(!r) return;
  scene.remove(r.g);
  remotes.delete(id);
}

function updateRemotes(t,dt){
  remotes.forEach(r=>{
    r.g.position.x += (r.targetX-r.g.position.x)*.22;
    r.g.position.z += (r.targetZ-r.g.position.z)*.22;
    let d=r.targetYaw-r.g.rotation.y;
    while(d>Math.PI)d-=Math.PI*2;
    while(d<-Math.PI)d+=Math.PI*2;
    r.g.rotation.y += d*.22;

    const moving=!!r.data?.moving;

    r._running=moving;

    // EWS-01 custom rig animation: no Running.fbx playback.
    if(r._ewsRig?.ready){
      r._ewsRig.apply(t,moving,dt);
    }

    // Subtle whole-body idle motion keeps the character alive even while still.
    if(!moving && r._visualModel){
      r._idleTime += dt;
      const idle=r._idleTime;
      r._visualModel.position.y=r._idleBaseY + Math.sin(idle*1.8)*0.018;
    }

    if(r._mixer) r._mixer.update(dt);
  });
}

function connect() {
  socket=io({
    transports:['websocket','polling'],
    reconnection:true,
    reconnectionAttempts:Infinity,
    timeout:10000
  });

  socket.on('connect',()=>{
    socket.emit('join',{username,language});
  });

  socket.on('connect_error',()=>toast('Соединение с клубом...'));

  socket.on('club:ready',data=>{
    joined=true;
    host=!!data.host;
    $('screenControl').style.display='none';
    $('screenPlay').style.display=host?'block':'none';
    if(data.screen) applyScreen(data.screen);
  });

  socket.on('world:state',data=>{
    for(const r of remotes.values()) scene.remove(r.g);
    remotes.clear();
    (data.players||[]).forEach(upsertRemote);
    if(data.screen) applyScreen(data.screen);
  });

  socket.on('player:joined',upsertRemote);
  socket.on('player:state',upsertRemote);
  socket.on('player:left',removeRemote);
  socket.on('online:state',renderOnline);
  socket.on('screen:state',applyScreen);

  socket.on('language:state',lang=>{
    language=lang;
    localStorage.setItem('ews-language',lang);
    $('langLabel').textContent=LANG_NAMES[lang]||lang.toUpperCase();
  });

  socket.on('chat:message',msg=>renderMessage(msg));
}

function renderOnline(users) {
  $('onlineList').innerHTML='';
  (users||[]).forEach(u=>{
    const div=document.createElement('div');
    div.className='user';
    const dot=document.createElement('span');
    dot.className='dot';
    div.append(dot,document.createTextNode(u.username + (u.username.toLowerCase()===HOST?' ★':'')));
    $('onlineList').appendChild(div);
  });
}

async function renderMessage(msg) {
  const div=document.createElement('div');
  div.className='msg';
  const b=document.createElement('b');
  b.textContent=msg.user+': ';
  div.appendChild(b);

  const span=document.createElement('span');
  span.textContent=msg.text;
  div.appendChild(span);
  $('messages').appendChild(div);
  $('messages').scrollTop=$('messages').scrollHeight;

  if(language==='en' || language==='ru' || language) {
    try {
      const r=await fetch('/api/translate',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({text:msg.text,target:language})
      });
      const data=await r.json();
      if(data.ok && data.text && data.text!==msg.text) span.textContent=msg.text+' → '+data.text;
    } catch {}
  }
}

function twitchEmbedUrl(value) {
  const raw=String(value||'').trim();
  if(!raw) return null;

  let url;
  try { url=new URL(raw, location.origin); } catch { return null; }

  const hostName=url.hostname.toLowerCase();
  const parent=location.hostname;

  // Twitch channel URL: https://www.twitch.tv/mvxtra
  if(hostName==='twitch.tv' || hostName==='www.twitch.tv'){
    const parts=url.pathname.split('/').filter(Boolean);
    if(parts.length>=1 && parts[0] && parts[0]!=='videos' && parts[0]!=='directory'){
      return 'https://player.twitch.tv/?channel='+encodeURIComponent(parts[0])+
        '&parent='+encodeURIComponent(parent)+'&autoplay=true&muted=false';
    }
    // Twitch VOD URL: /videos/123456789
    if(parts[0]==='videos' && parts[1]){
      return 'https://player.twitch.tv/?video=v'+encodeURIComponent(parts[1])+
        '&parent='+encodeURIComponent(parent)+'&autoplay=true&muted=false';
    }
  }

  // Already a Twitch player URL.
  if(hostName==='player.twitch.tv'){
    url.searchParams.set('parent',parent);
    return url.toString();
  }

  return null;
}

function clearCssScreen() {
  if(screenCssObject){
    scene.remove(screenCssObject);
    screenCssObject=null;
  }
  screenCssFrame=null;
}

// CSS3D iframes do not participate in WebGL depth testing. To keep the
// screen from appearing "through" 3D objects, we hide the iframe whenever
// the camera's view toward the screen is blocked by a real scene object.
// This makes speakers, avatars and props behave as solid occluders.
const screenOcclusionRaycaster = new THREE.Raycaster();
const screenOcclusionTargets = [];
const screenOcclusionSamples = [
  new THREE.Vector2(-.42,-.30), new THREE.Vector2(0,-.30), new THREE.Vector2(.42,-.30),
  new THREE.Vector2(-.42,0),    new THREE.Vector2(0,0),    new THREE.Vector2(.42,0),
  new THREE.Vector2(-.42,.30),  new THREE.Vector2(0,.30),  new THREE.Vector2(.42,.30)
];

function refreshScreenOcclusion(){
  if(!screenCssObject || !screenCssFrame || !camera) return;

  const center = new THREE.Vector3(0,0,0);
  screenCssObject.getWorldPosition(center);

  // Build the list once per check. CSS3D objects themselves are ignored.
  screenOcclusionTargets.length = 0;
  scene.traverse(obj=>{
    if(!obj.isMesh) return;
    if(obj===screenMesh) return;
    if(screenCssObject && (obj===screenCssObject || screenCssObject.getObjectById(obj.id))) return;
    if(obj.userData && obj.userData.screenOccluder===false) return;
    screenOcclusionTargets.push(obj);
  });

  let blocked=0;
  const from=camera.getWorldPosition(new THREE.Vector3());

  for(const s of screenOcclusionSamples){
    const target=center.clone();

    // Spread sample points across the screen plane.
    target.x += s.x * 5.35;
    target.y += s.y * 2.45;

    const dir=target.clone().sub(from);
    const distance=dir.length();
    if(distance<=0.01) continue;
    dir.normalize();

    screenOcclusionRaycaster.set(from,dir);
    const hits=screenOcclusionRaycaster.intersectObjects(screenOcclusionTargets,true);

    if(hits.some(hit=>hit.distance < distance-0.05)) blocked++;
  }

  // If the majority of the screen is behind geometry, hide the CSS iframe.
  // Otherwise keep it visible so small props do not make the whole screen blink.
  screenCssFrame.style.visibility = blocked >= 5 ? 'hidden' : 'visible';
}

function enableTwitchAudio(){
  const iframe=screenCssFrame?.querySelector('iframe');
  if(!iframe) return;
  try{
    iframe.contentWindow?.postMessage({
      event:'command',
      func:'setMuted',
      args:[false]
    },'*');
    iframe.contentWindow?.postMessage({
      event:'command',
      func:'play',
      args:[]
    },'*');
  }catch(_){}
}

function createTwitchWallScreen(src) {
  clearCssScreen();

  const frame=document.createElement('div');
  frame.style.width='1160px';
  frame.style.height='545px';
  frame.style.background='#000';
  frame.style.border='0';
  frame.style.overflow='hidden';
  frame.style.pointerEvents='none';

  const iframe=document.createElement('iframe');
  iframe.src=src;
  iframe.allow='autoplay; fullscreen; picture-in-picture';
  iframe.setAttribute('allowtransparency','true');
  iframe.allowFullscreen=true;
  iframe.style.width='1160px';
  iframe.style.height='545px';
  iframe.style.border='0';
  iframe.style.display='block';
  frame.appendChild(iframe);

  screenCssFrame=frame;
  screenCssObject=new THREE.CSS3DObject(frame);
  screenCssObject.position.set(0,3.175,13.42);
  // Face the opposite wall without mirroring the HTML/Twitch content.
  screenCssObject.rotation.set(0,Math.PI,0);
  screenCssObject.scale.set(-0.01,0.01,0.01);
  scene.add(screenCssObject);
}

function applyScreen(state) {
  $('screenOverlay').innerHTML='';
  $('screenOverlay').style.display='none';

  clearCssScreen();
  scene.background=null;
  if(screenMesh) screenMesh.visible=true;

  if(hls){ hls.destroy(); hls=null; }
  if(screenTexture){ screenTexture.dispose(); screenTexture=null; }
  if(screenVideo){
    screenVideo.pause();
    screenVideo.removeAttribute('src');
    screenVideo.load();
    screenVideo=null;
  }

  if(screenMesh){
    screenMesh.material.map=null;
    screenMesh.material.color.setHex(0x000000);
    screenMesh.material.needsUpdate=true;
  }

  if(!state?.active || !state.src){
    scene.background=null;
    if(screenMesh) screenMesh.visible=true;
    if(host) $('screenStatus').textContent='SCREEN OFF';
    return;
  }

  const twitch=twitchEmbedUrl(state.src);

  // Twitch is rendered behind the transparent WebGL scene. Real 3D meshes
  // therefore cover the iframe naturally instead of appearing behind it.
  if(twitch){
    scene.background=null;
    if(screenMesh) screenMesh.visible=false;
    createTwitchWallScreen(twitch);
    // Browsers block audible autoplay in cross-origin Twitch iframes.
    // The first click inside the club is used to start the player with sound.
    setTimeout(()=>enableTwitchAudio(),120);
    if(host) $('screenStatus').textContent='Twitch · '+(state.title||'EWS SESSIONS');
    return;
  }

  // HLS / normal video is rendered directly onto the physical Three.js wall.
  scene.background=new THREE.Color(0x030303);
  if(screenMesh) screenMesh.visible=true;
  const video=document.createElement('video');
  screenVideo=video;
  video.autoplay=true;
  video.muted=false;
  video.controls=false;
  video.loop=false;
  video.playsInline=true;
  video.setAttribute('playsinline','');
  video.crossOrigin='anonymous';

  screenTexture=new THREE.VideoTexture(video);
  screenTexture.minFilter=THREE.LinearFilter;
  screenTexture.magFilter=THREE.LinearFilter;
  screenTexture.format=THREE.RGBAFormat;
  screenTexture.encoding=THREE.sRGBEncoding;

  if(screenMesh){
    screenMesh.material.map=screenTexture;
    screenMesh.material.color.setHex(0xffffff);
    screenMesh.material.needsUpdate=true;
  }

  if(window.Hls && Hls.isSupported() && /\\.m3u8($|\\?)/i.test(state.src)){
    hls=new Hls({enableWorker:true,lowLatencyMode:true});
    hls.loadSource(state.src);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play().catch(()=>toast('Нажми на экран для звука')));
  }else{
    video.src=state.src;
    video.play().catch(()=>{});
  }

  if(host) $('screenStatus').textContent='VIDEO · '+(state.title||'EWS SESSIONS');
}

function sendScreen() {
  if(!host || !socket?.connected) return;

  const src=$('screenSrc').value.trim();
  if(!src){
    socket.emit('screen:set',{src:''});
    $('screenStatus').textContent='SCREEN OFF';
    return;
  }

  const twitch=twitchEmbedUrl(src);
  const type=twitch?'twitch':'video';

  socket.emit('screen:set',{
    src,
    type,
    title:'EWS SESSIONS'
  });

  $('screenStatus').textContent=twitch
    ? 'PLAY · Twitch запущен'
    : 'PLAY · ссылка отправлена';
}

$('screenButton').onclick=()=>{
  if(!host) return;

  const panel=$('screenControl');
  const opening=panel.style.display!=='block';
  panel.style.display=opening?'block':'none';

  if(opening){
    $('screenSrc').focus();
  }
};

$('screenPlay').onclick=sendScreen;

$('screenSrc').addEventListener('keydown',e=>{
  if(e.key!=='Enter') return;
  e.preventDefault();
  sendScreen();
});

function startClub() {
  buildWorld();
  connect();
  animate();
  $('langLabel').textContent=LANG_NAMES[language]||language.toUpperCase();
  $('chatInput').placeholder='ENTER → чат';
  $('screenSrc').value='';
}

// Keep the user signed in on this browser after the first successful login.
const saved=localStorage.getItem('ews-username');
if(saved) $('username').value=saved;

async function restoreSession() {
  const token=localStorage.getItem('ews-session-token');
  if(!token) return;

  try {
    const data=await api('/api/session',{token});
    setLoggedIn(data.username,data.token);
    startClub();
  } catch {
    localStorage.removeItem('ews-session-token');
  }
}

restoreSession();

})();
</script>
